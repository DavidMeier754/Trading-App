# packs.yaml — the drill-pack manifest
#
# One entry per pack in the drill table of docs/course/. It is the single source
# of truth for what the Practice hub is fed: the batch script (tools/build_drill_batch.py)
# builds one request per entry, and tools/validate_content.py checks every written pack
# against the entry that commissioned it.
#
# Format of a pack file: docs/level-files/07-drill-packs-and-replays.md, "Drill packs".
#
#   id                  <path>-<slug>, and the file is content/drills/<path>/<slug>.yaml
#   unlocked_by         the sub-level id ("<level>-<sub>") that must be completed first
#   unlocked_by_chapter the chapter that id lives in — sub-level ids are only unique
#                       inside a chapter, so the pair is what resolves to a file
#   screens             how many drill screens the pack is commissioned for
#   concepts            what a wrong answer marks weak (feeds spaced repetition)
#   exemplars           three screens from the linear chapter this pack unlocks from,
#                       sent with the batch request as the voice and difficulty reference:
#                       one straightforward, one near-miss whose answer is pass or no
#                       trade, one that needs arithmetic. `screen` is 1-based.
#
# The curriculum table says `all` in its Path column: it means every path gets a pack of
# this shape, not that one file serves three paths. A pack's charts, prices and setups
# are the path's own, and `unlocked_by` resolves inside the path's own chapters, so the
# bank is written once per path. This file is the scalping bank.

version: 1
path: scalping

