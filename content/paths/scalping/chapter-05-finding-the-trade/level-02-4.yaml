id: "2-4"
title: "Relative Volume"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: new-theory
tags: [relative-volume, routine, selection]
learning_goal: "User runs the multiple as the first filter of the morning and the Level 1 checks on the short list it produces."
purpose: "One sort, then four cheap checks on eight names. Done the other way round, the morning is spent reading charts of names that were never tradeable."
terms_introduced: []
reinforces: [1, 2]
prerequisite: "2-3"
xp: 25
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "Closes Level 2 by putting the multiple in its place in the order of work. Account named at $25,000."
screens:
  - type: intro
    text: "First thing, every morning: the multiple column, sorted, and a pen through most of it."

  - type: story
    character: retail-trader
    text: "The list is sorted long before {{market.regular_open}}. Four thousand names, and it is about to hand you eight."

  - type: theory
    title: "The multiple goes first"
    body: "Sort by relative volume before anything else. It is the only filter that turns four thousand names into eight, and every other check is cheap once the list is that short."

  - type: scanner-pick
    prompt: "Your account is $25,000 and you trade 1,400 shares. Two of these five are worth keeping."
    data:
      rows:
        - {ticker: KELP, price: 15.10, change_pct: 5.4, rvol: 4.8, spread: 0.02}
        - {ticker: RIME, price: 19.20, change_pct: 12.4, rvol: 16.0, spread: 0.15}
        - {ticker: GRAN, price: 22.40, change_pct: 0.6, rvol: 1.0, spread: 0.03}
        - {ticker: CLAY, price: 17.30, change_pct: 6.1, rvol: 5.6, spread: 0.03}
        - {ticker: VELA, price: 74.20, change_pct: 4.8, rvol: 6.2, spread: 0.05}
    targets: [KELP, CLAY]
    explanation: "KELP and CLAY: multiples near 5, quotes of two and three cents, and 1,400 shares the account can pay for. RIME quotes fifteen cents, GRAN is having an ordinary day and VELA is 336 shares here."

  - type: numeric-input
    prompt: "VELA trades at $74.20 and your account is $25,000. How many shares can it pay for?"
    answer: 336
    tolerance: 1
    unit: "shares"
    working: "$25,000 ÷ $74.20 = 336 shares"
    explanation: "Three hundred and thirty-six, and a twenty-cent move on them is $67 before the quote takes its share."

  - type: chart-decision
    scenario: "KELP has held 5× its normal volume all morning on minutes of 80,000 to 110,000 shares, and the minute that just closed finished four cents through the price you marked before the open."
    shares: 1400
    state: ["Size: 1,400 shares"]
    chart:
      kind: candles
      data: [[15.42, 15.48, 15.34, 15.36], [15.36, 15.40, 15.26, 15.30], [15.30, 15.36, 15.24, 15.34], [15.34, 15.38, 15.22, 15.24], [15.24, 15.30, 15.16, 15.18], [15.18, 15.20, 15.04, 15.06], [15.06, 15.08, 14.94, 14.96], [14.96, 15.00, 14.86, 14.88], [14.88, 14.92, 14.78, 14.80], [14.80, 14.84, 14.70, 14.74], [14.74, 14.78, 14.66, 14.70]]
      volume: [86000, 94000, 82000, 90000, 88000, 112000, 104000, 98000, 92000, 86000, 80000]
      levels:
        - {price: 15.10, label: "Pre-market low"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It rolled on down to $14.70 — $0.36 a share below the decision, +$504 short on 1,400 shares."
    explanation: "The multiple got it onto the screen before the open. The minute finishing clear of the marked price is what got the order in."

  - type: tf
    statement: "A name with an ordinary multiple can still offer a clean trade."
    answer: true
    explanation: "It can, and you will not be looking at it. The multiple decides which eight charts you have time to read, not which charts are good."

  - type: mc
    prompt: "Sorting by the multiple first saves you what, exactly?"
    options:
      - {text: "The time it would take to read four thousand charts", correct: true}
      - {text: "The cost of the quote on the names you skip"}
      - {text: "Having to check whether you can get back out"}
    explanation: "Time, and nothing else. Every other filter still has to be run on the eight names that survive."

  - type: scanner-pick
    prompt: "Same account and size, a different morning. Which single row survives?"
    data:
      rows:
        - {ticker: DUNE, price: 12.80, change_pct: 3.2, rvol: 1.3, spread: 0.02}
        - {ticker: ASHE, price: 16.40, change_pct: 8.4, rvol: 7.1, spread: 0.03}
        - {ticker: PEAT, price: 11.60, change_pct: 9.8, rvol: 9.4, spread: 0.11}
        - {ticker: SLAT, price: 31.90, change_pct: 5.5, rvol: 4.2, spread: 0.04}
    target: ASHE
    explanation: "ASHE: 7× normal, three cents wide, and 1,400 shares at $16.40 is $22,960 of the account. DUNE is having a normal day, PEAT quotes eleven cents and SLAT is 783 shares at this price."

  - type: chart-decision
    scenario: "PEAT is the biggest mover on that list at 9× normal, stepping higher on 66,000-share minutes. The price you marked is fourteen cents above."
    shares: 1400
    state: ["Size: 1,400 shares", "Quote: 11 cents"]
    chart:
      kind: candles
      data: [[11.32, 11.42, 11.28, 11.40], [11.40, 11.50, 11.36, 11.46], [11.46, 11.56, 11.42, 11.52], [11.52, 11.64, 11.48, 11.60], [11.60, 11.70, 11.56, 11.66], [11.66, 11.78, 11.62, 11.74], [11.74, 11.84, 11.70, 11.80], [11.80, 11.90, 11.76, 11.86], [11.86, 11.92, 11.80, 11.88], [11.88, 11.90, 11.78, 11.82]]
      volume: [64000, 70000, 62000, 68000, 66000, 76000, 70000, 64000, 60000, 58000]
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It reached $11.88 — $0.14 a share past the decision, and eleven of those fourteen cents were the quote."
    explanation: "Nine times normal is why it is on the list. Eleven cents wide against a fourteen-cent move is why it never reaches the screen."

  - type: sort
    prompt: "Which of these do you run on four thousand names, and which on the eight that are left?"
    buckets: ["On all four thousand", "On the eight that survive"]
    items:
      - {text: "Sort by the multiple", bucket: "On all four thousand"}
      - {text: "Read the width of the quote", bucket: "On the eight that survive"}
      - {text: "Check what a typical minute trades", bucket: "On the eight that survive"}
      - {text: "Mark the prices from before the open", bucket: "On the eight that survive"}
    explanation: "One sort, then four cheap checks on a short list. The other order is a morning spent on names that were never available."

  - type: fill-choice
    sentence: "The first filter of the morning turns four thousand names into about ___."
    options: ["eight", "forty", "one"]
    answer: "eight"
    explanation: "A number you can actually read through. Everything after the sort is checked by hand."

  - type: checklist-reveal
    title: "The first ten minutes of the morning"
    items:
      - "Sort the list by relative volume"
      - "Cross off anything the account cannot hold enough of"
      - "Cross off anything with a quote you cannot pay"
      - "Cross off anything whose minutes are too thin to leave"
