id: "5-1"
title: "Checkpoint"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: test
tags: [checkpoint, selection, relative-volume, catalyst]
learning_goal: "User proves they can size a name against a typical minute, read the multiple for what it is, name the reason behind a move, and cut a row for one stated reason."
purpose: "Everything from Level 6 on is a faster version of these four questions, so they have to be automatic first."
terms_introduced: []
reinforces: [1, 3]
prerequisite: "4-2"
xp: 40
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — The PlayBook"]
notes: "Ten scored questions on Levels 1–4, fresh wordings and fresh numbers throughout. Three reach back: the account ceiling and the quote cost from Chapter 3, the two dials from Chapter 1. Account named at $18,000; both worked positions are 1,200 shares under $13.90."
screens:
  - type: intro
    text: "Ten questions on Levels 1 to 4. Nothing here is timed, so read each row and each chart properly."
    counter: 10

  - type: numeric-input
    prompt: "MESA trades about 52,000 shares in a typical minute. You want 1,200 of them. What share of that minute is yours?"
    answer: 2.3
    tolerance: 0.2
    unit: "%"
    working: "1,200 ÷ 52,000 = 0.023 = 2.3 %"
    explanation: "Small enough to arrive and leave without the minute noticing, which is the whole of question one."

  - type: tf
    statement: "The multiple compares today's volume in a name with the volume in the other names on the list."
    answer: false
    explanation: "It compares a name with its own ordinary day. A quiet name at 6× its normal is on the list; a busy name at 1× its normal is not."

  - type: scanner-pick
    prompt: "Your account is $18,000 and you trade 1,200 shares. Which row survives?"
    data:
      rows:
        - {ticker: GRAN, price: 24.90, change_pct: 7.6, rvol: 6.4, spread: 0.03, catalyst: "Upgrade"}
        - {ticker: MESA, price: 13.40, change_pct: 6.9, rvol: 5.8, spread: 0.02, catalyst: "Results"}
        - {ticker: RIME, price: 12.10, change_pct: 15.6, rvol: 13.2, spread: 0.16, catalyst: "Trial result"}
        - {ticker: DUNE, price: 11.80, change_pct: 2.4, rvol: 1.1, spread: 0.02, catalyst: "—"}
    target: MESA
    explanation: "MESA: 1,200 shares at $13.40 is $16,080. GRAN is 722 shares on this account, RIME charges sixteen cents to find out, DUNE is having an ordinary day."

  - type: mc
    prompt: "A name is up 19 % on a takeover offer of $14.00 and has traded between $13.88 and $13.94 for forty minutes. What has it run out of?"
    options:
      - {text: "Shares available to buy"}
      - {text: "People willing to trade it at all"}
      - {text: "Disagreement about the price", correct: true}
    explanation: "An offered price settles the argument, and the argument is the only thing that moves a chart between here and there."

  - type: numeric-mc
    prompt: "GRAN trades at $23.40 and your account is $18,000. What is the most you can hold?"
    options:
      - {text: "1,200 shares"}
      - {text: "421 shares"}
      - {text: "900 shares"}
      - {text: "769 shares", correct: true}
    working: "$18,000 ÷ $23.40 = 769 shares"
    explanation: "Rounded down, because the 770th is a share you cannot pay for. The chart never gets a vote on this one."

  - type: chart-decision
    scenario: "MESA has run at 6× its normal volume since the open on minutes of around 100,000 shares, and the minute that just closed finished three cents above the high of the first half hour at $13.41. Your account is $18,000 and 1,200 shares is the size you trade."
    shares: 1200
    chart:
      kind: candles
      data: [[13.02, 13.12, 12.98, 13.10], [13.10, 13.20, 13.06, 13.16], [13.16, 13.24, 13.10, 13.14], [13.14, 13.26, 13.08, 13.22], [13.22, 13.34, 13.18, 13.30], [13.30, 13.48, 13.26, 13.44], [13.44, 13.56, 13.40, 13.52], [13.52, 13.62, 13.46, 13.58], [13.58, 13.66, 13.52, 13.62], [13.62, 13.68, 13.56, 13.63], [13.63, 13.66, 13.56, 13.60]]
      volume: [84000, 92000, 78000, 88000, 82000, 126000, 112000, 104000, 96000, 88000, 82000]
      levels:
        - {price: 13.41, label: "High of the first half hour"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped on to $13.63 — $0.19 a share above the decision, +$228 long on 1,200 shares."
    explanation: "Four filters cleared before the open, and the heaviest minute of the morning finishing clear of the marked price. $16,128 of an $18,000 account, so it is payable too."

  - type: sort
    prompt: "One of these ends a name's morning on its own. Which, and which are only worth a second look?"
    buckets: ["Ends it on its own", "Worth a second look"]
    items:
      - {text: "A quote sixteen cents wide", bucket: "Ends it on its own"}
      - {text: "Minutes of 7,000 shares", bucket: "Ends it on its own"}
      - {text: "A reason you have not read yet", bucket: "Worth a second look"}
      - {text: "Second on the list rather than first", bucket: "Worth a second look"}
    explanation: "The first two are no answers. The other two are work you have not done yet, and the work often ends in a yes."

  - type: chart-decision
    scenario: "PEAT is stepping higher on minutes of about 9,000 shares and the panel reads $12.56 bid, $12.67 ask. Your account is $18,000 and 1,200 shares is the size you trade."
    shares: 1200
    chart:
      kind: candles
      data: [[12.20, 12.30, 12.16, 12.28], [12.28, 12.38, 12.24, 12.34], [12.34, 12.42, 12.28, 12.38], [12.38, 12.50, 12.34, 12.46], [12.46, 12.56, 12.42, 12.52], [12.52, 12.66, 12.48, 12.62], [12.62, 12.74, 12.58, 12.70], [12.70, 12.80, 12.64, 12.76], [12.76, 12.84, 12.70, 12.79], [12.79, 12.82, 12.72, 12.76]]
      volume: [8000, 11000, 7000, 9000, 10000, 12000, 8000, 9000, 7000, 8000]
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It reached $12.79 — $0.17 a share past the decision, and eleven of those seventeen cents were the quote."
    explanation: "1,200 shares is about a seventh of one of those minutes, and the way out is what a seventh of a minute takes from you."

  - type: numeric-input
    prompt: "You had taken PEAT anyway, 1,200 shares in and back out on that eleven-cent quote. What would the quote alone have taken?"
    answer: 132
    tolerance: 0.01
    unit: "$"
    working: "$0.11 a share × 1,200 shares = $132"
    explanation: "A hundred and thirty-two dollars handed over before the position has done anything at all."

  - type: tf
    statement: "A stock can move 12 % in a morning and still be one you cannot get out of."
    answer: true
    explanation: "Chapter 1's two dials. Movement and ease of exit are separate readings, and a name needs both to be worth your size."

  - type: summary
    total: 10
