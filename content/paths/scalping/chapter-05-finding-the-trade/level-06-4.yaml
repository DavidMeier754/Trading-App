id: "6-4"
title: "Reading a Scanner"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: new-theory
tags: [scanner, shortlist, drill]
learning_goal: "User turns a filtered, sorted list into the handful of names whose charts are worth opening, and stops there."
purpose: "The shortlist is the only output of the whole scanner routine, and a shortlist of twenty is the same as no shortlist at all."
terms_introduced: []
reinforces: [1, 3]
prerequisite: "6-3"
xp: 25
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "Closes Level 6. Mostly reps: a pick, a deck and a decision. Account named at $26,000; the worked position is 1,600 shares at $15.90 = $25,440."
screens:
  - type: intro
    text: "The conditions removed the impossible. Now you decide which charts are worth your eyes."

  - type: story
    character: retail-trader
    text: "Twelve rows left, and time enough to read maybe five charts properly before the bell. The other seven are somebody else's morning."

  - type: theory
    title: "The list is not the shortlist"
    body: "A filtered list is every name that could be traded. The shortlist is the few you will actually watch. Cutting from one to the other is the last thing the scanner routine does, and you do it by hand."

  - type: scanner-pick
    prompt: "Your account is $26,000 and you trade 1,600 shares. Two of these five make the shortlist."
    data:
      rows:
        - {ticker: MARL, price: 14.60, change_pct: 8.4, rvol: 4.5, spread: 0.02, catalyst: "Results"}
        - {ticker: ORCA, price: 19.80, change_pct: 6.2, rvol: 5.8, spread: 0.03, catalyst: "Upgrade"}
        - {ticker: VEIN, price: 13.10, change_pct: 7.7, rvol: 6.1, spread: 0.02, catalyst: "Contract win"}
        - {ticker: YARN, price: 12.40, change_pct: 2.2, rvol: 1.3, spread: 0.02, catalyst: "—"}
        - {ticker: CRAG, price: 11.80, change_pct: 16.4, rvol: 12.6, spread: 0.19, catalyst: "Trial result"}
    targets: [MARL, VEIN]
    explanation: "MARL at $23,360 and VEIN at $20,960 for 1,600 shares, both two cents wide, both with a reason. ORCA is 1,313 shares here, YARN is ordinary, CRAG charges nineteen cents."

  - type: numeric-input
    prompt: "MARL's ordinary minute is 22,000 shares and its multiple reads 4.5. Your 1,600 shares are what share of a minute today?"
    answer: 1.6
    tolerance: 0.2
    unit: "%"
    working: "22,000 × 4.5 = 99,000 shares a minute; 1,600 ÷ 99,000 = 0.016 = 1.6 %"
    explanation: "The multiple is what turned a thin minute into one you can hide in. On an ordinary day the same size would be 7 % of it."

  - type: swipe-deck
    prompt: "Five names that cleared the conditions. Onto the shortlist, or pass?"
    cards:
      - chart:
          kind: candles
          data: [[14.20, 14.32, 14.16, 14.30], [14.30, 14.44, 14.26, 14.40], [14.40, 14.52, 14.34, 14.48], [14.48, 14.62, 14.44, 14.58], [14.58, 14.70, 14.52, 14.66], [14.66, 14.80, 14.62, 14.76], [14.76, 14.88, 14.70, 14.84], [14.84, 14.96, 14.78, 14.92]]
        answer: take
        note: "A step every minute with no holes in it, and the whole range is inside what the account can hold."
      - chart:
          kind: candles
          data: [[13.04, 13.08, 13.00, 13.06], [13.06, 13.10, 13.02, 13.04], [13.04, 13.09, 13.01, 13.07], [13.07, 13.10, 13.02, 13.05], [13.05, 13.09, 13.00, 13.06], [13.06, 13.10, 13.02, 13.04], [13.04, 13.08, 13.01, 13.07], [13.07, 13.10, 13.02, 13.05]]
        answer: pass
        note: "Ten cents covered in eight minutes. There is nothing here to divide between you and the quote."
      - chart:
          kind: candles
          data: [[12.60, 12.76, 12.54, 12.72], [12.72, 12.76, 12.44, 12.48], [12.48, 12.82, 12.46, 12.78], [12.78, 12.84, 12.50, 12.54], [12.54, 12.88, 12.52, 12.84], [12.84, 12.90, 12.54, 12.58], [12.58, 12.92, 12.56, 12.88], [12.88, 12.94, 12.58, 12.62]]
        answer: pass
        note: "Thirty cents up and most of it back, four times over. Both of your sides are somebody's wick."
      - chart:
          kind: candles
          data: [[16.10, 16.16, 15.96, 16.00], [16.00, 16.06, 15.86, 15.90], [15.90, 15.96, 15.76, 15.80], [15.80, 15.86, 15.66, 15.70], [15.70, 15.76, 15.58, 15.62], [15.62, 15.68, 15.48, 15.52], [15.52, 15.58, 15.40, 15.44], [15.44, 15.50, 15.34, 15.38]]
        answer: take
        note: "Lower highs on full bodies. A shortlist is names that are travelling, and this one is travelling down."
      - chart:
          kind: candles
          data: [[11.40, 11.46, 11.36, 11.44], [11.44, 11.52, 11.40, 11.48], [11.48, 11.54, 11.42, 11.44], [11.44, 11.50, 11.38, 11.46], [11.46, 11.52, 11.40, 11.42], [11.42, 11.48, 11.36, 11.44], [11.44, 11.50, 11.38, 11.40], [11.40, 11.46, 11.34, 11.42]]
        answer: pass
        note: "Twenty cents of drift with no shape to it. The multiple got it here; the chart sends it back."
    explanation: "Two onto the list and three off it. One pass is the range, one is the shape of the range, and one is simply nothing happening."

  - type: chart-decision
    scenario: "MARL made the shortlist before the bell and has held 4.5× its normal volume since the open. The minute that just closed finished three cents above the high of the morning at $15.87. Your account is $26,000 and 1,600 shares is the size you trade."
    shares: 1600
    chart:
      kind: candles
      data: [[15.44, 15.54, 15.38, 15.52], [15.52, 15.62, 15.46, 15.58], [15.58, 15.66, 15.52, 15.56], [15.56, 15.68, 15.50, 15.64], [15.64, 15.74, 15.58, 15.70], [15.70, 15.94, 15.66, 15.90], [15.90, 16.02, 15.86, 15.98], [15.98, 16.08, 15.92, 16.04], [16.04, 16.14, 15.98, 16.10], [16.10, 16.18, 16.04, 16.13], [16.13, 16.16, 16.04, 16.08]]
      volume: [104000, 112000, 96000, 108000, 100000, 152000, 136000, 124000, 114000, 106000, 98000]
      levels:
        - {price: 15.87, label: "High of the morning"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $16.13 — $0.23 a share above the decision, +$368 long on 1,600 shares."
    explanation: "The shortlist meant this chart was open and marked when the minute arrived. That is the only thing a shortlist ever buys you."

  - type: mc
    prompt: "You keep twelve names on the screen instead of four. What actually goes wrong?"
    options:
      - {text: "The scanner cannot refresh that many rows"}
      - {text: "Nothing is marked when a minute arrives", correct: true}
      - {text: "The quotes on the extra names widen"}
    explanation: "Twelve charts means none of them has levels drawn on it. The cost of a long list is paid in the seconds you do not have."

  - type: tf
    statement: "A name that fails the reading this morning should come off the filters altogether."
    answer: false
    explanation: "It failed today, not in principle. The conditions describe what you can trade; the reading describes what is worth trading now."

  - type: order
    prompt: "Put the scanner routine in the order it actually runs."
    items:
      - "The conditions, set long before this morning"
      - "The sort, by the multiple"
      - "The reading, on the rows that survived"
      - "The shortlist, and the charts opened on it"
    explanation: "Conditions, sort, read, shortlist. Three of the four are cheap, and the fourth is where the morning actually goes."

  - type: recap
    title: "Level 6 in three lines"
    points:
      - {text: "Every column on a row answers a question you already know how to ask.", level: "6-1"}
      - {text: "The gapper list is finished before the bell; the movers list has not started.", level: "6-2"}
      - {text: "Conditions are arithmetic and a machine does them. The reading is yours.", level: "6-3"}
