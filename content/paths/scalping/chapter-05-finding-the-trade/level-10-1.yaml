id: "10-1"
title: "Checkpoint"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: test
tags: [checkpoint, scanner, watchlist, float]
learning_goal: "User proves they can set conditions before sorting, cut a list to a watchlist they can actually mark, read a float column, and let the book decide a share count."
purpose: "Levels 11 to 13 add the market behind the stock, and they only help someone who can already pick the stock."
terms_introduced: []
reinforces: [1, 3]
prerequisite: "9-2"
xp: 40
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "Ten scored questions on Levels 6–9, fresh wordings and fresh numbers. Three reach back: the account ceiling and the book from Chapter 3, the two dials from Chapter 1. Account named at $21,000; both worked positions are 1,400 shares under $14.00."
screens:
  - type: intro
    text: "Ten questions on Levels 6 to 9. Your account is $21,000 and 1,400 shares is the size you trade."
    counter: 10

  - type: sort
    prompt: "Which of these is work you do once on a quiet evening, and which is work the morning asks for every single time?"
    buckets: ["Set once, in the conditions", "Done fresh, every morning"]
    items:
      - {text: "The widest quote I am willing to pay", bucket: "Set once, in the conditions"}
      - {text: "The price band my account and my size allow", bucket: "Set once, in the conditions"}
      - {text: "Which three names get their lines drawn", bucket: "Done fresh, every morning"}
      - {text: "Whether I have read the reason behind the move", bucket: "Done fresh, every morning"}
    explanation: "Conditions delete the rows you could never trade, whatever day it is. What survives them is a short list, and a short list is read by hand."

  - type: tf
    statement: "Before the bell the movers list is the one worth reading, because it is built from what has actually traded."
    answer: false
    explanation: "Nothing has traded yet, so it is empty. The gapper list is the one that exists before the open; the movers list earns its place once the session is running."

  - type: numeric-mc
    prompt: "KELP has issued 54 M shares. Founders and long-term holders sit on 41 M of them and are not selling. What is the float?"
    options:
      - {text: "54 M"}
      - {text: "13 M", correct: true}
      - {text: "41 M"}
      - {text: "95 M"}
    working: "54 M issued − 41 M held = 13 M"
    explanation: "Thirteen million shares is what today's crowd is actually fighting over, and it is a different number from the one in the company's filings."

  - type: scanner-pick
    prompt: "Same $21,000 account, same 1,400 shares. Which row survives?"
    data:
      rows:
        - {ticker: VANE, price: 22.70, change_pct: 9.1, rvol: 7.4, float: "260M", spread: 0.03, catalyst: "Contract win"}
        - {ticker: KELP, price: 13.60, change_pct: 8.4, rvol: 6.2, float: "13M", spread: 0.02, catalyst: "Results"}
        - {ticker: SLOE, price: 12.40, change_pct: 14.6, rvol: 11.8, float: "5M", spread: 0.15, catalyst: "Trial result"}
        - {ticker: BRIM, price: 14.10, change_pct: 2.1, rvol: 1.0, float: "90M", spread: 0.02, catalyst: "—"}
    target: KELP
    explanation: "KELP is $19,040 for 1,400 shares and two cents on the round trip. VANE is 925 shares on this account, SLOE charges fifteen cents to find out, BRIM is having an ordinary day."

  - type: chart-annotate
    prompt: "KELP, before the bell. Drag the line to the highest price it has reached this morning."
    chart:
      kind: candles
      data: [[13.40, 13.52, 13.36, 13.48], [13.48, 13.58, 13.44, 13.54], [13.54, 13.74, 13.50, 13.66], [13.66, 13.70, 13.58, 13.62], [13.62, 13.68, 13.56, 13.60], [13.60, 13.66, 13.54, 13.64], [13.64, 13.70, 13.58, 13.62], [13.62, 13.68, 13.56, 13.66], [13.66, 13.72, 13.60, 13.68]]
      volume: [22000, 26000, 34000, 18000, 16000, 20000, 17000, 19000, 21000]
    answer: 13.74
    tolerance: 0.04
    label: "Pre-market high"
    explanation: "$13.74, reached once and handed straight back. It is one of the three prices a watchlist name gets marked with while the screen is still quiet."

  - type: chart-decision
    scenario: "KELP has held 6× its normal volume since the bell, and the minute that just closed finished five cents above the pre-market high you marked at $13.74. Your account is $21,000 and 1,400 shares is the size you trade."
    shares: 1400
    chart:
      kind: candles
      data: [[13.52, 13.62, 13.46, 13.58], [13.58, 13.66, 13.52, 13.62], [13.62, 13.70, 13.56, 13.60], [13.60, 13.72, 13.54, 13.68], [13.68, 13.78, 13.62, 13.72], [13.72, 13.84, 13.68, 13.79], [13.79, 13.90, 13.74, 13.86], [13.86, 13.96, 13.80, 13.92], [13.92, 14.02, 13.86, 13.98], [13.98, 14.06, 13.92, 14.01], [14.01, 14.04, 13.94, 13.98]]
      volume: [92000, 100000, 86000, 94000, 88000, 142000, 126000, 114000, 104000, 96000, 88000]
      levels:
        - {price: 13.74, label: "Pre-market high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $14.01 — $0.22 a share above the decision, +$308 long on 1,400 shares."
    explanation: "The filters were all cleared before the bell, and then the heaviest minute of the morning finished clear of a price you had already drawn."

  - type: depth-ladder
    prompt: "SLOE's book, and you market-buy 900 shares of it. Where does the last of them fill?"
    data:
      bids: [[12.36, 500], [12.35, 700], [12.33, 1500]]
      asks: [[12.40, 300], [12.43, 400], [12.46, 1200]]
    target: ask-3
    explanation: "Three hundred, then four hundred, then two hundred more at a price six cents above the one you saw. That walk is the third ceiling on size, and only the book knows it."

  - type: spot-mistake
    prompt: "Tap the part that does not hold."
    segments:
      - {text: "Twelve names cleared the conditions,"}
      - {text: "so twelve names went on the watchlist", wrong: true}
      - {text: "and the morning started with three lines drawn on each."}
    explanation: "Three lines a name at about forty seconds a line is eight minutes for four names. Twelve is a list that never gets marked, and an unmarked name gets read while it is moving."

  - type: chart-decision
    scenario: "PRAM has a 5 M float and is stepping higher on 9× its normal volume. The panel reads $13.09 bid, $13.20 ask, with 400 shares showing at the ask. Your account is $21,000 and 1,400 shares is the size you trade."
    shares: 1400
    chart:
      kind: candles
      data: [[12.70, 12.80, 12.64, 12.78], [12.78, 12.88, 12.72, 12.84], [12.84, 12.92, 12.78, 12.88], [12.88, 13.00, 12.82, 12.96], [12.96, 13.06, 12.90, 13.02], [13.02, 13.16, 12.98, 13.10], [13.10, 13.22, 13.06, 13.18], [13.18, 13.28, 13.12, 13.24], [13.24, 13.34, 13.18, 13.29], [13.29, 13.32, 13.20, 13.25]]
      volume: [14000, 17000, 13000, 16000, 15000, 24000, 20000, 18000, 16000, 14000]
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It reached $13.29 — $0.19 a share past the decision, and eleven of those cents were the quote before the book was walked at all."
    explanation: "Four hundred shares showing against the 1,400 you trade, on an eleven-cent quote. The chart was right and the name was still not yours at that size."

  - type: tf
    statement: "Two names are both up 9 % today, so the one with the wider quote is the more volatile of the two."
    answer: false
    explanation: "Width is the ease-of-exit dial, not the movement dial. Both of them travelled the same distance; one is simply harder to leave."

  - type: summary
    total: 10
