id: "1-4"
title: "Not Every Stock"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: new-theory
tags: [selection, practice, decisions]
learning_goal: "User runs all four filters on a name in the order that costs the least time, and drops it on the first no."
purpose: "The four questions are worth nothing separately. What makes them a filter is running them every time, in the same order, before the chart."
terms_introduced: []
reinforces: [1, 3]
prerequisite: "1-3"
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — The PlayBook"]
notes: "Closes Level 1. Four kinds of name to leave alone, then the four filters run together. Account named at $18,000; the standing size is 1,100 shares, and TARN at $17.40 is worked at 900."
screens:
  - type: intro
    text: "Four filters, and the four kinds of name that fail one of them before the market opens."

  - type: carousel
    cards:
      - {label: "The one you cannot leave", text: "Minutes of a few thousand shares. Your own order is the move, going in and coming out.", icon: illiquid}
      - {label: "The one whose quote you cannot pay", text: "Twelve cents between the sides on a name that travels twenty. Most of the trade is the toll.", icon: spread}
      - {label: "The one that does not travel", text: "Nine cents covered by mid-morning. There is nothing in it to divide, however cheap the quote.", icon: flat}
      - {label: "The one you cannot hold", text: "Three hundred dollars a share. An $18,000 account pays for sixty of them, and sixty is not a position.", icon: account}

  - type: theory
    title: "One no is enough"
    body: "The filters are not scored out of four. A single no ends the name and the chart is never opened. That is the whole reason for running them first."

  - type: swipe-deck
    prompt: "Your account is $18,000 and you trade 1,100 shares. Take the name onto the screen, or pass?"
    cards:
      - chart:
          kind: candles
          data: [[16.42, 16.45, 16.40, 16.44], [16.44, 16.46, 16.41, 16.42], [16.42, 16.46, 16.40, 16.45], [16.45, 16.47, 16.41, 16.43], [16.43, 16.46, 16.40, 16.44], [16.44, 16.46, 16.41, 16.42], [16.42, 16.45, 16.40, 16.44], [16.44, 16.47, 16.42, 16.45]]
        answer: pass
        note: "Seven cents of range in eight minutes. Nothing in it to divide."
      - chart:
          kind: candles
          data: [[13.10, 13.12, 13.08, 13.10], [13.10, 13.30, 13.09, 13.28], [13.28, 13.30, 13.26, 13.28], [13.28, 13.29, 13.26, 13.27], [13.27, 13.48, 13.26, 13.46], [13.46, 13.48, 13.44, 13.46], [13.46, 13.47, 13.44, 13.45], [13.45, 13.66, 13.44, 13.64]]
        answer: pass
        note: "Twenty cents at a time and nothing in between. That shape is the exit missing."
      - chart:
          kind: candles
          data: [[14.20, 14.30, 14.16, 14.28], [14.28, 14.40, 14.24, 14.36], [14.36, 14.48, 14.32, 14.44], [14.44, 14.56, 14.40, 14.52], [14.52, 14.62, 14.48, 14.58], [14.58, 14.70, 14.54, 14.66], [14.66, 14.78, 14.62, 14.74], [14.74, 14.86, 14.70, 14.82]]
        answer: take
        note: "A step every minute, filled in the whole way up, and 1,100 shares at $14 is $15,400 of the account."
      - chart:
          kind: candles
          data: [[23.90, 24.04, 23.84, 24.00], [24.00, 24.16, 23.94, 24.12], [24.12, 24.26, 24.06, 24.22], [24.22, 24.36, 24.16, 24.32], [24.32, 24.44, 24.26, 24.40], [24.40, 24.54, 24.34, 24.50], [24.50, 24.64, 24.44, 24.60], [24.60, 24.72, 24.54, 24.68]]
        answer: pass
        note: "The chart is fine. At $24 this account pays for 750 shares, not 1,100."
      - chart:
          kind: candles
          data: [[10.86, 10.96, 10.82, 10.94], [10.94, 11.06, 10.90, 11.02], [11.02, 11.14, 10.98, 11.10], [11.10, 11.24, 11.06, 11.20], [11.20, 11.32, 11.16, 11.28], [11.28, 11.42, 11.24, 11.38], [11.38, 11.50, 11.34, 11.46], [11.46, 11.58, 11.42, 11.54]]
        answer: take
        note: "Eight-cent bodies with no holes in them, and 1,100 shares at $11 is $12,100 of the account."
    explanation: "Two takes and three passes, and one of the passes is about your account rather than the chart in front of you."

  - type: numeric-input
    prompt: "Your account is $18,000 and a name trades at $24. How many shares can the account pay for?"
    answer: 750
    tolerance: 1
    unit: "shares"
    working: "$18,000 ÷ $24 = 750 shares"
    explanation: "Seven hundred and fifty, so a plan built on 1,100 was never available in this name."

  - type: chart-decision
    scenario: "TARN is up 9 % and stepping higher. The bars underneath are between 6,000 and 11,000 shares and the panel reads $17.30 bid, $17.44 ask. Your account is $18,000 and 900 shares is the size you trade."
    shares: 900
    chart:
      kind: candles
      data: [[16.86, 17.00, 16.82, 16.96], [16.96, 17.10, 16.90, 17.06], [17.06, 17.18, 17.00, 17.14], [17.14, 17.28, 17.08, 17.24], [17.24, 17.36, 17.18, 17.32], [17.32, 17.46, 17.26, 17.40], [17.40, 17.56, 17.34, 17.52], [17.52, 17.66, 17.46, 17.62], [17.62, 17.76, 17.56, 17.73], [17.73, 17.78, 17.66, 17.70]]
      volume: [7000, 9000, 6000, 8000, 11000, 10000, 8000, 7000, 9000, 6000]
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It carried to $17.73 — $0.33 a share past the decision, and fourteen cents of it was the quote in minutes of 8,000 shares."
    explanation: "Two filters said no. The 9 % is the reason the name looks tempting and none of the reason it is tradeable."

  - type: tf
    statement: "A name that fails one filter is still worth trading if it passes the other three."
    answer: false
    explanation: "One no ends it. A name you cannot leave is not rescued by a tight quote or a big move."

  - type: order
    prompt: "Run the four filters in the order that costs you the least time."
    items:
      - "The price, against what the account can pay for"
      - "A typical minute, against the size you trade"
      - "The quote, against what the name travels"
      - "The travel itself, against the quote you would pay"
    explanation: "Cheapest first. The price is one glance and it settles the name before a single bar has been read."

  - type: chart-decision
    scenario: "CLAY has printed over 115,000-share minutes since the open, quotes two cents wide and has been travelling fourteen to eighteen cents a minute. Your account is $18,000 and 1,100 shares is the size you trade."
    shares: 1100
    chart:
      kind: candles
      data: [[14.10, 14.20, 14.06, 14.18], [14.18, 14.28, 14.12, 14.24], [14.24, 14.32, 14.18, 14.22], [14.22, 14.34, 14.16, 14.30], [14.30, 14.42, 14.26, 14.38], [14.38, 14.66, 14.36, 14.62], [14.62, 14.76, 14.58, 14.72], [14.72, 14.84, 14.68, 14.80], [14.80, 14.90, 14.74, 14.86], [14.86, 14.92, 14.80, 14.88], [14.88, 14.92, 14.82, 14.84]]
      volume: [124000, 132000, 118000, 126000, 120000, 164000, 148000, 136000, 128000, 122000, 116000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $14.88 — $0.26 a share above the decision, +$286 long on 1,100 shares."
    explanation: "All four answered before the chart was read: reachable, payable, worth paying for, and $16,082 of an $18,000 account."

  - type: recap
    title: "Level 1 in four lines"
    points:
      - {text: "A name you cannot leave is not a trade, however far it travels.", level: "1-1"}
      - {text: "A quote is cheap or dear only against what the name travels.", level: "1-2"}
      - {text: "The account divided by the price is a ceiling, not a target.", level: "1-3"}
      - {text: "One no on any of the four ends the name for the day.", level: "1-4"}
