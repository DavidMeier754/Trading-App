id: "8-1"
title: "Float and Share Structure"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: new-theory
tags: [float, selection, liquidity]
learning_goal: "User can say what a float is, read the column, and tell a name's float apart from the volume trading in it today."
purpose: "Two names at the same multiple behave completely differently if one has ten million shares available and the other has eight hundred million."
terms_introduced: ["Float"]
skills: ["Float"]
reinforces: [1, 3]
prerequisite: "7-3"
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — The PlayBook"]
notes: "Introduces the one scanner column the chapter has deliberately left alone until now. Account named at $17,000; the worked position is 1,000 shares at $14.80 = $14,800."
screens:
  - type: intro
    text: "There is one column on that row you have never used. This is what it is for."

  - type: theory
    title: "Float"
    body: "The float is the number of shares actually available to trade. A company may have issued fifty million, but if most of them sit with founders and long-term holders, far fewer than fifty million can change hands."

  - type: example
    body: "MARL has issued 48 M shares. Founders and long-term holders sit on 36 M of them and are not selling this morning. What is left over is the float, and it is what today's crowd has to share."

  - type: numeric-input
    prompt: "48 M shares issued, 36 M of them locked away. What is the float?"
    answer: 12000000
    tolerance: 1
    unit: "shares"
    working: "48,000,000 − 36,000,000 = 12,000,000 shares"
    explanation: "Twelve million, and every buyer and seller in the name today is working inside that number."

  - type: visual
    component: bar-chart
    data:
      bars:
        - {label: "MARL", value: 12}
        - {label: "PIKE", value: 96}
        - {label: "ORCA", value: 740}
      unit: "million shares of float"
    caption: "Three names on the same list. The column that separates them is not the one you have been sorting by."

  - type: mc
    prompt: "A name's float is 12 M shares and it has traded 9 M today. What does that tell you?"
    options:
      - {text: "The float has shrunk to 3 M shares"}
      - {text: "Three quarters of the tradeable shares changed hands today", correct: true}
      - {text: "Most of the company has been sold this morning"}
    explanation: "Shares change hands over and over; the float does not go down when they do. It means today's crowd has been through nearly all of it."

  - type: fill-tiles
    sentence: "The number of a company's shares actually available to trade is its ___."
    answer: "float"
    explanation: "Not the same as how many exist, and not the same as how many trade today."

  - type: story
    text: "A fund holds nine million of MARL's forty-eight and has held them for four years. Those shares are on the register and they are not in the morning's argument."

  - type: scanner-pick
    prompt: "Your account is $17,000 and you trade 1,000 shares. Which row survives?"
    data:
      rows:
        - {ticker: ORCA, price: 21.30, change_pct: 5.8, rvol: 4.9, float: "740M", spread: 0.03, catalyst: "Upgrade"}
        - {ticker: MARL, price: 14.80, change_pct: 8.6, rvol: 6.8, float: "12M", spread: 0.02, catalyst: "Results"}
        - {ticker: SALT, price: 13.60, change_pct: 2.1, rvol: 1.2, float: "84M", spread: 0.02, catalyst: "—"}
    target: MARL
    explanation: "MARL: $14,800 for 1,000 shares, two cents wide, a reason, and 6.8× its normal day. ORCA is 798 shares on this account and SALT is having an ordinary one."

  - type: chart-decision
    scenario: "MARL is on 6.8× its normal volume with minutes of about 90,000 shares, and the minute that just closed finished four cents under the pre-market low of $14.84."
    shares: 1000
    state: ["Size: 1,000 shares"]
    chart:
      kind: candles
      data: [[15.12, 15.18, 15.02, 15.04], [15.04, 15.08, 14.94, 14.96], [14.96, 15.02, 14.90, 14.98], [14.98, 15.02, 14.88, 14.90], [14.90, 14.94, 14.86, 14.88], [14.88, 14.90, 14.78, 14.80], [14.80, 14.82, 14.68, 14.70], [14.70, 14.74, 14.60, 14.62], [14.62, 14.66, 14.52, 14.54], [14.54, 14.58, 14.44, 14.48], [14.48, 14.52, 14.40, 14.44]]
      volume: [84000, 92000, 78000, 88000, 82000, 128000, 114000, 104000, 96000, 88000, 82000]
      levels:
        - {price: 14.84, label: "Pre-market low"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "Thirty-six cents came out of it by the last bar — $14.44, and +$360 short on 1,000 shares."
    explanation: "A twelve-million float with ninety-thousand-share minutes has both readings a scalp needs: enough trading to leave, and few enough shares that a crowd shows up in the price."

  - type: tf
    statement: "Two names can be at the same multiple and have floats that differ by fifty times."
    answer: true
    explanation: "The multiple compares a name with its own ordinary day. It says nothing at all about how many shares exist to be traded."

  - type: match
    prompt: "Four numbers you can read about one name. Which is which?"
    pairs:
      - ["Issued shares", "Everything the company has ever created"]
      - ["Float", "What is actually available to trade"]
      - ["Volume today", "What has changed hands since the bell"]
      - ["The multiple", "Today's volume against this name's own normal"]
    explanation: "Four different numbers that beginners run together, and only two of them change from one morning to the next."

  - type: hotspot
    component: scanner-table
    prompt: "Tap the row where the fewest shares are available for today's crowd to share."
    data:
      rows:
        - {ticker: ORCA, price: 21.30, change_pct: 5.8, rvol: 4.9, float: "740M", spread: 0.03, catalyst: "Upgrade"}
        - {ticker: MARL, price: 14.80, change_pct: 8.6, rvol: 6.8, float: "12M", spread: 0.02, catalyst: "Results"}
        - {ticker: SALT, price: 13.60, change_pct: 2.1, rvol: 1.2, float: "84M", spread: 0.02, catalyst: "—"}
    target: MARL
    explanation: "Twelve million against eighty-four and seven hundred and forty. What that does to the way the price moves is the next sub-level."

  - type: sort
    prompt: "Which of these change during a session, and which were fixed before it started?"
    buckets: ["Changes today", "Fixed before the open"]
    items:
      - {text: "How many shares have traded", bucket: "Changes today"}
      - {text: "The multiple", bucket: "Changes today"}
      - {text: "The float", bucket: "Fixed before the open"}
      - {text: "How many shares the company has issued", bucket: "Fixed before the open"}
    explanation: "Two of them are the session reporting on itself. The other two are facts about the company you could have looked up last week."
