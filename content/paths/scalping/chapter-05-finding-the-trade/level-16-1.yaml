id: "16-1"
title: "Chapter Review"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: repetition
tags: [review, routine, selection, market-context]
learning_goal: "User runs one pre-market end to end, from an empty screen to two marked names and a tag for the room, without being told which step comes next."
purpose: "Every skill in this chapter was taught alone; a morning asks for all of them in one unbroken twenty minutes."
terms_introduced: []
reinforces: [1, 2, 3, 4]
prerequisite: "15-3"
xp: 35
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "First half of the review: the scan, the cuts, the lines and the check. Account named at $25,000; the worked position is 1,600 shares at $14.55 = $23,280."
screens:
  - type: intro
    text: "An empty screen, the market shut. Your account is $25,000 and 1,600 shares is the size you trade."

  - type: story
    character: retail-trader
    text: "Nobody is going to tell you which step comes next this morning. In twenty minutes there should be two names on the screen with three prices drawn on each."

  - type: scanner-pick
    prompt: "Steps one and two, on this morning's list. Which two names survive?"
    data:
      rows:
        - {ticker: BOLE, price: 14.60, change_pct: 9.4, rvol: 8.2, float: "68M", spread: 0.02, catalyst: "Results"}
        - {ticker: THAW, price: 31.20, change_pct: 12.6, rvol: 11.4, float: "220M", spread: 0.04, catalyst: "Approval"}
        - {ticker: CRAN, price: 13.40, change_pct: 13.8, rvol: 12.0, float: "5M", spread: 0.19, catalyst: "Trial result"}
        - {ticker: IRIS, price: 15.10, change_pct: 7.2, rvol: 6.1, float: "94M", spread: 0.02, catalyst: "Guidance raise"}
        - {ticker: LARK, price: 12.70, change_pct: 2.2, rvol: 1.2, float: "150M", spread: 0.03, catalyst: "—"}
    targets: [BOLE, IRIS]
    explanation: "BOLE at $23,360 and IRIS at $24,160 for 1,600 shares, both two cents wide. THAW is 801 shares on this account, CRAN's quote is $304 of round trip, LARK is having an ordinary day."

  - type: mc
    prompt: "CRAN has the biggest multiple on the screen. Which reading ends it, and where does that reading come from?"
    options:
      - {text: "The float, and it comes off the row without a chart"}
      - {text: "The chart, once you see how far it jumps between prints"}
      - {text: "The quote, and it comes off the row without a chart", correct: true}
    explanation: "Nineteen cents on 1,600 shares is $304 of round trip. Five million shares of float is workable at a smaller size; the quote is not workable at any."

  - type: numeric-input
    prompt: "Confirm the cut on THAW: a $25,000 account, a price of $31.20. How many shares can the account pay for?"
    answer: 801
    tolerance: 1
    unit: "shares"
    working: "$25,000 ÷ $31.20 = 801 shares"
    explanation: "Eight hundred and one, against the 1,600 the plan is built on. Half a position in the best-looking name on the list is still half a position."

  - type: depth-ladder
    prompt: "CRAN's book before the bell, and you were about to buy 1,600 shares. Where would the last of them fill?"
    data:
      bids: [[13.28, 400], [13.24, 600], [13.18, 1200]]
      asks: [[13.47, 300], [13.54, 500], [13.62, 2000]]
    target: ask-3
    explanation: "Three hundred, then five hundred, then eight hundred more fifteen cents above the price you were looking at. The row said nineteen cents and the book says the row was optimistic."

  - type: hotspot
    component: internals-panel
    prompt: "Step four, on this morning's panel. Tap the street the move is actually coming from."
    data:
      index: {label: "{{market.index_example}}", data: [100.0, 100.2, 100.1, 100.3, 100.2, 100.4, 100.3, 100.5]}
      breadth: "1,480 up / 1,520 down"
      sectors:
        - {label: "Chipmakers", value: 2.6}
        - {label: "Banks", value: 0.2}
        - {label: "Miners", value: -0.4}
      tone: mixed
    target: sectors
    explanation: "One street at +2.6 % with everything else inside a point. If neither of your names is on it, a green index is not a green index for you."

  - type: tf
    statement: "A green index sitting over a count of names that disagrees with it is itself a reading, not a missing one."
    answer: true
    explanation: "Money and names pointing different ways says one street is carrying the room. That is the check answering, not the check failing."

  - type: chart-annotate
    prompt: "BOLE, before the bell. Drag the line to the round number the morning has stopped at three times."
    chart:
      kind: candles
      data: [[14.30, 14.38, 14.26, 14.36], [14.36, 14.50, 14.32, 14.42], [14.42, 14.46, 14.34, 14.38], [14.38, 14.44, 14.32, 14.42], [14.42, 14.50, 14.38, 14.44], [14.44, 14.48, 14.36, 14.40], [14.40, 14.46, 14.34, 14.44], [14.44, 14.48, 14.38, 14.46], [14.46, 14.50, 14.40, 14.48]]
      volume: [22000, 34000, 19000, 17000, 30000, 18000, 16000, 20000, 25000]
    answer: 14.50
    tolerance: 0.04
    label: "Round number"
    explanation: "$14.50, three times, and through it none of them. Round numbers hold on a quiet pre-market screen as reliably as they hold on a busy one."

  - type: sort
    prompt: "The work so far. Which of it came off a row, and which needed a chart opened?"
    buckets: ["Off the row", "Needed the chart"]
    items:
      - {text: "Eight hundred and one shares is not sixteen hundred", bucket: "Off the row"}
      - {text: "Nineteen cents is $304 of round trip", bucket: "Off the row"}
      - {text: "$14.50 has stopped it three times", bucket: "Needed the chart"}
      - {text: "Both pushes finished back under the number", bucket: "Needed the chart"}
    explanation: "Two cuts and two lines. The cuts were arithmetic and cost seconds; the lines are what the shortlist was kept short in order to pay for."

  - type: chart-decision
    scenario: "BOLE opened, spent twenty minutes under the round number you drew at $14.50, and the minute that just closed finished five cents through it on the heaviest bar since the bell. The room is mixed and BOLE is not on the street carrying it. Your account is $25,000 and 1,600 shares is the size you trade."
    shares: 1600
    state: ["Room: mixed", "Tries expected: 2"]
    chart:
      kind: candles
      data: [[14.34, 14.42, 14.30, 14.40], [14.40, 14.46, 14.36, 14.42], [14.42, 14.50, 14.38, 14.44], [14.44, 14.48, 14.40, 14.46], [14.46, 14.50, 14.42, 14.48], [14.48, 14.58, 14.46, 14.55], [14.55, 14.66, 14.52, 14.62], [14.62, 14.72, 14.58, 14.68], [14.68, 14.78, 14.64, 14.74], [14.74, 14.84, 14.70, 14.79], [14.79, 14.82, 14.72, 14.76]]
      volume: [100000, 108000, 94000, 102000, 96000, 158000, 136000, 122000, 110000, 100000, 92000]
      levels:
        - {price: 14.50, label: "Round number"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $14.79 — $0.24 a share above the decision, +$384 long on 1,600 shares."
    explanation: "A price drawn while the market was shut, given up on the heaviest minute of the session. The mixed room said expect two of these today rather than six."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Nine rows cleared the conditions this morning,"}
      - {text: "so the shortlist was nine names with one line on each,", wrong: true}
      - {text: "and the bell arrived with two of them properly marked."}
    explanation: "Nine names and a line apiece is nine names you cannot trade. Two names with three prices each is what the twenty minutes were for."

  - type: example
    body: "An empty screen twenty minutes ago; two names now, three prices on each, and a tag for the room. Every decision the session asks for gets answered out of that."
