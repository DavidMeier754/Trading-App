id: "9-1"
title: "Watchlist Practice"
chapter: 5
chapter_title: "Finding the Trade"
path: scalping
category: repetition
tags: [drill, watchlist, selection]
learning_goal: "User builds a watchlist from a raw list, marks it, and takes the trade the marking made visible — in one run, without teaching in between."
purpose: "The pre-market is one continuous piece of work, and doing it in pieces is not the same as doing it."
terms_introduced: []
skills: ["A watchlist in one run"]
reinforces: [1, 3]
prerequisite: "8-3"
xp: 30
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "First of the two practice subs. One morning, run end to end. Account named at $23,000; both worked positions are 1,400 shares under $15."
screens:
  - type: intro
    text: "One morning, start to finish. Your account is $23,000 and 1,400 shares is the size you trade."

  - type: scanner-pick
    prompt: "The list, sorted. Two of these five go on the watchlist."
    data:
      rows:
        - {ticker: ROAN, price: 14.90, change_pct: 7.9, rvol: 6.6, float: "88M", spread: 0.02, catalyst: "Results"}
        - {ticker: CRAG, price: 12.30, change_pct: 17.2, rvol: 14.4, float: "6M", spread: 0.16, catalyst: "Trial result"}
        - {ticker: ORCA, price: 27.40, change_pct: 6.4, rvol: 5.2, float: "640M", spread: 0.03, catalyst: "Upgrade"}
        - {ticker: PIKE, price: 13.90, change_pct: 9.4, rvol: 8.1, float: "72M", spread: 0.02, catalyst: "Guidance cut"}
        - {ticker: YARN, price: 11.70, change_pct: 1.9, rvol: 1.1, float: "120M", spread: 0.02, catalyst: "—"}
    targets: [ROAN, PIKE]
    explanation: "ROAN at $20,860 and PIKE at $19,460 for 1,400 shares. CRAG has the biggest multiple and a sixteen-cent quote, ORCA is 839 shares here, YARN is having an ordinary day."

  - type: mc
    prompt: "CRAG is top of the list at 14× normal. Say the cut in one sentence."
    options:
      - {text: "Six million shares is too small a float to trade at all"}
      - {text: "Sixteen cents on the round trip is $224 of my size", correct: true}
      - {text: "A trial result is not a reason the crowd stays"}
    explanation: "The float is workable at a smaller size and the reason is real. The quote is the part that ends it, and it ends it in dollars."

  - type: numeric-mc
    prompt: "1,400 shares in and back out of CRAG, on its sixteen-cent quote. What does the quote take?"
    options:
      - {text: "$22.40"}
      - {text: "$2,240"}
      - {text: "$224", correct: true}
      - {text: "$28"}
    working: "$0.16 a share × 1,400 shares = $224"
    explanation: "Two hundred and twenty-four dollars. ROAN's two-cent quote takes $28 for the same size, and that difference is the whole of the cut."

  - type: chart-annotate
    prompt: "ROAN, before the bell. Drag the line to the price its last two pushes stopped at."
    chart:
      kind: candles
      data: [[14.50, 14.60, 14.44, 14.58], [14.58, 14.88, 14.54, 14.70], [14.70, 14.76, 14.62, 14.66], [14.66, 14.74, 14.60, 14.72], [14.72, 14.88, 14.68, 14.74], [14.74, 14.80, 14.66, 14.70], [14.70, 14.78, 14.64, 14.72], [14.72, 14.80, 14.66, 14.76], [14.76, 14.82, 14.70, 14.78]]
      volume: [96000, 118000, 84000, 78000, 112000, 82000, 76000, 88000, 92000]
    answer: 14.88
    tolerance: 0.04
    label: "Resistance"
    explanation: "$14.88, reached twice and closed through neither time. That is the line the morning gets watched against."

  - type: chart-decision
    scenario: "ROAN has run at 6.6× its normal volume since the open. The minute that just closed finished four cents above the line you drew, on the heaviest bar of the morning."
    shares: 1400
    state: ["Size: 1,400 shares"]
    chart:
      kind: candles
      data: [[14.56, 14.66, 14.50, 14.62], [14.62, 14.72, 14.56, 14.68], [14.68, 14.76, 14.62, 14.66], [14.66, 14.78, 14.60, 14.74], [14.74, 14.84, 14.68, 14.80], [14.80, 14.96, 14.76, 14.92], [14.92, 15.04, 14.88, 15.00], [15.00, 15.10, 14.94, 15.06], [15.06, 15.16, 15.00, 15.12], [15.12, 15.22, 15.06, 15.17], [15.17, 15.20, 15.08, 15.12]]
      volume: [98000, 106000, 92000, 100000, 94000, 144000, 130000, 118000, 108000, 100000, 92000]
      levels:
        - {price: 14.88, label: "Resistance"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $15.17 — $0.25 a share above the decision, +$350 long on 1,400 shares."
    explanation: "The price that turned it twice before the bell was given up on more volume than either of those pushes had."

  - type: order-build
    prompt: "Take it. 1,400 shares, the ask is $14.94, and you refuse to pay more than three cents through it."
    ticker: ROAN
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [700, 1400, 2100]
      price: [14.91, 14.94, 14.97]
    answer: {side: buy, type: limit, qty: 1400, price: 14.97}
    explanation: "A limit three cents through the ask goes through like a market order and still refuses anything worse than $14.97."

  - type: numeric-input
    prompt: "Filled at $14.92 on 1,400 shares. How much of the $23,000 is standing in it?"
    answer: 20888
    tolerance: 1
    unit: "$"
    working: "1,400 shares × $14.92 = $20,888"
    explanation: "Nearly the whole account in one name, which is why the second watchlist name will not be traded at the same time."

  - type: tf
    statement: "PIKE is up 9 % on guidance being cut, so it belongs on the watchlist for a short rather than a long."
    answer: false
    explanation: "A cut to guidance is a reason the crowd is here, and the name is up on it. The reason chooses the name; the chart chooses the side."

  - type: chart-decision
    scenario: "PIKE gave back its opening push and has made lower highs for twenty minutes on rising volume. The minute that just closed finished six cents under the low of the morning at $13.56."
    shares: 1400
    state: ["Size: 1,400 shares"]
    chart:
      kind: candles
      data: [[14.00, 14.06, 13.86, 13.90], [13.90, 13.96, 13.78, 13.82], [13.82, 13.90, 13.72, 13.78], [13.78, 13.84, 13.66, 13.70], [13.70, 13.76, 13.58, 13.62], [13.62, 13.66, 13.46, 13.50], [13.50, 13.56, 13.40, 13.44], [13.44, 13.50, 13.34, 13.38], [13.38, 13.44, 13.26, 13.30], [13.30, 13.36, 13.18, 13.21], [13.21, 13.28, 13.16, 13.24]]
      volume: [104000, 112000, 98000, 108000, 102000, 138000, 126000, 116000, 106000, 98000, 92000]
      levels:
        - {price: 13.56, label: "Low of the morning"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It carried down to $13.21 — $0.29 a share below the decision, +$406 short on 1,400 shares."
    explanation: "Rising volume into lower highs, and then the price the morning had been resting on given up. Both watchlist names paid, and neither of them on the side the list suggested."

  - type: match
    prompt: "Four rows from this morning. Which sentence did each one earn?"
    pairs:
      - ["CRAG", "The quote takes $224 of my size"]
      - ["ORCA", "The account pays for 839 of the 1,400"]
      - ["YARN", "Nothing unusual is happening in it"]
      - ["PIKE", "A reason, a crowd, and a chart that chose the side"]
    explanation: "Three of them are one-sentence cuts, and the fourth is the sentence you want to be able to write."

  - type: compare
    prompt: "Two names cleared everything on the row. Which one is asking you for a decision this minute?"
    charts:
      - kind: candles
        data: [[13.86, 13.92, 13.80, 13.88], [13.88, 13.94, 13.82, 13.86], [13.86, 13.92, 13.80, 13.90], [13.90, 13.96, 13.84, 13.88], [13.88, 13.94, 13.82, 13.90], [13.90, 13.96, 13.84, 13.88], [13.88, 13.94, 13.82, 13.92], [13.92, 13.98, 13.86, 13.90]]
        levels: [{price: 14.30}]
        label: "A"
      - kind: candles
        data: [[14.60, 14.70, 14.56, 14.68], [14.68, 14.78, 14.64, 14.74], [14.74, 14.84, 14.70, 14.80], [14.80, 14.88, 14.76, 14.84], [14.84, 14.90, 14.78, 14.86], [14.86, 14.98, 14.82, 14.94], [14.94, 15.04, 14.90, 15.00], [15.00, 15.10, 14.96, 15.06]]
        levels: [{price: 14.88}]
        label: "B"
    answer: "B"
    explanation: "A is forty cents under its line and drifting sideways. B has closed three minutes above its line on bigger bodies. Only one of them is where a decision lives."

  - type: spot-mistake
    prompt: "Tap the part that is wrong."
    segments:
      - {text: "CRAG was top of the list at 14× normal,"}
      - {text: "so the cut needed a reason from the chart,", wrong: true}
      - {text: "and sixteen cents on 1,400 shares was reason enough."}
    explanation: "The chart was never opened, and did not need to be. Three of the four questions are answered off the row."
