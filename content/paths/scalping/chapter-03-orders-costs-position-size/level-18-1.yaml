id: "18-1"
title: "Chapter Review"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: repetition
tags: [review, costs, position-size, decisions]
learning_goal: "User runs a setup end to end in one fixed order — price it, size it, place it, decide — and reaches the pass on the second one from the cost line alone."
purpose: "Every piece of this chapter has been practised separately. A trade uses all of them, in one order, in about ten seconds."
terms_introduced: []
skills: ["Price, size, place, decide"]
reinforces: [1, 2]
prerequisite: "17-3"
xp: 30
difficulty: 3
sources: [consensus]
notes: "First of the two Chapter Review subs. Account named at $24,000. Setup 1 runs the full sequence and is taken; Setup 2 fails on cost with a chart that was never the problem. Categorised new-theory because the four-step sequence itself is stated here for the first time, and because agent.md §3.2 allows no more than two review-type subs in a row before the Final Exam."
screens:
  - type: intro
    text: "Two setups, start to finish. Price it, size it, place it, decide."

  - type: theory
    title: "The order never changes"
    body: "Price the trade first, because a cost you cannot clear ends it before sizing is worth doing. Then the share count. Then the tickets. The decision comes last, and by then it is almost made."

  - type: story
    text: "Setup 1. XYZ has turned up twice off the same price this morning. Bid $16.44 / ask $16.46, its minutes have been travelling about twenty cents, fees run a cent a share and slippage about two."

  - type: numeric-input
    prompt: "Gap two cents, slippage two cents, fees one cent. What does Setup 1 cost per share, in and out?"
    answer: 0.05
    tolerance: 0.001
    unit: "$"
    working: "$0.02 + $0.02 + $0.01 = $0.05"
    explanation: "A quarter of the twenty cents these minutes are making. Inside the line, so the trade survives its first question."

  - type: chart-annotate
    prompt: "Drag the line to the price Setup 1 has turned up off twice this morning."
    chart:
      kind: candles
      data: [[16.58, 16.62, 16.50, 16.52], [16.52, 16.56, 16.44, 16.46], [16.46, 16.50, 16.36, 16.38], [16.38, 16.42, 16.30, 16.34], [16.34, 16.40, 16.30, 16.38], [16.38, 16.42, 16.33, 16.36], [16.36, 16.44, 16.32, 16.42], [16.42, 16.48, 16.38, 16.44], [16.44, 16.50, 16.40, 16.46]]
    answer: 16.30
    tolerance: 0.03
    label: "Support"
    explanation: "Both dips stopped dead on $16.30. That is the price the stop will be measured from, and the only reason the stop sits where it does."

  - type: numeric-mc
    prompt: "Stop four cents under that level, entry at the ask of $16.46, and a $24,000 account at one per cent. How many shares?"
    options:
      - {text: "1,200 — the stop is the lower ceiling", correct: true}
      - {text: "1,457 — the account is the lower ceiling"}
      - {text: "1,328, between the two"}
      - {text: "2,400, twice the stop's ceiling"}
    working: "Stop distance: $16.46 − $16.26 = $0.20. Risk: $240 ÷ $0.20 = 1,200. Account: $24,000 ÷ $16.46 = 1,457. Take the smaller."
    explanation: "Twenty cents of stop is what turns a $240 budget into 1,200 shares. The account had room to spare this time, which is why the stop is the number that counts."

  - type: order-build
    prompt: "Build Setup 1's entry: 1,200 shares, capped two cents over the ask of $16.46."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [900, 1200, 1457]
      price: [16.44, 16.46, 16.48]
    answer: {side: buy, type: limit, qty: 1200, price: 16.48}
    explanation: "A limit at $16.48 fills like a market order against this quote and refuses to chase more than two cents if the ask jumps as the order lands."

  - type: chart-decision
    scenario: "Setup 1, live. The minute that just closed came off $16.30 a third time on the biggest bar since the session opened, and the ask is $16.46. Your $24,000 account allows 1,200 shares here."
    shares: 1200
    state: ["Stop would sit at $16.26", "Cost $0.05 a share"]
    chart:
      kind: candles
      data: [[16.52, 16.58, 16.44, 16.46], [16.46, 16.50, 16.36, 16.38], [16.38, 16.42, 16.30, 16.34], [16.34, 16.40, 16.30, 16.38], [16.38, 16.42, 16.33, 16.36], [16.36, 16.50, 16.30, 16.46], [16.46, 16.60, 16.43, 16.58], [16.58, 16.72, 16.54, 16.68], [16.68, 16.82, 16.64, 16.78], [16.78, 16.94, 16.74, 16.89]]
      volume: [78000, 69000, 61000, 66000, 57000, 168000, 142000, 124000, 108000, 94000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $16.89 — $0.43 a share past the decision, +$516 long on 1,200 shares before costs."
    explanation: "Three holds at the same price, a push off it on the heaviest bar of the session, and a size the stop and the account had already agreed on. Nothing here was decided by the candle alone."

  - type: journal-row
    prompt: "Fill the record for the trade you just closed."
    trade: {setup: "Third hold at the level", entry: 16.46, stop: 16.26, exit: 16.89, shares: 1200}
    slots: [risk, gross, all_in]
    chips:
      risk: ["$216", "$240", "$260"]
      gross: ["$430", "$516", "$600"]
      all_in: ["$36", "$60", "$84"]
    answer: {risk: "$240", gross: "$516", all_in: "$60"}
    explanation: "Twenty cents of stop on 1,200 shares is $240 at risk; forty-three cents made is $516 before costs; the five cents all-in took $60 of it."

  - type: story
    text: "Setup 2. A different name, bid $12.38 / ask $12.46, and the best any minute has managed all morning is twelve cents. Fees a cent a share, slippage about a cent."

  - type: slider
    prompt: "Setup 2's all-in cost against the twelve cents on offer. What share is gone?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 85
    tolerance: 10
    explanation: "Eight cents of gap plus two of slippage and fees is ten cents, out of twelve. There is almost nothing left to be right about."

  - type: chart-decision
    scenario: "Setup 2, live. It has just closed out of the top of its range on the biggest bar of the morning, the ask is $12.46 and the bid is $12.38. Your $24,000 account allows 1,800 shares here."
    shares: 1800
    state: ["Cost $0.10 a share", "Range was 12 cents"]
    chart:
      kind: candles
      data: [[12.38, 12.42, 12.34, 12.40], [12.40, 12.44, 12.36, 12.38], [12.38, 12.43, 12.35, 12.41], [12.41, 12.45, 12.37, 12.39], [12.39, 12.44, 12.36, 12.42], [12.42, 12.48, 12.40, 12.46], [12.46, 12.55, 12.44, 12.52], [12.52, 12.54, 12.46, 12.48], [12.48, 12.51, 12.42, 12.44], [12.44, 12.48, 12.40, 12.42]]
      volume: [92000, 84000, 76000, 88000, 72000, 164000, 138000, 112000, 96000, 88000]
      decision_index: 5
    best: no-trade
    outcome: "It managed $0.09 a share to $12.55 and came straight back. $162 made on 1,800 shares, $180 paid to get in and out."
    explanation: "The breakout was real and the volume was there. Ten cents of cost inside a twelve-cent range is what ruled it out, and the chart was never the problem."

  - type: tf
    statement: "Setup 2 failed on its costs, so the chart reading that found it was wasted work."
    answer: false
    explanation: "The reading is what let you price the trade and put it down in one look. Finding the pass quickly is most of what the check is for."

  - type: sort
    prompt: "On these two setups, what was settled before the entry and what was left to the market?"
    buckets: ["Settled before the entry", "Left to the market"]
    items:
      - {text: "How many shares go out", bucket: "Settled before the entry"}
      - {text: "Where the stop sits", bucket: "Settled before the entry"}
      - {text: "Whether the level holds a third time", bucket: "Left to the market"}
      - {text: "What the fill comes back at", bucket: "Left to the market"}
    explanation: "Two of those four are yours, and they are the two you can get right every single time."

  - type: visual
    component: cost-stack
    data: {shares: 1200, spread: 0.02, slippage: 0.02, fees: 0.01, target: 0.43}
    caption: "Setup 1, finished: $60 of cost against $516 made on 1,200 shares. Setup 2 never got past the first bar of this picture."
