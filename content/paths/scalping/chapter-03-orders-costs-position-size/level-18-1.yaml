id: "18-1"
title: "The All-In Check"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: repetition
tags: [costs, checklist, decisions]
learning_goal: "User runs the all-in check on three setups and makes cost-aware long / short / no-trade decisions."
purpose: "The check only matters if it changes what you do — here it decides real trades."
terms_introduced: []
reinforces: [2]
prerequisite: "17-1"
xp: 30
difficulty: 3
sources: [consensus]
screens:
  - type: intro
    text: "Three real setups. Run the check, then trade — or don't."

  - type: story
    character: retail-trader
    text: "Setup 1: XYZ bid $11.00 / ask $11.02, moves about $0.30 while you'd hold. Slippage about $0.01, fees $0.01. Connection solid. Target $0.20."

  - type: numeric-input
    prompt: "All-in cost per share?"
    answer: 0.04
    tolerance: 0.001
    unit: "$"
    working: "0.02 + 0.01 + 0.01 = 0.04"
    explanation: "Spread, slippage, fees."

  - type: numeric-mc
    prompt: "Percent of the $0.20 target?"
    options:
      - {text: "20 %", correct: true}
      - {text: "4 %"}
      - {text: "40 %"}
      - {text: "2 %"}
    working: "0.04 ÷ 0.20 = 0.20"
    explanation: "A fifth — fine."

  - type: chart-decision
    scenario: "XYZ pulls back to a level where buyers stepped in twice this morning, volume steady, all-in 20 % of target. 1,000 shares."
    shares: 1000
    chart: {kind: candles, data: [[10.80, 10.95, 10.75, 10.90], [10.90, 11.10, 10.85, 11.05], [11.05, 11.20, 11.00, 11.15], [11.15, 11.18, 10.98, 11.02], [11.02, 11.06, 10.96, 11.00], [11.00, 11.04, 10.97, 11.02], [11.02, 11.15, 11.00, 11.12], [11.12, 11.22, 11.08, 11.20], [11.20, 11.26, 11.14, 11.24]], decision_index: 5}
    best: long
    reasonable: [no-trade]
    outcome: "It bounced $0.22 — +$220 on 1,000 shares, minus about $40 in costs."
    explanation: "A tested level, steady volume and a cheap trade: a long with the pressure."

  - type: chart-tap
    prompt: "Setup 1's level held twice this morning. Tap the second test of it."
    chart:
      kind: candles
      data: [[11.24, 11.30, 11.18, 11.20], [11.20, 11.24, 11.06, 11.10], [11.10, 11.16, 11.04, 11.14], [11.14, 11.22, 11.10, 11.20], [11.20, 11.26, 11.14, 11.16], [11.16, 11.20, 11.05, 11.15], [11.15, 11.24, 11.12, 11.22], [11.22, 11.30, 11.18, 11.28]]
      levels:
        - {price: 11.05, label: "Support"}
    target: 5
    explanation: "Both dips stopped within a cent of $11.05, and the second one is the test the scenario was built on."

  - type: story
    character: retail-trader
    text: "Setup 2: bid $7.40 / ask $7.48, moves about $0.10. Fees $0.01. Target $0.10."

  - type: slider
    prompt: "Percent of the target eaten by the spread alone?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 80
    tolerance: 10
    explanation: "0.08 ÷ 0.10 = 80 %."

  - type: chart-decision
    scenario: "Same stock breaking out on volume — but that spread. 1,000 shares."
    shares: 1000
    chart: {kind: candles, data: [[7.30, 7.36, 7.28, 7.34], [7.34, 7.40, 7.32, 7.38], [7.38, 7.42, 7.36, 7.40], [7.40, 7.46, 7.39, 7.44], [7.44, 7.48, 7.42, 7.46], [7.46, 7.50, 7.44, 7.48], [7.48, 7.56, 7.46, 7.54], [7.54, 7.60, 7.50, 7.57], [7.57, 7.60, 7.52, 7.55]], decision_index: 5}
    best: no-trade
    outcome: "It moved $0.11. After the $0.08 spread and fees, about $0.02 per share — before slippage."
    explanation: "A good-looking move on bad ground. The check says no."

  - type: story
    character: retail-trader
    text: "Setup 3: bid $11.10 / ask $11.11, moves about $0.25. Your Wi-Fi dropped twice in the last hour."

  - type: mc
    prompt: "Trade?"
    options:
      - {text: "Yes — the cost check passes, and that's what matters"}
      - {text: "No — fix the connection first; the setup will come again", correct: true}
      - {text: "Yes, with half size"}
    explanation: "Reliability is a check, not a suggestion. Half size doesn't fix a dropped connection."

  - type: numeric-input
    prompt: "Later, connection fixed. 1 % of a $12,000 account, stop $0.12, share price $11.10. Shares?"
    answer: 1000
    unit: "shares"
    working: "Risk: $120 ÷ $0.12 = 1,000. Account: $12,000 ÷ $11.10 = 1,081. Take the smaller: 1,000"
    explanation: "Two ceilings — the stop and the account. The lower one is your share count."

  - type: chart-decision
    scenario: "Setup 3, connection stable, 1,000 shares sized. The stock grinds down along rising volume."
    shares: 1000
    chart: {kind: candles, data: [[11.32, 11.36, 11.24, 11.26], [11.26, 11.28, 11.18, 11.20], [11.20, 11.22, 11.14, 11.16], [11.16, 11.20, 11.12, 11.14], [11.14, 11.16, 11.10, 11.12], [11.12, 11.14, 11.08, 11.11], [11.11, 11.12, 11.02, 11.04], [11.04, 11.06, 10.96, 10.98], [10.98, 11.00, 10.92, 10.94]], decision_index: 5}
    best: short
    reasonable: [no-trade]
    outcome: "It slid $0.18 — +$180 short on 1,000 shares, minus about $30 in costs."
    explanation: "All four checks pass and the pressure is down: a short, on the same arithmetic in reverse."

  - type: sort
    prompt: "Passes the check?"
    buckets: ["Passes", "Fails"]
    items:
      - {text: "All-in 15 % of target, stable connection", bucket: "Passes"}
      - {text: "Spread alone 80 % of target", bucket: "Fails"}
      - {text: "Perfect costs, connection dropping", bucket: "Fails"}
      - {text: "All-in 25 %, sized from the stop", bucket: "Passes"}
    explanation: "Any failed question is a no."

  - type: fill-tiles
    sentence: "Spread, slippage and fees together are the all-in ___."
    answer: "cost"
    explanation: "The trade's honest price tag."

  - type: theory
    title: "Final exam next"
    body: "After it, you're a scalper who knows what every trade costs."
