id: "7-3"
title: "The Marketable Limit"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [orders, execution, exits]
learning_goal: "User rests a limit sell at the target as soon as the entry fills, and knows what it means when that order never trades."
purpose: "An exit decided in advance is the only exit that is not decided by whatever you happen to be feeling."
terms_introduced: []
reinforces: []
prerequisite: "7-2"
xp: 20
difficulty: 3
sources: [consensus]
notes: "Account named at $20,000; the chart decision is 1,200 shares near $16. Closes Level 7 with the exit half of the kit."
screens:
  - type: intro
    text: "You paid the gap to get in. On the way out, you can make somebody else pay it."

  - type: theory
    title: "Rest the exit, do not watch for it"
    body: "The moment your entry fills, put a limit sell at your target. It trades the instant an impatient buyer reaches up for your shares, whether or not you are looking at the screen."

  - type: example
    body: "Long 1,200 shares from $16.14 out of a $20,000 account, target eighteen cents up. A limit sell goes out at $16.32 and the trade is now finished in advance."
    visual: order-ticket
    visual_data: {ticker: XYZ, side: sell, qty: 1200, type: limit, price: 16.32}

  - type: numeric-input
    prompt: "In at $16.14, resting sell at $16.32, 1,200 shares. What is the trade worth if that order trades?"
    answer: 216
    tolerance: 0.01
    unit: "$"
    working: "$16.32 − $16.14 = $0.18 per share; $0.18 × 1,200 = $216"
    explanation: "Eighteen cents times twelve hundred shares, decided before the position was a minute old."

  - type: order-build
    prompt: "Build the exit for that position: the whole 1,200 shares, sold at $16.32 and nowhere lower."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit]
      qty: [600, 1200, 2400]
      price: [16.14, 16.26, 16.32]
    answer: {side: sell, type: limit, qty: 1200, price: 16.32}
    explanation: "Sell, limit, 1,200, $16.32. A limit sell accepts your price or better, so nobody is buying your shares below it."

  - type: mc
    prompt: "The stock prints $16.32 and comes straight back down. Where are you?"
    options:
      - {text: "Still long — a print is not a fill"}
      - {text: "Still long, and the order has cancelled itself"}
      - {text: "Out, because a buyer took the shares at your price", correct: true}
    explanation: "Trading at your price is what your order was waiting for, provided enough was bought there to reach it."

  - type: tf
    statement: "With a resting sell at your target, you are collecting the gap instead of paying it."
    answer: true
    explanation: "Somebody is paying the ask to take your shares off you, which is the market maker's side of the same trade you paid for on the way in."

  - type: slider
    prompt: "You are long from $16.14 and the move you are going for is eighteen cents. Where does the resting sell go?"
    min: 16.14
    max: 16.50
    step: 0.02
    unit: "$"
    answer: 16.32
    tolerance: 0.02
    explanation: "$16.14 + $0.18 = $16.32. The target is arithmetic, not a feeling about how far it might go."

  - type: chart-decision
    scenario: "XYZ has climbed, paused for three quiet minutes and the candle that just closed pushed back up out of the pause on rising volume. The quote is two cents wide and your $20,000 account allows 1,200 shares here."
    shares: 1200
    chart:
      kind: candles
      data: [[15.86, 15.98, 15.84, 15.96], [15.96, 16.10, 15.94, 16.08], [16.08, 16.16, 16.02, 16.06], [16.06, 16.12, 16.00, 16.04], [16.04, 16.14, 16.02, 16.12], [16.12, 16.22, 16.10, 16.20], [16.20, 16.34, 16.18, 16.32], [16.32, 16.42, 16.28, 16.38], [16.38, 16.48, 16.34, 16.44], [16.44, 16.56, 16.40, 16.55]]
      volume: [88000, 120000, 64000, 58000, 96000, 168000, 150000, 132000, 118000, 104000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It went on to $16.55 — $0.35 a share above the decision, +$420 long on 1,200 shares, and a sell resting eighteen cents up was taken two minutes in."
    explanation: "The quiet minutes were the pause and the heavy one is the push. Rest the exit at the target and the rest of the move is somebody else's problem."

  - type: mc
    prompt: "Your sell trades at $16.32 and the stock carries on to $16.60. What did the resting order cost you?"
    options:
      - {text: "Twenty-eight cents a share"}
      - {text: "Nothing at all", correct: true}
      - {text: "$336 of the move"}
    explanation: "The target was chosen when the trade was, and the move beyond it belongs to a trade you did not take."

  - type: sort
    prompt: "Which exit does each of these moments want?"
    buckets: ["Rest a limit at your price", "Take the bid now"]
    items:
      - {text: "The target you wrote down before entering", bucket: "Rest a limit at your price"}
      - {text: "The trade has turned and is running against you", bucket: "Take the bid now"}
      - {text: "A price twenty cents up that you would be pleased with", bucket: "Rest a limit at your price"}
      - {text: "The stock has died and you want the money back", bucket: "Take the bid now"}
    explanation: "Patience on the good side, speed on the bad side. Getting those two the wrong way round is the classic way to turn a small loss into a large one."

  - type: spot-mistake
    prompt: "Tap the part that is wrong."
    segments:
      - {text: "Your target sits above the market,"}
      - {text: "so the sell order is guaranteed to trade,", wrong: true}
      - {text: "which is why it goes out with the entry."}
    explanation: "It trades only if price gets there. If it never does, you are still holding every share."

  - type: recap
    title: "Level 7 in three lines"
    points:
      - {text: "A limit at or above the ask fills like a market order with a number on it.", level: "7-1"}
      - {text: "Some mornings the ceiling costs you the trade, and that is the deal.", level: "7-2"}
      - {text: "The exit goes out with the entry, resting at the target.", level: "7-3"}
