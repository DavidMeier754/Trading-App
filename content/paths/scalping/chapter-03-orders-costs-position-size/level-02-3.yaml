id: "2-3"
title: "The Spread as a Cost"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, costs, size]
icon: cost-spread
learning_goal: "User converts a per-share spread into a dollar cost for a stated share count, and sees how size multiplies it."
purpose: "Cents are what you read and dollars are what you lose, and scalping size makes the two look nothing alike."
terms_introduced: []
skills: ["The spread in dollars"]
reinforces: [1]
prerequisite: "2-2"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Account named at $25,000. The chart decision is 1,900 shares near $12."
screens:
  - type: intro
    text: "Four cents sounds like loose change. Multiply it by your share count."

  - type: theory
    title: "Two numbers, never mixed"
    body: "A spread is quoted per share. Your bill is that spread times how many shares you took. At scalping size those two numbers are not in the same world."

  - type: example
    body: "1,500 shares of a $16 stock, four cents between the sides: $60 spent at the moment of entry. The eighteen cents you are playing for is worth $270."
    visual: cost-stack
    visual_data: {shares: 1500, spread: 0.04, target: 0.18}

  - type: numeric-input
    prompt: "Five cents between the sides, 1,600 shares. What does entering cost you?"
    answer: 80
    tolerance: 0.01
    unit: "$"
    working: "$0.05 × 1,600 = $80"
    explanation: "Eighty dollars handed over before the first candle of the trade has finished."

  - type: numeric-mc
    prompt: "Same five cents, but only 400 shares this time."
    options:
      - {text: "$200"}
      - {text: "$20", correct: true}
      - {text: "$2"}
      - {text: "$0.05"}
    working: "$0.05 × 400 = $20"
    explanation: "Identical stock, identical spread, a quarter of the bill. Size is the only thing that changed."

  - type: mc
    prompt: "You want $200 out of a scalp on a $12 stock with a four-cent spread. You can take 1,000 shares and need twenty cents, or 2,000 shares and need ten. What does doubling the size do to the spread you pay?"
    options:
      - {text: "Halves it, because the move you need is halved"}
      - {text: "Leaves it at $40, since the spread is per share"}
      - {text: "Doubles it, from $40 to $80", correct: true}
    explanation: "The spread follows the share count, not the move. Bigger size buys you a shorter move and a larger bill."

  - type: slider
    prompt: "Eighteen cents on 1,500 shares is $270 gross. What share of that does a four-cent spread take?"
    min: 0
    max: 50
    step: 2
    unit: "%"
    answer: 22
    tolerance: 4
    explanation: "$60 out of $270 is a little over a fifth, on a trade that went exactly to plan."

  - type: sort
    prompt: "Which of these do you need before you can say what a position's spread will cost?"
    buckets: ["Need it", "Do not need it"]
    items:
      - {text: "The distance between the two prices", bucket: "Need it"}
      - {text: "How many shares you are taking", bucket: "Need it"}
      - {text: "The share price", bucket: "Do not need it"}
      - {text: "How long you plan to hold", bucket: "Do not need it"}
    explanation: "Two numbers, multiplied. A $9 stock and a $90 stock with the same spread and the same size cost you the same."

  - type: story
    text: "XYZ has based for five minutes and just pushed up on the heaviest bar of the morning. Bid $12.11 / ask $12.13, and your $25,000 account allows 1,900 shares here."

  - type: chart-decision
    scenario: "The panel has held two cents wide all morning and the last bar is nearly double anything before it. You have 1,900 shares ready."
    shares: 1900
    chart:
      kind: candles
      data: [[11.86, 11.92, 11.84, 11.90], [11.90, 11.96, 11.88, 11.94], [11.94, 11.98, 11.91, 11.95], [11.95, 12.00, 11.93, 11.98], [11.98, 12.04, 11.96, 12.02], [12.02, 12.14, 12.01, 12.12], [12.12, 12.22, 12.10, 12.20], [12.20, 12.28, 12.17, 12.26], [12.26, 12.34, 12.23, 12.31], [12.31, 12.38, 12.28, 12.35]]
      volume: [64000, 78000, 58000, 72000, 96000, 184000, 162000, 140000, 118000, 102000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $12.35 — $0.23 a share above the decision, +$437 long on 1,900 shares, of which the two-cent spread took $38."
    explanation: "A two-cent spread on 1,900 shares is $38. The bar underneath says the move is worth more than that."

  - type: tf
    statement: "Halving your share count halves what the spread costs you."
    answer: true
    explanation: "It is a straight multiplication, so the cost scales exactly with size — which is one reason size is a risk decision and not an ambition."

  - type: fill-tiles
    sentence: "A spread is quoted per share; your bill is that spread times your share ___."
    answer: "count"
    explanation: "Never quote yourself a cost in cents. Quote it in dollars, with the size attached."

  - type: recap
    title: "Level 2 in three lines"
    points:
      - {text: "A round trip pays the spread once, and it is paid at the moment you enter.", level: "2-1"}
      - {text: "Break-even is where the bid reaches your entry, not where your entry was.", level: "2-2"}
      - {text: "Cents become dollars when you multiply by the share count.", level: "2-3"}
