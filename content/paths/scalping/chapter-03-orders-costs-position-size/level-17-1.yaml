id: "17-1"
title: "The All-In Check"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [costs, checklist]
learning_goal: "User computes all-in cost per share, compares it to the target, and runs a four-question pre-trade checklist including reliability."
purpose: "One number and four questions turn everything in this chapter into a three-second habit before every scalp."
terms_introduced: ["All-in cost", "Fallback plan"]
prerequisite: "15-1"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "Before every scalp: one number and four questions."

  - type: theory
    title: "All-in cost"
    body: "Spread + slippage + fees, per share, for the round trip. Compare it to your target move. That ratio is the trade's honest price tag."

  - type: visual
    component: cost-stack
    data: {shares: 1000, spread: 0.02, slippage: 0.02, fees: 0.01, target: 0.15}
    caption: "$0.02 + $0.02 + $0.01 = $0.05 all-in against a $0.15 target — 33 % gone before you start."

  - type: numeric-input
    prompt: "Spread $0.03, round-trip slippage $0.02, fees $0.01. All-in cost per share?"
    answer: 0.06
    tolerance: 0.001
    unit: "$"
    working: "0.03 + 0.02 + 0.01 = 0.06"
    explanation: "Three layers, one number."

  - type: numeric-input
    prompt: "All-in $0.06, target $0.20. Percent eaten?"
    answer: 30
    unit: "%"
    working: "0.06 ÷ 0.20 = 0.30"
    explanation: "Under a third — workable."

  - type: slider
    prompt: "All-in $0.09, target $0.12. Percent eaten?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 75
    tolerance: 10
    explanation: "Three quarters gone — skip."

  - type: theory
    title: "Reliability"
    body: "All of this assumes your app, connection and broker work when it matters. A dropped connection with 2,000 shares open is a real risk. Have a fallback plan: the broker's phone number, a second device, mobile data."

  - type: checklist-reveal
    title: "Before every scalp"
    items:
      - "Is the spread small against the move I expect?"
      - "Is the all-in cost under about a third of my target?"
      - "Are my shares the lower of what my stop allows and what the account can pay for?"
      - "Are my connection and fallback ready?"

  - type: order
    prompt: "Put the three seconds before a scalp in the order you run them."
    items:
      - "Read the spread against the move you expect"
      - "Add slippage and fees to get the all-in cost"
      - "Size the shares from the stop and the account"
      - "Check the connection, then send the entry"
    explanation: "Cost first, because it can end the decision before sizing is worth doing at all."

  - type: mc
    prompt: "All-in 40 % of target, connection unstable, sizing correct. Trade?"
    options:
      - {text: "No — two of the four checks fail", correct: true}
      - {text: "Yes — sizing is what matters"}
      - {text: "Yes, but with market orders for speed"}
    explanation: "One failed check is a no. Two is a loud no."

  - type: tf
    statement: "Passing all four checks means the trade will be profitable."
    answer: false
    explanation: "It means the trade is well-structured. The outcome stays uncertain."

  - type: sort
    prompt: "Part of the all-in cost?"
    buckets: ["All-in cost", "Not part of it"]
    items:
      - {text: "Spread", bucket: "All-in cost"}
      - {text: "Slippage", bucket: "All-in cost"}
      - {text: "Fees", bucket: "All-in cost"}
      - {text: "Your stop distance", bucket: "Not part of it"}
    explanation: "Costs of executing, not the risk of being wrong."

  - type: match
    prompt: "Four terms this chapter turned into one habit."
    pairs:
      - ["All-in cost", "Spread + slippage + fees per share"]
      - ["Fallback plan", "How to act if your setup fails"]
      - ["Risk per trade", "Shares × stop distance"]
      - ["Marketable limit", "Capped entry that fills now"]
    explanation: "The chapter in four terms."

  - type: fill-choice
    sentence: "Compare the all-in cost to your ___."
    options: ["target move", "share price", "account size"]
    answer: "target move"
    explanation: "The move, never the price."

  - type: theory
    title: "Three seconds"
    body: "One number, four questions, three seconds. Practice on real setups next."
