id: "1-2"
title: "Bid, Ask, Spread"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, costs]
learning_goal: "User understands the spread as a cost paid on every round trip and can compute it for a given share count."
purpose: "You are down money the instant you enter a trade — seeing exactly how much is what separates scalpers who last from those who don't."
terms_introduced: ["Round trip"]
prerequisite: "1-1"
xp: 20
difficulty: 1
sources: [consensus]
screens:
  - type: intro
    text: "You lose money the instant you buy. Here's why."

  - type: theory
    title: "Buy at the ask, sell at the bid"
    body: "Bid $20.00, ask $20.05. You buy at $20.05. If you sold right away you'd get $20.00. You're down $0.05 per share before the price moved at all."

  - type: example
    body: "500 shares × $0.05 = $25. Buying and then selling — a round trip — costs the spread every single time, on top of any fee."
    visual: cost-stack
    visual_data: {shares: 500, spread: 0.05, target: 0.20}

  - type: theory
    title: "Not a fee, but real"
    body: "Nobody sends you a bill for the spread. It's built into the two prices. That's why it's easy to ignore and expensive to forget."

  - type: numeric-input
    prompt: "Bid $30.00, ask $30.10. You buy 1,000 shares at the ask and immediately sell at the bid. Total loss?"
    answer: 100
    unit: "$"
    working: "$0.10 × 1,000 = $100"
    explanation: "The whole spread, times every share."

  - type: mc
    prompt: "Why is the spread called a cost even though nobody charges it?"
    options:
      - {text: "The exchange collects it at the end of the day"}
      - {text: "You buy at the higher price and sell at the lower", correct: true}
      - {text: "It's only a cost if the price falls"}
    explanation: "It's paid in the prices, not on a statement."

  - type: tf
    statement: "A round trip means buying and then selling the same shares — or, for a short, selling and then buying back."
    answer: true
    explanation: "One complete open-and-close."

  - type: numeric-mc
    prompt: "Spread $0.03, position 800 shares. Round-trip spread cost?"
    options:
      - {text: "$24", correct: true}
      - {text: "$2.40"}
      - {text: "$0.03"}
      - {text: "$240"}
    working: "$0.03 × 800 = $24"
    explanation: "Spread times shares."

  - type: story
    character: retail-trader
    text: "You're eyeing a $0.10 move on a stock with a $0.06 spread."

  - type: slider
    prompt: "How much of that $0.10 move does the spread eat?"
    min: 0
    max: 100
    step: 10
    unit: "%"
    answer: 60
    tolerance: 10
    explanation: "0.06 ÷ 0.10 = 60 % gone before you start."

  - type: sort
    prompt: "Does it cost you the spread?"
    buckets: ["Costs the spread", "Doesn't"]
    items:
      - {text: "Buying at the ask, selling at the bid", bucket: "Costs the spread"}
      - {text: "Any round trip", bucket: "Costs the spread"}
      - {text: "Holding a position for an hour", bucket: "Doesn't"}
      - {text: "Watching the quote panel", bucket: "Doesn't"}
    explanation: "Crossing the two prices costs; waiting doesn't."

  - type: fill-tiles
    sentence: "Buying and then selling the same shares is a round ___."
    answer: "trip"
    explanation: "Open plus close."

  - type: mc
    prompt: "Two stocks both move about $0.20 a minute. Stock A: spread $0.01. Stock B: spread $0.08. For a scalper?"
    options:
      - {text: "B — a wider spread means more room to profit"}
      - {text: "Equal — the move is the same"}
      - {text: "A — it keeps $0.19 of a $0.20 move; B keeps only $0.12", correct: true}
    explanation: "Same move, very different take-home."

  - type: theory
    title: "The opponent"
    body: "For a scalper the spread isn't a detail. It's the opponent. Next: how to size it up in three seconds."
