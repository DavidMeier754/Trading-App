id: "13-1"
title: "Slippage and Speed"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [slippage, execution]
learning_goal: "User can define slippage and execution speed, keep both separate from the spread, and compute slippage cost for a share count."
purpose: "The gap between the price you saw and the price you got is a real, recurring cost — naming it is the first step to controlling it."
terms_introduced: ["Slippage", "Execution speed"]
reinforces: [2]
prerequisite: "12-1"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "You tapped at $50.00. You got $50.03. Meet slippage."

  - type: theory
    title: "Slippage"
    body: "The difference between the price you expected and the price you got. The market moved in the fraction of a second between your tap and the fill."

  - type: theory
    title: "It works both ways"
    body: "Mostly against you — you're usually chasing a move. Sometimes for you, when the ask dips as your order arrives. Fast, volatile stocks slip most."

  - type: visual
    component: cost-stack
    data: {shares: 1000, spread: 0.02, slippage: 0.03, target: 0.20}
    caption: "Market buy of 1,000 shares: ask $50.00 on screen, filled at $50.03. Slippage $30, spread $20 — $50 gone before the trade starts."

  - type: numeric-input
    prompt: "Expected $27.40, filled at $27.44, 600 shares. Slippage cost?"
    answer: 24
    unit: "$"
    working: "$0.04 × 600 = $24"
    explanation: "Slip per share times shares."

  - type: mc
    prompt: "Which order type caps slippage on entry?"
    options:
      - {text: "Market order — it fills fastest"}
      - {text: "Marketable limit — it never fills above your limit", correct: true}
      - {text: "Stop-market — it waits for the price"}
    explanation: "A cap on the price is a cap on the slip."

  - type: theory
    title: "Execution speed"
    body: "The time from your tap to the fill. Slow app, slow connection, slow broker → more time for the price to move → more slippage. For a scalper, speed is money. It is not the same thing as a tight spread."

  - type: tf
    statement: "A tight spread protects you from slippage."
    answer: false
    explanation: "Spread is the gap at one moment; slippage is the move during execution. They're independent."

  - type: sort
    prompt: "Spread or slippage?"
    buckets: ["Spread", "Slippage"]
    items:
      - {text: "Ask minus bid right now", bucket: "Spread"}
      - {text: "Price moved between tap and fill", bucket: "Slippage"}
      - {text: "Paid on every round trip", bucket: "Spread"}
      - {text: "Biggest in fast, volatile stocks", bucket: "Slippage"}
    explanation: "A gap versus a move."

  - type: numeric-mc
    prompt: "Spread $0.02, slippage $0.03 on entry, 1,000 shares. Cost so far?"
    options:
      - {text: "$50", correct: true}
      - {text: "$5"}
      - {text: "$500"}
      - {text: "$30"}
    working: "($0.02 + $0.03) × 1,000 = $50"
    explanation: "Both layers, times shares."

  - type: story
    character: retail-trader
    text: "Two scalpers tap buy at the same instant. One fills in 40 milliseconds at $18.10, the other in 600 milliseconds at $18.16."

  - type: mc
    prompt: "What separated them?"
    options:
      - {text: "The spread — they saw different quotes"}
      - {text: "Execution speed — the slower fill met a higher ask", correct: true}
      - {text: "Position size — bigger orders fill later"}
    explanation: "Half a second was six cents."

  - type: chart-decision
    scenario: "XYZ is spiking on news: candles are 15 cents tall, the quote is jumping several cents between looks and your target is 20 cents. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[19.20, 19.46, 19.10, 19.18], [19.18, 19.40, 19.14, 19.36], [19.36, 19.42, 19.10, 19.14], [19.14, 19.34, 19.08, 19.30], [19.30, 19.36, 19.06, 19.12], [19.12, 19.28, 19.04, 19.24], [19.24, 19.30, 19.00, 19.06], [19.06, 19.22, 19.02, 19.18], [19.18, 19.24, 18.96, 19.02], [19.02, 19.18, 18.98, 19.14]]
      volume: [310000, 240000, 270000, 190000, 220000, 180000, 210000, 170000, 190000, 160000]
      decision_index: 5
    best: no-trade
    outcome: "It swung both ways for another ten minutes and finished at $19.14, ten cents below the decision."
    explanation: "A quote moving several cents between looks is slippage waiting to happen, and it is bigger than half your target."

  - type: fill-tiles
    sentence: "The gap between the expected price and your fill is ___."
    answer: "slippage"
    explanation: "The market moved while you were executing."

  - type: mc
    prompt: "Chapter 2 called the fastest, most crowded minute of a run climax volume. Why is that exact minute also the worst one to chase for slippage?"
    options:
      - {text: "It isn't — heavy volume always means a calmer fill"}
      - {text: "Price is moving fastest exactly when everyone wants the same shares", correct: true}
      - {text: "Climax bars only happen after the spread has already gone to zero"}
    explanation: "Maximum participation is also maximum speed. Tapping into that minute is tapping into the exact moment the price is hardest to catch."

  - type: story
    character: retail-trader
    text: "Spread, then slippage. One more layer to go — and it is the only one that arrives as an actual bill."

