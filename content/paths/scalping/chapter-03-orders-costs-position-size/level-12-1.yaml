id: "12-1"
title: "Checkpoint"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: test
tags: [checkpoint]
learning_goal: "Verify Levels 6–11: market/limit/marketable limit orders, stop orders and stop distance, position sizing from both ceilings, and where the account binds."
purpose: "Orders and sizing have to be automatic before slippage and fees stack on top of them."
terms_introduced: []
reinforces: [1, 2]
prerequisite: "11-2"
xp: 40
difficulty: 2
sources: [consensus]
notes: "10 scored questions on Levels 6–11. Hearts apply. Pass mark 70 %. Account named at $18,000 throughout; the worked positions are 750 shares at $20.62 = $15,465 and 750 at $16.26 = $12,195, both inside the 95 % cap, and both sized off a $180 budget. Five questions are interactive, two of them chart decisions. Three reach back — two to Chapter 2 (the level a stop hangs off, lower highs) and one to Chapter 1's volatility dial. No depth-ladder here: the book is taught at Level 15, so a Level 12 checkpoint cannot test it."
screens:
  - type: intro
    text: "Checkpoint. Ten questions on an $18,000 account, nothing new. Hearts are on."
    counter: 10

  - type: order-build
    prompt: "The offer is $20.62 and the page says 750 shares. Build the entry that takes it now but pays no more than three cents over it."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [500, 750, 1200]
      price: [20.59, 20.62, 20.65]
    answer: {side: buy, type: limit, qty: 750, price: 20.65}
    explanation: "Buy, limit, 750, $20.65. Priced through the offer it trades at once and at $20.62 — the three cents is a ceiling on a fast-moving offer, not a price you have agreed to pay."

  - type: numeric-mc
    prompt: "A $26.00 stock, one per cent of the $18,000, and the chart is offering an eleven-cent stop. How many shares?"
    options:
      - {text: "1,636 shares"}
      - {text: "692 shares", correct: true}
      - {text: "1,164 shares"}
      - {text: "164 shares"}
    working: "Risk: $180 ÷ $0.11 = 1,636. Account: $18,000 ÷ $26.00 = 692. Take the smaller."
    explanation: "Near the top of the price band the cash runs out long before the stop does, and 692 shares on an eleven-cent stop risks $76 rather than the whole budget."

  - type: chart-annotate
    prompt: "XYZ has been turned back from the same floor twice this morning. Drag the line to where the stop for a long belongs."
    chart:
      kind: candles
      data: [[20.62, 20.68, 20.54, 20.58], [20.58, 20.62, 20.44, 20.48], [20.48, 20.60, 20.46, 20.56], [20.56, 20.62, 20.50, 20.52], [20.52, 20.56, 20.44, 20.50], [20.50, 20.64, 20.48, 20.60], [20.60, 20.68, 20.56, 20.64], [20.64, 20.70, 20.58, 20.66]]
      volume: [112000, 164000, 96000, 84000, 148000, 108000, 92000, 86000]
    answer: 20.38
    tolerance: 0.04
    label: "Stop"
    explanation: "Buyers turned it at $20.44 twice, so the stop goes a few cents under that price — beyond the level, not on it, where the ordinary wobble cannot reach it."

  - type: chart-decision
    scenario: "XYZ again. The candle that just closed pushed up off the $20.44 floor on the heaviest bar of the session, and the quote is two cents wide."
    shares: 750
    state: ["Account: $18,000", "Stop: $20.38", "Size: 750 shares"]
    chart:
      kind: candles
      data: [[20.56, 20.62, 20.50, 20.54], [20.54, 20.58, 20.44, 20.48], [20.48, 20.58, 20.46, 20.52], [20.52, 20.58, 20.48, 20.50], [20.50, 20.54, 20.44, 20.52], [20.52, 20.66, 20.50, 20.62], [20.62, 20.74, 20.58, 20.70], [20.70, 20.80, 20.66, 20.76], [20.76, 20.86, 20.72, 20.82], [20.82, 20.94, 20.78, 20.90]]
      volume: [92000, 134000, 78000, 70000, 126000, 192000, 158000, 136000, 118000, 104000]
      levels:
        - {price: 20.44, label: "Floor"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped on to $20.90 — 28 cents a share above the decision, +$210 long on 750 shares against $180 of risk."
    explanation: "A floor that has held twice, a close up off it on the session's heaviest minute, and a stop with an obvious home. The stop is what made 750 the number rather than a guess."

  - type: tf
    statement: "A stop-limit can leave you still holding the position after your stop price has already traded."
    answer: true
    explanation: "Once triggered it is only a limit order, and a price that fell straight through it never comes back to fill you. A stop-market takes whatever is there, which is the point of it."

  - type: spot-mistake
    prompt: "Three lines about one short. Tap the one that is wrong."
    segments:
      - {text: "You are short 750 shares from $16.26"}
      - {text: "with the stop resting at $16.50,"}
      - {text: "and it is a sell order.", wrong: true}
    explanation: "A short is closed by buying the shares back, so its stop is a buy stop. The price was right and the side was not — a sell order there would double the position instead of closing it."

  - type: tf
    statement: "A market order tells the broker which price to pay."
    answer: false
    explanation: "It tells the broker to trade now. The price is whatever the other side happens to be showing when the order arrives, which is why it is the order for when getting in matters more than the cent."

  - type: numeric-input
    prompt: "Long 700 shares with the stop nineteen cents under the entry. What does the trade risk?"
    answer: 133
    tolerance: 0.01
    unit: "$"
    working: "$0.19 × 700 = $133"
    explanation: "Stop distance times the share count. It is the only number in the trade the one per cent budget has an opinion about."

  - type: chart-decision
    scenario: "A different name, later in the same session. It has made a lower high every couple of minutes, and the candle that just closed gave up the $16.30 floor on the heaviest bar since the open."
    shares: 750
    state: ["Account: $18,000", "Stop: $16.50", "Size: 750 shares"]
    chart:
      kind: candles
      data: [[16.62, 16.66, 16.52, 16.56], [16.56, 16.60, 16.44, 16.48], [16.48, 16.54, 16.40, 16.44], [16.44, 16.48, 16.36, 16.40], [16.40, 16.44, 16.30, 16.34], [16.34, 16.36, 16.22, 16.26], [16.26, 16.30, 16.14, 16.18], [16.18, 16.22, 16.06, 16.10], [16.10, 16.14, 15.98, 16.02], [16.02, 16.08, 15.92, 15.96]]
      volume: [88000, 96000, 84000, 78000, 92000, 186000, 154000, 130000, 114000, 100000]
      levels:
        - {price: 16.30, label: "Floor"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "Sellers stayed in front of it to $15.96 — thirty cents a share under the decision, +$225 on a 750-share short."
    explanation: "Lower highs the whole way and the floor given up on the heaviest minute. Twenty-four cents to the stop above the last lower high is what fixed the size at 750, not the account."

  - type: mc
    prompt: "Two names at $10, the same $18,000 and the same one per cent. The calm one lets the stop sit twelve cents away; the jumpy one needs thirty-six. Which of Chapter 1's two dials just cut your size from 1,500 shares to 500?"
    options:
      - {text: "Liquidity, the ease of getting out"}
      - {text: "Volume, the shares changing hands"}
      - {text: "Volatility, the size of the moves", correct: true}
    explanation: "The stop has to clear the ordinary swing, and the stop is what divides the budget. A name that travels three times as far buys you a third of the shares for the same $180."

  - type: summary
    total: 10
