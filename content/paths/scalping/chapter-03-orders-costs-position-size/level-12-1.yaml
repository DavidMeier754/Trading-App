id: "12-1"
title: "Checkpoint"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: test
tags: [checkpoint]
learning_goal: "Verify Levels 6–11: market/limit/marketable limit orders, stop orders and stop distance, position sizing from both ceilings, and where the account binds."
purpose: "Orders and sizing have to be automatic before slippage and fees stack on top of them."
terms_introduced: []
reinforces: [1, 2]
prerequisite: "11-2"
xp: 40
difficulty: 2
sources: [consensus]
notes: "10 scored questions on Levels 6–11. Three reach back — one to Chapter 1's volatility dial, one to Chapter 2's climax volume, one to Chapter 1's session structure. Hearts apply. Pass mark 70 %."
screens:
  - type: intro
    text: "Checkpoint. Ten questions, nothing new. Hearts are on."
    counter: 10

  - type: mc
    prompt: "Ask $10.20. You send a limit buy at $10.23 while sellers are still at $10.20. You pay:"
    options:
      - {text: "$10.23"}
      - {text: "$10.215"}
      - {text: "$10.20", correct: true}
    explanation: "Marketable limit: fills at the ask, capped at your limit."

  - type: tf
    statement: "A stop-limit guarantees you get out when the stop price is touched."
    answer: false
    explanation: "Only a stop-market guarantees the exit."

  - type: sort
    prompt: "Which order type?"
    buckets: ["Market order", "Limit order", "Stop order"]
    items:
      - {text: "Now, at the best price", bucket: "Market order"}
      - {text: "Only at my price or better", bucket: "Limit order"}
      - {text: "Idle until a price is touched", bucket: "Stop order"}
      - {text: "Marketable when placed at or above the ask", bucket: "Limit order"}
    explanation: "Three tools, three behaviors."

  - type: numeric-mc
    prompt: "Account $15,000, 1 % rule, stop $0.15, stock at $25.00. Shares?"
    options:
      - {text: "1,000"}
      - {text: "600", correct: true}
      - {text: "150"}
      - {text: "2,500"}
    working: "Risk: $150 ÷ $0.15 = 1,000. Account: $15,000 ÷ $25.00 = 600. Take the smaller."
    explanation: "The account is the lower ceiling here, so 600 is the honest number."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Long 600 at $22.00,"}
      - {text: "protective buy stop at $21.90.", wrong: true}
      - {text: "Risk $60."}
    explanation: "A long needs a sell stop below the entry."

  - type: numeric-mc
    prompt: "$16,000 account, 1 % rule, stock at $29.00, stop nine cents away. Which ceiling wins?"
    options:
      - {text: "1,777 shares — the stop sets the size"}
      - {text: "551 shares — the account is what binds here", correct: true}
      - {text: "1,164, splitting the two"}
      - {text: "3,555, doubling the risk ceiling"}
    working: "Risk: $160 ÷ $0.09 = 1,777. Account: $16,000 ÷ $29.00 = 551. Take the smaller."
    explanation: "A stock this close to the top of the price band eats the account long before the stop does."

  - type: numeric-input
    prompt: "800 shares, stop distance $0.09. Risk per trade?"
    answer: 72
    unit: "$"
    working: "$0.09 × 800 = $72"
    explanation: "Stop distance times shares."

  - type: mc
    prompt: "Chapter 1 gave every stock two dials. Which one decides how far away a stop has to sit?"
    options:
      - {text: "Liquidity — thin stocks always need wider stops"}
      - {text: "Volatility — the more a stock swings, the more room the stop needs", correct: true}
      - {text: "Volume — heavier bars always mean wider stops"}
    explanation: "Volatility is the size of the moves. A calmer stock lets the stop sit closer without ordinary noise touching it off."

  - type: mc
    prompt: "Chapter 2 called the single heaviest bar of a run climax volume — the whole crowd trading in one minute. Why does that make it an easy minute to get an order filled in?"
    options:
      - {text: "It isn't — heavy bars are the most dangerous ones to trade into"}
      - {text: "Buyers and sellers are both there in size, in the same sixty seconds", correct: true}
      - {text: "Climax bars only happen once the spread has already gone to zero"}
    explanation: "Maximum participation is maximum liquidity for that minute — the opposite of the thin bar nobody is behind."

  - type: tf
    statement: "A quote that jumps from two cents wide to twelve right at {{market.regular_open}} means the quote is thin and unsettled, not that momentum has arrived."
    answer: true
    explanation: "Chapter 1 called the opening minutes the jumpiest of the session. A wide, unstable quote right then is the session being thin — not a signal to chase."

  - type: summary
    total: 10
