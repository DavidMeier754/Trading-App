id: "16-1"
title: "Chapters 1–2 Callback"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: repetition
tags: [callback, liquidity, spread, position-size]
learning_goal: "User runs Chapter 1's liquidity dial and Chapter 2's volume row as a price: the gap it produces, and the share count the stock and the account will both allow."
purpose: "Liquidity was a feeling in Chapter 1 and a row on the chart in Chapter 2. Here it is a number in cents, and it decides how much stock you can hold."
terms_introduced: []
reinforces: [1, 2]
prerequisite: "15-3"
xp: 25
difficulty: 2
sources: [consensus]
notes: "First of the chapter's two Callback subs. Account named at $22,000 throughout. First use of scanner-pick in the chapter, with only the columns Chapters 1–3 have taught."
screens:
  - type: intro
    text: "Everything in Chapters 1 and 2 was free to look at. From here it all carries a price."

  - type: theory
    title: "Three readings, one share count"
    body: "Whether you can leave is the volume row. What leaving costs is the quote. How much stock you can hold is the account. The three of them decide one number together."

  - type: scanner-pick
    prompt: "You want 1,200 shares in and out inside two minutes, and your $22,000 account has to pay for them. Which name is the one?"
    data:
      rows:
        - {ticker: ORN, price: 17.40, change_pct: 4.6, spread: 0.02}
        - {ticker: KLM, price: 26.80, change_pct: 5.1, spread: 0.02}
        - {ticker: RDN, price: 13.90, change_pct: 3.8, spread: 0.14}
        - {ticker: TQP, price: 11.20, change_pct: 0.3, spread: 0.03}
    target: ORN
    explanation: "ORN is the only row where all three answers come back clean: a two-cent gap, a day that is actually moving, and 1,200 shares the account can cover."

  - type: numeric-input
    prompt: "1,200 shares of ORN at $17.40. What does the position tie up?"
    answer: 20880
    tolerance: 1
    unit: "$"
    working: "1,200 × $17.40 = $20,880"
    explanation: "Inside the account, with room left over. That is the only question the second ceiling ever asks."

  - type: mc
    prompt: "KLM showed the biggest day's move on that list. Why was it never a candidate?"
    options:
      - {text: "The account cannot pay for 1,200 shares at $26.80", correct: true}
      - {text: "Its gap is $0.14, too wide to pay on a round trip"}
      - {text: "A stock that has already moved five per cent has nothing left"}
    explanation: "1,200 × $26.80 is $32,160, and there is $22,000. KLM quotes two cents like ORN does; it is the price tag, not the gap, that rules it out."

  - type: tf
    statement: "A two-cent gap is reason enough to trade a name, whatever its day's move has been."
    answer: false
    explanation: "Chapter 1 put every stock on two dials. A tight gap is the liquidity dial saying you can leave cheaply; without movement there is nothing there to pay for the trip."

  - type: compare
    prompt: "Your costs run four cents a share in both of these. In which one does a twelve-cent target exist at all?"
    charts:
      - kind: candles
        data: [[15.00, 15.03, 14.97, 15.01], [15.01, 15.04, 14.98, 14.99], [14.99, 15.03, 14.96, 15.02], [15.02, 15.05, 14.99, 15.00], [15.00, 15.04, 14.97, 15.03], [15.03, 15.05, 14.98, 15.00], [15.00, 15.03, 14.96, 15.02], [15.02, 15.05, 14.99, 15.01]]
        label: "A"
      - kind: candles
        data: [[14.90, 15.02, 14.88, 15.00], [15.00, 15.14, 14.98, 15.12], [15.12, 15.26, 15.10, 15.24], [15.24, 15.30, 15.18, 15.22], [15.22, 15.38, 15.20, 15.36], [15.36, 15.50, 15.34, 15.48], [15.48, 15.54, 15.42, 15.46], [15.46, 15.60, 15.44, 15.58]]
        label: "B"
    answer: "B"
    explanation: "A has spent eight minutes inside nine cents, so twelve cents is not on offer at any price. B is making twelve cents every two minutes."

  - type: numeric-input
    prompt: "ORN's quieter minutes print about 60,000 shares. What share of one of those minutes is a 1,200-share order?"
    answer: 2
    tolerance: 0.1
    unit: "%"
    working: "1,200 ÷ 60,000 = 0.02"
    explanation: "Chapter 1 called liquidity the ease of getting out, and two per cent of a minute is a door you can walk straight through."

  - type: sort
    prompt: "Three questions, three places to look. Which one answers each?"
    buckets: ["Whether you can leave", "What leaving costs", "How many shares you can hold"]
    items:
      - {text: "The volume row under the candles", bucket: "Whether you can leave"}
      - {text: "The two prices on the quote panel", bucket: "What leaving costs"}
      - {text: "The account divided by the share price", bucket: "How many shares you can hold"}
      - {text: "A minute printing 9,000 shares", bucket: "Whether you can leave"}
    explanation: "Chapter 2's bottom row, this chapter's quote, and your own bank. Each one answers exactly one of the three."

  - type: chart-decision
    scenario: "ORN has held a floor at $17.30 for five minutes and the minute that just closed pushed out of the top of the base on the biggest bar since the session opened. The panel reads bid $17.44 / ask $17.46, and your $22,000 account allows 1,200 shares here."
    shares: 1200
    state: ["Stop would sit at $17.28"]
    chart:
      kind: candles
      data: [[17.34, 17.40, 17.30, 17.36], [17.36, 17.42, 17.32, 17.38], [17.38, 17.41, 17.30, 17.34], [17.34, 17.40, 17.30, 17.38], [17.38, 17.42, 17.34, 17.40], [17.40, 17.50, 17.38, 17.46], [17.46, 17.54, 17.43, 17.52], [17.52, 17.60, 17.49, 17.58], [17.58, 17.66, 17.55, 17.63], [17.63, 17.70, 17.60, 17.67]]
      volume: [68000, 61000, 74000, 66000, 58000, 162000, 138000, 121000, 106000, 94000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped on to $17.67 — $0.21 a share above the decision, +$252 long on 1,200 shares."
    explanation: "A floor the base has not broken, a push out of it on the heaviest bar of the session, two cents of quote, and 1,200 shares the stock and the account both allow."

  - type: numeric-mc
    prompt: "In at $17.46 with the stop at $17.28, 1,200 shares. What was the planned loss?"
    options:
      - {text: "$21.60"}
      - {text: "$216", correct: true}
      - {text: "$2,160"}
      - {text: "$18"}
    working: "$17.46 − $17.28 = $0.18; $0.18 × 1,200 = $216"
    explanation: "Just inside the $220 that one per cent of this account allows, which is why 1,200 was a size and not a guess."

  - type: fill-choice
    sentence: "The volume row says whether you can leave; the quote says what leaving ___."
    options: ["costs", "proves", "delays"]
    answer: "costs"
    explanation: "One of them is on the chart and one is on the panel. They answer two different halves of the same worry."

  - type: checklist-reveal
    title: "Chapters 1 and 2, with a price on them"
    items:
      - "Is anybody trading this minute, or am I the volume?"
      - "What do the two prices on the panel charge me for the trip?"
      - "Is the day's move big enough to be worth that charge?"
      - "Can the account pay for the size the stop wants?"
