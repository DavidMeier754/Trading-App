id: "5-1"
title: "How Many Shares?"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [position-size, risk]
learning_goal: "User can compute position value and risk per trade, and derive share count from a risk budget and a stop distance."
purpose: "Share count is the one number you fully control — sizing from risk is what keeps a run of losses survivable."
terms_introduced: ["Position size", "Position value", "Risk per trade", "1 % rule"]
prerequisite: "4-1"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "The most important number in trading isn't the price. It's how many shares."

  - type: theory
    title: "Position value"
    body: "Shares × price. 500 shares at $20 = $10,000 in the trade. Your account decides what's possible; your risk decides what's smart."

  - type: theory
    title: "Risk per trade"
    body: "Shares × stop distance. 500 shares with a $0.10 stop = $50 at risk. That's the number you control — not the profit."

  - type: theory
    title: "The 1 % rule"
    body: "Many traders risk at most 1 % of the account per trade. $10,000 account → $100 max risk. Ten losers in a row cost 10 % of the account, not all of it."

  - type: visual
    component: bar-chart
    data: {bars: [{label: "$0.10 stop", value: 1000}, {label: "$0.25 stop", value: 400}, {label: "$0.50 stop", value: 200}], unit: "shares for $100 risk"}
    caption: "Work backwards: max risk ÷ stop distance = shares. Wider stop, fewer shares."

  - type: numeric-input
    prompt: "Account $20,000, 1 % rule. Max risk per trade?"
    answer: 200
    unit: "$"
    working: "$20,000 × 0.01 = $200"
    explanation: "One percent of the account."

  - type: numeric-input
    prompt: "Max risk $200, stop distance $0.08. How many shares?"
    answer: 2500
    unit: "shares"
    working: "$200 ÷ $0.08 = 2,500"
    explanation: "Risk divided by stop distance."

  - type: mc
    prompt: "Same $200 risk. Stock A needs a $0.05 stop, Stock B a $0.20 stop. Which allows more shares?"
    options:
      - {text: "A — 4,000 shares versus 1,000", correct: true}
      - {text: "B — a wider stop means a safer, bigger position"}
      - {text: "Equal — the risk is the same"}
    explanation: "Tighter stop, more shares for the same risk."

  - type: tf
    statement: "Position value and risk per trade are the same thing."
    answer: false
    explanation: "Value is what's in the trade; risk is what you lose if the stop hits."

  - type: numeric-mc
    prompt: "1,000 shares at $32.00 with a $0.12 stop. Risk?"
    options:
      - {text: "$120", correct: true}
      - {text: "$32,000"}
      - {text: "$12"}
      - {text: "$1,200"}
    working: "$0.12 × 1,000 = $120"
    explanation: "Stop distance times shares. $32,000 is the position value."

  - type: story
    character: retail-trader
    text: "Account $5,000. You like a stock at $60 with a $0.30 stop. 1 % rule."

  - type: numeric-input
    prompt: "How many shares?"
    answer: 166
    tolerance: 1
    unit: "shares"
    working: "$50 ÷ $0.30 = 166.7 → 166"
    explanation: "Round down — never up."

  - type: sort
    prompt: "Raises or lowers risk per trade?"
    buckets: ["Raises", "Lowers"]
    items:
      - {text: "More shares", bucket: "Raises"}
      - {text: "Wider stop", bucket: "Raises"}
      - {text: "Tighter stop", bucket: "Lowers"}
      - {text: "Fewer shares", bucket: "Lowers"}
    explanation: "Two levers, same product."

  - type: fill-choice
    sentence: "Shares × stop distance = ___."
    options: ["risk per trade", "position value", "spread cost"]
    answer: "risk per trade"
    explanation: "What you lose if the stop hits."

  - type: theory
    title: "Shares come from risk"
    body: "Never from excitement. Practice next."
