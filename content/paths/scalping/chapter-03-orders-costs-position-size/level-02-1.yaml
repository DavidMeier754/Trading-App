id: "2-1"
title: "The Spread as a Cost"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, costs, round-trip]
learning_goal: "User can define a round trip and explain why the whole spread is already paid the moment a position is opened."
purpose: "Every trade starts behind, and knowing exactly how far behind is what stops a scalper taking trades that were never worth taking."
terms_introduced: ["Round trip"]
reinforces: [1]
prerequisite: "1-4"
xp: 20
difficulty: 1
sources: [consensus]
notes: "The account is named once at $25,000 so every worked number in the file sits inside it."
screens:
  - type: intro
    text: "You are behind the second you get in. Here is exactly how far."

  - type: theory
    title: "One position, two crossings"
    body: "Getting in crosses the gap. Getting out crosses it again. A round trip is one complete position — open and close — and the gap is paid once across the pair."

  - type: theory
    title: "It is paid at the start, not at the end"
    body: "You bought at the ask. The price you could sell at is already lower. Nothing has to happen for you to be down: the loss is sitting there the instant you are in."

  - type: example
    body: "With a $25,000 account you buy 1,000 shares at the ask of $20.05. Bid is $20.00. Sell this second and you get $20,000 back for $20,050 spent — $50 gone, price unmoved."
    visual: cost-stack
    visual_data: {shares: 1000, spread: 0.05, target: 0.20}

  - type: numeric-input
    prompt: "Bid $13.00, ask $13.04. You buy 1,500 shares and sell them straight back. What does that cost you?"
    answer: 60
    tolerance: 0.01
    unit: "$"
    working: "$0.04 per share × 1,500 shares = $60"
    explanation: "Four cents times fifteen hundred shares, and the price never had to move at all."

  - type: tf
    statement: "The gap is charged twice on a position — once going in and once coming out."
    answer: false
    explanation: "Once per round trip. Buying at the ask while the bid sits lower already accounts for both ends."

  - type: mc
    prompt: "Nobody bills you for the gap. Why is it still money you have lost?"
    options:
      - {text: "It is built into the two prices", correct: true}
      - {text: "It appears on the monthly statement"}
      - {text: "It only counts when the trade goes against you"}
    explanation: "It never appears as a line item anywhere, which is exactly why beginners forget it."

  - type: sort
    prompt: "Which of these actually crosses the gap?"
    buckets: ["Crosses it", "Does not"]
    items:
      - {text: "Buying now and selling ten seconds later", bucket: "Crosses it"}
      - {text: "Selling short now and covering a minute later", bucket: "Crosses it"}
      - {text: "Watching the panel for an hour", bucket: "Does not"}
      - {text: "Deciding against a trade before you press anything", bucket: "Does not"}
    explanation: "Both directions pay it, and both pay it once. Only the trades you do not take are free."

  - type: fill-tiles
    sentence: "One open plus one close makes a round ___."
    answer: "trip"
    explanation: "The unit a scalper counts costs in — not per order, per round trip."

  - type: numeric-mc
    prompt: "Four cents between the sides, 800 shares, one complete position. What has the gap taken?"
    options:
      - {text: "$3.20"}
      - {text: "$320"}
      - {text: "$32", correct: true}
      - {text: "$0.04"}
    working: "$0.04 × 800 = $32"
    explanation: "Per-share numbers have to be multiplied by the share count before they mean anything."

  - type: slider
    prompt: "A six-cent gap on a stock that travels about fifteen cents while you hold it. What share of that fifteen cents is gone before you start?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 40
    tolerance: 10
    explanation: "0.06 ÷ 0.15 = 40 %. You are playing for the remaining nine cents."

  - type: story
    text: "You bought 1,200 shares at the ask of $17.02. The panel now reads bid $17.10 / ask $17.14, and you want to be out."

  - type: numeric-input
    prompt: "You sell all 1,200 shares right now. What is the result on the position?"
    answer: 96
    tolerance: 0.01
    unit: "$"
    working: "Sold at the bid: 17.10 − 17.02 = $0.08 per share; $0.08 × 1,200 = $96"
    explanation: "Chapter 1's move times shares, with one correction: the move runs from the ask you paid to the bid you got."

  - type: visual
    component: cost-stack
    data: {shares: 1200, spread: 0.04, target: 0.12}
    caption: "The dark block is already spent when the position opens. Everything above it is what you are playing for."
