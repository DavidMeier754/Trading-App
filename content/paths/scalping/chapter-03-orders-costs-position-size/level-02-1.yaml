id: "2-1"
title: "The Scalper's Enemy"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, liquidity]
learning_goal: "User judges a spread relative to the move they expect, links tight spreads to liquidity, and knows spreads change constantly."
purpose: "A spread that looks tiny in dollars can be most of a scalp — judging it correctly is the difference between an edge and a leak."
terms_introduced: ["Target", "Expected move"]
prerequisite: "1-2"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "A $0.05 spread is nothing to a swing trader and everything to you."

  - type: theory
    title: "Your target is tiny"
    body: "A scalper's target is the move you aim to capture — often $0.05 to $0.30 per share. A swing trader aims for $5. Same spread, totally different bite."

  - type: visual
    component: cost-stack
    data: {spread: 0.05, targets: [{label: "Scalp target", value: 0.10}, {label: "Swing target", value: 5.00}]}
    caption: "$0.05 spread against a $0.10 scalp target (50 %) and a $5 swing target (1 %)."

  - type: numeric-input
    prompt: "Target $0.20 per share, spread $0.08. What percent of the target is eaten?"
    answer: 40
    unit: "%"
    working: "0.08 ÷ 0.20 = 0.40 = 40 %"
    explanation: "Almost half the target is gone at entry."

  - type: theory
    title: "Compare to the move, not to the price"
    body: "A $0.05 spread on a $200 stock looks tiny. If that stock only moves $0.10 while you hold, the spread is half your world. Judge the spread against the move you expect — never against the share price."

  - type: mc
    prompt: "Stock A: $150, spread $0.05, moves about $0.60 while you'd hold. Stock B: $8, spread $0.02, moves about $0.04. Better scalp?"
    options:
      - {text: "A — the spread is a small slice of the expected move", correct: true}
      - {text: "B — the spread is smaller in dollars"}
      - {text: "B — cheaper stocks are easier to scalp"}
    explanation: "A: 8 % of the move. B: 50 %. Price level is irrelevant."

  - type: theory
    title: "Liquidity makes spreads tight"
    body: "Many buyers and sellers competing push bid and ask together. Thin stocks have wide spreads. Chapter 1's liquidity dial just turned into money."

  - type: tf
    statement: "A wider spread in dollars always means a worse scalping candidate."
    answer: false
    explanation: "Only relative to the expected move. $0.10 on a stock that moves $2 is fine; $0.02 on a stock that moves $0.03 is terrible."

  - type: theory
    title: "Spreads move"
    body: "Bid and ask update many times a second. Around news and in the first minutes after the open, spreads widen. A spread you checked five seconds ago may be gone."
    visual: quote-panel
    visual_data: {bid: 20.10, ask: 20.12, animate_to: {bid: 20.06, ask: 20.16}}

  - type: mc
    prompt: "You see a $0.02 spread, think for ten seconds, then buy. What's the realistic risk?"
    options:
      - {text: "None — spreads are fixed for the session"}
      - {text: "The bid and ask swapped places"}
      - {text: "The spread widened while you were thinking", correct: true}
    explanation: "Ten seconds is a long time in a fast stock."

  - type: sort
    prompt: "Tightens or widens the spread?"
    buckets: ["Tightens", "Widens"]
    items:
      - {text: "Heavy volume, many participants", bucket: "Tightens"}
      - {text: "Breaking news", bucket: "Widens"}
      - {text: "The first minute after the open", bucket: "Widens"}
      - {text: "A calm, liquid large-cap at midday", bucket: "Tightens"}
    explanation: "Crowded and calm is tight; thin or scared is wide."

  - type: numeric-mc
    prompt: "Expected move $0.15, spread $0.09. Percent eaten?"
    options:
      - {text: "6 %"}
      - {text: "60 %", correct: true}
      - {text: "15 %"}
      - {text: "90 %"}
    working: "0.09 ÷ 0.15 = 0.60"
    explanation: "Most of the move is gone — skip."

  - type: fill-choice
    sentence: "Judge a spread against the ___ you expect."
    options: ["move", "price", "volume"]
    answer: "move"
    explanation: "Not the share price — the move."

  - type: theory
    title: "Solid ground"
    body: "Tight spread, liquid stock, calm quote. That's the ground a scalper stands on."
