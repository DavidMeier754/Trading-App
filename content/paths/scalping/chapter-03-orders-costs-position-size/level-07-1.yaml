id: "7-1"
title: "The Marketable Limit"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [orders, execution, marketable-limit]
icon: limit
learning_goal: "User can place a limit order at or above the ask to get a market-order fill with a ceiling on the price."
purpose: "This is the ticket most experienced scalpers actually send: in now, but never above the number they chose."
terms_introduced: ["Marketable limit order"]
skills: ["Marketable limit order"]
reinforces: []
prerequisite: "6-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Account named at $20,000. The trick is that a limit price is a ceiling, not a price."
screens:
  - type: intro
    text: "One ticket that fills like a market order and refuses like a limit order."

  - type: theory
    title: "A limit that does not wait"
    body: "Put a limit buy at or above the ask and there is something for it to trade against immediately. It is a marketable limit order: it goes off like a market order, and it stops at your number."

  - type: example
    body: "Ask $17.24. You send a limit buy for 1,000 shares at $17.27. The sellers are still at $17.24, so that is what you pay. The three extra cents were a ceiling, not a price."
    visual: order-ticket
    visual_data: {ticker: XYZ, side: buy, qty: 1000, type: limit, price: 17.27}

  - type: walkthrough
    component: order-ticket
    data: {ticker: XYZ, side: buy, qty: 1000, type: limit, price: 17.27}
    steps:
      - {spotlight: type, text: "Still a limit. Nothing about the type has changed."}
      - {spotlight: price, text: "Three cents above the ask of $17.24 — the worst price you will accept."}
      - {spotlight: submit, text: "And it trades straight away, because the sellers are already inside your ceiling."}

  - type: mc
    prompt: "Ask $17.24, your limit buy at $17.27, sellers still sitting at $17.24. You pay:"
    options:
      - {text: "$17.27 — the price you named"}
      - {text: "$17.255 — halfway between the two"}
      - {text: "$17.24 — your price or better", correct: true}
    explanation: "A limit never pays more than its number and never refuses a better one. Naming a ceiling costs nothing when the market is under it."

  - type: numeric-input
    prompt: "1,000 shares filled at $17.24, out of a $20,000 account. What is now in the stock?"
    answer: 17240
    tolerance: 1
    unit: "$"
    working: "1,000 × $17.24 = $17,240"
    explanation: "The cap changed what you could have paid, not what you did pay."

  - type: theory
    title: "Why not just send a market order"
    body: "In a fast stock the ask can move between your tap and the moment the order arrives. A market order pays whatever it finds there. A ceiling does not."

  - type: mc
    prompt: "The ask jumps to $17.33 in the instant your order lands, and your ceiling is $17.27. What happens?"
    options:
      - {text: "Your order rests at $17.27 and nothing trades", correct: true}
      - {text: "It trades at $17.33, because it was marketable when you sent it"}
      - {text: "The exchange cancels it for being behind the market"}
    explanation: "Above your ceiling you simply do not buy. Missing that entry is exactly what you bought the ceiling for."

  - type: order-build
    prompt: "Build a capped entry: 1,000 shares, no more than three cents over the ask of $17.24."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit]
      qty: [500, 1000, 2000]
      price: [17.21, 17.24, 17.27]
    answer: {side: buy, type: limit, qty: 1000, price: 17.27}
    explanation: "The same four boxes as a resting order. Only the height of the price turns waiting into trading."

  - type: tf
    statement: "A marketable limit order usually trades at the ceiling you named."
    answer: false
    explanation: "It trades at the best price the other side is showing. The ceiling only matters on the day the market jumps past it."

  - type: sort
    prompt: "Trades this second, or sits and waits?"
    buckets: ["Trades this second", "Sits and waits"]
    items:
      - {text: "A market buy", bucket: "Trades this second"}
      - {text: "A limit buy at the ask", bucket: "Trades this second"}
      - {text: "A limit buy two cents under the bid", bucket: "Sits and waits"}
      - {text: "A limit sell ten cents over the ask", bucket: "Sits and waits"}
    explanation: "Reaching the other side is what decides it, not the word on the ticket."

  - type: numeric-input
    prompt: "A market order arriving at that same instant fills at $17.33. Against the $17.24 you saw when you pressed, what do 1,000 shares cost extra?"
    answer: 90
    tolerance: 0.01
    unit: "$"
    working: "$17.33 − $17.24 = $0.09 per share; $0.09 × 1,000 = $90"
    explanation: "Nine cents you never agreed to, on a stock you were happy to own three cents higher at most."

  - type: spot-mistake
    prompt: "One piece of this is false. Tap it."
    segments:
      - {text: "To get in now with a ceiling on the price,"}
      - {text: "post your limit under the bid,", wrong: true}
      - {text: "and it trades against the sellers."}
    explanation: "Under the bid there is nothing to trade against. The ceiling has to reach the sellers to do any work."

  - type: visual
    component: order-ticket
    data: {ticker: XYZ, side: buy, qty: 1000, type: limit, price: 17.27}
    caption: "The scalper's standard entry: the speed of a market order with a number written on it."
