id: "9-1"
title: "The Stop Order"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [orders, stops, risk]
learning_goal: "User places a stop on the correct side of an entry and can state the planned loss in dollars before the trade is taken."
purpose: "You are going to be wrong all morning long; the stop is the order that keeps being wrong cheap."
terms_introduced: ["Stop order", "Stop-loss"]
reinforces: [2]
prerequisite: "8-2"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Account named at $20,000. Chapter 2's higher low is the price the stop is placed against, not a round number of cents."
screens:
  - type: intro
    text: "Two of your three tickets are written. This is the one for the mornings you are wrong."

  - type: theory
    title: "An order that waits for bad news"
    body: "A stop order does nothing until the price touches the number on it. Then it wakes up and becomes a live order. Used to close a losing position, it is a stop-loss."

  - type: example
    body: "You are long 1,000 shares from $15.40 out of a $20,000 account. The climb's last dip was $15.30, so a sell stop goes at $15.28 — twelve cents under your entry, $120 if it is touched."
    visual: chart-candles
    visual_data:
      data: [[15.36, 15.46, 15.34, 15.44], [15.44, 15.52, 15.40, 15.42], [15.42, 15.48, 15.36, 15.46], [15.46, 15.50, 15.30, 15.34], [15.34, 15.42, 15.32, 15.40]]
      volume: [110000, 96000, 88000, 124000, 102000]
      levels: [15.28]

  - type: mc
    prompt: "You are long. Your stop-loss goes:"
    options:
      - {text: "Above the entry, where the trade is working"}
      - {text: "Below the entry, where the trade is finished", correct: true}
      - {text: "At the entry, so the worst case is nothing"}
    explanation: "A long loses money as price falls, so the order that ends it has to be sitting underneath."

  - type: numeric-input
    prompt: "Long 1,000 shares from $15.40 with the sell stop at $15.28. What is the planned loss?"
    answer: 120
    tolerance: 0.01
    unit: "$"
    working: "$15.40 − $15.28 = $0.12 per share; $0.12 × 1,000 = $120"
    explanation: "A number you know before you enter, which is the only useful kind of number about a losing trade."

  - type: chart-tap
    prompt: "You are long 1,000 from $15.40 with the sell stop at $15.28. Tap the minute that takes you out."
    chart:
      kind: candles
      data: [[15.36, 15.46, 15.34, 15.44], [15.44, 15.52, 15.40, 15.42], [15.42, 15.48, 15.36, 15.46], [15.46, 15.50, 15.30, 15.34], [15.34, 15.40, 15.26, 15.28], [15.28, 15.32, 15.18, 15.20], [15.20, 15.26, 15.14, 15.22], [15.22, 15.28, 15.16, 15.24]]
      volume: [110000, 96000, 88000, 124000, 168000, 152000, 120000, 104000]
      levels:
        - {price: 15.28, label: "Stop"}
    target: 4
    explanation: "The minute before it came down to $15.30 and held. This one traded through $15.28 and the resting order did the rest without you."

  - type: tf
    statement: "Your stop is drawn on the chart, so other traders can see where it sits."
    answer: false
    explanation: "It is an instruction sitting at your broker. The line on your screen is for you alone."

  - type: theory
    title: "Chosen before the entry, not after"
    body: "The stop is part of deciding whether to take the trade at all. Once you are in, every price on the screen is arguing with you, and that is the worst moment to pick a number."

  - type: mc
    prompt: "Your long was taken because the climb kept making higher lows, and the last of those lows is $15.30. Where does the stop belong?"
    options:
      - {text: "Ten cents under the entry, wherever that lands"}
      - {text: "Exactly on $15.30, the low itself"}
      - {text: "Just under $15.30, where the higher lows would be finished", correct: true}
    explanation: "The stop marks the price that proves the shape is gone. A round number of cents proves nothing about this chart."

  - type: sort
    prompt: "Which side of the entry does each of these sit on?"
    buckets: ["Below the entry", "Above the entry"]
    items:
      - {text: "The stop on a long", bucket: "Below the entry"}
      - {text: "The stop on a short", bucket: "Above the entry"}
      - {text: "The target on a long", bucket: "Above the entry"}
      - {text: "The target on a short", bucket: "Below the entry"}
    explanation: "Stop and target always straddle the entry, and shorting swaps which one is which."

  - type: numeric-mc
    prompt: "Short 800 shares from $22.60 with a buy stop at $22.74. Planned loss?"
    options:
      - {text: "$1,120"}
      - {text: "$14"}
      - {text: "$112", correct: true}
      - {text: "$11.20"}
    working: "$22.74 − $22.60 = $0.14 per share; $0.14 × 800 = $112"
    explanation: "Fourteen cents against you times eight hundred shares — the same arithmetic, just measured upwards."

  - type: fill-choice
    sentence: "A stop order placed to end a losing trade is a stop-___."
    options: ["loss", "limit", "market"]
    answer: "loss"
    explanation: "Same order, named for the job it is doing."

  - type: checklist-reveal
    title: "Before the entry goes out"
    items:
      - "Which price says this trade is finished?"
      - "Is my stop just beyond that price, not on it?"
      - "How many dollars is that on the size I want?"
      - "Am I still happy to take the trade knowing that number?"
