id: "10-1"
title: "How Many Shares?"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [position-size, risk, liquidity]
icon: size
learning_goal: "User separates what a position ties up from what it risks, and can compute both from a share count, a price and a stop distance."
purpose: "Two numbers describe every position, and confusing them is how a sensible-looking trade turns into an unsurvivable one."
terms_introduced: ["Position size", "Position value", "Risk per trade"]
skills: ["Position size", "Position value", "Risk per trade"]
reinforces: [1]
prerequisite: "9-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Account named at $20,000. Chapter 1's liquidity dial comes back as a limit on the share count itself."
screens:
  - type: intro
    text: "The chart has given you a stop. Now for the number that is entirely yours."

  - type: theory
    title: "Position size is the share count"
    body: "Not how confident you are, not how good the setup looks. Position size is one number — how many shares — and it is the only part of a trade you control completely."

  - type: theory
    title: "Two numbers that look alike"
    body: "Position value is shares times price: what the trade ties up. Risk per trade is shares times stop distance: what it costs if you are wrong. They are not remotely the same size."

  - type: example
    body: "1,200 shares at $14.00 out of a $20,000 account. The position value is $16,800 — most of the account. The stop is fourteen cents away, so the risk is $168."
    visual: cost-stack
    visual_data: {shares: 1200, spread: 0.03, target: 0.14}

  - type: numeric-input
    prompt: "1,200 shares at $14.00. What does the position tie up?"
    answer: 16800
    tolerance: 1
    unit: "$"
    working: "1,200 × $14.00 = $16,800"
    explanation: "This is the number that has to fit in the account, and it has nothing to do with how wrong the trade can go."

  - type: numeric-mc
    prompt: "Same 1,200 shares, stop fourteen cents under the entry. What does the trade risk?"
    options:
      - {text: "$16,800"}
      - {text: "$1,680"}
      - {text: "$168", correct: true}
      - {text: "$14"}
    working: "$0.14 × 1,200 = $168"
    explanation: "A hundredth of what the position is worth, because the stop only lets a small slice of it go wrong."

  - type: mc
    prompt: "Which of those two numbers does the account have to be able to pay?"
    options:
      - {text: "The $168, since that is the money genuinely at risk"}
      - {text: "The $16,800, because the shares have to be bought", correct: true}
      - {text: "Neither — only the difference between them matters"}
    explanation: "Being wrong costs $168. Being in the trade at all costs $16,800, and that money has to exist first."

  - type: tf
    statement: "Doubling the share count doubles both of those numbers."
    answer: true
    explanation: "Both are a multiplication by the size, so the size moves what you tie up and what you risk in exactly the same proportion."

  - type: sort
    prompt: "Position value, or risk per trade?"
    buckets: ["Position value", "Risk per trade"]
    items:
      - {text: "Shares × price", bucket: "Position value"}
      - {text: "Shares × stop distance", bucket: "Risk per trade"}
      - {text: "What the account has to cover", bucket: "Position value"}
      - {text: "What a wrong read actually costs", bucket: "Risk per trade"}
    explanation: "One is measured against your account, the other against your appetite for being wrong."

  - type: mc
    prompt: "Those 1,200 shares are in a name printing about 9,000 shares a minute. What does that say about the size?"
    options:
      - {text: "Nothing — size is a risk question, not a volume one"}
      - {text: "It is comfortable, since you own a tiny slice of the company"}
      - {text: "You would be an eighth of a whole minute's trading on the way out", correct: true}
    explanation: "Chapter 1 called liquidity the ease of getting out. A size that needs a minute of the stock's whole trading to leave is not an easy exit."

  - type: slider
    prompt: "Stop distance fourteen cents. Slide to what 1,200 shares put at risk."
    min: 0
    max: 400
    step: 20
    unit: "$"
    answer: 160
    tolerance: 20
    explanation: "$0.14 × 1,200 = $168, which is the band you are aiming at rather than a number to be exact about on a slider."

  - type: spot-mistake
    prompt: "Tap the claim that does not survive a second look."
    segments:
      - {text: "The position is 1,200 shares at $14.00,"}
      - {text: "so the trade risks $16,800,", wrong: true}
      - {text: "and the stop is fourteen cents away."}
    explanation: "That is what the position is worth. What it risks is the stop distance times the shares — $168."

  - type: fill-choice
    sentence: "Shares × stop distance is the ___."
    options: ["risk per trade", "position value", "spread cost"]
    answer: "risk per trade"
    explanation: "The only one of the three that tells you what being wrong is going to feel like."

  - type: visual
    component: bar-chart
    data:
      bars:
        - {label: "Position value", value: 16800}
        - {label: "Risk per trade", value: 168}
      unit: "$"
    caption: "Same 1,200 shares, two numbers, a hundred times apart. Both of them have to be checked."
