id: "10-1"
title: "How Many Shares?"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [position-size, risk]
learning_goal: "User derives a share count from the risk budget and the stop distance, then caps it at what the account can actually pay for, and takes the lower of the two."
purpose: "Share count is the one number you fully control — sizing from risk is what keeps a run of losses survivable."
terms_introduced: ["Position size", "Position value", "Risk per trade", "1 % rule"]
prerequisite: "9-1"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "The most important number in trading isn't the price. It's how many shares."

  - type: theory
    title: "Position value"
    body: "Shares × price. 500 shares at $20 = $10,000 in the trade. Your account decides what's possible; your risk decides what's smart."

  - type: theory
    title: "Risk per trade"
    body: "Shares × stop distance. 500 shares with a $0.10 stop = $50 at risk. That's the number you control — not the profit."

  - type: theory
    title: "The 1 % rule"
    body: "Many traders risk at most 1 % of the account per trade. $10,000 account → $100 max risk. Ten losers in a row cost 10 % of the account, not all of it."

  - type: visual
    component: bar-chart
    data: {bars: [{label: "$0.10 stop", value: 1000}, {label: "$0.25 stop", value: 400}, {label: "$0.50 stop", value: 200}], unit: "shares for $100 risk"}
    caption: "The first ceiling: max risk ÷ stop distance = shares. Wider stop, fewer shares."

  - type: numeric-input
    prompt: "Account $20,000, 1 % rule. Max risk per trade?"
    answer: 200
    unit: "$"
    working: "$20,000 × 0.01 = $200"
    explanation: "One percent of the account."

  - type: numeric-input
    prompt: "Max risk $200, stop distance $0.08. How many shares does the risk allow?"
    answer: 2500
    unit: "shares"
    working: "$200 ÷ $0.08 = 2,500"
    explanation: "Risk divided by stop distance — and that is only the first of two ceilings."

  - type: theory
    title: "The second ceiling"
    body: "Shares have to be paid for. A $20,000 account holds $20,000 of stock, so at $12 a share it holds 1,666 — however tight the stop is. Take whichever ceiling is lower."

  - type: numeric-input
    prompt: "Same $20,000 account and $0.08 stop, and the stock trades at $12.00. How many shares do you actually take?"
    answer: 1666
    tolerance: 1
    unit: "shares"
    working: "Risk: $200 ÷ $0.08 = 2,500. Account: $20,000 ÷ $12.00 = 1,666. Take the smaller."
    explanation: "Here the account is the binding one — the stop would have let you buy stock you cannot pay for."

  - type: mc
    prompt: "Same $200 risk, and both stocks cost the same. Stock A needs a $0.10 stop, Stock B a $0.25 stop. Which does the risk ceiling allow more of?"
    options:
      - {text: "B — a wider stop means a safer, bigger position"}
      - {text: "A — 2,000 shares versus 800", correct: true}
      - {text: "Equal — the risk is the same"}
    explanation: "Tighter stop, more shares for the same risk. The account ceiling then decides whether you can hold them."

  - type: tf
    statement: "Position value and risk per trade are the same thing."
    answer: false
    explanation: "Value is what's in the trade; risk is what you lose if the stop hits."

  - type: numeric-mc
    prompt: "1,000 shares at $18.00 with a $0.12 stop. Risk?"
    options:
      - {text: "$18,000"}
      - {text: "$12"}
      - {text: "$1,200"}
      - {text: "$120", correct: true}
    working: "$0.12 × 1,000 = $120"
    explanation: "Stop distance times shares. The $18,000 is the position value, and it has to fit the account."

  - type: story
    character: retail-trader
    text: "Account $10,000. You like a stock at $12.00 with a $0.20 stop. 1 % rule."

  - type: numeric-input
    prompt: "How many shares?"
    answer: 500
    tolerance: 1
    unit: "shares"
    working: "Risk: $100 ÷ $0.20 = 500. Account: $10,000 ÷ $12.00 = 833. Take the smaller: 500"
    explanation: "This time the stop is the binding ceiling. Round down — never up."

  - type: sort
    prompt: "Raises or lowers risk per trade?"
    buckets: ["Raises", "Lowers"]
    items:
      - {text: "More shares", bucket: "Raises"}
      - {text: "Wider stop", bucket: "Raises"}
      - {text: "Tighter stop", bucket: "Lowers"}
      - {text: "Fewer shares", bucket: "Lowers"}
    explanation: "Two levers, same product."

  - type: fill-choice
    sentence: "Shares × stop distance = ___."
    options: ["risk per trade", "position value", "spread cost"]
    answer: "risk per trade"
    explanation: "What you lose if the stop hits."

  - type: theory
    title: "Two ceilings, take the lower"
    body: "What your stop lets you risk, and what your account can pay for. Never the number that excitement suggests. Practice next."
