id: "1-1"
title: "Bid, Ask, Spread"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, quote-panel]
learning_goal: "User can read bid, ask, last and spread from a quote panel and knows which price a buyer pays and a seller receives right now."
purpose: "Bid and ask are the two prices every scalp starts and ends at — reading them instantly is the base skill of this whole path."
terms_introduced: ["Bid", "Ask", "Last", "Quote panel"]
prerequisite: null
xp: 20
difficulty: 1
sources: [consensus]
notes: "Spread was introduced in Chapter 1 Level 3 (market maker's gap); here it becomes a number."
screens:
  - type: intro
    text: "Every stock has two prices at once. Scalpers live in the gap between them."

  - type: theory
    title: "Bid and ask"
    body: "The bid is the highest price a buyer is offering right now. The ask is the lowest price a seller will take right now. The ask is always a little higher — that gap is the spread from Chapter 1."
    visual: quote-panel
    visual_data: {bid: 45.20, ask: 45.24, last: 45.22}

  - type: walkthrough
    component: quote-panel
    data: {bid: 45.20, ask: 45.24, last: 45.22}
    steps:
      - {spotlight: bid, text: "Bid: what you get if you sell right now."}
      - {spotlight: ask, text: "Ask: what you pay if you buy right now."}
      - {spotlight: spread, text: "Spread = ask − bid. Here $0.04."}
      - {spotlight: last, text: "Last: the price of the most recent trade — usually between the two."}

  - type: theory
    title: "Who sets them?"
    body: "Market makers and other traders post bids and asks all day. The spread is their income — and your cost, every single time you cross it."

  - type: hotspot
    component: quote-panel
    prompt: "Tap the price you'd pay to buy right now."
    data: {bid: 18.40, ask: 18.46, last: 18.44}
    target: ask
    explanation: "Buyers pay the ask: $18.46."

  - type: numeric-input
    prompt: "Bid $18.40, ask $18.46. What is the spread?"
    answer: 0.06
    tolerance: 0.001
    unit: "$"
    working: "18.46 − 18.40 = 0.06"
    explanation: "Ask minus bid."

  - type: tf
    statement: "A trade can print at a price between the bid and the ask."
    answer: true
    explanation: "'Last' is simply the most recent trade — at the bid, at the ask, or somewhere in between."

  - type: mc
    prompt: "You sell 500 shares right now while the quote shows bid $18.40 / ask $18.46. What do you receive per share?"
    options:
      - {text: "$18.46 — sellers get the ask"}
      - {text: "$18.40 — sellers get the bid", correct: true}
      - {text: "$18.43 — the middle"}
    explanation: "Selling now means taking what buyers are offering: the bid."

  - type: hotspot
    component: quote-panel
    prompt: "Tap both prices that make up the spread."
    data: {bid: 95.12, ask: 95.20, last: 95.15}
    targets: [bid, ask]
    explanation: "Spread = 95.20 − 95.12 = $0.08."

  - type: numeric-mc
    prompt: "Bid $67.42, ask $67.49. Spread?"
    options:
      - {text: "$0.70"}
      - {text: "$0.05"}
      - {text: "$0.07", correct: true}
      - {text: "$134.91"}
    working: "67.49 − 67.42 = 0.07"
    explanation: "Seven cents between the two sides."

  - type: match
    prompt: "Four numbers on every quote panel. Which is which?"
    pairs:
      - ["Bid", "Highest price a buyer offers now"]
      - ["Ask", "Lowest price a seller takes now"]
      - ["Spread", "Ask minus bid"]
      - ["Last", "Price of the most recent trade"]
    explanation: "Four numbers on every quote panel."

  - type: fill-tiles
    sentence: "The lowest price a seller will accept right now is the ___."
    answer: "ask"
    explanation: "Buyers pay the ask."

  - type: theory
    title: "Say it until it's boring"
    body: "Buy at the ask, sell at the bid. That sentence is the whole next lesson."
