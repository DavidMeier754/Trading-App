id: "1-4"
title: "Bid, Ask, Spread"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: new-theory
tags: [spread, market-maker, costs]
icon: spread
learning_goal: "User can explain the spread as the income of whoever quotes both sides, and identify who pays it in a given situation."
purpose: "Knowing where the money goes is what stops the spread feeling like a rounding error."
terms_introduced: []
skills: ["Who earns the spread"]
reinforces: [1]
prerequisite: "1-3"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Closes Level 1. Chapter 1 introduced the market maker as a character; here the character gets a wage slip."
screens:
  - type: intro
    text: "Somebody is on the other side of every trade you make. This is what they are charging you."

  - type: story
    text: "Someone has to be willing to buy when you want out and sell when you want in. That someone would like to be paid for it."

  - type: theory
    title: "The spread is a wage"
    body: "A market maker quotes both sides at once: a bid to buy from sellers, an ask to sell to buyers. Every pair of trades that crosses the spread leaves them the difference."

  - type: example
    body: "Bid $14.10, ask $14.14. They buy 1,000 shares from an impatient seller at $14.10 and sell 1,000 to an impatient buyer at $14.14. That is $40 for standing in the middle."
    visual: quote-panel
    visual_data: {bid: 14.10, ask: 14.14, last: 14.12}

  - type: numeric-input
    prompt: "Bid $19.88, ask $19.93. Over a minute they buy 1,400 shares at the bid and sell 1,400 at the ask. What does the minute leave them?"
    answer: 70
    tolerance: 0.01
    unit: "$"
    working: "19.93 − 19.88 = $0.05 per share; $0.05 × 1,400 = $70"
    explanation: "The spread times the shares they matched. They never needed the price to move."

  - type: mc
    prompt: "Who handed over that $70?"
    options:
      - {text: "Nobody — it appears because the price rose"}
      - {text: "The exchange, out of its own fees"}
      - {text: "The traders on both sides who wanted it done now", correct: true}
    explanation: "One paid the ask, one took the bid, and the difference stayed in the middle."

  - type: tf
    statement: "A market maker only earns the spread when the stock moves their way."
    answer: false
    explanation: "The move is the risk they are trying to avoid. The spread is what they are paid for taking it on."

  - type: carousel
    cards:
      - {label: "Retail trader", text: "Wants in or out now, so pays the spread almost every time.", icon: retail-trader}
      - {label: "Market maker", text: "Quotes both sides, collects the spread, tries to end the day holding nothing.", icon: market-maker}
      - {label: "Institution", text: "Has too many shares to be in a hurry, so works the order slowly and pays less of it.", icon: institution}

  - type: mc
    prompt: "An institution has 400,000 shares to sell and feeds them out over two hours rather than selling the lot at once. What are they mainly avoiding?"
    options:
      - {text: "Showing up on the day's volume bar"}
      - {text: "Crossing the spread on every share", correct: true}
      - {text: "The exchange's per-order fee"}
    explanation: "Patience lets them post their own price and let buyers come to them, which is the opposite side of the wage."

  - type: sort
    prompt: "In each of these, is the spread being paid or collected?"
    buckets: ["Pays the spread", "Collects the spread"]
    items:
      - {text: "Pressing buy because you want in now", bucket: "Pays the spread"}
      - {text: "Leaving your own price posted until somebody comes to you", bucket: "Collects the spread"}
      - {text: "Selling into the bid because you want out", bucket: "Pays the spread"}
      - {text: "Quoting both sides all day and going home flat", bucket: "Collects the spread"}
    explanation: "Impatience pays. Waiting gets paid. Scalping lives almost entirely on the impatient side, which is why the spread matters so much here."

  - type: numeric-mc
    prompt: "Three cents between the sides. In one minute they match 10,000 shares — bought at the bid, sold at the ask. What does that minute pay?"
    options:
      - {text: "$300", correct: true}
      - {text: "$30"}
      - {text: "$60"}
      - {text: "$3,000"}
    working: "$0.03 × 10,000 shares matched = $300"
    explanation: "Small per share, serious per minute. That is the business."

  - type: spot-mistake
    prompt: "Tap the part that is wrong."
    segments:
      - {text: "A market maker quotes both prices,"}
      - {text: "hoping the stock goes up,", wrong: true}
      - {text: "and keeps the distance between them."}
    explanation: "They would rather the stock went nowhere. Direction is the part of the job they are trying to hedge away."

  - type: recap
    title: "Level 1 in three lines"
    points:
      - {text: "A stock shows two live prices at once, and the ask is always the higher one.", level: "1-1"}
      - {text: "Buying pays the ask and selling takes the bid, long or short.", level: "1-2"}
      - {text: "The distance between them is somebody's income, and in a scalp it is yours to pay.", level: "1-4"}
