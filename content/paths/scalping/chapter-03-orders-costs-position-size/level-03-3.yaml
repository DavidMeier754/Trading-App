id: "3-3"
title: "Market, Limit, Marketable Limit"
chapter: 3
chapter_title: "Orders, Costs & Position Size"
path: scalping
category: repetition
tags: [orders, execution]
learning_goal: "User picks the right order type for realistic entry and exit situations and reads an order ticket."
purpose: "Order choice has to be automatic at scalping speed — this drills it on real tickets."
terms_introduced: []
prerequisite: "3-2"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "Real tickets, real quotes. Pick the right order every time."

  - type: story
    character: retail-trader
    text: "Bid $19.98 / ask $20.00. You want in right now, but not above $20.03."

  - type: mc
    prompt: "Which order?"
    options:
      - {text: "Market buy, filled at whatever the ask is"}
      - {text: "Limit buy at $20.03 — marketable and capped", correct: true}
      - {text: "Limit buy at $19.95, waiting for a dip"}
    explanation: "At or above the ask fills now; the $20.03 cap protects you."

  - type: hotspot
    component: order-ticket
    prompt: "Tap the field that caps your price."
    data: {ticker: XYZ, side: buy, qty: 500, type: limit, price: 20.03}
    target: price
    explanation: "The limit price is the ceiling."

  - type: tf
    statement: "With a market buy on that quote you'd pay $19.98."
    answer: false
    explanation: "Market buys hit the ask: $20.00."

  - type: numeric-mc
    prompt: "You're long 500 at $20.00 and set a limit sell at $20.12. It fills. Gross profit?"
    options:
      - {text: "$6"}
      - {text: "$600"}
      - {text: "$60", correct: true}
      - {text: "$12"}
    working: "$0.12 × 500 = $60"
    explanation: "Twelve cents on 500 shares."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "A limit sell at $20.12"}
      - {text: "is guaranteed to fill by the end of the day", wrong: true}
      - {text: "if you're patient."}
    explanation: "Limit orders fill only if the price gets there. No guarantee, ever."

  - type: story
    character: retail-trader
    text: "Bid $54.30 / ask $54.34. The stock is dropping and you want out of 300 shares now."

  - type: mc
    prompt: "Which order?"
    options:
      - {text: "Limit sell at $54.40, ten cents above the bid"}
      - {text: "Limit buy at $54.30, to average down first"}
      - {text: "Market sell, or a marketable limit sell at $54.30", correct: true}
    explanation: "Getting out now means hitting the bid."

  - type: sort
    prompt: "Fills immediately, or waits?"
    buckets: ["Fills immediately", "Waits"]
    items:
      - {text: "Market buy", bucket: "Fills immediately"}
      - {text: "Limit buy at the ask", bucket: "Fills immediately"}
      - {text: "Limit buy $0.10 below the ask", bucket: "Waits"}
      - {text: "Limit sell $0.10 above the bid", bucket: "Waits"}
    explanation: "At or through the market fills; away from it waits."

  - type: numeric-input
    prompt: "Bid $54.30. Market sell of 300 shares. You receive about:"
    answer: 16290
    unit: "$"
    working: "$54.30 × 300 = $16,290"
    explanation: "At the bid, times shares."

  - type: match
    prompt: "Match each order to its behavior."
    pairs:
      - ["Market order", "Now, price uncapped"]
      - ["Marketable limit", "Now, price capped"]
      - ["Limit order", "Only at your price or better"]
      - ["Unfilled", "Never executed"]
    explanation: "The order kit so far."

  - type: mc
    prompt: "Fast stock, the ask jumping every tick. Which entry protects you from paying far more than you saw?"
    options:
      - {text: "Marketable limit a few cents above the ask", correct: true}
      - {text: "Market order"}
      - {text: "Limit order well below the ask"}
    explanation: "Capped speed. The market order is uncapped; the low limit misses the move."

  - type: fill-tiles
    sentence: "When an order is executed, it is ___."
    answer: "filled"
    explanation: "A fill is an execution."

  - type: theory
    title: "Next"
    body: "The order that gets you out when you're wrong."
