id: "1-3"
title: "The Stop Is Not Optional"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [risk, stops, costs, discipline]
learning_goal: "User prices the cost of widening a stop, and treats a fill past the trigger as a cost rather than as a broken plan."
purpose: "Almost every account-ending loss started as a small planned one that somebody gave a little more room."
terms_introduced: []
skills: ["The price of widening a stop"]
reinforces: [3]
prerequisite: "1-2"
xp: 20
difficulty: 2
sources: ["Elder — Trading for a Living", "Douglas — Trading in the Zone"]
notes: "Same $20,000 account as 1-2; worked positions are 1,100 shares at $16.46 and 1,400 at $12.28."
screens:
  - type: intro
    text: "Moving a stop is not free. Here is the bill."

  - type: story
    text: "Your stop is a cent away. It has been a cent away for what feels like a long time, and nothing on the chart has changed except that you are watching it."

  - type: theory
    title: "What widening buys you"
    body: "One more chance at an idea that has already failed, paid for with every cent you add. The extra room does not change the answer, only the price of finding it out."

  - type: numeric-input
    prompt: "Long 1,100 shares of KELP at $16.46 with the stop at $16.32. You slide the stop down to $16.16 instead. What does the planned loss become?"
    answer: 330
    tolerance: 0.01
    unit: "$"
    working: "$16.46 − $16.16 = $0.30; $0.30 × 1,100 shares = $330"
    explanation: "The plan was $154. Sixteen cents of room cost $176 more than the trade was ever allowed to lose."

  - type: order
    prompt: "Put these in the order they actually happen."
    items:
      - "The floor the trade was leaning on breaks"
      - "The stop is slid down to give it room"
      - "The loss passes the number you planned"
      - "The position comes off anyway, lower"
    explanation: "Nobody widens a stop and then closes at the original price. The extra room is spent, not lent."

  - type: theory
    title: "Why a hard stop is hard"
    body: "A resting order takes the decision away from you at the exact moment you are worst at making it. That is the whole point of it — not convenience, but your hands off the wheel."

  - type: mc
    prompt: "A mental stop and a hard stop at the same price. What is actually different?"
    options:
      - {text: "The hard stop shows your hand to the market and the mental one does not"}
      - {text: "The hard stop still works when you hesitate", correct: true}
      - {text: "The mental stop gets a better fill because you pick the moment"}
    explanation: "Both are a price. Only one of them is an order, and only one survives the ten seconds where you argue with yourself."

  - type: depth-ladder
    prompt: "Your stop on 1,100 shares triggers and the book underneath it looks like this. Where does the last of them fill?"
    data:
      bids: [[16.30, 500], [16.27, 400], [16.22, 1500]]
      asks: [[16.34, 600], [16.38, 900], [16.44, 1200]]
    target: bid-3
    explanation: "Five hundred at $16.30, four hundred more three cents lower, and the last two hundred at $16.22 — eight cents below the top of the book."

  - type: theory
    title: "That difference is slippage, not failure"
    body: "A stop-market gets you out; it never promises where. On a fast minute the fill sits a few cents past the trigger, and that is a cost you budget for, the same way you budget for the spread."

  - type: numeric-input
    prompt: "Your stop sat at $16.32 on 1,100 shares and the fill averaged $16.27 through that book. What did the trade lose from $16.46?"
    answer: 209
    tolerance: 0.01
    unit: "$"
    working: "$16.46 − $16.27 = $0.19; $0.19 × 1,100 shares = $209"
    explanation: "$154 planned, $209 paid. Five cents of slippage is a cost of doing business in a thin book, not a sign the stop was wrong."

  - type: tf
    statement: "A stop that fills five cents past its trigger proves the stop was in the wrong place."
    answer: false
    explanation: "It proves the minute was fast. The place was right; the fill is what speed charges."

  - type: spot-mistake
    prompt: "Tap the part that does not hold."
    segments:
      - {text: "I keep my stop in my head"}
      - {text: "because a resting order gets picked off", wrong: true}
      - {text: "and I am watching the screen anyway."}
    explanation: "Your few hundred shares sit in a book trading tens of thousands a minute. Nobody is hunting them; you simply have to be there, and a resting order always is."

  - type: chart-decision
    scenario: "MARL held $12.40 three times this morning and has just closed a minute underneath it at $12.28. You were long and the stop took you out at the break. Your account is $20,000."
    shares: 1400
    chart:
      kind: candles
      data: [[12.56, 12.60, 12.48, 12.52], [12.52, 12.56, 12.40, 12.44], [12.44, 12.52, 12.40, 12.50], [12.50, 12.54, 12.40, 12.42], [12.42, 12.46, 12.34, 12.36], [12.36, 12.40, 12.26, 12.28], [12.28, 12.32, 12.18, 12.20], [12.20, 12.24, 12.10, 12.12], [12.12, 12.16, 12.04, 12.06], [12.06, 12.14, 12.02, 12.10]]
      volume: [64000, 88000, 72000, 96000, 118000, 142000, 126000, 108000, 94000, 82000]
      levels:
        - {price: 12.40, label: "Floor"}
      decision_index: 5
    best: no-trade
    outcome: "It kept going to $12.02. Buying it back at $12.28 would have been 22 cents a share against you — $308 on 1,400 shares."
    explanation: "Buying the level back a cent at a time is widening the stop under another name. The floor broke, and the idea it was holding up went with it."

  - type: fill-tiles
    sentence: "Widening a stop does not rescue the idea; it only raises its ___."
    answer: "cost"
    explanation: "The idea failed at the level. Everything after that is paying more for the same answer."

  - type: checklist-reveal
    title: "Before you touch a stop"
    items:
      - "Has the chart changed, or only the time I have spent staring at it?"
      - "Is this move toward my entry, or away from it?"
      - "Would I place this stop on a fresh trade right now?"
