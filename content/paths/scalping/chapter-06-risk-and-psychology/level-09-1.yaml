id: "9-1"
title: "Session Limits"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [risk, limits, discipline]
learning_goal: "User sets a daily loss limit and a trade limit in advance and stops trading when either is reached."
purpose: "A scalper's account is rarely ruined by one trade — it is ruined by one morning that nobody stopped."
terms_introduced: ["Daily loss limit", "Trade limit"]
prerequisite: "8-1"
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
screens:
  - type: intro
    text: "The worst days are never caused by one bad trade."

  - type: theory
    title: "Thirty chances to be wrong"
    body: "A scalper makes decisions all morning. That is what makes the day, not the trade, the dangerous unit: a bad hour can undo a good week."

  - type: theory
    title: "Daily loss limit"
    body: "A number written down before the open: the most you will lose today, in R. Reach it and the session is over, whatever the chart is doing."

  - type: example
    body: "1R is $120 on 1,000 shares and your limit is 3R — $360. Three full stops and the platform closes — whether that takes twenty minutes or the whole session."

  - type: theory
    title: "Trade limit"
    body: "A cap on how many trades you take. It catches the quiet day, when nothing sets up and you trade anyway. Many scalpers also stop taking new trades after the opening window, {{market.first_minutes}} {{market.timezone}}."

  - type: checklist-reveal
    title: "Written before the open"
    items:
      - "1R in dollars for today's share size"
      - "The daily loss limit in R"
      - "The maximum number of trades"
      - "The time you stop taking new ones"
      - "What you do the moment a limit is hit"

  - type: numeric-input
    prompt: "Your 1R is $150 and your daily loss limit is 2.5R. In dollars, where does the day end?"
    answer: 375
    tolerance: 0.01
    unit: "$"
    working: "2.5 × $150 = $375"
    explanation: "The limit is a price you can name before the open, not a feeling you get during it."

  - type: mc
    prompt: "You reach your daily loss limit mid-morning. Minutes later the cleanest setup of the week appears. What does the rule say?"
    options:
      - {text: "Take it at half size, because it is your best setup"}
      - {text: "Take it, then stop for the day"}
      - {text: "You are done — the rule is why you still have an account tomorrow", correct: true}
    explanation: "A limit you override once is not a limit. The setup will come back; the discipline is harder to rebuild."

  - type: tf
    statement: "Daily loss limits are a beginner's tool that experienced scalpers grow out of."
    answer: false
    explanation: "Frequency is the reason for them: the more decisions a day holds, the more a bad state costs."

  - type: order
    prompt: "Put the session in order."
    items:
      - "Write 1R, the loss limit and the trade cap"
      - "Take the setups the plan allows"
      - "Take the third full stop of the morning"
      - "Close the platform for the day"
    explanation: "The limits are written while you are calm and obeyed while you are not."

  - type: chart-decision
    scenario: "You have taken your maximum eight trades for the day. XYZ now pulls back to the rising VWAP in a clean uptrend — your best setup. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[11.20, 11.30, 11.14, 11.28], [11.28, 11.44, 11.26, 11.40], [11.40, 11.52, 11.36, 11.48], [11.48, 11.54, 11.38, 11.42], [11.42, 11.46, 11.32, 11.36], [11.36, 11.40, 11.30, 11.38], [11.38, 11.50, 11.36, 11.48], [11.48, 11.58, 11.44, 11.56], [11.56, 11.62, 11.50, 11.58], [11.58, 11.64, 11.52, 11.56]]
      vwap: [11.18, 11.22, 11.26, 11.29, 11.31, 11.32, 11.34, 11.36, 11.39, 11.41]
      decision_index: 5
    state: ["Trades: 8 of 8", "Trade cap reached"]
    best: no-trade
    outcome: "It bounced off VWAP and reached $11.64. A 20-cent scalp from $11.38 would have made $200 on 1,000 shares — that is what the cap cost you."
    explanation: "Rules cost you good trades sometimes. That is the price of them stopping the bad ones."

  - type: fill-tiles
    sentence: "A limit you break once is no longer a ___."
    answer: "limit"
    explanation: "Its whole value is that it cannot be renegotiated in the moment."

  - type: example
    body: "Written on one line before the open: 1R $120, loss limit 3R, eight trades, nothing new after the first hour. Four numbers, and none of them gets decided while the market is open."

