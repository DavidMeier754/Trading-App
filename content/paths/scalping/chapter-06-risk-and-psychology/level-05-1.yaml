id: "5-1"
title: "Checkpoint"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: test
tags: [test, stops, r-multiple, management]
learning_goal: "Confirm the user can place a stop from the chart, size from both ceilings, read a result in R, and manage a live trade with break-even, partial, trail and time stops."
purpose: "Everything the rest of this chapter measures is measured in the unit these four levels built."
terms_introduced: []
reinforces: [3]
prerequisite: "4-2"
xp: 50
difficulty: 2
sources: ["Tharp — Trade Your Way to Financial Freedom", "Elder — Trading for a Living"]
notes: "10 scored questions. Hearts apply. Pass mark 70 %. Questions 3, 6 and 7 reach back into Chapter 3. Account named at $22,000 with a $220 budget; worked positions are 1,300 shares at $15.60, 1,000 at $19.40 and 1,200 at $16.90."
screens:
  - type: intro
    text: "Checkpoint: Levels 1 to 4. Ten questions. Your account is $22,000 and you risk $220 a trade."
    counter: 10

  - type: mc
    prompt: "You are long and the floor the idea leans on turns out to be nineteen cents below your entry. What gives?"
    options:
      - {text: "The share count, to keep the risk the same", correct: true}
      - {text: "The stop, pulled in to fifteen cents so the size can stay"}
      - {text: "Nothing — take the usual size and watch it closely"}
    explanation: "Distance belongs to the chart. The share count is the only part of the plan allowed to move."

  - type: chart-decision
    scenario: "MERL has turned at $15.46 three times in the last six minutes and the minute that just closed finished at $15.60, above the highs behind it. A stop under $15.46 is sixteen cents away."
    shares: 1300
    chart:
      kind: candles
      data: [[15.54, 15.60, 15.46, 15.50], [15.50, 15.56, 15.46, 15.54], [15.54, 15.58, 15.48, 15.50], [15.50, 15.56, 15.48, 15.54], [15.54, 15.58, 15.50, 15.56], [15.56, 15.64, 15.54, 15.60], [15.60, 15.72, 15.58, 15.70], [15.70, 15.80, 15.66, 15.78], [15.78, 15.86, 15.74, 15.82], [15.82, 15.86, 15.76, 15.80]]
      volume: [84000, 92000, 76000, 88000, 80000, 124000, 116000, 106000, 98000, 90000]
      levels:
        - {price: 15.46, label: "Floor"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached $15.86 and the exit filled at $15.82 — 22 cents a share, +$286 on 1,300 shares against $208 of risk."
    explanation: "A floor that has held three times, a close through the highs above it, and a share count that makes sixteen cents cost $208 rather than $300."

  - type: numeric-input
    prompt: "A $28 name with a ten-cent stop. How many shares does your account and your budget allow?"
    answer: 746
    tolerance: 5
    unit: "shares"
    working: "$220 ÷ $0.10 = 2,200 shares; 95 % of $22,000 is $20,900, and $20,900 ÷ $28 = 746 shares"
    explanation: "The budget would happily take 2,200. The cash can pay for 746, and the smaller ceiling is the one that counts."

  - type: tf
    statement: "A trade closed because nothing happened is a worse outcome than the same trade closed at its stop."
    answer: false
    explanation: "Getting out early costs the spread and the fees. Waiting for the stop costs a full unit, and the idea had already stopped happening."

  - type: chart-annotate
    prompt: "You are long OTIS from $13.10 and have been trailing the stop. Drag the line to where it sits now."
    chart:
      kind: candles
      data: [[13.02, 13.12, 12.98, 13.10], [13.10, 13.30, 13.08, 13.28], [13.28, 13.32, 13.24, 13.26], [13.26, 13.46, 13.24, 13.44], [13.44, 13.50, 13.40, 13.46], [13.46, 13.58, 13.44, 13.56], [13.56, 13.60, 13.50, 13.52], [13.52, 13.56, 13.44, 13.46], [13.46, 13.52, 13.42, 13.48]]
    answer: 13.38
    tolerance: 0.04
    label: "Trailed stop"
    explanation: "Two cents under the second higher low at $13.40. The first low at $13.24 stopped mattering the moment the second one formed."

  - type: order-build
    prompt: "You are long 1,300 shares of MERL from $15.60 and the floor is $15.46. Build the resting order that ends the trade."
    ticker: MERL
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [650, 1300, 2000]
      price: [15.44, 15.60, 15.76]
    answer: {side: sell, type: stop, qty: 1300, price: 15.44}
    explanation: "A sell stop for the whole position, two cents under the floor. Until it is resting at the broker it is a number you are hoping to remember."

  - type: depth-ladder
    prompt: "A stop on 1,000 shares triggers into this book. Where does the last of them fill?"
    data:
      bids: [[15.42, 300], [15.39, 500], [15.34, 1400]]
      asks: [[15.46, 700], [15.50, 900], [15.56, 1600]]
    target: bid-3
    explanation: "Three hundred at the top, five hundred more three cents down, and the last two hundred eight cents below the trigger. A stop guarantees the exit, never the price."

  - type: journal-row
    prompt: "One finished trade from this morning. Fill in what it risked and what it returned."
    trade: {setup: "Rejection at the morning high", entry: 19.40, stop: 19.60, exit: 19.00, shares: 1000}
    slots: [r_risked, r_made]
    chips:
      r_risked: ["$100", "$200", "$400"]
      r_made: ["+1R", "+2R", "+3R"]
    answer: {r_risked: "$200", r_made: "+2R"}
    explanation: "The stop sits above the entry, so this one was a short: twenty cents of risk on 1,000 shares is $200, and the forty cents it covered for is twice that."

  - type: chart-decision
    scenario: "BRAN has been stopped at $17.00 twice this morning and has just closed a minute at $16.90. The floor underneath is $16.72."
    shares: 1200
    chart:
      kind: candles
      data: [[16.84, 17.00, 16.80, 16.96], [16.96, 16.98, 16.84, 16.88], [16.88, 16.94, 16.72, 16.76], [16.76, 16.90, 16.74, 16.86], [16.86, 16.96, 16.82, 16.88], [16.88, 16.94, 16.84, 16.90], [16.90, 17.00, 16.86, 16.92], [16.92, 16.98, 16.80, 16.82], [16.82, 16.88, 16.72, 16.76], [16.76, 16.84, 16.70, 16.74]]
      volume: [126000, 98000, 110000, 92000, 88000, 96000, 104000, 100000, 94000, 86000]
      levels:
        - {price: 17.00, label: "Ceiling"}
        - {price: 16.72, label: "Floor"}
      decision_index: 5
    best: no-trade
    outcome: "It touched $17.00 once more and then slid to $16.70 — a long at $16.90 was 20 cents a share down, $240 on 1,200 shares."
    explanation: "Eighteen cents down to the floor and ten cents up to the ceiling. The chart is fine; the trade is the wrong way round before it starts."

  - type: sort
    prompt: "Four things that happen inside a live trade. Which are the plan working, and which are the plan being abandoned?"
    buckets: ["The plan working", "The plan abandoned"]
    items:
      - {text: "The stop moves up under a new higher low", bucket: "The plan working"}
      - {text: "The stop moves down because price is close to it", bucket: "The plan abandoned"}
      - {text: "Half comes off into the level that capped it earlier", bucket: "The plan working"}
      - {text: "The size is doubled because the last trade lost", bucket: "The plan abandoned"}
    explanation: "Two of them are decisions the chart asked for. The other two are decisions the last few minutes asked for."

  - type: summary
    total: 10
