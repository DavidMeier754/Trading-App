id: "10-1"
title: "Checkpoint"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: test
tags: [test, expectancy, costs, limits]
learning_goal: "Confirm the user can compute expectancy, net it for the all-in cost, judge a method from its two averages, and trade inside the three session caps."
purpose: "The rest of the chapter is about your own head, and it assumes this arithmetic no longer needs thinking about."
terms_introduced: []
reinforces: [3]
prerequisite: "9-3"
xp: 50
difficulty: 3
sources: ["Tharp — Trade Your Way to Financial Freedom", "Aziz — How to Day Trade for a Living"]
notes: "10 scored questions on Levels 6–9. Hearts apply. Pass mark 70 %. Questions 3, 6 and 10 reach back into Chapter 3. Account named at $25,000 with 1R at $250; worked positions are 1,300 shares at $17.50 and 1,350 at $16.90."
screens:
  - type: intro
    text: "Checkpoint: Levels 6 to 9. Ten questions. Your account is $25,000 and 1R is $250."
    counter: 10

  - type: mc
    prompt: "Two methods close the same share of their trades in profit. What decides which one you keep?"
    options:
      - {text: "How many trades each one produced over the month"}
      - {text: "How the two averages compare", correct: true}
      - {text: "Which of them wins more often in a row"}
    explanation: "What a winner pays against what a loser costs. The win rate is already identical, so it cannot be the thing that separates them."

  - type: numeric-input
    prompt: "Out of a hundred trades, 40 win an average of $260 and 60 lose an average of $120. What is one average trade worth?"
    answer: 32
    tolerance: 0.01
    unit: "$"
    working: "(0.4 × $260) − (0.6 × $120) = $104 − $72 = $32"
    explanation: "Wrong six times in ten and worth thirty-two dollars a trade, because a winner pays for two losers and change."

  - type: numeric-mc
    prompt: "You trade it 1,400 shares at a time, and the all-in round trip costs a cent and a half a share. What is left of that $32?"
    options:
      - {text: "$21"}
      - {text: "$32"}
      - {text: "−$11"}
      - {text: "$11", correct: true}
    working: "$0.015 × 1,400 shares = $21; $32 − $21 = $11"
    explanation: "One subtraction: gross expectancy minus one round trip. Two thirds of the method belonged to the costs."

  - type: tf
    statement: "A method whose gross edge is smaller than one round trip can be rescued by trading it more often."
    answer: false
    explanation: "Frequency multiplies whatever the average already is. Multiplying a negative number gives a bigger negative one."

  - type: chart-decision
    scenario: "TIDE has held $17.38 four times this morning and the minute that just closed finished at $17.50, through the highs behind it."
    shares: 1300
    chart:
      kind: candles
      data: [[17.44, 17.48, 17.38, 17.40], [17.40, 17.46, 17.38, 17.44], [17.44, 17.48, 17.40, 17.42], [17.42, 17.46, 17.38, 17.40], [17.40, 17.48, 17.38, 17.46], [17.46, 17.54, 17.44, 17.50], [17.50, 17.62, 17.48, 17.60], [17.60, 17.70, 17.56, 17.66], [17.66, 17.74, 17.62, 17.70], [17.70, 17.74, 17.64, 17.68]]
      volume: [68000, 74000, 62000, 70000, 66000, 106000, 98000, 88000, 80000, 72000]
      levels:
        - {price: 17.38, label: "Floor"}
      decision_index: 5
    state: ["Trades: 6 of 6", "Day: +2R"]
    best: no-trade
    outcome: "It carried to $17.74. Twenty cents on 1,300 shares is $260 the cap cost you, and the same cap is why the day is still +2R."
    explanation: "Nothing is wrong with the chart. The sixth trade was the last one the page allowed, and a cap that only holds on bad charts was never a cap."

  - type: numeric-input
    prompt: "Chapter 3's all-in check: a two-cent spread, a cent of slippage getting in, and fees of six tenths of a cent over the round trip. What does one share cost you?"
    answer: 0.036
    tolerance: 0.001
    unit: "$"
    working: "$0.02 + $0.01 + $0.006 = $0.036"
    explanation: "Nearly four cents before the stock has moved, and it comes off the winners and onto the losers alike."

  - type: sort
    prompt: "Four changes to the same trading week. What does each do to the average trade?"
    buckets: ["Raises it", "Lowers it"]
    items:
      - {text: "Waiting for levels with twice the room above them", bucket: "Raises it"}
      - {text: "Filling the quiet hour with two extra trades", bucket: "Lowers it"}
      - {text: "Deleting the setup with a negative record", bucket: "Raises it"}
      - {text: "Letting the average loss drift to 1.4R", bucket: "Lowers it"}
    explanation: "Two of them change what the trades are worth. The other two change how many of the cheap ones get taken."

  - type: chart-decision
    scenario: "FERN has been refused at $17.04 three times and the minute that just closed is the lowest of the morning at $16.90. A stop above the ceiling is fourteen cents away."
    shares: 1350
    chart:
      kind: candles
      data: [[17.02, 17.04, 16.92, 16.94], [16.94, 17.00, 16.90, 16.98], [16.98, 17.04, 16.92, 16.94], [16.94, 16.98, 16.88, 16.92], [16.92, 16.98, 16.88, 16.96], [16.96, 16.98, 16.86, 16.90], [16.90, 16.92, 16.78, 16.80], [16.80, 16.84, 16.70, 16.72], [16.72, 16.76, 16.60, 16.64], [16.64, 16.70, 16.56, 16.58]]
      volume: [98000, 88000, 80000, 86000, 82000, 138000, 126000, 112000, 100000, 90000]
      levels:
        - {price: 17.04, label: "Ceiling"}
      decision_index: 5
    state: ["Day: −2R", "Limit: 3R", "Trades: 3 of 6"]
    best: short
    reasonable: [no-trade]
    outcome: "It worked down to $16.56 and the cover filled at $16.60 — 30 cents a share, +$405 on 1,350 shares against $189 of risk."
    explanation: "Two units down is not the limit, and the caps leave room for exactly this. Fourteen cents of risk against a ceiling that has refused it three times."

  - type: spot-mistake
    prompt: "Tap the part a trader would have to unlearn."
    segments:
      - {text: "A daily loss limit"}
      - {text: "is worth suspending on a strong day", wrong: true}
      - {text: "because there is more room to give back."}
    explanation: "The morning's profit is not a second account. A limit suspended once has taught you that it can be, and the next morning will ask."

  - type: match
    prompt: "Four things a record measures. Which description belongs to which?"
    pairs:
      - ["Average win", "Everything won, divided by the number of winners"]
      - ["Expectancy", "What one average trade is worth after costs"]
      - ["All-in cost", "Spread, slippage and fees on one round trip"]
      - ["Trade cap", "How many decisions the day is allowed"]
    explanation: "Three of them come off the statement and one is written before the open, and the method needs all four."

  - type: summary
    total: 10
