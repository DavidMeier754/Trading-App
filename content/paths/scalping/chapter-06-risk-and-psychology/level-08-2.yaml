id: "8-2"
title: "Expectancy Practice"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: repetition
tags: [drill, expectancy, costs, charts]
learning_goal: "User runs expectancy on five records at speed, nets each one for costs, and says which methods to keep and which to delete."
purpose: "Deleting a method is a decision most traders never make, and it is the cheapest improvement available to them."
terms_introduced: []
reinforces: [3]
prerequisite: "8-1"
xp: 25
difficulty: 3
sources: ["Tharp — Trade Your Way to Financial Freedom", "Bellafiore — One Good Trade"]
notes: "Drill sub-level. Account named at $23,000; worked positions are 1,200 shares at $17.60 and 1,250 at $17.20. All-in cost $0.02 a share round trip."
screens:
  - type: intro
    text: "Five records, a hundred trades each. Two of them should be deleted this week."

  - type: story
    character: retail-trader
    text: "Same trader, five setups, one spreadsheet. Nothing here needs a chart — just the three numbers each of them produced."

  - type: numeric-mc
    prompt: "Record 1: 58 trades win an average of $85, 42 lose an average of $115. One average trade?"
    options:
      - {text: "+$49.30"}
      - {text: "−$1.00"}
      - {text: "+$5.80"}
      - {text: "+$1.00", correct: true}
    working: "(0.58 × $85) − (0.42 × $115) = $49.30 − $48.30 = $1.00"
    explanation: "A dollar a trade, from a setup that wins nearly six times in ten. The round trip costs more than that."

  - type: numeric-input
    prompt: "Record 5: 35 trades win an average of $300, 65 lose an average of $110. One average trade?"
    answer: 33.5
    tolerance: 0.05
    unit: "$"
    working: "(0.35 × $300) − (0.65 × $110) = $105 − $71.50 = $33.50"
    explanation: "Wrong two times in three and the best number on the page, because a winner is nearly three losers."

  - type: sort
    prompt: "Four of the five records. Which stay on the list?"
    buckets: ["Keep", "Delete"]
    items:
      - {text: "58 % win, $85 average win, $115 average loss", bucket: "Delete"}
      - {text: "44 % win, $220 average win, $120 average loss", bucket: "Keep"}
      - {text: "72 % win, $60 average win, $190 average loss", bucket: "Delete"}
      - {text: "50 % win, $150 average win, $90 average loss", bucket: "Keep"}
    explanation: "They come out at $1.00, $29.60, −$10.00 and $30.00. The two highest win rates are the two being deleted."

  - type: numeric-mc
    prompt: "That 50 % record is worth $30 a trade gross, taken 1,200 shares at a time. At two cents a share round trip, what is left?"
    options:
      - {text: "$6", correct: true}
      - {text: "$30"}
      - {text: "$24"}
      - {text: "−$6"}
    working: "$0.02 × 1,200 shares = $24; $30 − $24 = $6"
    explanation: "The best-looking record on the page survives its costs by six dollars, which is an argument for fewer shares or more room."

  - type: chart-decision
    scenario: "QUAY has turned at $17.46 four times since the bell and the minute that just closed finished at $17.60, above every high behind it. The stop goes under the floor, fourteen cents away. Your account is $23,000."
    shares: 1200
    chart:
      kind: candles
      data: [[17.54, 17.58, 17.46, 17.48], [17.48, 17.56, 17.46, 17.54], [17.54, 17.58, 17.50, 17.52], [17.52, 17.56, 17.46, 17.50], [17.50, 17.56, 17.48, 17.54], [17.54, 17.64, 17.52, 17.60], [17.60, 17.72, 17.58, 17.70], [17.70, 17.82, 17.66, 17.78], [17.78, 17.96, 17.74, 17.92], [17.92, 17.98, 17.86, 17.90]]
      volume: [92000, 100000, 84000, 90000, 86000, 144000, 130000, 118000, 108000, 94000]
      levels:
        - {price: 17.46, label: "Floor"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached $17.98 and the exit filled at $17.90 — 30 cents a share, $360 on 1,200 shares against $168 of risk."
    explanation: "Two units and change from one trade. Records like the fourth one on this page are built out of these, not out of frequency."

  - type: journal-row
    prompt: "That QUAY trade, finished. Fill in what it risked and what it returned."
    trade: {setup: "Reclaim of the morning floor", entry: 17.60, stop: 17.46, exit: 17.90, shares: 1200}
    slots: [r_risked, r_made]
    chips:
      r_risked: ["$120", "$168", "$240"]
      r_made: ["+1R", "+2R", "+3R"]
    answer: {r_risked: "$168", r_made: "+2R"}
    explanation: "Fourteen cents on 1,200 shares is $168, and the thirty cents it ran is a little over twice that."

  - type: tf
    statement: "A method worth a dollar a trade is worth trading if you take enough trades."
    answer: false
    explanation: "A dollar is inside the cost of the round trip, so more of them is a bigger bill, not a bigger number."

  - type: compare
    prompt: "Two mornings, same costs. Which one has enough move in it to be worth a round trip?"
    charts:
      - kind: candles
        data: [[18.10, 18.14, 18.06, 18.08], [18.08, 18.14, 18.06, 18.12], [18.12, 18.14, 18.08, 18.10], [18.10, 18.14, 18.06, 18.08], [18.08, 18.13, 18.06, 18.11], [18.11, 18.14, 18.07, 18.09], [18.09, 18.14, 18.06, 18.12], [18.12, 18.14, 18.08, 18.10]]
        label: "A"
      - kind: candles
        data: [[14.60, 14.66, 14.52, 14.54], [14.54, 14.58, 14.44, 14.46], [14.46, 14.52, 14.38, 14.40], [14.40, 14.44, 14.28, 14.30], [14.30, 14.36, 14.22, 14.24], [14.24, 14.28, 14.14, 14.16], [14.16, 14.20, 14.06, 14.08], [14.08, 14.12, 13.98, 14.00]]
        label: "B"
    answer: "B"
    explanation: "A is eight cents wide and has crossed it seven times. B has travelled sixty-five cents in the same eight minutes, and the bill for trading either of them is identical."

  - type: numeric-input
    prompt: "1R is $180. Your week: +2R, −1R, +3R, −1R, −1R, +1R. What is that in dollars, before costs?"
    answer: 540
    tolerance: 0.01
    unit: "$"
    working: "+2 − 1 + 3 − 1 − 1 + 1 = 3R; 3 × $180 = $540"
    explanation: "Three units from six trades, and one of them did most of the work."

  - type: chart-decision
    scenario: "NEAP has printed between 5,000 and 9,000 shares a minute all morning and is quoted $17.14 by $17.24. You would take 1,250 shares."
    shares: 1250
    chart:
      kind: candles
      data: [[17.18, 17.26, 17.14, 17.22], [17.22, 17.28, 17.16, 17.18], [17.18, 17.24, 17.12, 17.20], [17.20, 17.26, 17.16, 17.18], [17.18, 17.24, 17.14, 17.22], [17.22, 17.26, 17.14, 17.20], [17.20, 17.28, 17.12, 17.16], [17.16, 17.24, 17.10, 17.22], [17.22, 17.26, 17.14, 17.18], [17.18, 17.24, 17.12, 17.20]]
      volume: [7000, 5000, 9000, 6000, 8000, 5000, 7000, 6000, 9000, 8000]
      decision_index: 5
    best: no-trade
    outcome: "Ten more minutes inside the same fourteen cents. Getting 1,250 shares in and out of that quote costs $125 in spread before the stock does anything."
    explanation: "A ten-cent spread on 1,250 shares is $125, and nothing on this chart has moved that far. The record this would join is the one being deleted."

  - type: spot-mistake
    prompt: "Read it through, then tap the part that is wrong."
    segments:
      - {text: "My last six trades all won,"}
      - {text: "so the setup is working again,", wrong: true}
      - {text: "whatever the hundred before them say."}
    explanation: "Six is a mood. A hundred is a record, and it is the one the next hundred will resemble."

  - type: slider
    prompt: "Record 3 loses $10 an average trade. Over 500 trades, what share of a $23,000 account is that?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 20
    tolerance: 10
    explanation: "500 × $10 = $5,000, which is about a fifth of the account, handed over one small loss at a time."

  - type: example
    body: "Two of the five are gone. Nothing was learned, no chart was read better, and the average trade in the book just went up."
