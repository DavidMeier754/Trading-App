id: "8-1"
title: "Expectancy Practice"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: repetition
tags: [expectancy, practice, costs]
learning_goal: "User applies expectancy, R and cost awareness to realistic scalping numbers and to two live decisions."
purpose: "The number only helps if you can run it on your own trades in your head."
terms_introduced: []
reinforces: [3]
prerequisite: "7-3"
xp: 20
difficulty: 2
sources: ["Tharp — Trade Your Way to Financial Freedom", "Elder — Trading for a Living"]
screens:
  - type: intro
    text: "Five sets of numbers. Which method pays?"

  - type: story
    character: retail-trader
    text: "Two weeks of records: 100 trades, 1,000 shares each, all on the 1-minute chart."

  - type: numeric-mc
    prompt: "Of those 100 trades, 55 won an average of $70 and 45 lost an average of $80. What is the expectancy per trade?"
    options:
      - {text: "−$10.00"}
      - {text: "+$38.50"}
      - {text: "+$2.50", correct: true}
      - {text: "−$2.50"}
    working: "(0.55 × $70) − (0.45 × $80) = $38.50 − $36.00 = $2.50"
    explanation: "Two and a half dollars an average trade — real, but thin enough that costs decide it."

  - type: mc
    prompt: "Which change raises that $2.50 per trade the most?"
    options:
      - {text: "Taking only setups with a target twice the stop", correct: true}
      - {text: "Taking three more trades a day"}
      - {text: "Moving the stop wider so fewer trades stop out"}
    explanation: "More trades multiply whatever expectancy already is; a wider stop raises the average loss. Better reward against risk changes the number itself."

  - type: sort
    prompt: "What does each one do to expectancy?"
    buckets: ["Raises it", "Lowers it"]
    items:
      - {text: "Trading a stock with a 1-cent spread instead of a 6-cent one", bucket: "Raises it"}
      - {text: "Adding trades outside the plan because the morning is quiet", bucket: "Lowers it"}
      - {text: "Moving the stop away as price approaches it", bucket: "Lowers it"}
      - {text: "Dropping the setup you have never made money on", bucket: "Raises it"}
    explanation: "Costs and unplanned trades come straight out of the average; better selection puts it back."

  - type: numeric-input
    prompt: "1R is $120. Your morning: +2R, −1R, +1R, −1R, −1R. What is that in dollars, before costs?"
    answer: 0
    tolerance: 0.01
    unit: "$"
    working: "+2 − 1 + 1 − 1 − 1 = 0R; 0 × $120 = $0"
    explanation: "Flat in R — and after five round trips of spread and fees, slightly down. Activity is not progress."

  - type: chart-decision
    scenario: "XYZ has run 40 cents in four minutes and sits 30 cents above the nearest level you could hide a stop under. Your usual target is 15 cents. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[10.10, 10.18, 10.08, 10.16], [10.16, 10.28, 10.14, 10.26], [10.26, 10.40, 10.24, 10.38], [10.38, 10.48, 10.36, 10.46], [10.46, 10.54, 10.44, 10.50], [10.50, 10.56, 10.46, 10.52], [10.52, 10.54, 10.40, 10.42], [10.42, 10.46, 10.30, 10.32], [10.32, 10.38, 10.26, 10.36], [10.36, 10.40, 10.28, 10.30]]
      decision_index: 5
    best: no-trade
    outcome: "It faded to $10.26 and sat at $10.30. A long at $10.52 was $220 down on 1,000 shares, with the stop 8 cents lower still."
    explanation: "Thirty cents of risk for a fifteen-cent target is negative expectancy before the first candle prints."

  - type: tf
    statement: "Doubling the number of trades you take each day doubles your expectancy per trade."
    answer: false
    explanation: "It multiplies the total, not the per-trade number — and if expectancy is negative it doubles the damage."

  - type: fill-choice
    sentence: "Expectancy has to be measured ___ costs."
    options: ["after", "before", "without"]
    answer: "after"
    explanation: "The spread and fees are part of every trade, so they belong inside the average, not beside it."

  - type: numeric-mc
    prompt: "1R is $150. A day of twenty trades ends at −3R. How much is that?"
    options:
      - {text: "−$300"}
      - {text: "−$3,000"}
      - {text: "−$150"}
      - {text: "−$450", correct: true}
    working: "3 × $150 = $450"
    explanation: "Twenty decisions, and three units of risk is the whole story of the day."

  - type: spot-mistake
    prompt: "One of these does not follow. Tap it."
    segments:
      - {text: "My win rate is 70 %,"}
      - {text: "so the method must be profitable,", wrong: true}
      - {text: "whatever the losers cost."}
    explanation: "Seven $20 winners against three $60 losers is −$40. The win rate never answers it alone."

  - type: chart-decision
    scenario: "XYZ has made lower highs all morning and just failed again at $11.20, a level that rejected it twice. Entry $11.10, stop $11.24, first support $10.80. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[11.40, 11.44, 11.28, 11.30], [11.30, 11.36, 11.18, 11.20], [11.20, 11.26, 11.10, 11.14], [11.14, 11.22, 11.08, 11.18], [11.18, 11.20, 11.10, 11.12], [11.12, 11.18, 11.06, 11.08], [11.08, 11.10, 10.96, 10.98], [10.98, 11.02, 10.88, 10.90], [10.90, 10.94, 10.78, 10.82], [10.82, 10.86, 10.76, 10.84]]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It slid to $10.76. Covered at $10.80: $0.30 per share, +$300 on 1,000 shares against $140 of risk."
    explanation: "A level that has turned price twice, a 14-cent stop and a 30-cent target — that is what positive expectancy looks like on a chart."

  - type: theory
    title: "Numbers, not feelings"
    body: "Every rule that follows — the daily limits, the reset, the sizing — exists to protect the number you just practiced."
