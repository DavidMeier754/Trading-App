id: "6-1"
title: "Win Rate and Expectancy"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [expectancy, win-rate, costs]
learning_goal: "User computes expectancy from win rate, average win and average loss, and subtracts costs before judging a method."
purpose: "A scalper takes hundreds of trades a month; whatever one average trade is worth gets multiplied by all of them."
terms_introduced: ["Win rate", "Average win", "Average loss", "Expectancy", "Edge"]
reinforces: [3]
prerequisite: "2-1"
xp: 20
difficulty: 2
sources: ["Tharp — Trade Your Way to Financial Freedom", "Aziz — How to Day Trade for a Living"]
screens:
  - type: intro
    text: "Six winners out of ten, and the account still shrinks. Here is how that happens."

  - type: theory
    title: "Win rate"
    body: "The share of your trades that end in profit. Sixty out of a hundred is a 60 % win rate. On its own it tells you almost nothing about whether the method pays."

  - type: theory
    title: "Average win, average loss"
    body: "Add up the winners and divide by how many there were. Do the same for the losers. Two numbers, in dollars or in R."

  - type: theory
    title: "Expectancy"
    body: "What one average trade is worth: (win rate × average win) − (loss rate × average loss). Positive means the series pays. A positive expectancy is what traders mean by an edge."

  - type: example
    body: "Sixty winners of $30 and forty losers of $60 on 1,000-share scalps: (0.6 × $30) − (0.4 × $60) = $18 − $24 = −$6 per trade. At 20 trades a day, that is −$120 a day."
    visual: bar-chart
    visual_data:
      bars: [{label: "0.6 × $30", value: 18}, {label: "0.4 × $60", value: -24}]
      unit: "$"

  - type: numeric-input
    prompt: "Fifty of a hundred trades win. The average win is $40 and the average loss is $20. What is the expectancy per trade?"
    answer: 10
    tolerance: 0.01
    unit: "$"
    working: "(0.5 × $40) − (0.5 × $20) = $20 − $10 = $10"
    explanation: "Half the trades win, but the winners are twice the losers, so the average trade is worth $10."

  - type: mc
    prompt: "Which number tells you least on its own about whether a method pays?"
    options:
      - {text: "The expectancy"}
      - {text: "The average win compared with the average loss"}
      - {text: "The win rate", correct: true}
    explanation: "A 90 % win rate with one huge loser is negative; a 40 % win rate with big winners is positive."

  - type: theory
    title: "Costs live inside it"
    body: "The spread, slippage and fees come out of every single trade. They make your average win smaller and your average loss bigger, so expectancy has to be measured after them."

  - type: numeric-mc
    prompt: "You scalp 1,000 shares with a $0.12 target and a $0.10 stop. Round-trip costs are $0.02 per share. What is the average loss after costs?"
    options:
      - {text: "$120", correct: true}
      - {text: "$100"}
      - {text: "$80"}
      - {text: "$20"}
    working: "($0.10 stop + $0.02 costs) × 1,000 shares = $120"
    explanation: "Costs are paid on losers too, so they land on both sides of the calculation."

  - type: numeric-input
    prompt: "Same trade: 60 % win rate, net win $100, net loss $120. What is the expectancy per trade?"
    answer: 12
    tolerance: 0.01
    unit: "$"
    working: "(0.6 × $100) − (0.4 × $120) = $60 − $48 = $12"
    explanation: "Twelve dollars an average trade, and it only exists because the win rate is well above half."

  - type: slider
    prompt: "That winner was worth $0.12 × 1,000 shares = $120 gross. What share of it do the $20 of costs take?"
    min: 0
    max: 50
    step: 5
    unit: "%"
    answer: 15
    tolerance: 10
    explanation: "$20 of $120 is a sixth of it. At scalping size and frequency, costs are a permanent slice of every result."

  - type: tf
    statement: "A method that wins only 40 % of the time can still have positive expectancy."
    answer: true
    explanation: "If the winners are big enough relative to the losers, yes: 0.4 × 3R beats 0.6 × 1R."

  - type: chart-decision
    scenario: "XYZ breaks the morning low at $26.48 on the heaviest volume of the day and stays under it. Entry $26.44, stop $26.52 above the breakdown candle, next level $26.20. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[26.68, 26.70, 26.60, 26.62], [26.62, 26.64, 26.54, 26.56], [26.56, 26.58, 26.48, 26.50], [26.50, 26.54, 26.48, 26.49], [26.49, 26.50, 26.40, 26.42], [26.42, 26.46, 26.38, 26.44], [26.44, 26.46, 26.32, 26.34], [26.34, 26.36, 26.26, 26.28], [26.28, 26.30, 26.18, 26.20], [26.20, 26.26, 26.16, 26.22]]
      volume: [40000, 52000, 78000, 45000, 96000, 88000, 104000, 92000, 110000, 74000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell to $26.16. Covered at $26.20: $0.24 per share, +$240 on 1,000 shares against $80 of risk."
    explanation: "Eight cents risked for twenty-four keeps expectancy positive even when you are right less than half the time."

  - type: theory
    title: "Expectancy is the score"
    body: "Not today's dollars, not the last trade. Your edge multiplied by a lot of trades is the number that decides how this goes."
