id: "7-2"
title: "The Journal"
chapter: 6
chapter_title: "Risk & Psychology for Scalpers"
path: scalping
category: new-theory
tags: [journal, review, routine]
learning_goal: "User runs a weekly review that finds the best setup, the best hour and the habit that costs most, and turns it into one rule."
purpose: "The rows are only worth writing if something changes because of them."
terms_introduced: ["Weekly review"]
prerequisite: "7-1"
xp: 20
difficulty: 3
sources: ["Bellafiore — One Good Trade", "Aziz — How to Day Trade for a Living"]
screens:
  - type: intro
    text: "On Friday the rows become a verdict."

  - type: theory
    title: "The weekly review"
    body: "Once a week you sort your rows and answer three questions: which setup paid, which hour paid, and which habit cost the most."

  - type: theory
    title: "Sort by setup"
    body: "Group every trade by setup name and total the R. One setup usually carries the week. One usually bleeds it quietly, ten cents at a time."

  - type: visual
    component: bar-chart
    data:
      bars: [{label: "Pullback to VWAP", value: 6.5}, {label: "Range trades", value: -3.0}, {label: "Opening drive", value: 2.0}, {label: "Chases", value: -7.5}]
      unit: "R"
    caption: "One trader's week in R, grouped by setup."

  - type: mc
    prompt: "Looking at that week, which change would have had the biggest effect?"
    options:
      - {text: "Doubling the size on the VWAP pullbacks"}
      - {text: "Not taking the chases at all", correct: true}
      - {text: "Adding a fifth setup to the plan"}
    explanation: "Deleting the worst column is worth 7.5R and needs no new skill. Doubling the size on the winner adds 6.5R and doubles what its losers cost."

  - type: theory
    title: "Sort by hour"
    body: "Group the same rows by time of day. Most scalpers make their R in the opening window, {{market.first_minutes}} {{market.timezone}}, and give some of it back when volume thins out."

  - type: tf
    statement: "If nearly all your R comes from the opening window, trading the quiet hours the same way is free practice."
    answer: false
    explanation: "Same fees, thinner volume, wider spreads — it is paid practice, and the record usually shows exactly what it costs."

  - type: numeric-input
    prompt: "The four setups above came to +6.5R, −3R, +2R and −7.5R. What is the week in R?"
    answer: -2
    tolerance: 0.01
    working: "6.5 − 3 + 2 − 7.5 = −2"
    explanation: "A losing week built entirely out of one column that was never in the plan."

  - type: slider
    prompt: "Of that trader's winning R (+8.5R in total), what share came from the pullback to VWAP?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 75
    tolerance: 10
    explanation: "6.5R of 8.5R. One setup carries the week — which is the argument for doing more of it and less of everything else."

  - type: chart-decision
    scenario: "Midday. Volume is a third of the opening window's and the spread on XYZ has widened to 6 cents. A small pullback sets up; your target is 12 cents. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[18.40, 18.44, 18.36, 18.38], [18.38, 18.42, 18.34, 18.40], [18.40, 18.44, 18.36, 18.38], [18.38, 18.40, 18.32, 18.34], [18.34, 18.40, 18.32, 18.38], [18.38, 18.42, 18.34, 18.36], [18.36, 18.42, 18.34, 18.40], [18.40, 18.44, 18.36, 18.38], [18.38, 18.40, 18.32, 18.36], [18.36, 18.42, 18.34, 18.38]]
      decision_index: 5
    best: no-trade
    outcome: "It drifted four cents your way and back. Crossing a 6-cent spread on 1,000 shares costs $60 of a $120 target."
    explanation: "Half the target paid away before the move starts. The hour is in your record for a reason."

  - type: order
    prompt: "Put the weekly review in order."
    items:
      - "Sort the rows by setup"
      - "Total the R for each one"
      - "Find the habit that cost the most"
      - "Write one rule for next week"
    explanation: "Data first, then the single change. A review that ends without a rule changes nothing."

  - type: fill-tiles
    sentence: "The cheapest improvement is usually removing your worst ___."
    answer: "setup"
    explanation: "Subtracting a losing column beats adding a new one."

  - type: theory
    title: "One rule a week"
    body: "Not five. One rule, written from your own rows, applied for a week and then reviewed again. That is how the record becomes a method."
