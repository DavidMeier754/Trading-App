id: "3-2"
title: "Managing the Trade"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [risk, management, partials, targets]
learning_goal: "User prices what a partial exit gives up and takes it at a level rather than at a feeling."
purpose: "Taking half off is the most common management decision in scalping and the one most often made for the wrong reason."
terms_introduced: []
reinforces: [3]
prerequisite: "3-1"
xp: 20
difficulty: 3
sources: ["Bellafiore — One Good Trade", "Aziz — How to Day Trade for a Living"]
notes: "Account named at $18,000 with 1R at $180; worked positions are 1,200 shares at $14.90 and 1,000 at $17.60."
screens:
  - type: intro
    text: "Half off, and the rest is playing with house money. That sentence is doing a lot of hiding."

  - type: theory
    title: "What a partial buys and what it sells"
    body: "Closing part of the position early makes the good trades smaller and the ones that turn round cheaper. You are buying a steadier result with a slice of your best days."

  - type: example
    body: "1,200 shares, fifteen-cent stop, 1R of $180. Half off at +1R banks $90 and the rest runs to +2R for $180 — $270, on a trade that would have paid $360 held whole."

  - type: numeric-mc
    prompt: "Same trade. What did splitting it cost, against holding all 1,200 to the same exit?"
    options:
      - {text: "$180"}
      - {text: "$270"}
      - {text: "$90", correct: true}
      - {text: "Nothing"}
    working: "$360 held whole − $270 split = $90"
    explanation: "Ninety dollars, paid for a trade that could not turn red once the first half was off."

  - type: theory
    title: "Where the partial belongs"
    body: "At the first price sellers have already defended today, or where the bars go small and the move stops travelling. Both are things the chart did. Neither is a number of cents you chose in advance."

  - type: chart-annotate
    prompt: "PEAT, and you are long from $14.90. Drag the line to where the first half should come off."
    chart:
      kind: candles
      data: [[15.14, 15.20, 15.06, 15.10], [15.10, 15.16, 14.96, 15.00], [15.00, 15.06, 14.78, 14.82], [14.82, 14.94, 14.78, 14.90], [14.90, 14.94, 14.80, 14.86], [14.86, 14.96, 14.84, 14.94], [14.94, 15.04, 14.92, 15.02], [15.02, 15.14, 15.00, 15.12], [15.12, 15.20, 15.08, 15.16]]
    answer: 15.20
    tolerance: 0.04
    label: "First target"
    explanation: "The high that already turned it back this morning. Sellers are on record at that price; that is where half of a long is worth banking."

  - type: sort
    prompt: "Four moments in a live trade. Which of them are reasons to take half off?"
    buckets: ["A reason to take a partial", "Not a reason"]
    items:
      - {text: "Price is into the level that turned it back earlier", bucket: "A reason to take a partial"}
      - {text: "The move has stalled and the bars have gone small", bucket: "A reason to take a partial"}
      - {text: "It is green and you would like it to stay that way", bucket: "Not a reason"}
      - {text: "You are behind for the week and want something on the board", bucket: "Not a reason"}
    explanation: "Two of them are things the chart did. The other two will ask for the partial at a different price every single day."

  - type: tf
    statement: "Taking partials makes your good trades smaller."
    answer: true
    explanation: "That is the price of it, and it is not hidden. What you buy is fewer good trades handed back."

  - type: numeric-input
    prompt: "Short 1,000 shares of GLIM at $17.60 with the stop at $17.78. You cover 500 at $17.42 and 500 at $17.24. What is the trade worth before costs?"
    answer: 270
    tolerance: 0.01
    unit: "$"
    working: "500 × $0.18 = $90; 500 × $0.36 = $180"
    explanation: "One and a half units in total, from a move that was worth two if you had held the lot."

  - type: chart-decision
    scenario: "GLIM held $17.62 all morning and the minute that just closed finished under it at $17.60 on the heaviest bar of the session. Your account is $18,000, 1R is $180, and a stop at $17.78 is eighteen cents away."
    shares: 1000
    chart:
      kind: candles
      data: [[17.76, 17.80, 17.68, 17.72], [17.72, 17.78, 17.66, 17.68], [17.68, 17.74, 17.62, 17.66], [17.66, 17.72, 17.62, 17.70], [17.70, 17.74, 17.64, 17.66], [17.66, 17.68, 17.58, 17.60], [17.60, 17.62, 17.46, 17.48], [17.48, 17.52, 17.36, 17.38], [17.38, 17.44, 17.28, 17.32], [17.32, 17.38, 17.26, 17.30]]
      volume: [86000, 78000, 104000, 92000, 96000, 138000, 124000, 112000, 98000, 88000]
      levels:
        - {price: 17.62, label: "Floor"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It worked down to $17.26. Half covered at $17.42 and the rest at $17.30 — eighteen and thirty cents a share, +$240 on 1,000 shares."
    explanation: "A floor that held all morning gave way on the heaviest minute of it, and the first half came off into the next level rather than at a chosen number of cents."

  - type: mc
    prompt: "Half comes off at the first target and the rest runs to twice the stop distance. What did the partial actually do?"
    options:
      - {text: "Made the win smaller and the give-back smaller", correct: true}
      - {text: "Made the win bigger, because the first half was banked"}
      - {text: "Took the risk out of the second half"}
    explanation: "It swaps some upside for a steadier result. Nothing about the second half became safer; only the amount riding on it changed."

  - type: spot-mistake
    prompt: "Tap the part a trader would have to unlearn."
    segments:
      - {text: "The trade is green and I am nervous,"}
      - {text: "so I take half off here", wrong: true}
      - {text: "twelve cents short of the level."}
    explanation: "The partial belongs where the sellers are, not where your nerves are. Twelve cents early is a decision the chart never asked for."

  - type: fill-tiles
    sentence: "A partial trades a bigger payday for a steadier ___."
    answer: "result"
    explanation: "Fewer big days, fewer days handed back. Whether that is worth it is something your own record answers later."

  - type: example
    body: "Half off at the level, half left for the target. Over a hundred scalps you will book fewer large winners and give back fewer good trades, and that is the entire argument."
