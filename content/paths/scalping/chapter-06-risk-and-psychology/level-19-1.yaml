id: "19-1"
title: "Final Exam"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: final-exam
tags: [final-exam]
learning_goal: "Confirm mastery of the stop before the entry, R, expectancy after costs, the session limits, tilt and the reset, the journal, the weekly review and sizing in a drawdown."
purpose: "The playbook chapter assumes every rule in these fourteen questions is already automatic."
terms_introduced: []
reinforces: [3, 4, 5]
prerequisite: "18-2"
xp: 80
difficulty: 3
sources: ["Elder — Trading for a Living", "Douglas — Trading in the Zone", "Tharp — Trade Your Way to Financial Freedom"]
notes: "14 scored questions on Levels 1–18. Hearts apply. Pass mark 70 %. Questions 5, 6, 7, 10 and 11 reach back into Chapters 3, 4 and 5. Account named at $14,000; worked positions are 1,000 shares at $12.60 and $12.72, and 900 at $15.26."
screens:
  - type: intro
    text: "Final exam: Risk & Psychology for Scalpers. Fourteen questions. Your account is $14,000."
    counter: 14

  - type: mc
    prompt: "You have the setup and the price you would pay. What is the next thing you decide?"
    options:
      - {text: "The share count, and the stop from whatever risk is left"}
      - {text: "The target, so you know what the trade is worth"}
      - {text: "The price that says the idea failed, read off the chart", correct: true}
    explanation: "The stop is a level, not a budget. The share count is what comes out of it afterwards."

  - type: numeric-input
    prompt: "You short 1,000 shares at $12.60 with the stop at $12.71. What is 1R?"
    answer: 110
    tolerance: 0.01
    unit: "$"
    working: "$0.11 per share × 1,000 shares = $110"
    explanation: "Eleven cents of stop distance across a thousand shares is everything the trade can cost."

  - type: numeric-mc
    prompt: "That short covers at $12.38. What does the R column say?"
    options:
      - {text: "+1R"}
      - {text: "+2.2R"}
      - {text: "+0.5R"}
      - {text: "+2R", correct: true}
    working: "Gain $0.22 ÷ risk $0.11 = 2"
    explanation: "Twenty-two cents made against eleven risked. The share count never enters that column."

  - type: tf
    statement: "Two traders who are right the same share of the time can have opposite expectancies."
    answer: true
    explanation: "What a winner pays against what a loser costs decides it. Being right often is not the same as being paid well."

  - type: numeric-mc
    prompt: "A hundred trades: 45 win an average of $190, 55 lose an average of $120. The all-in round trip is 1.4 cents a share on 1,000 shares. What is one average trade worth after costs?"
    options:
      - {text: "$19.50"}
      - {text: "−$14"}
      - {text: "$5.50", correct: true}
      - {text: "$33.50"}
    working: "(0.45 × $190) − (0.55 × $120) = $19.50; $0.014 × 1,000 = $14; $19.50 − $14 = $5.50"
    explanation: "Nearly three quarters of the edge goes to the spread, the slippage and the fees before you keep anything."

  - type: chart-decision
    scenario: "You are forty minutes past the cut-off you wrote for new trades. HOLM has come back above the session's average price and held there for two minutes. 900 shares."
    shares: 900
    chart:
      kind: candles
      data: [[15.24, 15.28, 15.14, 15.16], [15.16, 15.22, 15.10, 15.12], [15.12, 15.20, 15.08, 15.18], [15.18, 15.24, 15.14, 15.22], [15.22, 15.26, 15.16, 15.22], [15.22, 15.28, 15.18, 15.26], [15.26, 15.36, 15.24, 15.34], [15.34, 15.44, 15.30, 15.40], [15.40, 15.50, 15.36, 15.48], [15.48, 15.52, 15.44, 15.50]]
      vwap: [15.22, 15.21, 15.20, 15.20, 15.20, 15.21, 15.22, 15.24, 15.26, 15.28]
      volume: [86000, 78000, 72000, 80000, 74000, 112000, 124000, 108000, 96000, 88000]
      decision_index: 5
    state: ["Day: +1R", "New trades: closed"]
    best: no-trade
    outcome: "It carried to $15.52. Twenty-six cents on 900 shares is $234 the cut-off cost you, and the same cut-off is why the morning's +1R is still there at the close."
    explanation: "A clean reclaim and the answer is still no. The third cap is the clock, and it does not wait for a bad chart to be obeyed."

  - type: scanner-pick
    prompt: "Tomorrow's pre-market. Which name earns a place on the page?"
    data:
      rows:
        - {ticker: FENN, price: 17.90, change_pct: 9.1, rvol: 5.4, float: "16M", spread: 0.02, catalyst: "Earnings"}
        - {ticker: BRIL, price: 21.40, change_pct: 0.6, rvol: 1.0, float: "420M", spread: 0.02, catalyst: "—"}
        - {ticker: CAST, price: 19.80, change_pct: 7.2, rvol: 3.1, float: "7M", spread: 0.14, catalyst: "News"}
        - {ticker: DORN, price: 10.40, change_pct: 1.8, rvol: 0.8, float: "95M", spread: 0.05, catalyst: "—"}
    target: FENN
    explanation: "CAST is busy and charges fourteen cents at the door. BRIL and DORN are having ordinary days with a percentage printed beside them."

  - type: mc
    prompt: "Two stops in ten minutes and your hand is already back on the keyboard. What does your written routine do first?"
    options:
      - {text: "Half size on the next setup, to see how it behaves"}
      - {text: "The platform closes for ten minutes", correct: true}
      - {text: "One more trade, to get the morning back to flat"}
    explanation: "Distance first, then the writing, then the plan — and only then a smaller position. Judgement is the broken tool at that moment, so nothing in the routine asks for it."

  - type: spot-mistake
    prompt: "Tap the part that does not hold."
    segments:
      - {text: "The month is down four per cent,"}
      - {text: "so the size goes up until it is back", wrong: true}
      - {text: "and the setups stay exactly the same."}
    explanation: "The gain is measured against the smaller account, so a deeper hole needs a bigger climb. Size comes down in a drawdown, never up."

  - type: chart-tap
    prompt: "Tap the first minute that closed back above the session's average price."
    chart:
      kind: candles
      data: [[15.36, 15.40, 15.26, 15.28], [15.28, 15.34, 15.22, 15.24], [15.24, 15.36, 15.20, 15.30], [15.30, 15.38, 15.26, 15.36], [15.36, 15.44, 15.32, 15.42], [15.42, 15.48, 15.38, 15.44], [15.44, 15.52, 15.40, 15.50], [15.50, 15.56, 15.44, 15.46], [15.46, 15.58, 15.44, 15.56], [15.56, 15.62, 15.50, 15.58]]
      vwap: [15.34, 15.33, 15.32, 15.32, 15.33, 15.34, 15.36, 15.38, 15.40, 15.42]
    target: 3
    explanation: "The third minute traded above the line and closed back under it. The fourth is the one that finished above, and the minutes after it stayed there."

  - type: chart-decision
    scenario: "TOLL has been refused at $12.86 three times and the minute that just closed finished at $12.72, the lowest close of the morning. Stop $12.88, 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[12.84, 12.86, 12.72, 12.76], [12.76, 12.84, 12.72, 12.80], [12.80, 12.86, 12.74, 12.78], [12.78, 12.82, 12.70, 12.74], [12.74, 12.86, 12.70, 12.78], [12.78, 12.80, 12.68, 12.72], [12.72, 12.74, 12.58, 12.60], [12.60, 12.64, 12.48, 12.50], [12.50, 12.56, 12.40, 12.44], [12.44, 12.50, 12.36, 12.40]]
      volume: [82000, 76000, 70000, 74000, 72000, 118000, 106000, 98000, 90000, 84000]
      levels:
        - {price: 12.86, label: "Ceiling"}
      decision_index: 5
    state: ["Day: −1R", "Limit: 3R", "Trades: 2 of 6"]
    best: short
    reasonable: [no-trade]
    outcome: "It worked down to $12.36 and the cover filled at $12.50 — 22 cents a share, +$220 on 1,000 shares against $160 of risk."
    explanation: "One unit down is not the limit and two trades is not the cap. Sixteen cents of risk above a ceiling that has refused it three times."

  - type: journal-row
    prompt: "Write that trade's row."
    trade: {setup: "Ceiling fade", entry: 12.72, stop: 12.88, exit: 12.50, shares: 1000}
    slots: [r_risked, r_made, grade]
    chips:
      r_risked: ["$160", "$220", "$120"]
      r_made: ["+1R", "+1.4R", "+2R"]
      grade: ["A", "B", "C"]
    answer: {r_risked: "$160", r_made: "+1.4R", grade: "A"}
    explanation: "Sixteen cents risked, twenty-two made, and a setup taken exactly as the card describes it."

  - type: tf
    statement: "With the day sitting at its loss limit, a smaller position is a reasonable way to keep trading."
    answer: false
    explanation: "Half size is still a trade, and the limit ends the session rather than shrinking it."

  - type: fill-choice
    sentence: "One trade taken exactly as the plan describes and still losing money is a good ___."
    options: ["decision", "result", "week"]
    answer: "decision"
    explanation: "You own the decision. The result is a single draw from a sample that needs hundreds before it means anything."

  - type: summary
    total: 14

  - type: tier-up
    tier: "Planner"
    means: "You have a risk process and a journal: a stop before every entry, results in R, limits written before the bell, a way back from a bad run, and rows that turn into one rule a week."

  - type: badge
    name: "Risk & Psychology — Complete"
    unlocks: "Chapter 7"
