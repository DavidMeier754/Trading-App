id: "2-2"
title: "R — The Unit"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [risk, r-multiple, shorts, sizing]
learning_goal: "User computes 1R and an R-multiple on a short as fluently as on a long, and holds the unit steady across names of different prices."
purpose: "The unit is only useful if it is the same size every time, in every name, on both sides of the market."
terms_introduced: []
skills: ["R on a short"]
reinforces: [3]
prerequisite: "2-1"
xp: 20
difficulty: 2
sources: ["Tharp — Trade Your Way to Financial Freedom", "Aziz — How to Day Trade for a Living"]
notes: "Account named at $24,000 with $180 a trade; worked positions are 1,400 shares at $15.80, 1,800 at $12.40, 600 at $28.60 and 900 at $24.00."
screens:
  - type: intro
    text: "A short in one name, a long in another, four times the share count. One unit at stake in all of them."

  - type: theory
    title: "The same unit, upside down"
    body: "On a short the stop sits above the entry, because a short is wrong when price goes up. Entry to stop, times shares, is still exactly one unit of risk."

  - type: numeric-input
    prompt: "Short 1,400 shares at $15.80 with the stop at $15.92. What does the trade risk?"
    answer: 168
    tolerance: 0.01
    unit: "$"
    working: "$15.92 − $15.80 = $0.12; $0.12 × 1,400 shares = $168"
    explanation: "Twelve cents above the entry, because that is the direction that proves a short wrong — and $168 sits inside the $180 unit."

  - type: numeric-mc
    prompt: "That short covers at $15.56. What did it return?"
    options:
      - {text: "+1R"}
      - {text: "+2R", correct: true}
      - {text: "+3R"}
      - {text: "−2R"}
    working: "$15.80 − $15.56 = $0.24 made ÷ $0.12 risked = 2"
    explanation: "Twice the distance you put up, in the direction you wanted."

  - type: theory
    title: "Where the unit comes from"
    body: "1R is not a rule of thumb. It is the number you decided a single trade may cost, written down before you had seen a single chart today."

  - type: match
    prompt: "Four finished trades, all risking $180. Match each to what it returned."
    pairs:
      - ["Made $360", "+2R"]
      - ["Made $90", "+0.5R"]
      - ["Stopped out", "−1R"]
      - ["Closed at the entry", "0R"]
    explanation: "Every one of them is measured against the same $180, which is the only reason the four can be compared at all."

  - type: tf
    statement: "A trade that closes at exactly your entry is 0R in the account as well as on the chart."
    answer: false
    explanation: "0R on the chart. In the account you are down the spread and the fees, paid on the way in and again on the way out."

  - type: example
    body: "1,800 shares of a $12.40 name with a ten-cent stop: $180. 600 shares of a $28.60 name with a thirty-cent stop: $180. Three times the shares, the same bet."

  - type: numeric-input
    prompt: "You keep 1R at $180. A $24 name has an honest stop twenty cents away. How many shares?"
    answer: 900
    tolerance: 1
    unit: "shares"
    working: "$180 ÷ $0.20 = 900 shares, and $24,000 ÷ $24 = 1,000, so the budget binds"
    explanation: "Same unit, longer stop, so the share count is what gives way."

  - type: chart-decision
    scenario: "SPAR has turned at $15.68 twice in the last four minutes and the minute that just closed finished at $15.80, through the last small high. Your account is $24,000, which pays for 1,400 shares here, and a stop under $15.68 is twelve cents away."
    shares: 1400
    chart:
      kind: candles
      data: [[15.62, 15.72, 15.58, 15.68], [15.68, 15.76, 15.64, 15.72], [15.72, 15.78, 15.68, 15.70], [15.70, 15.78, 15.68, 15.76], [15.76, 15.78, 15.72, 15.74], [15.74, 15.84, 15.72, 15.80], [15.80, 15.92, 15.78, 15.90], [15.90, 15.98, 15.86, 15.96], [15.96, 16.06, 15.92, 16.04], [16.04, 16.06, 15.98, 16.02]]
      volume: [92000, 86000, 74000, 96000, 82000, 128000, 116000, 108000, 124000, 96000]
      levels:
        - {price: 15.68, label: "Floor"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $16.06 and the target filled at $16.04 — 24 cents a share, +$336 on 1,400 shares against $168 of risk."
    explanation: "Twelve cents to the floor underneath, and a share count the cash can pay for at this price. The two units came from leaving the target where the plan put it."

  - type: spot-mistake
    prompt: "One of these does not follow. Tap it."
    segments:
      - {text: "I risked $450 on that one"}
      - {text: "because it was a much better read", wrong: true}
      - {text: "than the trade before it."}
    explanation: "A better read is a reason to take the trade, not a reason to make it two and a half units instead of one. A steady unit is what keeps a bad run survivable."

  - type: fill-tiles
    sentence: "A trade that loses exactly what it was allowed to lose costs you one ___."
    answer: "unit"
    explanation: "Written down as −1R, so it can be added to the ninety-nine trades around it."

  - type: mc
    prompt: "One scalp made $90 on $180 of risk. Another made $150 on $600 of risk. Which was the better trade?"
    options:
      - {text: "The $150 one, because it made more money"}
      - {text: "Neither — you cannot compare trades of different sizes"}
      - {text: "The $90 one, at half a unit against a quarter", correct: true}
    explanation: "Half a unit beats a quarter of one. Dollars only tell you who was betting bigger."

  - type: hotspot
    component: order-ticket
    prompt: "This long is about to go out. Tap the field you would change to risk less without moving your stop."
    data: {ticker: SPAR, side: buy, qty: 1400, type: limit, price: 15.80, stop_price: 15.68}
    target: qty
    explanation: "Distance belongs to the chart; the share count belongs to you. Halve the quantity and the unit halves with it."

  - type: example
    body: "A short in a $15 name and a long in a $28 one, four minutes apart. Different tickers, different share counts, the same single unit at stake in both."
