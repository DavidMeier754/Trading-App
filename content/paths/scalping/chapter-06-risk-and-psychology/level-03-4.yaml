id: "3-4"
title: "Managing the Trade"
chapter: 6
chapter_title: "Risk & Psychology"
path: scalping
category: new-theory
tags: [risk, management, time-stop, discipline]
learning_goal: "User closes a scalp whose move has failed to arrive, before the stop is reached, and treats the freed risk as the point of doing so."
purpose: "A scalp is a bet that something happens in the next few minutes; when it does not, the bet has already lost even though the stop is untouched."
terms_introduced: ["Time stop"]
reinforces: [3]
prerequisite: "3-3"
xp: 20
difficulty: 3
sources: ["Volman — Forex Price Action Scalping", "Steenbarger — The Daily Trading Coach"]
notes: "Account named at $18,000; worked positions are 1,200 shares at $14.60 and 1,200 at $14.88."
screens:
  - type: intro
    text: "Nothing has gone wrong. That is exactly the problem."

  - type: story
    character: retail-trader
    text: "Six minutes in. The bars have gone small, the volume has drained away, and price is within three cents of where you bought it."

  - type: theory
    title: "Time stop"
    body: "An exit taken because the move you were paid to expect has not started. You close at whatever the market offers, before the stop is anywhere near, and put the risk back in your pocket."

  - type: mc
    prompt: "What is a time stop actually protecting?"
    options:
      - {text: "The profit the trade has already given you"}
      - {text: "The stop price from ever being hit"}
      - {text: "Your risk budget and your attention", correct: true}
    explanation: "A dead trade holds a unit of risk and a screen you could be using elsewhere. The stop protects the account; the clock protects the rest of the session."

  - type: branch
    scenario: "You are long 1,200 shares of CRAG from $14.60 with the stop at $14.46. Six minutes have passed and price has not been more than three cents from your entry."
    shares: 1200
    chart:
      kind: candles
      data: [[14.50, 14.62, 14.48, 14.60], [14.60, 14.64, 14.56, 14.58], [14.58, 14.62, 14.56, 14.60], [14.60, 14.62, 14.57, 14.59], [14.59, 14.62, 14.57, 14.61], [14.61, 14.62, 14.58, 14.60], [14.60, 14.62, 14.57, 14.58], [14.58, 14.61, 14.56, 14.60], [14.60, 14.62, 14.57, 14.59]]
      decision_index: 5
    steps:
      - prompt: "The bars have shrunk and the volume has drained. What now?"
        options:
          - {text: "Close it and pay the costs", correct: true, next: 1}
          - {text: "Hold — the stop has not been hit", next: 1}
        explanation: "The trade was a bet on a move starting now. Six quiet minutes is the move answering."
      - prompt: "Say you held. Two minutes later it is still flat, and a name on your list has just broken out. What now?"
        options:
          - {text: "Close CRAG and go and look at the other one", correct: true}
          - {text: "Wait for CRAG to pay for itself first"}
        explanation: "The cost of a dead trade is never only its stop. It is the risk it is holding and the setup you are not watching."
      - prompt: "You are out for $24 of costs, and CRAG then breaks out without you. What does that change?"
        options:
          - {text: "Nothing — the exit was right on what you knew", correct: true}
          - {text: "Next time, hold through the quiet patch"}
        explanation: "A rule you judge one trade at a time is not a rule. Quiet minutes lose more often than they pay, and this was one of the times they paid."

  - type: numeric-input
    prompt: "Long 1,200 shares at $14.60 with the stop at $14.46. What was that trade risking while it sat there doing nothing?"
    answer: 168
    tolerance: 0.01
    unit: "$"
    working: "$14.60 − $14.46 = $0.14; $0.14 × 1,200 shares = $168"
    explanation: "A hundred and sixty-eight dollars committed to an idea that had already stopped happening."

  - type: tf
    statement: "A trade that has not moved is costing you nothing, as long as the stop has not been hit."
    answer: false
    explanation: "It is holding a unit of risk and your attention, and both of those were meant for a trade that is actually working."

  - type: sort
    prompt: "Four ways a scalp finishes. Which ones does the stop handle, and which need the clock?"
    buckets: ["The stop ends it", "The clock ends it"]
    items:
      - {text: "The floor the long was leaning on breaks", bucket: "The stop ends it"}
      - {text: "Price sits within two cents of your entry for six minutes", bucket: "The clock ends it"}
      - {text: "The move starts, then reverses back through your entry", bucket: "The stop ends it"}
      - {text: "Volume drains away and the bars shrink to a cent", bucket: "The clock ends it"}
    explanation: "Two of them are the idea being proved wrong. The other two are the idea quietly failing to happen, which needs its own exit or it never gets one."

  - type: chart-decision
    scenario: "BRIG cleared its morning high four minutes ago. Since then the bars have shrunk to two cents and the volume behind them has fallen to a fifth of what it was. Your account is $18,000."
    shares: 1200
    chart:
      kind: candles
      data: [[14.60, 14.76, 14.58, 14.74], [14.74, 14.86, 14.72, 14.84], [14.84, 14.90, 14.82, 14.88], [14.88, 14.92, 14.84, 14.86], [14.86, 14.90, 14.84, 14.88], [14.88, 14.90, 14.86, 14.88], [14.88, 14.90, 14.84, 14.86], [14.86, 14.88, 14.82, 14.84], [14.84, 14.88, 14.80, 14.82], [14.82, 14.86, 14.78, 14.80]]
      volume: [148000, 132000, 96000, 62000, 44000, 32000, 30000, 28000, 34000, 30000]
      decision_index: 5
    best: no-trade
    outcome: "Over the next eight minutes it covered six cents in total and closed at $14.80 — a long at $14.88 would be 8 cents a share down, $96 on 1,200 shares."
    explanation: "The breakout is on the chart; the participation is not. Shrinking bars on draining volume are the same message a time stop gives you, arriving before you are in."

  - type: fill-choice
    sentence: "A scalp that has not moved in several minutes has lost its ___."
    options: ["reason", "stop", "spread"]
    answer: "reason"
    explanation: "You were paid to expect a move now. Without it, the position is just risk sitting on the screen."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "It has done nothing for ten minutes,"}
      - {text: "so I will leave it until the stop decides", wrong: true}
      - {text: "and look for something else meanwhile."}
    explanation: "The stop is there for the idea failing, not for the idea never starting. Leaving it to decide costs you a full unit instead of a few cents."

  - type: example
    body: "Four dead trades closed for costs instead of left to their stops is the difference between a flat morning and a morning that has to be won back."

  - type: recap
    title: "Level 3 in four lines"
    points:
      - {text: "The stop goes to your entry once price has cleared the level, not once you are green.", level: "3-1"}
      - {text: "A partial belongs at a level, and it costs you part of the best trades.", level: "3-2"}
      - {text: "A trail hides under each new higher low and always hands back the last leg.", level: "3-3"}
      - {text: "A move that has not started is an exit, not a wait.", level: "3-4"}
