id: "12-1"
title: "The Scalper's Map"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [map, process, confluence]
icon: scalper-map
learning_goal: "User runs one read in a fixed order — level, side of the average, candle, tape — and stops at the first step that comes back empty."
purpose: "In a fast market nobody weighs four things at once, so the four things get an order and the order never changes."
terms_introduced: []
skills: ["The four-part read"]
reinforces: [2, 3]
prerequisite: "11-3"
xp: 25
difficulty: 2
path_position: merge
sources: ["Bellafiore — One Good Trade", "Aziz — How to Day Trade for a Living"]
notes: "Merge sub after the three strands: assumes the tape, the levels and the open have all been done. Chapter 2 supplies the levels, Chapter 3 the stop the level pays for. Account named at $26,000."
screens:
  - type: intro
    text: "Four readings, one order, every single time."

  - type: story
    text: "Before the three strands you had one thing to look at. Now you have four, the minute is still sixty seconds long, and you need them in an order."

  - type: theory
    title: "The order"
    body: "The level, then which side of its own average the session is on, then what the last finished minute settled, then the tape. If the first one comes back empty, there is no read to finish."

  - type: theory
    title: "Slowest first, fastest last"
    body: "Your levels were drawn before the open and will still be there in an hour. The tape is different every second. Check the things that hold still while you think, and check the fastest one last."

  - type: order
    prompt: "Put the four readings in the order you run them."
    items:
      - "Is price standing at a level?"
      - "Which side of its own average is the session on?"
      - "What did the last finished minute settle?"
      - "Is size still arriving where you are going?"
    explanation: "The first three decide whether there is a trade. The last one decides whether this second is the second to take it."

  - type: mc
    prompt: "Why does the level come first rather than the candle?"
    options:
      - {text: "Because the level gives you the entry and the stop, and without one there is nothing to size", correct: true}
      - {text: "Because the candle is harder to read than a level"}
      - {text: "Because levels are right more often than candles are"}
    explanation: "A shape in open space cannot be priced. Everything after step one is about a price that step one has already found."

  - type: chart-decision
    scenario: "Yesterday's high is $19.40. Price has been above its own average price all session, the minute that just closed finished six cents through the level, and the prints behind it were 1,000s and 1,500s at the ask."
    shares: 1200
    state: ["Size: 1,200 shares", "Account: $26,000"]
    chart:
      kind: candles
      data: [[19.10, 19.18, 19.08, 19.16], [19.16, 19.24, 19.14, 19.22], [19.22, 19.28, 19.18, 19.20], [19.20, 19.28, 19.18, 19.26], [19.26, 19.32, 19.22, 19.30], [19.30, 19.48, 19.28, 19.46], [19.46, 19.54, 19.44, 19.52], [19.52, 19.60, 19.50, 19.58], [19.58, 19.64, 19.56, 19.62], [19.62, 19.70, 19.60, 19.68], [19.68, 19.74, 19.66, 19.71]]
      volume: [86000, 94000, 68000, 74000, 66000, 172000, 146000, 124000, 108000, 96000, 88000]
      vwap: [19.1, 19.13, 19.15, 19.17, 19.19, 19.22, 19.26, 19.3, 19.34, 19.38, 19.42]
      levels:
        - {price: 19.4, label: "Yesterday's high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped away to $19.71 — $0.25 a share past the decision, +$300 long on 1,200 shares."
    explanation: "All four in order: a level to lean on, the session on your side, a minute that finished through it, and size still paying the ask while you were deciding."

  - type: numeric-input
    prompt: "You take 1,200 shares of that at $19.46 with the stop under the low of the minute that broke the level, $19.28. What is at risk?"
    answer: 216
    tolerance: 0.01
    unit: "$"
    working: "$19.46 − $19.28 = $0.18 a share; $0.18 × 1,200 shares = $216"
    explanation: "The level you found in step one is what makes that stop eighteen cents instead of a guess."

  - type: tf
    statement: "The tape is checked last because it matters least of the four."
    answer: false
    explanation: "It is checked last because it changes fastest. Checking it first means reading it again by the time the other three are done."

  - type: fill-choice
    sentence: "The ___ is the reading you check last, because it is different a second later."
    options: ["tape", "level", "candle"]
    answer: "tape"
    explanation: "Levels keep. Prints do not."

  - type: chart-decision
    scenario: "The round number at $21.20 has just been finished through with price above its own average price all session. As it went through, the size resting on the bid was pulled and the prints thinned to 100s and 200s."
    shares: 1100
    state: ["Size: 1,100 shares"]
    chart:
      kind: candles
      data: [[21.00, 21.08, 20.98, 21.06], [21.06, 21.12, 21.02, 21.10], [21.10, 21.16, 21.06, 21.08], [21.08, 21.14, 21.06, 21.12], [21.12, 21.18, 21.10, 21.16], [21.16, 21.28, 21.14, 21.26], [21.26, 21.28, 21.18, 21.20], [21.20, 21.22, 21.12, 21.14], [21.14, 21.18, 21.08, 21.10], [21.10, 21.14, 21.04, 21.06], [21.06, 21.10, 21.00, 21.03]]
      volume: [76000, 82000, 64000, 70000, 66000, 128000, 88000, 76000, 70000, 66000, 62000]
      vwap: [21.0, 21.02, 21.04, 21.05, 21.07, 21.09, 21.12, 21.14, 21.15, 21.16, 21.16]
      levels:
        - {price: 21.2, label: "Round number"}
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It gave the level back and finished at $21.03 — $0.23 a share against a long, $253 on 1,100 shares."
    explanation: "Three readings came back yes and the fourth said nobody was left to buy it. The last step is the one that stops you paying for a break nobody is behind."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The prints were heavy at the ask,"}
      - {text: "so the level and the side were checked afterwards,", wrong: true}
      - {text: "and the entry went on."}
    explanation: "Run backwards, the tape talks you into trades with nothing underneath them. It is the confirmation, never the reason."

  - type: example
    body: "Level, side, candle, tape. Four answers, about three seconds, and the same three seconds whether the answer is a trade or a pass."
