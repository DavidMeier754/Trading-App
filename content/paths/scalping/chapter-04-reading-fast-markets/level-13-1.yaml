id: "13-1"
title: "Map Drills"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: repetition
tags: [map, decisions, practice]
learning_goal: "User applies the four-part read to unseen charts and passes on the ones where the inputs disagree."
purpose: "The read only counts if it still works when the chart is new and the clock is running."
terms_introduced: []
reinforces: [2, 3]
prerequisite: "12-4"
xp: 30
difficulty: 3
sources: ["Bellafiore — One Good Trade", "Volman — Understanding Price Action"]
notes: "Practice sub. Three decisions across the chapter's material, with cost and execution checks."
screens:
  - type: intro
    text: "Three decisions, no hints. Level, line, candle, tape."

  - type: story
    text: "Mid-morning. Lines drawn, VWAP on the chart, tape open on the right, $30,000 in the account."

  - type: chart-decision
    scenario: "XYZ is above VWAP all session. It pulls back to the line at $17.60, leaves a long lower wick, and the tape starts printing at the ask again."
    shares: 1500
    state: ["Size: 1,500 shares"]
    chart:
      kind: candles
      data: [[17.90, 17.96, 17.80, 17.82], [17.82, 17.86, 17.72, 17.74], [17.74, 17.78, 17.66, 17.68], [17.68, 17.72, 17.62, 17.66], [17.66, 17.70, 17.58, 17.64], [17.64, 17.72, 17.56, 17.70], [17.70, 17.80, 17.68, 17.78], [17.78, 17.88, 17.74, 17.86], [17.86, 17.92, 17.82, 17.90], [17.90, 17.96, 17.86, 17.92]]
      vwap: [17.58, 17.58, 17.59, 17.59, 17.60, 17.60, 17.61, 17.62, 17.63, 17.64]
      volume: [56000, 51000, 46000, 42000, 39000, 98000, 74000, 68000, 61000, 56000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It bounced to $17.92 — $0.22 per share, +$330 long on 1,500 shares from $17.70."
    explanation: "A pullback into the line that holds, with the tape turning back to the ask, is the bounce this chapter started with."

  - type: mc
    prompt: "Same trade, but the tape is silent and the volume on the bounce candle is the smallest of the hour. What changes?"
    options:
      - {text: "Nothing — the level and the line are what matter"}
      - {text: "It becomes a short, because low volume means sellers"}
      - {text: "One input is missing, so the trade is optional", correct: true}
    explanation: "Nobody committed anything at the line, so the bounce has nothing holding it up."

  - type: chart-decision
    scenario: "XYZ has been under VWAP all morning. It rallies into the line at $18.40, stalls for three candles, and the tape starts printing at the bid."
    shares: 1500
    state: ["Size: 1,500 shares"]
    chart:
      kind: candles
      data: [[18.00, 18.10, 17.96, 18.08], [18.08, 18.18, 18.04, 18.16], [18.16, 18.26, 18.12, 18.24], [18.24, 18.34, 18.20, 18.32], [18.32, 18.38, 18.28, 18.34], [18.34, 18.40, 18.28, 18.30], [18.30, 18.34, 18.20, 18.22], [18.22, 18.26, 18.10, 18.12], [18.12, 18.16, 18.02, 18.04], [18.04, 18.08, 17.94, 17.98]]
      vwap: [18.52, 18.50, 18.48, 18.46, 18.44, 18.42, 18.41, 18.40, 18.38, 18.36]
      volume: [64000, 59000, 56000, 51000, 44000, 78000, 84000, 76000, 69000, 62000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It rolled over to $17.98 — $0.32 per share, +$480 short on 1,500 shares from $18.30."
    explanation: "Three candles that cannot reach the line, then prints at the bid: the rejection is already happening."

  - type: numeric-input
    prompt: "That short is 1,500 shares. The spread is $0.04 and you also pay $0.005 per share in fees each way. What are the all-in costs for the round trip?"
    answer: 75
    unit: "$"
    working: "Spread $0.04 × 1,500 = $60; fees $0.005 × 1,500 × 2 = $15; total $75"
    explanation: "On a $480 result that is a sixth of the move — worth knowing, never worth ignoring."

  - type: sort
    prompt: "Which input is telling you this?"
    buckets: ["The level", "VWAP", "The candle", "The tape"]
    items:
      - {text: "Price is at yesterday's high", bucket: "The level"}
      - {text: "Sellers have owned the whole session", bucket: "VWAP"}
      - {text: "The last minute closed with a long upper wick", bucket: "The candle"}
      - {text: "Prints are arriving at the bid, faster and larger", bucket: "The tape"}
    explanation: "Where, who, what, now."

  - type: tf
    statement: "A read where three inputs agree and one disagrees is the same as a read where all four agree."
    answer: false
    explanation: "It can still be a trade, but it is a weaker one — and the disagreement is usually what you learn from later."

  - type: hotspot
    component: quote-panel
    prompt: "You are long and want out immediately. Tap the price your sell fills at."
    data: {bid: 38.88, ask: 38.92, last: 38.90}
    target: bid
    explanation: "A seller in a hurry takes the bid, four cents below the ask. That gap is the round trip."

  - type: fill-choice
    sentence: "The only one of the four inputs that shows you what is happening right now is the ___."
    options: ["tape", "level", "candle"]
    answer: "tape"
    explanation: "The candle is the last minute, the level is history — only prints are live."

  - type: chart-tap
    prompt: "Tap the candle that broke yesterday's low at $27.50 and could not hold below it."
    chart:
      kind: candles
      data: [[27.80, 27.86, 27.72, 27.74], [27.74, 27.78, 27.66, 27.68], [27.68, 27.72, 27.58, 27.60], [27.60, 27.64, 27.54, 27.56], [27.56, 27.60, 27.46, 27.58], [27.58, 27.66, 27.54, 27.64], [27.64, 27.72, 27.60, 27.70], [27.70, 27.78, 27.66, 27.76]]
      levels:
        - {price: 27.50, label: "Yesterday's low"}
    target: 4
    explanation: "It traded to $27.46 and closed at $27.58 — through the level and back inside within the minute."

  - type: chart-decision
    scenario: "Mid-morning on XYZ. Your nearest marked level is thirty cents away and the tape has gone quiet."
    shares: 1000
    state: ["Size: 1,000 shares"]
    chart:
      kind: candles
      data: [[27.20, 27.24, 27.18, 27.22], [27.22, 27.25, 27.18, 27.20], [27.20, 27.24, 27.17, 27.21], [27.21, 27.24, 27.18, 27.19], [27.19, 27.23, 27.17, 27.22], [27.22, 27.25, 27.19, 27.21], [27.21, 27.24, 27.18, 27.20], [27.20, 27.23, 27.17, 27.21], [27.21, 27.24, 27.18, 27.22], [27.22, 27.24, 27.19, 27.20]]
      vwap: [27.21, 27.21, 27.21, 27.21, 27.21, 27.21, 27.21, 27.21, 27.21, 27.21]
      volume: [21000, 19000, 18000, 17000, 16000, 15000, 17000, 16000, 15000, 14000]
      decision_index: 5
    best: no-trade
    outcome: "Eight cents of range for another fifteen minutes. Every entry paid the spread and got nothing back."
    explanation: "Zero of four inputs. Most of the session looks like this, and most of the session is not a trade."

  - type: theory
    title: "The reps are the skill"
    body: "You have now made the same read a dozen times. Next: what to do with the fact that most of them come back a pass."
