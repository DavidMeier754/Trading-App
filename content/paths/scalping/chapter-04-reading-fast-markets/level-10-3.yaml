id: "10-3"
title: "Fan-out B — VWAP & Levels in Action"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [levels, failed-test, decisions]
learning_goal: "User can tell a break that holds from one that is handed back, and knows why the second one travels faster than the first."
purpose: "The minute after a break fails is one of the few moments a fast market shows you where a crowd is standing."
terms_introduced: ["Failed test"]
reinforces: [2]
prerequisite: "10-2"
xp: 30
difficulty: 3
path_position: fan-out:levels
sources: ["Volman — Understanding Price Action", "Bellafiore — One Good Trade"]
notes: "Strand B, third sub. Self-contained. Chapter 2's breakout and its close-versus-wick rule are what the failure is measured against. Account named at $26,000."
screens:
  - type: intro
    text: "A level goes. Two minutes later price is back inside it. Somebody is now in the wrong place."

  - type: story
    character: retail-trader
    text: "You watched the break, you did not take it, and now price is back under the level. Everyone who did take it is watching the same thing you are."

  - type: theory
    title: "The failed test"
    body: "A failed test is a level broken and then handed straight back, with a minute finishing on the old side again. The break was real and the people who joined it are offside."

  - type: theory
    title: "Why it travels"
    body: "Their stops sit on the other side of the level, and so do the orders of everyone who wanted to trade against the break. Both lots fire in the same direction, which is why the move away is quicker than the break was."

  - type: chart-decision
    scenario: "The pre-market high at $12.80 was broken three minutes ago. Price is back under it, under its own average price, and the minute that just closed finished ten cents below the level on the heaviest bar of the morning."
    shares: 1800
    state: ["Size: 1,800 shares"]
    chart:
      kind: candles
      data: [[12.66, 12.72, 12.62, 12.70], [12.70, 12.76, 12.68, 12.74], [12.74, 12.86, 12.72, 12.84], [12.84, 12.88, 12.80, 12.82], [12.82, 12.84, 12.74, 12.76], [12.76, 12.78, 12.68, 12.70], [12.70, 12.72, 12.60, 12.62], [12.62, 12.64, 12.52, 12.54], [12.54, 12.56, 12.44, 12.46], [12.46, 12.48, 12.38, 12.40], [12.40, 12.44, 12.32, 12.36]]
      volume: [72000, 78000, 142000, 96000, 118000, 168000, 146000, 124000, 108000, 94000, 86000]
      vwap: [12.72, 12.73, 12.75, 12.76, 12.77, 12.77, 12.76, 12.75, 12.73, 12.71, 12.68]
      levels:
        - {price: 12.8, label: "Pre-market high"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It dropped away to $12.36 — $0.34 a share under the decision, +$612 short on 1,800 shares."
    explanation: "Two minutes of trading above the level, then two minutes finishing under it, and the busiest bar of the session on the way back. Everything bought up there is now underwater."

  - type: mc
    prompt: "Why does price often move quicker away from a failed test than it did on the break itself?"
    options:
      - {text: "Because spreads tighten once a level is broken"}
      - {text: "Because the stops of the break and the orders against it fire the same way", correct: true}
      - {text: "Because a failed test always happens on lighter volume"}
    explanation: "Two separate lots of orders end up pointing in one direction, and neither of them is choosing the price it gets."

  - type: branch
    scenario: "You are long 1,600 shares of XYZ from $12.86, taken two minutes after the break of the $12.80 level. Your stop is at $12.72 and your account is $26,000."
    shares: 1600
    chart:
      kind: candles
      data: [[12.62, 12.68, 12.58, 12.66], [12.66, 12.74, 12.64, 12.72], [12.72, 12.88, 12.70, 12.86], [12.86, 12.90, 12.82, 12.84], [12.84, 12.86, 12.76, 12.78], [12.78, 12.80, 12.68, 12.70], [12.70, 12.72, 12.62, 12.64], [12.64, 12.66, 12.56, 12.58], [12.58, 12.60, 12.50, 12.52], [12.52, 12.54, 12.44, 12.46]]
      volume: [68000, 74000, 156000, 92000, 124000, 148000, 126000, 108000, 96000, 88000]
      vwap: [12.70, 12.71, 12.74, 12.75, 12.76, 12.75, 12.74, 12.72, 12.70, 12.68]
      decision_index: 4
    steps:
      - prompt: "The minute just finished two cents back under the level. What do you do with the long?"
        options:
          - {text: "The break you paid for has been handed back, so close it", correct: true, next: 1}
          - {text: "Hold to the stop at $12.72, which is only six cents away", next: 1}
        explanation: "You bought a level that had gone. It has not gone, so the reason is not there any more, and the stop is where you find that out expensively."
      - prompt: "You are flat at $12.78. The next minute is a ten-cent body down on the heaviest bar of the morning. What is the read?"
        options:
          - {text: "The level is a ceiling now, and the failure is the trade", correct: true}
          - {text: "Wait for price to come back to $12.86 and try the long again"}
        explanation: "The same evidence that got you out points the other way. That is the whole reason a failed test is worth recognising rather than just surviving."

  - type: numeric-input
    prompt: "You were long 1,600 shares from $12.86 and out at $12.78. What did the failed break cost before fees?"
    answer: 128
    tolerance: 0.01
    unit: "$"
    working: "$12.86 − $12.78 = $0.08 a share; $0.08 × 1,600 shares = $128"
    explanation: "Eight cents for finding out, instead of the fourteen the stop was holding open."

  - type: compare
    prompt: "Both charts broke the line drawn on them. In which one did the break survive?"
    charts:
      - kind: candles
        data: [[17.40, 17.48, 17.38, 17.46], [17.46, 17.54, 17.44, 17.52], [17.52, 17.66, 17.50, 17.64], [17.64, 17.68, 17.58, 17.60], [17.60, 17.62, 17.52, 17.54], [17.54, 17.56, 17.46, 17.48], [17.48, 17.50, 17.40, 17.42], [17.42, 17.46, 17.36, 17.38]]
        levels:
          - {price: 17.6, label: "Yesterday's high"}
        label: "A"
      - kind: candles
        data: [[17.40, 17.48, 17.38, 17.46], [17.46, 17.54, 17.44, 17.52], [17.52, 17.66, 17.50, 17.64], [17.64, 17.70, 17.60, 17.68], [17.68, 17.74, 17.64, 17.72], [17.72, 17.78, 17.68, 17.76], [17.76, 17.82, 17.72, 17.80], [17.80, 17.86, 17.78, 17.84]]
        levels:
          - {price: 17.6, label: "Yesterday's high"}
        label: "B"
    answer: "B"
    explanation: "Both broke on the same minute. A never finished above the level again; B never finished below it again."

  - type: tf
    statement: "A break that is handed straight back tells you more than a break that simply stalls above the level."
    answer: true
    explanation: "A stall is an argument still running. A return inside the level has already settled who was wrong."

  - type: fill-tiles
    sentence: "A level broken and then handed straight back is a ___ test."
    answer: "failed"
    explanation: "The break happened, and it did not survive a finished minute on the far side."

  - type: chart-decision
    scenario: "The round number at $23.00 was broken three minutes ago and every minute since has finished above it, with price above its own average price all session."
    shares: 1000
    state: ["Size: 1,000 shares"]
    chart:
      kind: candles
      data: [[22.72, 22.80, 22.70, 22.78], [22.78, 22.86, 22.76, 22.84], [22.84, 22.92, 22.82, 22.90], [22.90, 23.06, 22.88, 23.04], [23.04, 23.10, 23.00, 23.06], [23.06, 23.12, 23.02, 23.10], [23.10, 23.18, 23.08, 23.16], [23.16, 23.24, 23.14, 23.22], [23.22, 23.28, 23.20, 23.26], [23.26, 23.32, 23.24, 23.30], [23.30, 23.38, 23.28, 23.35]]
      volume: [76000, 84000, 92000, 164000, 118000, 104000, 112000, 98000, 88000, 82000, 76000]
      vwap: [22.72, 22.74, 22.77, 22.80, 22.84, 22.88, 22.92, 22.96, 23.0, 23.04, 23.08]
      levels:
        - {price: 23.0, label: "Round number"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $23.35 — $0.25 a share past the decision, +$250 long on 1,000 shares."
    explanation: "The opposite of a failure: the level was taken, the next two minutes both finished above it, and the lowest of them came back to the level exactly and finished six cents above it."

  - type: recap
    title: "Level 10 in three lines"
    points:
      - {text: "The session's average price walks into your levels, and the price they share carries both readings.", level: "10-1"}
      - {text: "The first test meets the whole pile of orders; every test after it meets less.", level: "10-2"}
      - {text: "A break handed straight back leaves a crowd offside, which is why the return travels fast.", level: "10-3"}
