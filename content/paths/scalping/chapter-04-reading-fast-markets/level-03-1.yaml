id: "3-1"
title: "Intraday Levels"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [levels, preparation]
learning_goal: "User can name the three prices yesterday leaves behind and say what each of them does to today's session."
purpose: "A scalper has no time to hunt for levels once the session is running, and yesterday hands you three of them for free."
terms_introduced: []
reinforces: [2]
prerequisite: "2-3"
xp: 25
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Murphy — Technical Analysis of the Financial Markets"]
notes: "Yesterday's close is the new idea here; Chapter 2's break-and-hold reading is what the questions lean on. Account named at $22,000."
screens:
  - type: intro
    text: "Three of today's most important prices were set before today started."

  - type: theory
    title: "Yesterday leaves three prices"
    body: "Its high, its low and its close. Every chart watching this stock shows all three, which is what makes orders pile up on them again today."

  - type: carousel
    cards:
      - {label: "Yesterday's high", text: "The most anybody paid in the last full session. Today's buyers have to get past it before there is a new price in this stock.", icon: level-high}
      - {label: "Yesterday's low", text: "The least anybody accepted. Sellers have to finish under it before today is worse than yesterday was.", icon: level-low}
      - {label: "Yesterday's close", text: "Today's zero. Above it the stock is green on every screen in the market, below it red, and that alone brings traders to it.", icon: level-close}

  - type: chart-annotate
    prompt: "Drag the line to the price the last two pushes have both stopped at."
    chart:
      kind: candles
      data: [[16.52, 16.62, 16.50, 16.60], [16.60, 16.80, 16.58, 16.76], [16.76, 16.78, 16.66, 16.68], [16.68, 16.74, 16.64, 16.72], [16.72, 16.80, 16.70, 16.74], [16.74, 16.76, 16.62, 16.64], [16.64, 16.70, 16.60, 16.68], [16.68, 16.72, 16.62, 16.66], [16.66, 16.70, 16.58, 16.60]]
      volume: [88000, 124000, 76000, 68000, 104000, 82000, 64000, 58000, 72000]
    answer: 16.8
    tolerance: 0.04
    label: "Yesterday's high"
    explanation: "$16.80 twice, eight minutes apart, and neither minute finished above it. That is the line on the chart for the rest of the day."

  - type: mc
    prompt: "XYZ closed yesterday at $16.20 and is trading at $16.58. What does yesterday's close tell you right now?"
    options:
      - {text: "That $16.58 is an expensive price for this stock"}
      - {text: "That yesterday's buyers are in front", correct: true}
      - {text: "That the stock will keep rising for the rest of the day"}
    explanation: "It is the day's zero, nothing more. Where price is relative to it says who is comfortable, not where price goes next."

  - type: numeric-input
    prompt: "You are long 1,200 shares from $16.44 and yesterday's high at $16.80 is the first line above you. What is that stretch worth before costs?"
    answer: 432
    tolerance: 0.01
    unit: "$"
    working: "$16.80 − $16.44 = $0.36 a share; $0.36 × 1,200 shares = $432"
    explanation: "Knowing the line before the entry is what turns a hope into a number you can decide on."

  - type: tf
    statement: "Yesterday's close is only useful for working out today's percentage change."
    answer: false
    explanation: "Every screen in the market measures the day from it, so it collects orders like any other line does."

  - type: chart-decision
    scenario: "Yesterday's high is $16.80. XYZ has finished every minute of the session above the line, and the minute that just closed went through the level on the heaviest bar of the morning. Your account is $22,000 and you are sizing 1,200 shares."
    shares: 1200
    chart:
      kind: candles
      data: [[16.40, 16.50, 16.38, 16.48], [16.48, 16.58, 16.46, 16.56], [16.56, 16.60, 16.52, 16.54], [16.54, 16.64, 16.52, 16.62], [16.62, 16.72, 16.60, 16.70], [16.70, 16.86, 16.68, 16.84], [16.84, 16.92, 16.82, 16.90], [16.90, 16.98, 16.88, 16.96], [16.96, 17.04, 16.94, 17.02], [17.02, 17.10, 17.00, 17.08], [17.08, 17.14, 17.05, 17.11]]
      volume: [72000, 86000, 58000, 68000, 94000, 164000, 142000, 124000, 108000, 92000, 84000]
      vwap: [16.40, 16.43, 16.46, 16.49, 16.52, 16.55, 16.58, 16.61, 16.64, 16.67, 16.70]
      levels:
        - {price: 16.80, label: "Yesterday's high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $17.11 — $0.27 a share past the decision, +$324 long on 1,200 shares."
    explanation: "Two lines agree: the session's average price is underneath and the last full session's ceiling has just been finished through, with the weight to match."

  - type: fill-choice
    sentence: "Above yesterday's ___, the stock is green on every screen in the market."
    options: ["close", "high", "low"]
    answer: "close"
    explanation: "The high and the low are yesterday's edges. The close is where today is measured from."

  - type: chart-tap
    prompt: "Tap the minute that finished above yesterday's high for the first time."
    chart:
      kind: candles
      data: [[14.10, 14.16, 14.06, 14.14], [14.14, 14.22, 14.12, 14.20], [14.20, 14.30, 14.18, 14.24], [14.24, 14.32, 14.22, 14.28], [14.28, 14.38, 14.26, 14.36], [14.36, 14.44, 14.34, 14.42], [14.42, 14.48, 14.38, 14.44], [14.44, 14.52, 14.42, 14.50]]
      levels:
        - {price: 14.30, label: "Yesterday's high"}
    target: 4
    explanation: "One minute reached $14.30 and the next traded through it, and both finished underneath. This one finished six cents clear."

  - type: example
    body: "Yesterday's high $16.80, its low $15.90, its close $16.20. Thirty seconds of homework, three lines, and all of them were on the chart before the session opened."
