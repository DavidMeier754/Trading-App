id: "2-1"
title: "Trading the Line"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, decisions]
learning_goal: "User can tell price being defended at the line from price being pushed away from it, and picks the side each one gives."
purpose: "Price comes back to the line several times a session, and what it does when it gets there is the whole trade."
terms_introduced: ["Rejection"]
skills: ["Rejection"]
reinforces: [2]
prerequisite: "1-4"
xp: 25
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "Chapter 2's shrinking-pullback reading and its close-versus-wick rule, both re-tested at the line. Account named at $26,000."
screens:
  - type: intro
    text: "Price keeps coming back to the line. What happens there is the trade."

  - type: theory
    title: "The magnet"
    body: "In a session with a direction, price runs away from the line and then drifts back to it. Everyone who missed the move is waiting there, and so is the desk that is being scored on it."

  - type: example
    body: "XYZ climbs from $19.20 to $19.44, hands fourteen cents back on three quieter minutes, and stops at $19.28 — one cent over the line. The next minute takes the whole give-back with it."
    visual: chart-candles
    visual_data:
      data: [[19.20, 19.34, 19.18, 19.32], [19.32, 19.44, 19.30, 19.42], [19.42, 19.46, 19.34, 19.36], [19.36, 19.38, 19.26, 19.28], [19.28, 19.34, 19.25, 19.32], [19.32, 19.44, 19.30, 19.42], [19.42, 19.52, 19.40, 19.50], [19.50, 19.60, 19.48, 19.58]]
      volume: [86000, 94000, 68000, 52000, 44000, 102000, 92000, 84000]
      vwap: [19.22, 19.26, 19.28, 19.27, 19.27, 19.28, 19.30, 19.33]

  - type: carousel
    cards:
      - {label: "Defended", text: "Price comes back to the line from above and stops there. Buyers are still paying the session's average price, so the old direction is intact.", icon: level-hold}
      - {label: "Rejection", text: "Price pushes into the line from the wrong side, cannot finish a minute through it, and snaps back. Whoever tried just failed in public.", icon: level-reject}

  - type: chart-decision
    scenario: "XYZ has held above the line all session. The give-back into it has come on bars shrinking every minute."
    shares: 1400
    state: ["Size: 1,400 shares", "Account: $26,000"]
    chart:
      kind: candles
      data: [[17.06, 17.20, 17.04, 17.18], [17.18, 17.32, 17.16, 17.30], [17.30, 17.38, 17.26, 17.28], [17.28, 17.30, 17.18, 17.20], [17.20, 17.22, 17.15, 17.18], [17.18, 17.28, 17.16, 17.26], [17.26, 17.38, 17.24, 17.36], [17.36, 17.46, 17.34, 17.44], [17.44, 17.52, 17.42, 17.50], [17.50, 17.58, 17.48, 17.56], [17.56, 17.64, 17.54, 17.62]]
      volume: [96000, 108000, 74000, 58000, 46000, 124000, 112000, 98000, 86000, 78000, 70000]
      vwap: [17.08, 17.13, 17.16, 17.17, 17.17, 17.17, 17.18, 17.19, 17.21, 17.23, 17.25]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $17.62 — $0.36 a share past the decision, +$504 long on 1,400 shares."
    explanation: "The give-back dried up right at the line and the next minute was the busiest of the session. Nobody sold the session's average price for long."

  - type: mc
    prompt: "Price has been under the line since the open, pushes up into it, and finishes the minute back underneath. What have you seen?"
    options:
      - {text: "The line has stopped working as a level"}
      - {text: "The sellers are still there", correct: true}
      - {text: "Buyers have taken the session back"}
    explanation: "Somebody was happy to sell at the session's average price again. Until a minute finishes above it, that has not changed."

  - type: chart-decision
    scenario: "No minute has finished above the line today. XYZ has just traded five cents through it and closed eight cents back underneath."
    shares: 1400
    state: ["Size: 1,400 shares"]
    chart:
      kind: candles
      data: [[14.52, 14.54, 14.40, 14.42], [14.42, 14.44, 14.32, 14.34], [14.34, 14.42, 14.32, 14.40], [14.40, 14.46, 14.38, 14.44], [14.44, 14.48, 14.42, 14.46], [14.46, 14.54, 14.38, 14.40], [14.40, 14.42, 14.28, 14.30], [14.30, 14.32, 14.20, 14.22], [14.22, 14.24, 14.12, 14.14], [14.14, 14.16, 14.06, 14.08], [14.08, 14.10, 14.00, 14.02]]
      volume: [78000, 66000, 52000, 48000, 44000, 118000, 104000, 92000, 84000, 76000, 68000]
      vwap: [14.60, 14.56, 14.53, 14.51, 14.50, 14.49, 14.47, 14.45, 14.42, 14.39, 14.36]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell away to $14.02 — $0.38 a share below the decision, +$532 short on 1,400 shares."
    explanation: "The best minute of the rally was spent above the line and given back inside the same sixty seconds, on the heaviest bar since the open."

  - type: tf
    statement: "A minute that trades through the line and finishes back on its old side is the line holding, not breaking."
    answer: true
    explanation: "The same rule Chapter 2 gave you for any level: the wick says price went there, the close says what was decided about it."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Price pushed up through the line"}
      - {text: "and finished the minute back underneath it,"}
      - {text: "so the buyers have taken the session.", wrong: true}
    explanation: "They tried and were turned away. A minute finishing on the old side is the opposite of control changing hands."

  - type: numeric-input
    prompt: "You are long 1,400 shares from $17.26 with the stop at $17.12. What is at risk?"
    answer: 196
    tolerance: 0.01
    unit: "$"
    working: "$17.26 − $17.12 = $0.14 a share; $0.14 × 1,400 shares = $196"
    explanation: "Fourteen cents of stop, and 1,400 × $17.26 is $24,164 — the account can pay for the position it is risking."

  - type: fill-tiles
    sentence: "Price pushing into the line and finishing the minute back on its old side is a ___."
    answer: "rejection"
    explanation: "The side that tried to change the session got turned away inside the minute."

  - type: theory
    title: "Two of the three"
    body: "The line defended gives you the old direction. The line rejecting gives you the other one. Next: the trade that only exists when control actually changes hands."
