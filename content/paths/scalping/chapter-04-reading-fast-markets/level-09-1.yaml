id: "9-1"
title: "Fan-out A — Tape Reading"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [tape, prints, execution]
icon: tape-prints
learning_goal: "User can read a run of prints for speed, size and side, and say which crowd is paying up."
purpose: "The chart tells you what the last minute settled; the prints tell you what is being paid for right now."
terms_introduced: []
skills: ["Reading prints for speed, size and side"]
reinforces: [3]
prerequisite: "8-1"
xp: 25
difficulty: 2
path_position: fan-out:tape
sources: ["Bellafiore — One Good Trade", "Aziz — How to Day Trade for a Living"]
notes: "Strand A, first sub. Self-contained: uses nothing from strands B or C. Chapter 3 introduced the tape and the order book as screens; here they become a reading. No time-and-sales component exists, so runs of prints are given in prose. Account named at $26,000."
screens:
  - type: intro
    text: "A candle is sixty seconds summarised. The prints are the sixty seconds themselves."

  - type: theory
    title: "One trade, one print"
    body: "A print is a single trade that has already happened: a price and a share count. The tape is the list of them, newest first, and it never stops while the session is open."

  - type: theory
    title: "Speed, size, side"
    body: "Three things to read. How fast the prints arrive, how many shares each one carries, and whether they are going off at the ask or at the bid."

  - type: example
    body: "1,200 at the ask. 800 at the ask. 1,500 at the ask. Three prints, one side, growing size — somebody is paying the seller's price and not slowing down about it."

  - type: mc
    prompt: "The prints are arriving four a second, almost all of them at the bid, and each one is bigger than the last. What is that?"
    options:
      - {text: "Sellers hitting out, and getting more urgent", correct: true}
      - {text: "Buyers paying up, and getting more urgent"}
      - {text: "Market makers widening the spread"}
    explanation: "The bid is what a buyer is offering. Anyone trading there is accepting it, which means they want out more than they want the extra cent."

  - type: sort
    prompt: "Which crowd is being aggressive in each of these?"
    buckets: ["Buyers paying up", "Sellers hitting out"]
    items:
      - {text: "A 900-share print at the ask", bucket: "Buyers paying up"}
      - {text: "A 1,500-share print at the bid", bucket: "Sellers hitting out"}
      - {text: "Prints arriving faster, and all of them at the ask", bucket: "Buyers paying up"}
      - {text: "Each print a cent lower than the one before it, all at the bid", bucket: "Sellers hitting out"}
    explanation: "Whichever side of the quote the trade happens on, the aggressor is the one who crossed to get there."

  - type: depth-ladder
    prompt: "The prints are all going off at the ask. You market-buy 1,000 shares into this book. Where does your last share fill?"
    data:
      bids: [[20.00, 900], [19.99, 600], [19.98, 1400]]
      asks: [[20.02, 300], [20.03, 400], [20.04, 1200]]
    target: ask-3
    explanation: "300 shares at $20.02 and 400 at $20.03 leave 300 to take from $20.04, so the last share fills two cents worse than the price you were looking at."

  - type: numeric-input
    prompt: "Six prints go off at the ask in a few seconds: 400, 800, 1,200, 600, 900 and 1,100 shares. How many shares did buyers pay up for?"
    answer: 5000
    tolerance: 0
    unit: "shares"
    working: "400 + 800 + 1,200 + 600 + 900 + 1,100 = 5,000 shares"
    explanation: "Five thousand shares taken at the seller's price in a few seconds, which is the kind of number that moves a quote."

  - type: chart-decision
    scenario: "The round number at $20.00 is the first line above. Price is above its own average price, the minute that just closed finished six cents through the level, and the prints behind it were 800s and 1,200s at the ask."
    shares: 1200
    state: ["Size: 1,200 shares", "Account: $26,000"]
    chart:
      kind: candles
      data: [[19.76, 19.82, 19.74, 19.80], [19.80, 19.86, 19.78, 19.84], [19.84, 19.90, 19.80, 19.82], [19.82, 19.90, 19.80, 19.88], [19.88, 19.94, 19.86, 19.92], [19.92, 20.08, 19.90, 20.06], [20.06, 20.14, 20.04, 20.12], [20.12, 20.18, 20.10, 20.16], [20.16, 20.22, 20.14, 20.20], [20.20, 20.26, 20.18, 20.24], [20.24, 20.30, 20.22, 20.28]]
      volume: [82000, 90000, 66000, 72000, 64000, 182000, 146000, 124000, 108000, 96000, 88000]
      vwap: [19.76, 19.78, 19.80, 19.82, 19.84, 19.86, 19.89, 19.92, 19.95, 19.98, 20.01]
      levels:
        - {price: 20.0, label: "Round number"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped up to $20.28 — $0.22 a share past the decision, +$264 long on 1,200 shares."
    explanation: "The candle says the level went. The prints say who took it: size, at the ask, one after another."

  - type: tf
    statement: "A print is an order waiting at a price for somebody to trade against it."
    answer: false
    explanation: "That is the book. A print is a trade that already happened and cannot be taken back."

  - type: hotspot
    component: order-book
    prompt: "Buyers are lifting the asks print after print. Tap the row that will hold them up the longest."
    data: {bids: [[20.00, 900], [19.99, 600], [19.98, 1400]], asks: [[20.02, 300], [20.03, 2400], [20.04, 400]]}
    target: ask-2
    explanation: "2,400 shares at $20.03 against 300 and 400 either side of it. That is the row the buying has to chew through."

  - type: fill-tiles
    sentence: "A single trade that has already happened is a ___."
    answer: "print"
    explanation: "Price and size, done, and on the tape a fraction of a second later."

  - type: story
    text: "The size going off at my ask is not slowing down. I can keep offering at this price, or I can move up and let them come to me."
