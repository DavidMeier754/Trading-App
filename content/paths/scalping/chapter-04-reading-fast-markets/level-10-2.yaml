id: "10-2"
title: "Fan-out B — VWAP & Levels in Action"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [levels, touches, decisions]
icon: in-action
learning_goal: "User treats the first test of a level as the one worth trading and expects a level to be thinner on every test after it."
purpose: "The same level is a different trade the third time price arrives at it, and the chart looks almost identical."
terms_introduced: []
skills: ["The first test"]
reinforces: [2]
prerequisite: "10-1"
xp: 25
difficulty: 3
path_position: fan-out:levels
sources: ["Volman — Understanding Price Action", "Raschke & Connors — Street Smarts"]
notes: "Strand B, second sub. Self-contained. Chapter 2's support and resistance and its close-versus-wick verdict decide what counts as a test. Account named at $28,000."
screens:
  - type: intro
    text: "A level does not get stronger every time it holds. It gets emptier."

  - type: theory
    title: "Each test spends it"
    body: "A level is a pile of resting orders. Every test trades against some of them and they are not replaced for free. The first arrival meets the whole pile; the fourth meets what is left of it."

  - type: example
    body: "Four thousand shares are bid at $21.40. The first test takes 1,500 of them, the second another 1,600. What meets the third push is 900 shares and a reputation."

  - type: carousel
    cards:
      - {label: "First test", text: "The whole pile is there and nobody has been proved wrong yet. The tightest stop and the cleanest reaction you will get at this price.", icon: level-first}
      - {label: "Second test", text: "Still worth taking, with less behind it. The reaction is usually smaller and slower than the first one was.", icon: level-second}
      - {label: "Third and after", text: "Price keeps coming back because it is being allowed to. Each return is a hint that one side has run out of patience, not that the level is strong.", icon: level-third}

  - type: chart-decision
    scenario: "Yesterday's high at $13.60 was taken twenty minutes ago. XYZ has been above its own average price since the open and has just come back to the level for the first time, finishing the minute ten cents above it on the heaviest bar of the stretch."
    shares: 1700
    state: ["Size: 1,700 shares", "Account: $28,000"]
    chart:
      kind: candles
      data: [[13.72, 13.78, 13.68, 13.70], [13.70, 13.74, 13.64, 13.66], [13.66, 13.68, 13.60, 13.62], [13.62, 13.66, 13.58, 13.60], [13.60, 13.64, 13.56, 13.62], [13.62, 13.72, 13.60, 13.70], [13.70, 13.78, 13.68, 13.76], [13.76, 13.84, 13.74, 13.82], [13.82, 13.88, 13.80, 13.86], [13.86, 13.92, 13.84, 13.90], [13.90, 13.98, 13.88, 13.95]]
      volume: [84000, 76000, 68000, 58000, 62000, 148000, 124000, 108000, 96000, 88000, 80000]
      vwap: [13.50, 13.52, 13.53, 13.54, 13.55, 13.56, 13.58, 13.60, 13.62, 13.64, 13.66]
      levels:
        - {price: 13.6, label: "Yesterday's high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It stepped away to $13.95 — $0.25 a share past the decision, +$425 long on 1,700 shares."
    explanation: "First arrival, full pile: price dipped four cents under the level, was taken straight back, and the minute that did it was the busiest of the stretch."

  - type: numeric-input
    prompt: "You take 1,700 shares of that at $13.70 with the stop two cents under the low of the touch, $13.56. What is at risk?"
    answer: 272
    tolerance: 0.01
    unit: "$"
    working: "$13.70 − $13.54 = $0.16 a share; $0.16 × 1,700 shares = $272"
    explanation: "The first test gives you the tightest stop of the day at this price, because the low it makes is the shallowest one the level will produce."

  - type: chart-tap
    prompt: "Tap the third time this level was tested."
    chart:
      kind: candles
      data: [[21.20, 21.40, 21.18, 21.32], [21.32, 21.36, 21.24, 21.26], [21.26, 21.34, 21.22, 21.30], [21.30, 21.40, 21.28, 21.34], [21.34, 21.38, 21.26, 21.28], [21.28, 21.36, 21.24, 21.32], [21.32, 21.40, 21.30, 21.34], [21.34, 21.38, 21.28, 21.30], [21.30, 21.34, 21.22, 21.24]]
      volume: [136000, 98000, 86000, 112000, 82000, 76000, 94000, 72000, 68000]
      levels:
        - {price: 21.4, label: "Resistance"}
    target: 6
    explanation: "$21.40 on the first minute, again on the fourth, and this is the third arrival. Each one reached the same price on lighter volume than the one before."

  - type: mc
    prompt: "Why is the first test of a level usually the one worth trading?"
    options:
      - {text: "Because the whole pile of resting orders is still there", correct: true}
      - {text: "Because the first test always produces the biggest move"}
      - {text: "Because spreads are tighter the first time price arrives"}
    explanation: "Size is what makes a level react, and the first arrival is the only one that meets all of it."

  - type: swipe-deck
    prompt: "Your rule: the first or second test of the level, with the session on the same side. Take it, or pass?"
    cards:
      - chart: {kind: candles, data: [[18.40, 18.46, 18.36, 18.44], [18.44, 18.50, 18.40, 18.42], [18.42, 18.46, 18.34, 18.36], [18.36, 18.40, 18.30, 18.38], [18.38, 18.48, 18.36, 18.46], [18.46, 18.54, 18.44, 18.52], [18.52, 18.58, 18.48, 18.56], [18.56, 18.62, 18.52, 18.60]], vwap: [18.28, 18.30, 18.31, 18.32, 18.34, 18.36, 18.39, 18.42], levels: [{price: 18.3, label: "Pre-market high"}]}
        answer: take
        note: "First return to the level since it broke, above the session's average the whole way, and the minute at it closed back up."
      - chart: {kind: candles, data: [[18.40, 18.46, 18.30, 18.38], [18.38, 18.48, 18.36, 18.46], [18.46, 18.50, 18.30, 18.34], [18.34, 18.44, 18.32, 18.42], [18.42, 18.46, 18.30, 18.36], [18.36, 18.44, 18.30, 18.38], [18.38, 18.42, 18.30, 18.32], [18.32, 18.40, 18.28, 18.30]], vwap: [18.44, 18.43, 18.42, 18.41, 18.40, 18.39, 18.38, 18.37], levels: [{price: 18.3, label: "Pre-market high"}]}
        answer: pass
        note: "Five arrivals at the same price in eight minutes, with the session under its own average throughout. That is a level being worn out."
      - chart: {kind: candles, data: [[24.60, 24.66, 24.52, 24.54], [24.54, 24.58, 24.46, 24.48], [24.48, 24.54, 24.44, 24.52], [24.52, 24.56, 24.46, 24.48], [24.48, 24.52, 24.40, 24.42], [24.42, 24.44, 24.34, 24.36], [24.36, 24.40, 24.30, 24.32], [24.32, 24.36, 24.26, 24.28]], vwap: [24.70, 24.68, 24.66, 24.64, 24.62, 24.60, 24.58, 24.56], levels: [{price: 24.4, label: "Yesterday's low"}]}
        answer: take
        note: "First time through the floor, under the session's average all morning, and the minute finished clear of it."
      - chart: {kind: candles, data: [[16.20, 16.28, 16.16, 16.26], [16.26, 16.32, 16.22, 16.24], [16.24, 16.30, 16.18, 16.28], [16.28, 16.32, 16.22, 16.24], [16.24, 16.30, 16.20, 16.28], [16.28, 16.32, 16.24, 16.26], [16.26, 16.30, 16.22, 16.28], [16.28, 16.32, 16.26, 16.30]], vwap: [16.22, 16.23, 16.24, 16.24, 16.25, 16.25, 16.26, 16.26], levels: [{price: 16.32, label: "Round number"}]}
        answer: pass
        note: "Four pushes into the same cent and not one minute finished through it. Arriving is not the same as testing."
    explanation: "Two firsts and two levels that have been visited until there is nothing left behind them."

  - type: tf
    statement: "A level that has held three times is certain to break on the fourth."
    answer: false
    explanation: "Nothing on a chart is certain. What has changed is the balance: fewer orders behind the level, and a crowd that keeps being allowed back."

  - type: fill-choice
    sentence: "Every test of a level spends some of the orders resting ___ it."
    options: ["behind", "above", "inside"]
    answer: "behind"
    explanation: "They are traded against, and nobody is obliged to put them back."

  - type: visual
    component: chart-candles
    data:
      data: [[19.80, 20.00, 19.78, 19.92], [19.92, 19.96, 19.84, 19.86], [19.86, 19.94, 19.82, 19.90], [19.90, 20.00, 19.88, 19.94], [19.94, 19.98, 19.86, 19.88], [19.88, 19.96, 19.84, 19.92], [19.92, 20.00, 19.90, 19.96], [19.96, 20.08, 19.94, 20.06]]
      volume: [164000, 104000, 88000, 118000, 76000, 68000, 82000, 142000]
      levels:
        - {price: 20.0, label: "Round number"}
    caption: "Three arrivals at $20.00 on falling volume, and the fourth one goes straight through."
