id: "4-1"
title: "Map Practice"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [levels, vwap, costs, position-size]
learning_goal: "User prices every read before taking it: the cost against the distance to the next line, and the size against both ceilings."
purpose: "A good read you cannot afford is not a trade, and the only way to know is to price it before you send anything."
terms_introduced: []
reinforces: [3]
prerequisite: "3-4"
xp: 25
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — The PlayBook"]
notes: "First sub of Level 4 and the one new rule in it: read first, price second. Chapter 3's cost ratio and two ceilings do the work. Account named at $20,000 so the account ceiling can bind."
screens:
  - type: intro
    text: "Three reads. Each one priced before a single share is sent."

  - type: story
    character: retail-trader
    text: "Three names on the screen, $20,000 in the account, and the lines already drawn. Nothing new today except the candles."

  - type: theory
    title: "Read first, price second"
    body: "The map tells you there is a trade. The arithmetic tells you whether it survives the cost and whether the account can pay for it. In that order, every time."

  - type: chart-decision
    scenario: "XYZ has taken the line back with two closes above it, and the pre-market high at $12.72 is the first line overhead. Your account is $20,000 and you are sizing 1,600 shares."
    shares: 1600
    state: ["Costs $0.04 a share round trip"]
    chart:
      kind: candles
      data: [[12.44, 12.46, 12.32, 12.34], [12.34, 12.36, 12.26, 12.28], [12.28, 12.34, 12.26, 12.32], [12.32, 12.38, 12.30, 12.36], [12.36, 12.38, 12.32, 12.34], [12.34, 12.44, 12.32, 12.42], [12.42, 12.50, 12.40, 12.48], [12.48, 12.56, 12.46, 12.54], [12.54, 12.60, 12.52, 12.58], [12.58, 12.66, 12.56, 12.64], [12.64, 12.70, 12.62, 12.69]]
      volume: [68000, 74000, 52000, 58000, 64000, 132000, 114000, 98000, 86000, 78000, 72000]
      vwap: [12.48, 12.46, 12.44, 12.42, 12.40, 12.38, 12.37, 12.37, 12.38, 12.39, 12.40]
      levels:
        - {price: 12.72, label: "Pre-market high"}
      decision_index: 6
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $12.69, three cents short of the line — $0.21 a share past the decision, +$336 long on 1,600 shares."
    explanation: "Two closes back above the line, twenty-four cents of room to the next one, and four cents of cost to get there and back. The read and the price agree."

  - type: numeric-input
    prompt: "Costs run four cents a share on that trade and you took 1,600 shares. What does the round trip hand over?"
    answer: 64
    tolerance: 0.01
    unit: "$"
    working: "$0.04 a share × 1,600 shares = $64"
    explanation: "A per-share number means nothing until the share count is attached, and $64 is what the trip costs whether it works or not."

  - type: slider
    prompt: "Costs four cents a share, and the line above is twenty-four cents away. How much of that target goes to costs?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 15
    tolerance: 10
    explanation: "$0.04 ÷ $0.24 is about 17 %, which leaves most of the move for the trade. Past a third, the read stops being worth taking."

  - type: chart-decision
    scenario: "XYZ has finished every minute above the line and has just closed through yesterday's high at $26.40. Your account is $20,000, the risk budget is $200, and a stop under the breakout minute sits at $26.31."
    shares: 700
    state: ["Risk budget $200", "Stop $26.31"]
    chart:
      kind: candles
      data: [[26.10, 26.20, 26.08, 26.18], [26.18, 26.26, 26.16, 26.24], [26.24, 26.28, 26.20, 26.22], [26.22, 26.34, 26.20, 26.32], [26.32, 26.38, 26.30, 26.36], [26.36, 26.48, 26.34, 26.46], [26.46, 26.54, 26.44, 26.52], [26.52, 26.60, 26.50, 26.58], [26.58, 26.66, 26.56, 26.64], [26.64, 26.72, 26.62, 26.70], [26.70, 26.78, 26.68, 26.75]]
      volume: [84000, 96000, 72000, 88000, 104000, 156000, 132000, 118000, 102000, 92000, 84000]
      vwap: [26.10, 26.14, 26.18, 26.22, 26.25, 26.28, 26.31, 26.34, 26.37, 26.40, 26.43]
      levels:
        - {price: 26.4, label: "Yesterday's high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $26.75 — $0.29 a share past the decision, +$203 long on 700 shares."
    explanation: "The read is clean, and 700 shares is all of it you can hold: at $26.46 that is $18,522, and the account has $20,000."

  - type: numeric-mc
    prompt: "Same trade: $200 of risk budget, fifteen cents of stop, $26.46 a share, $20,000 in the account. How many shares does the pair of ceilings allow?"
    options:
      - {text: "755 — the account binds", correct: true}
      - {text: "1,333 — the risk budget binds"}
      - {text: "1,900 — the stop is tight"}
    working: "$200 ÷ $0.15 = 1,333 shares; $20,000 ÷ $26.46 = 755 shares; take the lower of the two"
    explanation: "The stop would let you hold 1,333, and the bank will not pay for them. The lower number is the size, every time."

  - type: tf
    statement: "A read good enough to trade can still be a trade you are not able to take."
    answer: true
    explanation: "The account ceiling is not a cost you can weigh up — it is cash you either have or do not have."

  - type: chart-decision
    scenario: "XYZ is stepping up above the line, the bars underneath are all near 10,000 shares, and the panel reads bid $18.09 / ask $18.23. Your account is $20,000 and you are sizing 1,100 shares."
    shares: 1100
    chart:
      kind: candles
      data: [[17.96, 18.04, 17.94, 18.02], [18.02, 18.10, 18.00, 18.08], [18.08, 18.12, 18.04, 18.06], [18.06, 18.14, 18.04, 18.12], [18.12, 18.14, 18.08, 18.10], [18.10, 18.18, 18.08, 18.16], [18.16, 18.18, 18.10, 18.12], [18.12, 18.20, 18.10, 18.18], [18.18, 18.20, 18.12, 18.14], [18.14, 18.22, 18.12, 18.20]]
      volume: [11000, 9000, 8000, 12000, 7000, 14000, 9000, 8000, 11000, 10000]
      vwap: [17.96, 17.97, 17.98, 17.99, 18.00, 18.01, 18.02, 18.03, 18.04, 18.05]
      decision_index: 5
    best: no-trade
    reasonable: []
    outcome: "Four minutes later it was $18.20 — $0.04 a share past the decision, $44 on 1,100 shares against the $154 the gap would have taken."
    explanation: "Fourteen cents wide against minutes that travel ten, and 1,100 shares is a tenth of everything this stock trades in a minute. The read is the least of the problems."

  - type: fill-choice
    sentence: "The read says a trade is there; the ___ says whether you may take it."
    options: ["cost", "chart", "clock"]
    answer: "cost"
    explanation: "Two separate questions, and the second one has stopped better reads than that."

  - type: checklist-reveal
    title: "Pricing a read"
    items:
      - "How far is the next line from the entry?"
      - "What do the gap, the slippage and the fees take out of it?"
      - "What does the stop allow, and what can the account pay for?"
      - "Which of those two share counts is smaller?"
