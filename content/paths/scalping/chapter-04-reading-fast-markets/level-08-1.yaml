id: "8-1"
title: "Checkpoint"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: test
tags: [checkpoint, candles, confluence, levels]
learning_goal: "User proves they can name a 1-minute shape, count the readings standing at a price, price the trade those readings offer, and pass when only one of them is there."
purpose: "The three strands ahead each assume the shape, the line and the count are read without effort."
terms_introduced: []
reinforces: [2, 3]
prerequisite: "7-3"
xp: 40
difficulty: 2
sources: ["Volman — Understanding Price Action", "Nison — Japanese Candlestick Charting Techniques"]
notes: "Ten scored questions on Levels 6 and 7 with fresh wordings and numbers. Three reach back: Chapter 2's climax volume at a level, and Chapter 3's order book and spread. Account named at $28,000."
screens:
  - type: intro
    text: "Ten questions on the shapes and the count. Nothing here is timed, so read each chart properly."
    counter: 10

  - type: chart-tap
    prompt: "Tap the minute whose push was refused before it finished."
    chart:
      kind: candles
      data: [[21.10, 21.18, 21.06, 21.16], [21.16, 21.24, 21.14, 21.22], [21.22, 21.28, 21.18, 21.26], [21.26, 21.32, 21.24, 21.30], [21.30, 21.52, 21.28, 21.32], [21.32, 21.36, 21.26, 21.28], [21.28, 21.32, 21.22, 21.24], [21.24, 21.28, 21.18, 21.20], [21.20, 21.24, 21.14, 21.16]]
      volume: [86000, 94000, 88000, 92000, 198000, 104000, 96000, 88000, 82000]
    target: 4
    explanation: "Twenty-two cents of push and twenty of it handed back inside the same minute, on the busiest bar of the nine."

  - type: mc
    prompt: "Price is at $19.70. Which of these leaves two separate readings standing at $19.80?"
    options:
      - {text: "The high of the day at $19.80, which is also the level that capped the last two pushes"}
      - {text: "Resistance at $19.80 and the top of the morning's range at $19.80"}
      - {text: "Yesterday's close at $19.80 and the round number sitting eight cents away", correct: true}
    explanation: "The first two are one price with a second name on it. A price from the last full session and a number people type into orders are two different habits agreeing."

  - type: chart-decision
    scenario: "Yesterday's high is $24.98 and the round number above it is $25.00. XYZ has finished every minute above its own average price, and the minute that just closed took both lines on the heaviest bar of the morning."
    shares: 1000
    state: ["Size: 1,000 shares", "Account: $28,000"]
    chart:
      kind: candles
      data: [[24.60, 24.68, 24.58, 24.66], [24.66, 24.74, 24.64, 24.72], [24.72, 24.78, 24.68, 24.70], [24.70, 24.78, 24.68, 24.76], [24.76, 24.82, 24.72, 24.78], [24.78, 25.06, 24.76, 25.04], [25.04, 25.12, 25.02, 25.10], [25.10, 25.18, 25.08, 25.16], [25.16, 25.24, 25.14, 25.22], [25.22, 25.28, 25.20, 25.26], [25.26, 25.38, 25.24, 25.35]]
      volume: [78000, 86000, 62000, 68000, 58000, 176000, 144000, 122000, 106000, 94000, 86000]
      vwap: [24.60, 24.63, 24.65, 24.67, 24.69, 24.72, 24.76, 24.80, 24.84, 24.88, 24.92]
      levels:
        - {price: 24.98, label: "Yesterday's high"}
        - {price: 25.0, label: "Round number"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran on to $25.35 — $0.31 a share past the decision, +$310 long on 1,000 shares."
    explanation: "Two lines inside two cents, a session that has never been under its own average, a body that finished clear of both, and three times the volume of the minutes before it."

  - type: numeric-input
    prompt: "You take 1,000 shares of that at $25.04 with the stop under the low of the minute that did it, at $24.74. What is at risk?"
    answer: 300
    tolerance: 0.01
    unit: "$"
    working: "$25.04 − $24.74 = $0.30 a share; $0.30 × 1,000 shares = $300"
    explanation: "Thirty cents is a wide stop for a scalp, and 1,000 × $25.04 is $25,040, so the account carries the position but only just."

  - type: tf
    statement: "A push refused at a level on the heaviest bar of the session says more than the same push on a quiet one."
    answer: true
    explanation: "Somebody was there to refuse it. On a quiet bar the price simply ran out of buyers rather than meeting sellers."

  - type: depth-ladder
    prompt: "You market-sell 1,200 shares into this book. Where does the last share fill?"
    data:
      bids: [[17.40, 400], [17.39, 500], [17.38, 1600]]
      asks: [[17.42, 700], [17.43, 900], [17.44, 500]]
    target: bid-3
    explanation: "400 shares go at $17.40 and 500 at $17.39, and the last 300 need the 1,600 resting at $17.38."

  - type: sort
    prompt: "Does the price have a second reading standing at it, or only the first one?"
    buckets: ["A second reading", "Only the first"]
    items:
      - {text: "Yesterday's low, with the session's average price arriving at the same cent", bucket: "A second reading"}
      - {text: "A round number, with price above its own average all session", bucket: "A second reading"}
      - {text: "The pre-market high, on a chart with nothing else drawn on it", bucket: "Only the first"}
      - {text: "Resistance at $22.40, which is where the morning's range tops out", bucket: "Only the first"}
    explanation: "Two of them were built by different sessions or different habits. The other two are one price, once."

  - type: compare
    prompt: "Costs are the same in both. In which one is a second reading standing at the price the minute just closed through?"
    charts:
      - kind: candles
        data: [[13.60, 13.68, 13.58, 13.66], [13.66, 13.72, 13.62, 13.64], [13.64, 13.70, 13.60, 13.68], [13.68, 13.74, 13.64, 13.72], [13.72, 13.76, 13.68, 13.70], [13.70, 13.86, 13.68, 13.84], [13.84, 13.90, 13.82, 13.88], [13.88, 13.94, 13.86, 13.92]]
        vwap: [14.02, 14.01, 14.00, 13.99, 13.98, 13.97, 13.97, 13.96]
        levels:
          - {price: 13.8, label: "Yesterday's high"}
        label: "A"
      - kind: candles
        data: [[13.60, 13.68, 13.58, 13.66], [13.66, 13.72, 13.62, 13.64], [13.64, 13.70, 13.60, 13.68], [13.68, 13.74, 13.64, 13.72], [13.72, 13.76, 13.68, 13.70], [13.70, 13.86, 13.68, 13.84], [13.84, 13.90, 13.82, 13.88], [13.88, 13.94, 13.86, 13.92]]
        vwap: [13.58, 13.60, 13.62, 13.64, 13.66, 13.69, 13.72, 13.75]
        levels:
          - {price: 13.8, label: "Yesterday's high"}
        label: "B"
    answer: "B"
    explanation: "Same candles, same line. In B the session has been above its own average the whole way, so the break has the day behind it; in A the break is still happening underneath it."

  - type: numeric-mc
    prompt: "Bid $15.94 / ask $15.99. You take 1,200 shares and close the position a minute later. What has the gap alone taken?"
    options:
      - {text: "$6"}
      - {text: "$600"}
      - {text: "$0.05"}
      - {text: "$60", correct: true}
    working: "$15.99 − $15.94 = $0.05 a share; $0.05 × 1,200 shares = $60"
    explanation: "Paid once across the open and the close, and taken straight out of the distance to your next line."

  - type: chart-decision
    scenario: "Price is above its own average price, there is no line within twenty cents in either direction, and the bars have been the same size for ten minutes."
    shares: 1400
    state: ["Size: 1,400 shares", "Costs: $0.04 a share round trip"]
    chart:
      kind: candles
      data: [[13.40, 13.46, 13.36, 13.44], [13.44, 13.48, 13.40, 13.42], [13.42, 13.48, 13.38, 13.46], [13.46, 13.50, 13.42, 13.44], [13.44, 13.50, 13.40, 13.48], [13.48, 13.52, 13.44, 13.50], [13.50, 13.54, 13.46, 13.48], [13.48, 13.52, 13.44, 13.50], [13.50, 13.54, 13.46, 13.52], [13.52, 13.56, 13.48, 13.50], [13.50, 13.54, 13.46, 13.52]]
      volume: [58000, 54000, 60000, 52000, 56000, 50000, 54000, 48000, 52000, 50000, 54000]
      vwap: [13.38, 13.39, 13.40, 13.41, 13.42, 13.42, 13.43, 13.44, 13.44, 13.45, 13.45]
      levels: []
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It was $13.52 five minutes later — $0.02 a share past the decision, $28 on 1,400 shares against $56 of costs."
    explanation: "One reading, and it is the cheapest one on the list. Nothing to enter at, nothing to aim at, and the round trip costs twice what the move paid."

  - type: summary
    total: 10
