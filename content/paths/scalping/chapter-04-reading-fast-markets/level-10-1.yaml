id: "10-1"
title: "Fan-out B — VWAP & Levels in Action"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, levels, confluence]
learning_goal: "User can spot the session's average price arriving at a marked level and trade the price the two of them share."
purpose: "The cleanest situation a fast chart offers is two independent lines landing on the same cent."
terms_introduced: []
reinforces: [2]
prerequisite: "8-1"
xp: 25
difficulty: 2
path_position: fan-out:levels
sources: ["Volman — Understanding Price Action", "Murphy — Technical Analysis of the Financial Markets"]
notes: "Strand B, first sub. Self-contained: uses nothing from strands A or C. Chapter 2's support and resistance are the levels the line is meeting. Account named at $26,000."
screens:
  - type: intro
    text: "One of your lines is drawn before the open. The other one walks towards it all morning."

  - type: theory
    title: "The line comes to the level"
    body: "Your levels sit still. The session's average price moves all day, and some of that time it is walking straight into one of them. When it arrives, one price carries both."

  - type: example
    body: "Yesterday's low is $17.20 and has been overhead since the open. By the middle of the morning the session's average price has fallen to $17.21. Two readings, one cent apart, and every push into them is arguing with both."
    visual: chart-candles
    visual_data:
      data: [[16.82, 16.88, 16.78, 16.86], [16.86, 16.92, 16.84, 16.90], [16.90, 16.98, 16.86, 16.96], [16.96, 17.04, 16.94, 17.02], [17.02, 17.10, 17.00, 17.08], [17.08, 17.16, 17.06, 17.14], [17.14, 17.20, 17.12, 17.18], [17.18, 17.24, 17.14, 17.16]]
      volume: [94000, 88000, 88000, 82000, 76000, 70000, 84000, 164000]
      vwap: [17.34, 17.32, 17.30, 17.28, 17.26, 17.24, 17.22, 17.21]
      levels:
        - {price: 17.2, label: "Yesterday's low"}

  - type: chart-tap
    prompt: "Tap the minute where the session's average price and yesterday's close met price at the same cent."
    chart:
      kind: candles
      data: [[15.86, 15.92, 15.84, 15.90], [15.90, 15.94, 15.84, 15.86], [15.86, 15.88, 15.78, 15.80], [15.80, 15.84, 15.74, 15.76], [15.76, 15.78, 15.68, 15.70], [15.70, 15.74, 15.64, 15.66], [15.66, 15.68, 15.58, 15.60], [15.60, 15.64, 15.54, 15.56], [15.56, 15.58, 15.48, 15.50]]
      volume: [94000, 86000, 78000, 72000, 68000, 74000, 82000, 88000, 132000]
      vwap: [15.42, 15.43, 15.44, 15.45, 15.46, 15.47, 15.48, 15.49, 15.5]
      levels:
        - {price: 15.5, label: "Yesterday's close"}
    target: 8
    explanation: "Price finished at $15.50, the line reached $15.50, and the last full session closed there. Three sessions' worth of opinion on one cent."

  - type: chart-decision
    scenario: "Yesterday's low at $17.20 has been overhead since the open and the session's average price has fallen to a cent above it. XYZ rallied into both, traded four cents through, and finished the minute back underneath on the heaviest bar of the morning."
    shares: 1400
    state: ["Size: 1,400 shares", "Account: $26,000"]
    chart:
      kind: candles
      data: [[16.90, 16.98, 16.86, 16.96], [16.96, 17.04, 16.94, 17.02], [17.02, 17.10, 17.00, 17.08], [17.08, 17.16, 17.06, 17.14], [17.14, 17.20, 17.12, 17.18], [17.18, 17.24, 17.14, 17.16], [17.16, 17.18, 17.08, 17.10], [17.10, 17.12, 17.02, 17.04], [17.04, 17.06, 16.96, 16.98], [16.98, 17.00, 16.90, 16.92], [16.92, 16.94, 16.84, 16.87]]
      volume: [88000, 82000, 76000, 70000, 84000, 164000, 132000, 116000, 102000, 92000, 84000]
      vwap: [17.30, 17.28, 17.26, 17.24, 17.22, 17.21, 17.20, 17.19, 17.17, 17.15, 17.13]
      levels:
        - {price: 17.2, label: "Yesterday's low"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It rolled back to $16.87 — $0.29 a share under the decision, +$406 short on 1,400 shares."
    explanation: "The rally had to beat the last full session's floor and the price this session has paid on average, and it beat neither of them for a full minute."

  - type: numeric-input
    prompt: "You short 1,400 shares of that at $17.16 with the stop two cents above the refused high of $17.24. What is at risk?"
    answer: 140
    tolerance: 0.01
    unit: "$"
    working: "$17.26 − $17.16 = $0.10 a share; $0.10 × 1,400 shares = $140"
    explanation: "Two lines an inch apart give you a stop just beyond both of them, which is the other reason this situation is worth waiting for."

  - type: mc
    prompt: "Why is a level worth more when the session's average price has arrived at it?"
    options:
      - {text: "Because the average price makes the level move to meet it"}
      - {text: "Because the spread is always tighter at the average price"}
      - {text: "Because two separate crowds are watching the same cent", correct: true}
    explanation: "One crowd is trading yesterday's map and the other is trading today's cost. They only agree occasionally, and this is what it looks like when they do."

  - type: compare
    prompt: "In which chart is the push running into two readings rather than one?"
    charts:
      - kind: candles
        data: [[22.40, 22.48, 22.38, 22.46], [22.46, 22.54, 22.44, 22.52], [22.52, 22.58, 22.48, 22.50], [22.50, 22.58, 22.48, 22.56], [22.56, 22.62, 22.54, 22.60], [22.60, 22.66, 22.56, 22.58], [22.58, 22.64, 22.54, 22.62], [22.62, 22.70, 22.60, 22.66]]
        vwap: [22.36, 22.38, 22.40, 22.42, 22.44, 22.46, 22.48, 22.50]
        levels:
          - {price: 22.7, label: "Yesterday's high"}
        label: "A"
      - kind: candles
        data: [[22.40, 22.48, 22.38, 22.46], [22.46, 22.54, 22.44, 22.52], [22.52, 22.58, 22.48, 22.50], [22.50, 22.58, 22.48, 22.56], [22.56, 22.62, 22.54, 22.60], [22.60, 22.66, 22.56, 22.58], [22.58, 22.64, 22.54, 22.62], [22.62, 22.70, 22.60, 22.66]]
        vwap: [22.62, 22.64, 22.66, 22.68, 22.69, 22.70, 22.70, 22.71]
        levels:
          - {price: 22.7, label: "Yesterday's high"}
        label: "B"
    answer: "B"
    explanation: "Same candles both times. In B the session's average price has climbed to the level the push is arriving at; in A it is twenty cents below and taking no part in what happens up there."

  - type: tf
    statement: "A level is worth more when the session's average price is nowhere near it, because there is more room to run."
    answer: false
    explanation: "Room is worth something and agreement is worth more. A line on its own is one reading, whatever the distance to the next one."

  - type: spot-mistake
    prompt: "Tap the part a trader would have to unlearn."
    segments:
      - {text: "Yesterday's low and the session's average price are both at $17.20,"}
      - {text: "and price has been under both of them all morning,"}
      - {text: "so the trade is a long into them.", wrong: true}
    explanation: "Two lines overhead are two reasons the rally stops, not two reasons to join it."

  - type: chart-decision
    scenario: "The round number at $19.00 and yesterday's close at $18.98 sit together above. Price has been above its own average price all session, and the last six minutes have gone nowhere twenty-six cents under the pair."
    shares: 1300
    state: ["Size: 1,300 shares", "Costs: $0.04 a share round trip"]
    chart:
      kind: candles
      data: [[18.66, 18.72, 18.62, 18.70], [18.70, 18.74, 18.66, 18.68], [18.68, 18.74, 18.64, 18.72], [18.72, 18.76, 18.68, 18.70], [18.70, 18.76, 18.66, 18.74], [18.74, 18.78, 18.70, 18.72], [18.72, 18.78, 18.68, 18.76], [18.76, 18.80, 18.72, 18.74], [18.74, 18.80, 18.70, 18.78], [18.78, 18.82, 18.74, 18.76], [18.76, 18.82, 18.72, 18.79]]
      volume: [62000, 56000, 60000, 54000, 58000, 52000, 56000, 50000, 54000, 58000, 52000]
      vwap: [18.60, 18.61, 18.62, 18.63, 18.64, 18.65, 18.66, 18.66, 18.67, 18.68, 18.68]
      levels:
        - {price: 19.0, label: "Round number"}
        - {price: 18.98, label: "Yesterday's close"}
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It was $18.79 five minutes later — $0.07 a share past the decision, $91 on 1,300 shares against $52 of costs, and the pair of lines was never reached."
    explanation: "Two readings at one price are worth waiting for and worth nothing until price is standing at them. This is a plan, not a trade."

  - type: numeric-mc
    prompt: "You are long 1,300 shares from $18.76 and the pair of lines at $19.00 is where you are getting out. What is the stretch worth before costs?"
    options:
      - {text: "$24"}
      - {text: "$312", correct: true}
      - {text: "$2,400"}
      - {text: "$130"}
    working: "$19.00 − $18.76 = $0.24 a share; $0.24 × 1,300 shares = $312"
    explanation: "The pair of lines that is too far away to enter at is exactly the right distance to aim at."

  - type: checklist-reveal
    title: "When two lines meet"
    items:
      - "Which two readings are standing at this price?"
      - "Is price at them now, or still on its way?"
      - "Which side did the last finished minute settle on?"
      - "Where does the stop go so it is beyond both of them?"
