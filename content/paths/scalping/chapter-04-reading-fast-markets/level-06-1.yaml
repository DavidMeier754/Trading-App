id: "6-1"
title: "Candle Signals on the 1-Minute"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [candles, signals]
learning_goal: "User can name a momentum candle and a doji on a 1-minute chart and say who won the minute in each."
purpose: "On a fast chart one candle is the smallest piece of evidence you get, and you have to read it in a glance."
terms_introduced: ["Doji"]
reinforces: [2]
prerequisite: "5-1"
xp: 25
difficulty: 2
sources: ["Nison — Japanese Candlestick Charting Techniques", "Volman — Understanding Price Action"]
notes: "Chapter 2's body-and-wick measuring, re-tested on the two easiest shapes. Account named at $22,000."
screens:
  - type: intro
    text: "Sixty seconds of arguing, drawn as one candle."

  - type: theory
    title: "One minute, one argument"
    body: "Every candle on a 1-minute chart is sixty seconds of buyers and sellers arguing. The body is what the minute settled; the wicks are what it tried and gave back."

  - type: carousel
    cards:
      - {label: "Momentum candle", text: "A long body with barely any wick. One side pushed from the first second to the last and never handed anything back.", icon: candle-momentum}
      - {label: "Doji", text: "Open and close at almost the same price, with wicks on both sides. The minute ran out before either side finished in front.", icon: candle-doji}

  - type: visual
    component: chart-candles
    data:
      data: [[12.60, 12.64, 12.56, 12.62], [12.62, 12.80, 12.60, 12.78], [12.78, 12.84, 12.76, 12.78], [12.78, 12.82, 12.72, 12.80], [12.80, 12.96, 12.78, 12.94], [12.94, 12.98, 12.88, 12.90], [12.90, 12.94, 12.84, 12.86], [12.86, 12.92, 12.82, 12.90]]
      volume: [48000, 126000, 38000, 52000, 138000, 64000, 46000, 58000]
    caption: "Two minutes where one side pushed the whole way, and one that ended exactly where it began."

  - type: chart-tap
    prompt: "Tap the doji."
    chart:
      kind: candles
      data: [[14.20, 14.26, 14.16, 14.24], [14.24, 14.38, 14.22, 14.36], [14.36, 14.42, 14.34, 14.40], [14.40, 14.46, 14.34, 14.40], [14.40, 14.48, 14.38, 14.46], [14.46, 14.52, 14.42, 14.50], [14.50, 14.54, 14.44, 14.46], [14.46, 14.56, 14.44, 14.54], [14.54, 14.60, 14.50, 14.58]]
      volume: [64000, 148000, 72000, 44000, 86000, 78000, 62000, 94000, 70000]
    target: 3
    explanation: "Open and close both $14.40, with six cents of wick above and below. That minute settled nothing."

  - type: mc
    prompt: "A minute opens and closes at the same price with wicks on both sides. What does it tell you?"
    options:
      - {text: "Buyers gave up and went home"}
      - {text: "Neither side finished ahead", correct: true}
      - {text: "The move is about to reverse"}
    explanation: "Both sides were active — the wicks prove it — and neither of them kept the ground they took."

  - type: tf
    statement: "A long body with almost no wick says one side held everything it took during the minute."
    answer: true
    explanation: "Nothing was given back at any point, which is what makes the shape worth noticing at all."

  - type: chart-decision
    scenario: "Five minutes inside four cents above the line, and then a sixteen-cent body with barely any wick."
    shares: 1400
    state: ["Size: 1,400 shares", "Account: $22,000"]
    chart:
      kind: candles
      data: [[14.28, 14.34, 14.26, 14.32], [14.32, 14.38, 14.30, 14.36], [14.36, 14.38, 14.32, 14.34], [14.34, 14.38, 14.32, 14.36], [14.36, 14.38, 14.32, 14.34], [14.34, 14.52, 14.33, 14.50], [14.50, 14.56, 14.48, 14.54], [14.54, 14.60, 14.52, 14.58], [14.58, 14.64, 14.56, 14.62], [14.62, 14.68, 14.60, 14.66], [14.66, 14.72, 14.64, 14.69]]
      volume: [62000, 58000, 44000, 48000, 42000, 164000, 128000, 110000, 96000, 84000, 76000]
      vwap: [14.28, 14.29, 14.30, 14.30, 14.31, 14.32, 14.34, 14.36, 14.38, 14.40, 14.42]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $14.69 — $0.19 a share past the decision, +$266 long on 1,400 shares."
    explanation: "Five quiet minutes of nothing, then one minute that took sixteen cents and kept every one of them, on three times the volume of the five before it."

  - type: numeric-input
    prompt: "You are long 1,400 shares from $14.50 with the stop at the open of that candle, $14.34. What is at risk?"
    answer: 224
    tolerance: 0.01
    unit: "$"
    working: "$14.50 − $14.34 = $0.16 a share; $0.16 × 1,400 shares = $224"
    explanation: "The body of the candle is the risk: if price goes back through where the minute started, the minute meant nothing."

  - type: fill-tiles
    sentence: "A minute that opens and closes at the same price is a ___."
    answer: "doji"
    explanation: "Both sides turned up and neither of them finished in front."

  - type: compare
    prompt: "Which chart's last minute is the momentum candle?"
    charts:
      - kind: candles
        data: [[17.20, 17.26, 17.16, 17.24], [17.24, 17.28, 17.20, 17.22], [17.22, 17.28, 17.18, 17.26], [17.26, 17.30, 17.22, 17.24], [17.24, 17.28, 17.20, 17.26], [17.26, 17.30, 17.22, 17.28], [17.28, 17.32, 17.24, 17.26], [17.26, 17.44, 17.25, 17.42]]
        label: "A"
      - kind: candles
        data: [[17.20, 17.26, 17.16, 17.24], [17.24, 17.28, 17.20, 17.22], [17.22, 17.28, 17.18, 17.26], [17.26, 17.30, 17.22, 17.24], [17.24, 17.28, 17.20, 17.26], [17.26, 17.30, 17.22, 17.28], [17.28, 17.32, 17.24, 17.26], [17.26, 17.44, 17.24, 17.28]]
        label: "B"
    answer: "A"
    explanation: "Both last minutes reached $17.44. A finished sixteen cents up and kept it; B gave all sixteen back and finished two cents up."

  - type: theory
    title: "Two shapes down"
    body: "A long body is one side holding everything. A flat one is nobody holding anything. Next: the two shapes that show a minute being taken back."
