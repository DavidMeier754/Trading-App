id: "1-4"
title: "VWAP"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, decisions, practice]
learning_goal: "User picks the side the line allows and stands aside when the session's closes sit on both sides of it."
purpose: "The line is only worth having on the chart if it changes which charts you are willing to trade."
terms_introduced: []
reinforces: [1]
prerequisite: "1-3"
xp: 25
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "Closes Level 1 with the side filter and a recap. Account named at $22,000; every worked position fits it."
screens:
  - type: intro
    text: "One line, one filter, and most of the morning's charts gone."

  - type: story
    character: retail-trader
    text: "The first half hour is behind you. One stock on the screen, $22,000 in the account, and one rule for the rest of the morning."

  - type: theory
    title: "The side filter"
    body: "Long only while the session's closes are above the line. Short only while they are below it. Nothing when they are on both sides of it."

  - type: swipe-deck
    prompt: "Your rule: the last minute finished above the line and the session's closes have been above it too. Take it, or pass?"
    cards:
      - chart: {kind: candles, data: [[21.10, 21.20, 21.06, 21.18], [21.18, 21.26, 21.14, 21.24], [21.24, 21.28, 21.18, 21.20], [21.20, 21.32, 21.18, 21.30], [21.30, 21.40, 21.28, 21.38], [21.38, 21.44, 21.34, 21.36], [21.36, 21.50, 21.34, 21.48], [21.48, 21.58, 21.46, 21.56]], vwap: [21.12, 21.15, 21.17, 21.19, 21.22, 21.25, 21.28, 21.32]}
        answer: take
        note: "Every close of the session clear of the line, and the last one the highest of them."
      - chart: {kind: candles, data: [[13.60, 13.62, 13.50, 13.52], [13.52, 13.56, 13.44, 13.46], [13.46, 13.52, 13.42, 13.50], [13.50, 13.52, 13.40, 13.42], [13.42, 13.46, 13.34, 13.36], [13.36, 13.40, 13.30, 13.32], [13.32, 13.36, 13.24, 13.26], [13.26, 13.30, 13.18, 13.20]], vwap: [13.70, 13.66, 13.63, 13.60, 13.57, 13.54, 13.50, 13.46]}
        answer: pass
        note: "Not one close above the line. This is the mirror of the rule, not the rule."
      - chart: {kind: candles, data: [[16.20, 16.24, 16.10, 16.12], [16.12, 16.16, 16.02, 16.04], [16.04, 16.10, 16.00, 16.08], [16.08, 16.12, 16.02, 16.06], [16.06, 16.10, 16.00, 16.04], [16.04, 16.08, 15.98, 16.02], [16.02, 16.12, 16.00, 16.10], [16.10, 16.22, 16.08, 16.20]], vwap: [16.26, 16.22, 16.19, 16.17, 16.15, 16.13, 16.12, 16.11]}
        answer: pass
        note: "The last minute is above and the seven before it are not. Half the rule is not the rule."
      - chart: {kind: candles, data: [[24.40, 24.52, 24.36, 24.50], [24.50, 24.60, 24.46, 24.58], [24.58, 24.64, 24.52, 24.54], [24.54, 24.68, 24.52, 24.66], [24.66, 24.76, 24.62, 24.74], [24.74, 24.80, 24.68, 24.72], [24.72, 24.86, 24.70, 24.84], [24.84, 24.94, 24.80, 24.92]], vwap: [24.42, 24.46, 24.49, 24.52, 24.56, 24.60, 24.64, 24.68]}
        answer: take
        note: "Above the line from the first minute, and the line climbing underneath it."
      - chart: {kind: candles, data: [[19.00, 19.06, 18.94, 18.98], [18.98, 19.04, 18.92, 19.02], [19.02, 19.08, 18.96, 18.99], [18.99, 19.05, 18.93, 19.03], [19.03, 19.07, 18.95, 18.97], [18.97, 19.04, 18.92, 19.02], [19.02, 19.06, 18.94, 18.98], [18.98, 19.05, 18.93, 19.01]], vwap: [19.00, 19.00, 19.00, 19.00, 19.00, 19.00, 19.00, 19.00]}
        answer: pass
        note: "Four closes above and four below. Nobody owns this session, so neither side is on offer."
    explanation: "Two of the five are the rule. The other three are a rule that has only half happened."

  - type: chart-decision
    scenario: "Not one close above the line all session — the best XYZ managed was six cents underneath. The minute that just closed is the lowest of the morning."
    shares: 1200
    state: ["Size: 1,200 shares", "Account: $22,000"]
    chart:
      kind: candles
      data: [[16.70, 16.74, 16.62, 16.64], [16.64, 16.70, 16.58, 16.60], [16.60, 16.72, 16.58, 16.70], [16.70, 16.72, 16.64, 16.66], [16.66, 16.72, 16.60, 16.62], [16.62, 16.66, 16.54, 16.56], [16.56, 16.60, 16.46, 16.48], [16.48, 16.52, 16.38, 16.40], [16.40, 16.44, 16.30, 16.32], [16.32, 16.36, 16.24, 16.27], [16.27, 16.30, 16.18, 16.19]]
      volume: [64000, 72000, 51000, 68000, 76000, 92000, 108000, 96000, 88000, 74000, 66000]
      vwap: [16.82, 16.78, 16.76, 16.74, 16.72, 16.70, 16.67, 16.64, 16.60, 16.56, 16.52]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It ran down to $16.19 — $0.37 a share under the decision, +$444 short on 1,200 shares."
    explanation: "The filter allows one side here, and the lowest close of the morning is the session agreeing with it."

  - type: numeric-input
    prompt: "That short went on at $16.56 with the stop at $16.68, 1,200 shares. What was the planned loss?"
    answer: 144
    tolerance: 0.01
    unit: "$"
    working: "$16.68 − $16.56 = $0.12 a share; $0.12 × 1,200 shares = $144"
    explanation: "Twelve cents of stop on twelve hundred shares, and 1,200 × $16.56 is $19,872 — inside the account with room left."

  - type: compare
    prompt: "In which of these has the average share of the session been in front all morning?"
    charts:
      - kind: candles
        data: [[15.30, 15.34, 15.22, 15.24], [15.24, 15.28, 15.16, 15.18], [15.18, 15.24, 15.14, 15.22], [15.22, 15.26, 15.12, 15.14], [15.14, 15.18, 15.06, 15.08], [15.08, 15.12, 15.02, 15.04], [15.04, 15.08, 14.96, 14.98], [14.98, 15.02, 14.90, 14.92]]
        vwap: [15.40, 15.36, 15.33, 15.30, 15.27, 15.23, 15.19, 15.15]
        label: "A"
      - kind: candles
        data: [[15.30, 15.40, 15.26, 15.38], [15.38, 15.46, 15.34, 15.44], [15.44, 15.48, 15.38, 15.40], [15.40, 15.52, 15.38, 15.50], [15.50, 15.58, 15.46, 15.56], [15.56, 15.60, 15.50, 15.54], [15.54, 15.66, 15.52, 15.64], [15.64, 15.72, 15.60, 15.70]]
        vwap: [15.32, 15.35, 15.37, 15.40, 15.43, 15.46, 15.49, 15.53]
        label: "B"
    answer: "B"
    explanation: "Both start near $15.30. In B every close is over the line, so whoever bought at any point today is in front; in A nobody is."

  - type: tf
    statement: "One close two cents above the line is enough to call the session's buyers in control."
    answer: false
    explanation: "It is a start. A morning of closes underneath does not get cancelled by a single minute."

  - type: chart-decision
    scenario: "Ten minutes inside sixteen cents, with closes landing on both sides of the line."
    shares: 1300
    state: ["Size: 1,300 shares", "Costs: $0.04 a share round trip"]
    chart:
      kind: candles
      data: [[11.48, 11.54, 11.42, 11.46], [11.46, 11.52, 11.40, 11.50], [11.50, 11.55, 11.44, 11.47], [11.47, 11.53, 11.42, 11.51], [11.51, 11.56, 11.45, 11.48], [11.48, 11.54, 11.43, 11.50], [11.50, 11.55, 11.44, 11.47], [11.47, 11.52, 11.42, 11.49], [11.49, 11.54, 11.43, 11.48], [11.48, 11.53, 11.44, 11.52]]
      volume: [46000, 52000, 44000, 49000, 41000, 47000, 43000, 50000, 45000, 48000]
      vwap: [11.49, 11.49, 11.49, 11.49, 11.49, 11.49, 11.49, 11.49, 11.49, 11.49]
      decision_index: 5
    best: no-trade
    reasonable: []
    outcome: "Four minutes later it was $11.52 — $0.02 a share above the decision, $26 on 1,300 shares against $52 of costs."
    explanation: "The filter has no side to give you here, and the chip above the chart says the round trip costs more than the whole move."

  - type: slider
    prompt: "Four out of five of today's shares traded at $18.30 and the rest at $18.80. Where is the line?"
    min: 18.3
    max: 18.8
    step: 0.05
    unit: "$"
    answer: 18.4
    tolerance: 0.1
    explanation: "0.8 × $18.30 + 0.2 × $18.80 = $18.40 — a tenth of the way up a fifty-cent range, because that is where the shares are."

  - type: recap
    title: "Level 1 in three lines"
    points:
      - {text: "VWAP averages every price of the session weighted by the shares that traded at it.", level: "1-1"}
      - {text: "It is one running total, so it swings at the open and barely moves late in the day.", level: "1-2"}
      - {text: "Large orders are scored against it, which is why price keeps reacting there.", level: "1-3"}
