id: "15-1"
title: "Halts and Standing Aside"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [open, halt, no-trade]
learning_goal: "User knows what a halt does to an open position and can name the conditions that make the opening minutes untradeable."
purpose: "Standing aside for the first minutes costs nothing; being in the wrong stock at the wrong second costs a lot."
terms_introduced: ["Halt"]
skills: ["Halt"]
reinforces: [3]
prerequisite: "14-3"
xp: 20
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Carter — Mastering the Trade"]
notes: "Halt mechanics kept generic so both market profiles fit."
screens:
  - type: intro
    text: "Some mornings the honest read is: not this one."

  - type: theory
    title: "When trading stops"
    body: "If a stock moves too far too fast, or news is about to be released, the exchange pauses trading in it for a few minutes. That pause is a halt, and it happens most often near the open."

  - type: theory
    title: "What a halt does to you"
    body: "During a halt nothing fills. Your stop cannot protect you, because there is nothing to trade against. When the stock reopens it can start far away from where it stopped."

  - type: example
    body: "You are long 1,000 shares at $12.40 with a stop at $12.28. The stock halts and reopens at $11.90. Your stop fills there: $0.50 per share, $500, not the $120 you planned."

  - type: mc
    prompt: "Why can a stop order not do its job through a halt?"
    options:
      - {text: "Stop orders are cancelled automatically when a stock halts"}
      - {text: "Nothing trades during a halt, so nothing can fill", correct: true}
      - {text: "The broker holds the order back until the price is better"}
    explanation: "A stop needs a market to trade in; during the pause there is none."

  - type: tf
    statement: "A halt is a normal part of a fast session, and it can happen on the way up as well as on the way down."
    answer: true
    explanation: "It is triggered by speed, not by direction — a violent rally halts as readily as a collapse."

  - type: checklist-reveal
    title: "Stand aside when"
    items:
      - "The spread is a large slice of the move you are trading for."
      - "You cannot name a level near the price."
      - "The stock is moving on news you have not read."
      - "Your first two trades of the day were both losses."

  - type: chart-decision
    scenario: "XYZ gapped up on news you have not read. It is swinging fifteen cents a minute and there is no level anywhere near."
    shares: 1000
    state: ["Size: 1,000 shares", "Quote: $0.09 wide"]
    chart:
      kind: candles
      data: [[26.40, 26.62, 26.28, 26.34], [26.34, 26.56, 26.30, 26.52], [26.52, 26.58, 26.26, 26.30], [26.30, 26.50, 26.24, 26.46], [26.46, 26.52, 26.22, 26.28], [26.28, 26.44, 26.20, 26.40], [26.40, 26.46, 26.14, 26.20], [26.20, 26.38, 26.16, 26.34], [26.34, 26.40, 26.10, 26.16], [26.16, 26.32, 26.12, 26.26]]
      volume: [310000, 240000, 270000, 190000, 220000, 180000, 210000, 170000, 190000, 160000]
      decision_index: 5
    best: no-trade
    outcome: "It swung both ways for another ten minutes and got nowhere. Both sides would have been stopped out."
    explanation: "No level, news you cannot read and a nine-cent spread is three reasons to let this one go."

  - type: numeric-input
    prompt: "The spread is $0.09 and you are trading 1,000 shares for a $0.20 target. What does the round trip cost you in spread?"
    answer: 90
    unit: "$"
    working: "$0.09 per share × 1,000 shares = $90"
    explanation: "You would need almost half of your target just to get back to flat."

  - type: slider
    prompt: "That $0.09 spread against a $0.20 target — how much of the target does it take?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 45
    tolerance: 10
    explanation: "$0.09 of $0.20 is 45 % of the move, before slippage and fees."

  - type: spot-mistake
    prompt: "Read it through, then tap the part that is wrong."
    segments:
      - {text: "The stock is halted,"}
      - {text: "so I will place my stop now", wrong: true}
      - {text: "and be protected when it reopens."}
    explanation: "A stop placed during a halt fills at whatever the reopening price is — protection it cannot give."

  - type: fill-tiles
    sentence: "An exchange pausing trading in a stock for a few minutes is called a ___."
    answer: "halt"
    explanation: "Nothing fills while it lasts, and the reopening price can be far away."

  - type: story
    text: "Ten minutes later. The wild stock is still wild; a second one has settled into a clean range above VWAP."

  - type: chart-decision
    scenario: "This one opened quietly, held above VWAP for eight minutes, and is now breaking its opening-range high at $18.30 with volume picking up."
    shares: 1500
    state: ["Size: 1,500 shares"]
    chart:
      kind: candles
      data: [[18.10, 18.20, 18.06, 18.18], [18.18, 18.26, 18.14, 18.22], [18.22, 18.30, 18.18, 18.26], [18.26, 18.30, 18.20, 18.24], [18.24, 18.28, 18.18, 18.26], [18.26, 18.38, 18.24, 18.36], [18.36, 18.46, 18.32, 18.44], [18.44, 18.52, 18.40, 18.50], [18.50, 18.56, 18.46, 18.52], [18.52, 18.58, 18.48, 18.54]]
      vwap: [18.12, 18.15, 18.18, 18.20, 18.21, 18.23, 18.26, 18.29, 18.32, 18.35]
      volume: [72000, 64000, 68000, 51000, 46000, 118000, 94000, 86000, 72000, 66000]
      levels:
        - {price: 18.30, label: "Opening range high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $18.54 — $0.18 per share, +$270 long on 1,500 shares from $18.36."
    explanation: "Above VWAP, a level to break, volume arriving on the break: the same trade the wild stock could not offer you."

  - type: theory
    title: "Two stocks, one morning"
    body: "The chaotic one pays in adrenaline. The orderly one pays in cents you can measure. Both were available at the same minute."
