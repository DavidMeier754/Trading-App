id: "1-1"
title: "VWAP"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, levels]
learning_goal: "User can say what VWAP is, work out a simple volume-weighted average, and read price above or below the line."
purpose: "VWAP is the one line almost every intraday trader has on the screen — including the institutions on the other side of your fills."
terms_introduced: ["VWAP"]
reinforces: [1]
prerequisite: null
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "First sub of the chapter. Defines the line; 1-2 trades it."
screens:
  - type: intro
    text: "One line on your chart knows what the whole session paid."

  - type: theory
    title: "The average price of the session"
    body: "VWAP is the volume-weighted average price: every trade of the session averaged together, with bigger trades counting for more. It starts at the open and updates with every trade."

  - type: example
    body: "So far today XYZ traded 1,000 shares at $20.00, 4,000 at $20.50 and 5,000 at $21.00. That is $207,000 for 10,000 shares. VWAP is $20.70."

  - type: theory
    title: "Weighted, not averaged"
    body: "A plain average of those three prices is $20.50. VWAP says $20.70, because most of the shares changed hands higher up. VWAP follows the shares, not the ticks."

  - type: numeric-mc
    prompt: "2,000 shares trade at $30.00, then 6,000 at $30.40. What is VWAP?"
    options:
      - {text: "$30.20"}
      - {text: "$30.40"}
      - {text: "$30.10"}
      - {text: "$30.30", correct: true}
    working: "(2,000 × $30.00 + 6,000 × $30.40) ÷ 8,000 shares = $30.30"
    explanation: "Three quarters of the shares traded at $30.40, so VWAP sits close to it."

  - type: theory
    title: "Above the line or below it"
    body: "Price above VWAP: buyers have been paying up and the average buyer today is ahead. Below: sellers have had the upper hand. Scalpers lean long above the line and short below it."

  - type: visual
    component: chart-candles
    data:
      data: [[24.10, 24.18, 24.08, 24.16], [24.16, 24.24, 24.14, 24.22], [24.22, 24.26, 24.18, 24.20], [24.20, 24.30, 24.19, 24.28], [24.28, 24.36, 24.26, 24.34], [24.34, 24.38, 24.28, 24.31], [24.31, 24.42, 24.30, 24.40], [24.40, 24.48, 24.38, 24.46]]
      volume: [42000, 51000, 33000, 48000, 62000, 39000, 56000, 61000]
      vwap: [24.12, 24.15, 24.17, 24.19, 24.22, 24.24, 24.27, 24.30]
    caption: "Every candle closes above the VWAP line: buyers in charge all session."

  - type: chart-tap
    prompt: "Tap the first candle that closes below VWAP."
    chart:
      kind: candles
      data: [[31.40, 31.48, 31.36, 31.46], [31.46, 31.54, 31.44, 31.52], [31.52, 31.56, 31.46, 31.48], [31.48, 31.52, 31.40, 31.46], [31.46, 31.48, 31.32, 31.34], [31.34, 31.40, 31.26, 31.28], [31.28, 31.36, 31.24, 31.33], [31.33, 31.38, 31.20, 31.22], [31.22, 31.28, 31.16, 31.18], [31.18, 31.24, 31.10, 31.14]]
      vwap: [31.38, 31.42, 31.44, 31.44, 31.44, 31.42, 31.41, 31.39, 31.36, 31.34]
    target: 4
    explanation: "The candle before it dipped under the line but closed back above — only a close counts."

  - type: tf
    statement: "A stock that has traded under VWAP all morning is showing you buyers in control."
    answer: false
    explanation: "Under the line the average buyer of the session is behind; that is sellers in control."

  - type: theory
    title: "Why the big money watches it"
    body: "An institution filling 400,000 shares is graded against VWAP — buying below it counts as a good fill. Large orders lean on the line, which is why price so often reacts there."

  - type: mc
    prompt: "Why does price react at VWAP so often?"
    options:
      - {text: "Large orders are measured against it and cluster there", correct: true}
      - {text: "It sits exactly halfway between the day's high and low"}
      - {text: "Exchanges use it as the official reference price for the session"}
    explanation: "It matters because so many big orders are judged by it, not because of anything the exchange does."

  - type: fill-choice
    sentence: "VWAP weights every price by the ___ that traded there."
    options: ["volume", "time", "spread"]
    answer: "volume"
    explanation: "Shares, not minutes — that is what makes it volume-weighted."

  - type: slider
    prompt: "XYZ traded between $50.00 and $50.60 today, but four out of five shares changed hands near $50.10. Where is VWAP?"
    min: 50.0
    max: 50.6
    step: 0.05
    unit: "$"
    answer: 50.15
    tolerance: 0.1
    explanation: "Weighted by shares, VWAP sits near where the volume traded, not in the middle of the range."

  - type: numeric-input
    prompt: "You are long 1,000 shares from $20.70. Price is now $20.82. Paper result before costs?"
    answer: 120
    unit: "$"
    working: "$0.12 per share × 1,000 shares = $120"
    explanation: "Twelve cents on a thousand shares — a normal scalp."

  - type: theory
    title: "The day's centre of gravity"
    body: "VWAP is where the session's money actually traded. Next: what price does when it comes back to the line."
