id: "1-1"
title: "VWAP"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, levels]
learning_goal: "User can say what VWAP is and work out a simple volume-weighted average from a handful of trades."
purpose: "VWAP is the one line almost every intraday trader has on the screen, and it is the first thing a scalper looks at after the shape of the chart."
terms_introduced: ["VWAP"]
reinforces: [1]
prerequisite: null
xp: 20
difficulty: 1
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — One Good Trade"]
notes: "First sub of the chapter. Defines the line and computes it; Chapter 1's volume reading is what makes the weighting land."
screens:
  - type: intro
    text: "One line on the chart knows what every share of this session actually paid."

  - type: theory
    title: "The price the session paid"
    body: "VWAP is the volume-weighted average price. Take every trade since the open, weight each price by the shares that traded at it, and average them. It starts at the open and moves with every trade."

  - type: example
    body: "XYZ has traded 2,000 shares at $15.00, 3,000 at $15.20 and 5,000 at $15.30. That is $152,100 for 10,000 shares, so VWAP is $15.21."

  - type: theory
    title: "Weighted, not averaged"
    body: "A plain average of those three prices is $15.17. VWAP says $15.21, because half the shares changed hands at the top price. The line follows the shares, not the list of prices."

  - type: numeric-mc
    prompt: "4,000 shares trade at $19.00, then 1,000 at $19.50. Where is VWAP?"
    options:
      - {text: "$19.25"}
      - {text: "$19.40"}
      - {text: "$19.10", correct: true}
      - {text: "$19.05"}
    working: "(4,000 × $19.00 + 1,000 × $19.50) ÷ 5,000 = $95,500 ÷ 5,000 = $19.10"
    explanation: "Four fifths of the shares went through at $19.00, so the line sits ten cents above it and nowhere near the middle."

  - type: visual
    component: chart-candles
    data:
      data: [[15.02, 15.10, 15.00, 15.08], [15.08, 15.16, 15.06, 15.14], [15.14, 15.18, 15.10, 15.12], [15.12, 15.22, 15.11, 15.20], [15.20, 15.28, 15.18, 15.26], [15.26, 15.30, 15.20, 15.23], [15.23, 15.34, 15.22, 15.32], [15.32, 15.40, 15.30, 15.38]]
      volume: [88000, 96000, 62000, 74000, 108000, 58000, 92000, 104000]
      vwap: [15.04, 15.07, 15.09, 15.11, 15.14, 15.16, 15.19, 15.22]
    caption: "Eight minutes, eight closes above the line, and the line climbing behind them."

  - type: chart-tap
    prompt: "Tap the first minute that finished above the line."
    chart:
      kind: candles
      data: [[12.40, 12.44, 12.32, 12.34], [12.34, 12.38, 12.26, 12.28], [12.28, 12.34, 12.24, 12.32], [12.32, 12.40, 12.30, 12.38], [12.38, 12.42, 12.34, 12.36], [12.36, 12.48, 12.35, 12.46], [12.46, 12.54, 12.44, 12.52], [12.52, 12.56, 12.46, 12.50], [12.50, 12.60, 12.48, 12.58], [12.58, 12.66, 12.56, 12.62]]
      vwap: [12.46, 12.42, 12.40, 12.39, 12.38, 12.39, 12.41, 12.43, 12.45, 12.47]
    target: 5
    explanation: "The fourth minute traded above the line and finished a cent underneath it. This one finished seven cents clear."

  - type: tf
    statement: "VWAP resets every hour, so the afternoon line has nothing to do with the morning."
    answer: false
    explanation: "It runs from the open to the close of the session. Every share of the morning is still inside the afternoon's number."

  - type: theory
    title: "Which side of it you are on"
    body: "Above the line, the average share of this session was bought for less than it is worth now. Below it, the average share is under water. That is the first thing the line tells you."

  - type: mc
    prompt: "Two stocks are both at $18.40. One has traded 4 million shares today, the other 90,000. A 2,000-share trade goes through at $18.70. Whose VWAP barely notices?"
    options:
      - {text: "The one that has traded 4 million shares", correct: true}
      - {text: "The one that has traded 90,000 shares"}
      - {text: "Neither, since the trade is the same size in both"}
    explanation: "Chapter 1's volume reading decides it: 2,000 shares is a rounding error inside 4 million and a real slice of 90,000."

  - type: fill-choice
    sentence: "VWAP counts each price by the number of ___ that traded at it."
    options: ["shares", "minutes", "orders"]
    answer: "shares"
    explanation: "Two minutes can carry wildly different weight; two thousand shares always carry the same."

  - type: numeric-input
    prompt: "The first minute traded 30,000 shares at an average of $21.00. The second traded 10,000 at an average of $21.40. Where is VWAP now?"
    answer: 21.1
    tolerance: 0.01
    unit: "$"
    working: "(30,000 × $21.00 + 10,000 × $21.40) ÷ 40,000 = $844,000 ÷ 40,000 = $21.10"
    explanation: "The quiet second minute moved the line ten cents, because the busy first minute was three times its size."

  - type: sort
    prompt: "Which of these actually drags the line, and which one it ignores?"
    buckets: ["Drags the line", "The line ignores it"]
    items:
      - {text: "400,000 shares changing hands ten cents above it", bucket: "Drags the line"}
      - {text: "600 shares changing hands a dollar above it", bucket: "The line ignores it"}
      - {text: "A 260,000-share minute at the low of the day", bucket: "Drags the line"}
      - {text: "One 100-share trade at the high of the day", bucket: "The line ignores it"}
    explanation: "Distance from the line is not what moves it. Shares are."

  - type: theory
    title: "The session's centre of gravity"
    body: "You can now build the line and say which side of it price is on. Next: how far one more minute of trading can actually shift it."
