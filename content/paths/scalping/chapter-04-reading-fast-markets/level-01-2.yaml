id: "1-2"
title: "VWAP"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, decisions]
learning_goal: "User can tell a bounce, a rejection and a reclaim apart at VWAP and pick the side the line is pointing to."
purpose: "Price comes back to VWAP several times a session — what it does when it gets there is the scalp."
terms_introduced: ["Rejection", "Reclaim"]
prerequisite: "1-1"
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
screens:
  - type: intro
    text: "Price keeps coming back to the line. What happens there is the trade."

  - type: theory
    title: "The magnet"
    body: "In a trending session price runs away from VWAP and then drifts back to it. Traders who missed the move are waiting there, so the pullback often stops at the line."

  - type: example
    body: "XYZ climbs from $33.40 to $33.90, then drifts back to $33.66 — right onto VWAP. The candles shrink on the way down, sellers run out, and it turns back up."
    visual: chart-candles
    visual_data:
      data: [[33.40, 33.52, 33.38, 33.50], [33.50, 33.66, 33.48, 33.64], [33.64, 33.80, 33.62, 33.78], [33.78, 33.90, 33.74, 33.86], [33.86, 33.88, 33.72, 33.74], [33.74, 33.76, 33.64, 33.66], [33.66, 33.68, 33.60, 33.65], [33.65, 33.78, 33.64, 33.76]]
      vwap: [33.44, 33.50, 33.56, 33.60, 33.62, 33.62, 33.62, 33.63]

  - type: carousel
    cards:
      - {label: "Bounce", text: "Price comes down to VWAP from above, buyers defend it, and the move continues in the old direction.", icon: bounce}
      - {label: "Rejection", text: "Price pushes through the line, cannot hold there, and snaps straight back. The side that tried just failed.", icon: rejection}
      - {label: "Reclaim", text: "Price that has been below VWAP closes back above it and holds. Control has changed hands.", icon: reclaim}

  - type: theory
    title: "A poke is not a reclaim"
    body: "One wick through the line proves nothing. A reclaim is a close on the other side that the next candle or two holds. Same rule you use at any level: wait for the close."

  - type: chart-decision
    scenario: "XYZ has climbed all morning and is now easing back into VWAP on shrinking candles. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[18.20, 18.34, 18.18, 18.32], [18.32, 18.48, 18.30, 18.46], [18.46, 18.60, 18.44, 18.56], [18.56, 18.58, 18.46, 18.48], [18.48, 18.50, 18.42, 18.44], [18.44, 18.46, 18.40, 18.45], [18.45, 18.56, 18.44, 18.54], [18.54, 18.66, 18.52, 18.64], [18.64, 18.72, 18.60, 18.70], [18.70, 18.78, 18.66, 18.74]]
      vwap: [18.22, 18.28, 18.35, 18.38, 18.40, 18.41, 18.42, 18.44, 18.46, 18.48]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "The line held and price ran to $18.74 — $0.29 per share, +$290 long on 1,000 shares from $18.45."
    explanation: "An uptrend that eases back onto VWAP and stalls there is the bounce: the trend is intact and the line is doing the work."

  - type: mc
    prompt: "Price has been below VWAP since the open. Which of these is a reclaim?"
    options:
      - {text: "A candle wicks above the line and closes back below"}
      - {text: "A candle closes above the line and the next two stay above it", correct: true}
      - {text: "Price rises to within a cent of the line and stops"}
    explanation: "A reclaim is a close above the line that holds — anything less is still a test."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Price is below VWAP."}
      - {text: "One wick above the line", wrong: true}
      - {text: "tells you buyers have taken control."}
    explanation: "A wick above proves nothing; you need a close above that holds."

  - type: chart-decision
    scenario: "XYZ has been under VWAP all morning. It rallies into the line, leaves a long upper wick and closes back below. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[27.30, 27.34, 27.10, 27.14], [27.14, 27.20, 27.00, 27.04], [27.04, 27.16, 27.02, 27.14], [27.14, 27.26, 27.12, 27.24], [27.24, 27.32, 27.22, 27.26], [27.26, 27.30, 27.18, 27.20], [27.20, 27.22, 27.06, 27.08], [27.08, 27.12, 26.96, 26.98], [26.98, 27.02, 26.88, 26.92], [26.92, 26.96, 26.84, 26.88]]
      vwap: [27.40, 27.34, 27.30, 27.28, 27.27, 27.26, 27.24, 27.22, 27.19, 27.16]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "Sellers were waiting at the line. It fell to $26.88 — $0.32 per share, +$320 short on 1,000 shares from $27.20."
    explanation: "Rallying into the line and closing back below is a rejection: the sellers who own this session are still there."

  - type: tf
    statement: "Price rallying into VWAP from below and being pushed straight back down is a reason to look for a long."
    answer: false
    explanation: "That is a rejection — sellers are still in charge; the long only comes after a close above that holds."

  - type: order
    prompt: "Put a reclaim in order."
    items:
      - "Price trades below VWAP"
      - "A candle closes back above the line"
      - "The next candle holds above it"
      - "You look for your entry"
    explanation: "Close first, hold second, entry third — in that order there is no guessing."

  - type: fill-tiles
    sentence: "Price that was below VWAP, closes back above it and holds, has made a ___."
    answer: "reclaim"
    explanation: "Control of the session just changed hands."

  - type: numeric-input
    prompt: "You buy 1,000 shares on a reclaim at $18.46 and the spread is $0.02. What does the round trip cost you in spread?"
    answer: 20
    unit: "$"
    working: "$0.02 per share × 1,000 shares = $20"
    explanation: "Two cents of your move is gone before the trade even starts working."

  - type: theory
    title: "Three trades from one line"
    body: "The bounce goes with the trend, the rejection fades a failed push, the reclaim catches a change of control. Next: the other lines worth drawing."
