id: "1-2"
title: "VWAP"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [vwap, volume]
icon: vwap
learning_goal: "User can update a running VWAP with one more minute of trading and explain why the line gets harder to move as the session goes on."
purpose: "Knowing how fast the line can move tells you how much a single minute of buying is really worth."
terms_introduced: []
skills: ["Updating VWAP"]
reinforces: [1]
prerequisite: "1-1"
xp: 20
difficulty: 1
sources: ["Aziz — How to Day Trade for a Living", "Carter — Mastering the Trade"]
notes: "Running-total arithmetic, then the first short from the side of the line. Account named at $20,000."
screens:
  - type: intro
    text: "The line adds every minute and throws none of them away."

  - type: theory
    title: "It never drops a minute"
    body: "VWAP is one running total of money divided by one running total of shares. Nothing from earlier in the session is ever taken out again, which is why the line drifts instead of jumping."

  - type: example
    body: "Twenty minutes in, XYZ has traded 500,000 shares and VWAP is $13.40. The next minute puts 100,000 shares through at an average of $13.70. The line has 600,000 shares in it now."

  - type: numeric-input
    prompt: "Where is VWAP after that minute?"
    answer: 13.45
    tolerance: 0.01
    unit: "$"
    working: "(500,000 × $13.40 + 100,000 × $13.70) ÷ 600,000 = $8,070,000 ÷ 600,000 = $13.45"
    explanation: "A minute a fifth the size of everything before it pulled the line five cents."

  - type: theory
    title: "The line stiffens"
    body: "Early on, the line is dividing by very little, so it swings. By the afternoon it is dividing by millions of shares, and a busy minute barely nudges it."

  - type: numeric-mc
    prompt: "Same minute — 100,000 shares at $13.70 — but the session has already traded 2 million shares at a VWAP of $13.40. Where is the line now?"
    options:
      - {text: "$13.45"}
      - {text: "$13.41", correct: true}
      - {text: "$13.55"}
      - {text: "$13.70"}
    working: "(2,000,000 × $13.40 + 100,000 × $13.70) ÷ 2,100,000 = $28,170,000 ÷ 2,100,000 = $13.41"
    explanation: "The identical minute moved the line five cents earlier and one cent now. Only the pile underneath it changed."

  - type: mc
    prompt: "Why does one heavy minute move VWAP more at the open than in the last hour?"
    options:
      - {text: "Far fewer shares have gone through it yet", correct: true}
      - {text: "Spreads are wider in the first half hour"}
      - {text: "The line is redrawn at the start of the session"}
    explanation: "The divisor is the whole story. A wide spread at the open costs you money but leaves the line where it is."

  - type: visual
    component: chart-candles
    data:
      data: [[23.10, 23.22, 23.06, 23.20], [23.20, 23.28, 23.14, 23.16], [23.16, 23.20, 23.02, 23.06], [23.06, 23.14, 23.00, 23.12], [23.12, 23.26, 23.10, 23.24], [23.24, 23.30, 23.16, 23.18], [23.18, 23.22, 23.08, 23.10], [23.10, 23.24, 23.08, 23.22]]
      volume: [140000, 126000, 158000, 132000, 149000, 118000, 137000, 144000]
      vwap: [23.15, 23.15, 23.14, 23.14, 23.15, 23.15, 23.15, 23.15]
    caption: "Two million shares already through: price travels sixteen cents a minute and the line sits still."

  - type: chart-tap
    prompt: "Tap the last minute that finished above the line."
    chart:
      kind: candles
      data: [[16.28, 16.36, 16.26, 16.34], [16.34, 16.42, 16.32, 16.40], [16.40, 16.48, 16.38, 16.46], [16.46, 16.50, 16.40, 16.42], [16.42, 16.44, 16.34, 16.36], [16.36, 16.38, 16.26, 16.28], [16.28, 16.30, 16.20, 16.22], [16.22, 16.24, 16.16, 16.18], [16.18, 16.20, 16.10, 16.12], [16.12, 16.14, 16.06, 16.08]]
      vwap: [16.26, 16.29, 16.32, 16.33, 16.34, 16.33, 16.32, 16.30, 16.28, 16.26]
    target: 4
    explanation: "Two cents clear of the line, and the minute after it finished five cents under and never came back."

  - type: tf
    statement: "In the last hour of a busy session, a single heavy minute usually shifts VWAP by a cent or two rather than ten."
    answer: true
    explanation: "By then the line is dividing by millions of shares, so even a big minute is a small share of the total."

  - type: chart-decision
    scenario: "XYZ has not finished a minute above the line since the open. The last four closes are each lower than the one before."
    shares: 1200
    state: ["Size: 1,200 shares", "Account: $20,000"]
    chart:
      kind: candles
      data: [[14.70, 14.72, 14.60, 14.62], [14.62, 14.64, 14.52, 14.56], [14.56, 14.62, 14.54, 14.60], [14.60, 14.62, 14.50, 14.54], [14.54, 14.56, 14.46, 14.48], [14.48, 14.50, 14.40, 14.42], [14.42, 14.44, 14.32, 14.34], [14.34, 14.36, 14.26, 14.28], [14.28, 14.30, 14.20, 14.22], [14.22, 14.24, 14.16, 14.19], [14.19, 14.21, 14.11, 14.13]]
      volume: [62000, 71000, 48000, 66000, 74000, 88000, 96000, 84000, 79000, 71000, 68000]
      vwap: [14.76, 14.72, 14.70, 14.68, 14.66, 14.63, 14.60, 14.57, 14.54, 14.50, 14.46]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It worked down to $14.13 — $0.29 a share below the decision, +$348 short on 1,200 shares."
    explanation: "Every close of the session is under the line and the closes are stepping down. The side the line allows is the side the sellers already own."

  - type: fill-tiles
    sentence: "A session spent entirely below the line is a session the ___ have controlled."
    answer: "sellers"
    explanation: "Somebody has been willing to let shares go under the session's own average price all morning."

  - type: example
    body: "Two takeaways with numbers on them: five cents from one minute at the open, one cent from the same minute after lunch. The morning line is the one that still has room to move."
