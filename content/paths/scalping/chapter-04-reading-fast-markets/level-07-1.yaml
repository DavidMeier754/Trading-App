id: "7-1"
title: "Confluence"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [confluence, candles, volume]
learning_goal: "User only calls a candle a signal when a marked level and the volume agree with it, and treats a lone candle as noise."
purpose: "Most losing scalps come from acting on one piece of evidence — this is the filter that removes them."
terms_introduced: ["Confluence"]
reinforces: [2]
prerequisite: "6-1"
xp: 20
difficulty: 2
sources: ["Murphy — Technical Analysis of the Financial Markets", "Volman — Understanding Price Action"]
screens:
  - type: intro
    text: "One candle is noise. A candle, at a level, on real volume is a signal."

  - type: theory
    title: "Confluence"
    body: "Confluence is two or more independent reasons pointing the same way at the same price: a level, VWAP, a candle, the volume. The more that agree, the fewer surprises you get."

  - type: example
    body: "XYZ stalls at $44.00. VWAP has risen to $44.02, the candle leaves a long upper wick, and volume is the biggest of the hour. One price, three reasons."

  - type: checklist-reveal
    title: "Before you call it a signal"
    items:
      - "Is price at a level you marked before the open?"
      - "Does the candle show one side clearly winning the minute?"
      - "Is volume bigger than the candles around it?"
      - "Does VWAP point the same way?"

  - type: chart-decision
    scenario: "XYZ pulls back into VWAP at $27.30, which is also yesterday's close. The candle there is a rejection with a long lower wick on double the recent volume. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[27.60, 27.66, 27.52, 27.54], [27.54, 27.58, 27.44, 27.46], [27.46, 27.50, 27.38, 27.40], [27.40, 27.44, 27.32, 27.36], [27.36, 27.38, 27.28, 27.33], [27.33, 27.40, 27.24, 27.38], [27.38, 27.50, 27.36, 27.48], [27.48, 27.58, 27.46, 27.56], [27.56, 27.64, 27.52, 27.62], [27.62, 27.68, 27.58, 27.64]]
      vwap: [27.31, 27.31, 27.30, 27.30, 27.30, 27.30, 27.31, 27.32, 27.33, 27.34]
      volume: [52000, 48000, 41000, 36000, 33000, 94000, 68000, 61000, 54000, 49000]
      levels:
        - {price: 27.30, label: "Yesterday's close"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It turned at the line and reached $27.64 — $0.26 per share, +$260 long on 1,000 shares from $27.38."
    explanation: "Level, VWAP, rejection candle and volume all at one price: that is confluence, and it is where the odds are best."

  - type: mc
    prompt: "A perfect momentum candle appears in the middle of a range, nowhere near a level, on average volume. What is it?"
    options:
      - {text: "A signal, because the candle shape is what matters"}
      - {text: "A signal, because momentum always continues"}
      - {text: "Noise — one piece of evidence with nothing to back it", correct: true}
    explanation: "Shape without a level and without volume is one reason, and one reason is not enough."

  - type: sort
    prompt: "Signal or noise?"
    buckets: ["Signal", "Noise"]
    items:
      - {text: "Rejection candle at yesterday's high on the biggest volume of the hour", bucket: "Signal"}
      - {text: "Engulfing candle right at VWAP as price reaches it", bucket: "Signal"}
      - {text: "Doji in the middle of a quiet range", bucket: "Noise"}
      - {text: "Big red candle with no level anywhere near it", bucket: "Noise"}
    explanation: "A candle earns the word signal from where it happens and what traded there."

  - type: tf
    statement: "A level test on ordinary volume leaves you with a shape and nothing behind it."
    answer: true
    explanation: "Nobody has committed anything yet, so the test is still unproven — wait for the next candle."

  - type: theory
    title: "Volume is the tiebreaker"
    body: "Level and candle tell you where and what. Volume tells you how many shares agreed. When two reasons are there and volume is not, wait for the next candle."

  - type: chart-decision
    scenario: "XYZ makes a nice engulfing candle, but it is nowhere near a level, VWAP is far below, and volume is average. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[27.20, 27.28, 27.16, 27.22], [27.22, 27.26, 27.14, 27.16], [27.16, 27.20, 27.10, 27.12], [27.12, 27.22, 27.10, 27.20], [27.20, 27.24, 27.14, 27.18], [27.18, 27.30, 27.16, 27.28], [27.28, 27.32, 27.18, 27.20], [27.20, 27.24, 27.12, 27.14], [27.14, 27.22, 27.12, 27.20], [27.20, 27.24, 27.14, 27.18]]
      vwap: [27.44, 27.42, 27.40, 27.38, 27.37, 27.36, 27.35, 27.34, 27.33, 27.32]
      volume: [41000, 39000, 42000, 38000, 40000, 43000, 41000, 39000, 42000, 40000]
      levels:
        - {price: 27.80, label: "Yesterday's high"}
      decision_index: 5
    best: no-trade
    outcome: "Price wandered back to where it started. The candle was the only thing that happened."
    explanation: "A good-looking candle with nothing agreeing with it is one reason — and one reason is a coin flip with costs attached."

  - type: numeric-input
    prompt: "You skip that trade. The spread is $0.04 on 1,000 shares. How much did not trading save you in spread alone?"
    answer: 40
    unit: "$"
    working: "$0.04 per share × 1,000 shares = $40"
    explanation: "Every trade you do not take is a round trip you do not pay for."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Three reasons agree at one price,"}
      - {text: "so this trade works more often"}
      - {text: "than a one-reason trade, and cannot lose.", wrong: true}
    explanation: "Confluence improves the odds over a series. Any single trade can still lose, and plenty of them do."

  - type: fill-tiles
    sentence: "Two or more independent reasons pointing the same way at one price is called ___."
    answer: "confluence"
    explanation: "Reasons flowing together — that is all the word means."

  - type: theory
    title: "The filter"
    body: "Level, candle, volume, VWAP. Two of them is a look, three is a trade, one is a spread paid for nothing."
