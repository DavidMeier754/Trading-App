id: "7-1"
title: "Confluence"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [confluence, levels, vwap]
learning_goal: "User can count the independent reasons standing at one price and tell two separate readings from one fact written twice."
purpose: "Almost every scalp that looked fine and went nowhere had exactly one reason behind it."
terms_introduced: ["Confluence"]
reinforces: [2, 3]
prerequisite: "6-4"
xp: 25
difficulty: 2
sources: ["Murphy — Technical Analysis of the Financial Markets", "Volman — Understanding Price Action"]
notes: "Chapter 2's support and resistance supply half the reasons; Chapter 3's cost-against-room decides whether a single-reason read is worth paying for. Account named at $24,000."
screens:
  - type: intro
    text: "Every chart gives you a reason. The question is how many."

  - type: theory
    title: "Two reasons at one price"
    body: "Confluence is two or more separate readings landing on the same price. Not a stronger reason: a second one, arrived at a different way, that happens to agree."

  - type: example
    body: "Yesterday's high is $20.98 and the round number is $21.00. Two cents apart, so one band of price carries both of them, and everything in the market that watches either one is watching the same six cents."
    visual: chart-candles
    visual_data:
      data: [[20.70, 20.78, 20.68, 20.76], [20.76, 20.84, 20.74, 20.82], [20.82, 20.86, 20.78, 20.80], [20.80, 20.88, 20.78, 20.86], [20.86, 20.90, 20.82, 20.88], [20.88, 21.08, 20.86, 21.06], [21.06, 21.14, 21.04, 21.12], [21.12, 21.20, 21.10, 21.18]]
      volume: [72000, 84000, 58000, 64000, 56000, 168000, 138000, 118000]
      levels:
        - {price: 20.98, label: "Yesterday's high"}
        - {price: 21.0, label: "Round number"}
    caption: "Two lines, six cents of band, and one minute that finished above both of them."

  - type: theory
    title: "Separate, or the same fact twice"
    body: "If the high of the day is the pre-market high, that is one fact on two labels. Two readings only count as two when one could have been false while the other stayed true."

  - type: sort
    prompt: "Two reasons standing at one price, or one reason wearing two labels?"
    buckets: ["Two reasons", "One reason twice"]
    items:
      - {text: "Yesterday's close at $18.00, and $18.00 is the round number", bucket: "Two reasons"}
      - {text: "The high of the day, which is also the pre-market high nothing has beaten", bucket: "One reason twice"}
      - {text: "The session's average price arriving at yesterday's low", bucket: "Two reasons"}
      - {text: "Resistance at $24.40, and the top of the range is $24.40", bucket: "One reason twice"}
    explanation: "The left-hand pair were drawn from different sessions and different habits. The right-hand pair are one price with two names on it."

  - type: chart-decision
    scenario: "Yesterday's high is $20.98 and the round number above it is $21.00. XYZ has finished every minute above the line, and the minute that just closed finished through both on the heaviest bar of the morning."
    shares: 1000
    state: ["Size: 1,000 shares", "Account: $24,000"]
    chart:
      kind: candles
      data: [[20.70, 20.78, 20.68, 20.76], [20.76, 20.84, 20.74, 20.82], [20.82, 20.86, 20.78, 20.80], [20.80, 20.88, 20.78, 20.86], [20.86, 20.90, 20.82, 20.88], [20.88, 21.08, 20.86, 21.06], [21.06, 21.14, 21.04, 21.12], [21.12, 21.20, 21.10, 21.18], [21.18, 21.26, 21.16, 21.24], [21.24, 21.30, 21.22, 21.28], [21.28, 21.36, 21.26, 21.33]]
      volume: [72000, 84000, 58000, 64000, 56000, 168000, 138000, 118000, 102000, 92000, 84000]
      vwap: [20.70, 20.73, 20.75, 20.77, 20.79, 20.81, 20.84, 20.87, 20.90, 20.93, 20.96]
      levels:
        - {price: 20.98, label: "Yesterday's high"}
        - {price: 21.0, label: "Round number"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $21.33 — $0.27 a share past the decision, +$270 long on 1,000 shares."
    explanation: "Three separate readings at one price: the last full session's ceiling, the number people type into orders, and a session that has never traded under its own average."

  - type: numeric-input
    prompt: "Costs run four cents a share on that trade and you took 1,000 shares. What does the round trip hand over?"
    answer: 40
    tolerance: 0.01
    unit: "$"
    working: "$0.04 a share × 1,000 shares = $40"
    explanation: "Twenty-seven cents of move against four cents of cost is what a stack of reasons is supposed to buy you."

  - type: mc
    prompt: "Price is at $15.90. Which of these leaves you with two independent reasons at one price?"
    options:
      - {text: "The round number at $16.00 and the top of this morning's range at $16.00"}
      - {text: "The high of the day at $16.00 and the level it has stopped at twice, $16.00"}
      - {text: "Yesterday's high at $16.00 and the session's average price climbing into $16.00", correct: true}
    explanation: "The other two are a single price with a second label attached. Yesterday's ceiling and today's average were built by different sessions."

  - type: compare
    prompt: "Costs are the same in both. In which one is more than one reading standing at the price?"
    charts:
      - kind: candles
        data: [[17.60, 17.68, 17.56, 17.66], [17.66, 17.74, 17.64, 17.72], [17.72, 17.78, 17.68, 17.70], [17.70, 17.78, 17.68, 17.76], [17.76, 17.82, 17.74, 17.80], [17.80, 17.88, 17.78, 17.86], [17.86, 17.92, 17.82, 17.84], [17.84, 17.90, 17.80, 17.88]]
        vwap: [17.78, 17.78, 17.78, 17.78, 17.79, 17.80, 17.81, 17.82]
        levels:
          - {price: 18.2, label: "Yesterday's high"}
        label: "A"
      - kind: candles
        data: [[17.60, 17.68, 17.56, 17.66], [17.66, 17.74, 17.64, 17.72], [17.72, 17.78, 17.68, 17.70], [17.70, 17.78, 17.68, 17.76], [17.76, 17.82, 17.74, 17.80], [17.80, 17.88, 17.78, 17.86], [17.86, 17.92, 17.82, 17.84], [17.84, 17.90, 17.80, 17.88]]
        vwap: [17.90, 17.90, 17.90, 17.90, 17.90, 17.90, 17.90, 17.90]
        levels:
          - {price: 17.9, label: "Yesterday's close"}
        label: "B"
    answer: "B"
    explanation: "Identical candles. In B the last full session's zero and this session's average price sit on the same cent; in A the only line is thirty-two cents overhead."

  - type: tf
    statement: "Two reasons at one price make the move that follows a certainty."
    answer: false
    explanation: "They improve the odds and they pay for the cost of finding out. Nothing on a chart does more than that."

  - type: chart-decision
    scenario: "XYZ has finished every minute above the line. The minute that just closed finished three cents under a small level from earlier in the morning, on an ordinary bar."
    shares: 1300
    state: ["Size: 1,300 shares"]
    chart:
      kind: candles
      data: [[16.30, 16.38, 16.28, 16.36], [16.36, 16.44, 16.34, 16.42], [16.42, 16.48, 16.38, 16.40], [16.40, 16.46, 16.38, 16.44], [16.44, 16.48, 16.40, 16.42], [16.42, 16.44, 16.36, 16.37], [16.37, 16.44, 16.35, 16.42], [16.42, 16.48, 16.40, 16.46], [16.46, 16.50, 16.42, 16.44], [16.44, 16.52, 16.42, 16.50], [16.50, 16.54, 16.46, 16.52]]
      volume: [74000, 82000, 66000, 70000, 62000, 68000, 72000, 66000, 60000, 74000, 68000]
      vwap: [16.30, 16.32, 16.33, 16.34, 16.35, 16.35, 16.36, 16.36, 16.37, 16.38, 16.39]
      levels:
        - {price: 16.4, label: "Morning level"}
      decision_index: 5
    best: no-trade
    reasonable: [short]
    outcome: "It was back through the level inside two minutes and finished at $16.52 — $0.15 a share against a short, $195 on 1,300 shares."
    explanation: "One reading says sell and another says the session's buyers have never let go. Reasons that point opposite ways do not add up to a trade."

  - type: fill-tiles
    sentence: "Two separate readings landing on the same price is ___."
    answer: "confluence"
    explanation: "Two, arrived at different ways, agreeing on one number."

  - type: checklist-reveal
    title: "Counting the reasons"
    items:
      - "Which lines are standing at this price?"
      - "Were any two of them drawn from the same fact?"
      - "Which side of its own average is the session on?"
      - "Do the reasons point the same way, or against each other?"
