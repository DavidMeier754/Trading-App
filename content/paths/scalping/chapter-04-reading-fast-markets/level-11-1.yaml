id: "11-1"
title: "Fan-out C — The Opening Drive"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [open, momentum, sessions]
learning_goal: "User can recognise a session that opens and keeps going, and still waits out the first five minutes before acting on it."
purpose: "The biggest moves of the day and the worst fills of the day are in the same few minutes."
terms_introduced: ["Opening drive"]
reinforces: [2, 3]
prerequisite: "8-1"
xp: 25
difficulty: 2
path_position: fan-out:open
sources: ["Aziz — How to Day Trade for a Living", "Carter — Mastering the Trade"]
notes: "Strand C, first sub. Self-contained: uses nothing from strands A or B. Chapter 2's opening minutes and its momentum reading are what this builds on; Chapter 3 supplies the cost of chasing. Account named at $24,000."
screens:
  - type: intro
    text: "Some sessions spend the first minutes deciding. Others leave without you."

  - type: theory
    title: "The first minutes"
    body: "Inside {{market.first_minutes}} {{market.timezone}} more shares change hands than in any other stretch of the day. Everything is faster, wider and louder, and none of it is a mistake."

  - type: theory
    title: "An opening drive"
    body: "A session that opens and keeps going one way: every minute finishing near its far end, nothing given back, and the heaviest volume of the day underneath. It is the clearest thing a chart ever says."

  - type: example
    body: "XYZ opens at $16.40 and the first four minutes finish at $16.60, $16.76, $16.88 and $17.00. Sixty cents in four minutes, and not one minute closed below the one before it."

  - type: chart-decision
    scenario: "The bell went four minutes ago. Every minute has finished near its high on the heaviest bars of the day, and there is no line from yesterday within thirty cents."
    shares: 1100
    state: ["Size: 1,100 shares", "Account: $24,000"]
    chart:
      kind: candles
      data: [[16.40, 16.62, 16.38, 16.60], [16.60, 16.78, 16.58, 16.76], [16.76, 16.90, 16.72, 16.88], [16.88, 17.02, 16.86, 17.00], [17.00, 17.10, 16.96, 17.06], [17.06, 17.12, 16.98, 17.02], [17.02, 17.08, 16.94, 16.98], [16.98, 17.04, 16.90, 16.94], [16.94, 17.00, 16.88, 16.98], [16.98, 17.06, 16.94, 17.04], [17.04, 17.12, 17.00, 17.08]]
      volume: [420000, 320000, 280000, 240000, 210000, 180000, 160000, 150000, 140000, 130000, 120000]
      vwap: [16.52, 16.62, 16.70, 16.78, 16.84, 16.88, 16.90, 16.91, 16.92, 16.93, 16.94]
      decision_index: 3
    best: no-trade
    reasonable: [long]
    outcome: "It spent the next seven minutes between $16.88 and $17.12 and finished at $17.08 — $0.08 a share past the decision, $88 on 1,100 shares."
    explanation: "The drive is real and you are four minutes in with nothing to lean on. Chapter 2's rule holds here: the first five minutes are for watching, because the only stop on offer is back under the minute that just closed, fourteen cents away."

  - type: chart-tap
    prompt: "Tap the first minute of that session that finished lower than the one before it."
    chart:
      kind: candles
      data: [[16.40, 16.62, 16.38, 16.60], [16.60, 16.78, 16.58, 16.76], [16.76, 16.90, 16.72, 16.88], [16.88, 17.02, 16.86, 17.00], [17.00, 17.10, 16.96, 17.06], [17.06, 17.12, 16.98, 17.02], [17.02, 17.08, 16.94, 16.98], [16.98, 17.04, 16.90, 16.94], [16.94, 17.00, 16.88, 16.98]]
      volume: [420000, 320000, 280000, 240000, 210000, 180000, 160000, 150000, 140000]
    target: 5
    explanation: "Five closes climbing, and this is the first one that finished under the minute before it. That is where the drive stopped being a drive."

  - type: mc
    prompt: "What does an opening drive actually tell you?"
    options:
      - {text: "Which side has been in front since the first trade", correct: true}
      - {text: "Where the day will finish"}
      - {text: "That the stock will be liquid for the rest of the session"}
    explanation: "It is the strongest statement about the session so far, and it says nothing at all about the hours after it."

  - type: numeric-input
    prompt: "You are long 1,100 shares from $16.88 and the drive stalls at $17.12, where you get out. What is that worth before costs?"
    answer: 264
    tolerance: 0.01
    unit: "$"
    working: "$17.12 − $16.88 = $0.24 a share; $0.24 × 1,100 shares = $264"
    explanation: "And 1,100 × $16.88 is $18,568, so the account carries the position comfortably."

  - type: sort
    prompt: "A drive, or the usual opening noise?"
    buckets: ["A drive", "Noise"]
    items:
      - {text: "Every minute finishing near its high on the heaviest volume of the day", bucket: "A drive"}
      - {text: "Six minutes overlapping each other inside eight cents", bucket: "Noise"}
      - {text: "Forty cents travelled one way with no minute closing back", bucket: "A drive"}
      - {text: "Two big minutes up, two big minutes down, back where it started", bucket: "Noise"}
    explanation: "A drive keeps what it takes. Noise takes the same distance and hands it back before anybody can use it."

  - type: chart-decision
    scenario: "The session opened and sold off for five minutes without finishing one above its own average price. The sixth has just closed under all five."
    shares: 1000
    state: ["Size: 1,000 shares"]
    chart:
      kind: candles
      data: [[21.60, 21.62, 21.30, 21.34], [21.34, 21.40, 21.16, 21.20], [21.20, 21.24, 21.04, 21.08], [21.08, 21.14, 20.96, 21.00], [21.00, 21.06, 20.90, 20.94], [20.94, 21.00, 20.86, 20.90], [20.90, 20.94, 20.76, 20.80], [20.80, 20.84, 20.66, 20.70], [20.70, 20.74, 20.58, 20.62], [20.62, 20.66, 20.52, 20.56], [20.56, 20.60, 20.46, 20.50]]
      volume: [460000, 340000, 300000, 260000, 220000, 190000, 210000, 180000, 160000, 150000, 140000]
      vwap: [21.46, 21.36, 21.28, 21.22, 21.16, 21.10, 21.04, 20.98, 20.92, 20.86, 20.80]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It kept going to $20.50 — $0.40 a share under the decision, +$400 short on 1,000 shares."
    explanation: "The watching is done, the six minutes are on the chart, and every one of them finished under the price the session has paid on average."

  - type: tf
    statement: "The widest moves of the day and the worst fills of the day happen in the same few minutes."
    answer: true
    explanation: "It is one crowd arriving at once, which is what makes both the range and the spread what they are."

  - type: fill-choice
    sentence: "A session that opens and keeps going without handing anything back is an opening ___."
    options: ["drive", "range", "gap"]
    answer: "drive"
    explanation: "One direction, from the first trade, with the day's volume behind it."

  - type: story
    character: retail-trader
    text: "Four minutes in you wanted it badly. Six minutes in you had the same trade with a stop you could actually place."
