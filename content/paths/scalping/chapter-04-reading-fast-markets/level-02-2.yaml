id: "2-2"
title: "Intraday Levels"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: repetition
tags: [levels, vwap, decisions]
learning_goal: "User combines VWAP and the marked levels into decisions and prices the cost of each one before taking it."
purpose: "Lines only earn their place when they change what you do — this is where they start doing that."
terms_introduced: []
prerequisite: "2-1"
xp: 20
difficulty: 2
sources: ["Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "Practice sub. No new ideas; three decisions plus cost and level checks."
screens:
  - type: intro
    text: "No new ideas. Your lines, three decisions and the cost of each one."

  - type: story
    character: retail-trader
    text: "{{market.regular_open}} {{market.timezone}}. Four lines on the chart, $18,000 in the account, one stock on the screen."

  - type: chart-decision
    scenario: "XYZ opened under VWAP and sold off. It now closes back above the line and the next candle holds above it. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[21.40, 21.44, 21.26, 21.28], [21.28, 21.32, 21.14, 21.16], [21.16, 21.24, 21.12, 21.22], [21.22, 21.30, 21.20, 21.28], [21.28, 21.36, 21.26, 21.34], [21.34, 21.40, 21.32, 21.38], [21.38, 21.48, 21.36, 21.46], [21.46, 21.54, 21.44, 21.52], [21.52, 21.58, 21.48, 21.56], [21.56, 21.62, 21.52, 21.58]]
      vwap: [21.36, 21.32, 21.30, 21.30, 21.31, 21.32, 21.33, 21.35, 21.37, 21.39]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It held the line and reached $21.58 — $0.20 per share, +$300 long on 1,500 shares from $21.38."
    explanation: "Two closes above the line after a morning below it: control changed hands and the reclaim held."

  - type: numeric-input
    prompt: "Before that trade: the spread is $0.03 and you are trading 1,500 shares. What does the round trip cost in spread?"
    answer: 45
    unit: "$"
    working: "$0.03 per share × 1,500 shares = $45"
    explanation: "On a $0.20 target that is 15 % of the move — worth knowing before you press the button."

  - type: chart-decision
    scenario: "XYZ is grinding up into the round number at $40.00 with the candles getting smaller and volume drying up. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[39.62, 39.72, 39.60, 39.70], [39.70, 39.82, 39.68, 39.80], [39.80, 39.88, 39.76, 39.86], [39.86, 39.92, 39.84, 39.90], [39.90, 39.96, 39.88, 39.93], [39.93, 39.98, 39.91, 39.95], [39.95, 39.99, 39.86, 39.88], [39.88, 39.92, 39.80, 39.82], [39.82, 39.86, 39.74, 39.76], [39.76, 39.80, 39.70, 39.74]]
      volume: [8200, 7400, 6100, 4800, 3600, 2900, 6800, 5400, 4900, 4200]
      levels:
        - {price: 40.00, label: "Round number"}
      decision_index: 5
    best: no-trade
    reasonable: [short]
    outcome: "It never touched $40.00 and drifted back to $39.74. A long into the level would have been under water within two minutes."
    explanation: "Buying into a level on fading volume is paying up for the last few cents before the sellers who are waiting there."

  - type: match
    prompt: "Match each line to what it tells you."
    pairs:
      - ["VWAP", "The volume-weighted average price of the session so far"]
      - ["Yesterday's close", "Whether the stock is up or down on the day"]
      - ["Pre-market high", "The highest price traded before the session opened"]
      - ["Round number", "A price where orders cluster because people think in round numbers"]
    explanation: "Four lines, four different pieces of information."

  - type: mc
    prompt: "Price is above VWAP and one cent under yesterday's high, which has stopped it twice already. Best plan?"
    options:
      - {text: "Wait — the level has to break and hold before the long is there", correct: true}
      - {text: "Buy now, because being above VWAP means buyers are in charge"}
      - {text: "Short into the level, because it has held twice"}
    explanation: "Two signals disagree, so you wait for the level to settle the argument."

  - type: tf
    statement: "Once price is above VWAP, the levels above it stop mattering."
    answer: false
    explanation: "VWAP tells you who is in charge; the levels above still tell you where the move can stall."

  - type: chart-tap
    prompt: "Yesterday's high is $52.50. Tap the candle that broke it and closed above."
    chart:
      kind: candles
      data: [[52.10, 52.18, 52.06, 52.16], [52.16, 52.26, 52.12, 52.24], [52.24, 52.32, 52.20, 52.28], [52.28, 52.44, 52.26, 52.40], [52.40, 52.48, 52.34, 52.38], [52.38, 52.46, 52.34, 52.44], [52.44, 52.62, 52.42, 52.58], [52.58, 52.70, 52.54, 52.66], [52.66, 52.74, 52.60, 52.70], [52.70, 52.78, 52.66, 52.74]]
      levels:
        - {price: 52.50, label: "Yesterday's high"}
    target: 6
    explanation: "Earlier candles reached $52.48 at best; this one closed eight cents through the level."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The pre-market high is a level"}
      - {text: "because pre-market volume is heavy,", wrong: true}
      - {text: "and traders remember where price turned."}
    explanation: "Pre-market volume is thin — the level works because traders remember the price, not because much traded there."

  - type: slider
    prompt: "Your target is 15 cents. The spread is 3 cents. How much of the target does the round trip in spread take?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 20
    tolerance: 10
    explanation: "$0.03 of $0.15 is 20 % of the move, gone before slippage and fees."

  - type: fill-tiles
    sentence: "Price closing back above VWAP after a morning below it is a ___."
    answer: "reclaim"
    explanation: "The buyers took the line back."

  - type: chart-decision
    scenario: "XYZ is chopping in a nine-cent band with VWAP running flat through the middle of it and yesterday's close at the bottom edge. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[14.52, 14.56, 14.48, 14.50], [14.50, 14.55, 14.47, 14.53], [14.53, 14.56, 14.49, 14.51], [14.51, 14.54, 14.47, 14.49], [14.49, 14.55, 14.48, 14.54], [14.54, 14.56, 14.50, 14.52], [14.52, 14.55, 14.47, 14.50], [14.50, 14.54, 14.48, 14.53], [14.53, 14.56, 14.49, 14.51], [14.51, 14.54, 14.48, 14.52]]
      vwap: [14.51, 14.51, 14.51, 14.51, 14.51, 14.51, 14.51, 14.51, 14.51, 14.51]
      levels:
        - {price: 14.47, label: "Yesterday's close"}
      decision_index: 5
    best: no-trade
    outcome: "It was still in the same band twenty minutes later. Any entry would have paid the spread for nothing."
    explanation: "Lines stacked on top of each other with no room between them is a range, and a range this tight has no scalp in it."

  - type: theory
    title: "Lines, then decisions"
    body: "The map does not tell you to trade. It tells you where a trade could be — and where there is nothing worth paying the spread for."
