id: "6-2"
title: "Candle Signals on the 1-Minute"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [candles, signals, levels]
learning_goal: "User can name a rejection candle and an engulfing candle and say which minute each of them cancels."
purpose: "These are the two shapes that show a price being refused, and both of them turn up at the lines you drew before the open."
terms_introduced: ["Engulfing candle"]
reinforces: [2]
prerequisite: "6-1"
xp: 25
difficulty: 2
sources: ["Nison — Japanese Candlestick Charting Techniques", "Bellafiore — One Good Trade"]
notes: "Chapter 2's levels and its volume row decide whether either shape counts. Account named at $30,000."
screens:
  - type: intro
    text: "Two shapes that say a price was offered and refused."

  - type: theory
    title: "Refused, and erased"
    body: "A long wick is a price the market went to and would not keep. A body that covers the whole body before it is a minute undoing the minute that came first."

  - type: carousel
    cards:
      - {label: "Rejection candle", text: "A long wick with a small body at the other end. Price traded up there, or down there, and was pushed straight back before the minute finished.", icon: candle-rejection}
      - {label: "Engulfing candle", text: "A body that covers the whole body of the minute before it, in the other direction. A minute of selling wiped out by a minute of buying, or the reverse.", icon: candle-engulfing}

  - type: chart-tap
    prompt: "Tap the engulfing candle."
    chart:
      kind: candles
      data: [[19.20, 19.26, 19.16, 19.24], [19.24, 19.28, 19.22, 19.26], [19.26, 19.30, 19.24, 19.28], [19.28, 19.32, 19.26, 19.30], [19.30, 19.34, 19.28, 19.32], [19.34, 19.36, 19.26, 19.28], [19.28, 19.30, 19.22, 19.24], [19.24, 19.26, 19.18, 19.20], [19.20, 19.22, 19.14, 19.16]]
      volume: [74000, 68000, 62000, 58000, 54000, 162000, 96000, 88000, 82000]
    target: 5
    explanation: "It opens above the previous close and finishes below the previous open, so the whole of that green body is inside this red one."

  - type: match
    prompt: "Four shapes from the last two lessons. What did each minute do?"
    pairs:
      - ["Momentum candle", "One side held everything it took"]
      - ["Doji", "Neither side finished in front"]
      - ["Rejection candle", "Price went somewhere and was pushed back"]
      - ["Engulfing candle", "One minute undid the body of the minute before"]
    explanation: "Body length, wick length, and what the candle before it looked like. That is the whole reading."

  - type: chart-decision
    scenario: "Yesterday's high is $17.50. The minute that just closed traded eight cents through it and finished sixteen cents back underneath, on the heaviest bar of the session."
    shares: 1600
    state: ["Size: 1,600 shares", "Account: $30,000"]
    chart:
      kind: candles
      data: [[17.12, 17.22, 17.10, 17.20], [17.20, 17.30, 17.18, 17.28], [17.28, 17.36, 17.26, 17.34], [17.34, 17.42, 17.32, 17.40], [17.40, 17.46, 17.38, 17.44], [17.44, 17.58, 17.32, 17.34], [17.34, 17.36, 17.24, 17.26], [17.26, 17.28, 17.16, 17.18], [17.18, 17.20, 17.10, 17.12], [17.12, 17.14, 17.04, 17.06], [17.06, 17.08, 16.94, 16.96]]
      volume: [78000, 86000, 94000, 104000, 112000, 196000, 148000, 126000, 108000, 94000, 86000]
      vwap: [17.12, 17.16, 17.20, 17.23, 17.26, 17.28, 17.29, 17.29, 17.28, 17.27, 17.26]
      levels:
        - {price: 17.5, label: "Yesterday's high"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell away to $16.96 — $0.38 a share under the decision, +$608 short on 1,600 shares."
    explanation: "Everyone who bought above yesterday's high was filled and then abandoned inside the same minute, and it was the busiest minute of the day."

  - type: mc
    prompt: "A minute at the top of a run has a long upper wick and a small body at the bottom. What happened inside it?"
    options:
      - {text: "Buyers pushed up and were sold into", correct: true}
      - {text: "Buyers were in control the whole minute"}
      - {text: "Volume dried up and nothing happened"}
    explanation: "The wick is exactly the part of the push that was taken back before the minute finished."

  - type: numeric-mc
    prompt: "That minute ran to $17.58 and finished at $17.34. How much of its push was handed back?"
    options:
      - {text: "$0.08"}
      - {text: "$0.16"}
      - {text: "$0.34"}
      - {text: "$0.24", correct: true}
    working: "$17.58 − $17.34 = $0.24"
    explanation: "Twenty-four cents offered and refused in sixty seconds, which is why the wick is worth measuring rather than glancing at."

  - type: tf
    statement: "A long upper wick with a small body only counts as a rejection candle if the body is green."
    answer: false
    explanation: "The colour is a detail. What matters is that the wick is long, the body is small, and it is at the other end of the candle."

  - type: spot-mistake
    prompt: "One of these does not follow. Tap it."
    segments:
      - {text: "The body covered the whole body before it"}
      - {text: "in the same direction,"}
      - {text: "so it is an engulfing candle.", wrong: true}
    explanation: "Engulfing means the other direction. Same direction and bigger is just a stronger minute of the same thing."

  - type: chart-decision
    scenario: "Yesterday's low is $22.24. The minute that just closed opened at the level and finished twenty cents higher, covering the whole body of the minute before it."
    shares: 1200
    state: ["Size: 1,200 shares"]
    chart:
      kind: candles
      data: [[22.60, 22.62, 22.48, 22.50], [22.50, 22.52, 22.40, 22.42], [22.42, 22.44, 22.34, 22.36], [22.36, 22.38, 22.28, 22.30], [22.30, 22.32, 22.22, 22.26], [22.24, 22.46, 22.22, 22.44], [22.44, 22.52, 22.42, 22.50], [22.50, 22.58, 22.48, 22.56], [22.56, 22.64, 22.54, 22.62], [22.62, 22.68, 22.60, 22.66], [22.66, 22.74, 22.64, 22.71]]
      volume: [86000, 94000, 102000, 112000, 96000, 224000, 156000, 132000, 114000, 98000, 88000]
      vwap: [22.62, 22.58, 22.54, 22.51, 22.49, 22.48, 22.48, 22.49, 22.50, 22.51, 22.52]
      levels:
        - {price: 22.24, label: "Yesterday's low"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $22.71 — $0.27 a share past the decision, +$324 long on 1,200 shares."
    explanation: "Five minutes of selling into the last full session's floor, and one minute that took the whole of the last one back on double the busiest bar before it. The line above is a cent away and goes next."

  - type: example
    body: "Four shapes, sixty seconds each: a body that held, a body that never formed, a wick that was refused, and a minute that erased the one before it."
