id: "6-2"
title: "VWAP & Levels in Action"
chapter: 4
chapter_title: "Reading Fast Markets"
path: scalping
category: new-theory
tags: [levels, failed-test, decisions]
learning_goal: "User can tell a break that holds from a failed test and knows why the failure often moves faster than the break."
purpose: "The moment a level breaks and immediately fails is one of the few times a fast market shows its hand."
terms_introduced: ["Failed test"]
prerequisite: "6-1"
xp: 20
difficulty: 3
path_position: fan-out:levels
sources: ["Volman — Understanding Price Action", "Bellafiore — One Good Trade"]
notes: "Fan-out strand B, second sub. Self-contained."
screens:
  - type: intro
    text: "A level breaks. Ninety seconds later price is back inside. That is information."

  - type: theory
    title: "The failed test"
    body: "A failed test is a break of a level that cannot hold: price trades through, then closes back on the old side within a candle or two. The break did not have the buying or selling behind it."

  - type: example
    body: "XYZ pushes two cents through yesterday's high at $41.20, spends one minute there and closes back at $41.14. Everyone who bought the break is now offside."

  - type: chart-decision
    scenario: "XYZ breaks yesterday's high at $18.20 by two cents, then closes back below it on the next candle with volume fading. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[17.90, 17.98, 17.86, 17.96], [17.96, 18.06, 17.94, 18.04], [18.04, 18.14, 18.02, 18.12], [18.12, 18.22, 18.10, 18.18], [18.18, 18.22, 18.12, 18.14], [18.14, 18.16, 18.04, 18.06], [18.06, 18.08, 17.96, 17.98], [17.98, 18.02, 17.88, 17.90], [17.90, 17.94, 17.80, 17.82], [17.82, 17.86, 17.74, 17.78]]
      volume: [68000, 72000, 84000, 91000, 42000, 76000, 81000, 74000, 69000, 62000]
      levels:
        - {price: 18.20, label: "Yesterday's high"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell to $17.78 — $0.28 per share, +$420 short on 1,500 shares from $18.06."
    explanation: "The break had no volume behind it, so the buyers it attracted became the sellers on the way back down."

  - type: theory
    title: "Why the failure moves"
    body: "Two groups push the same way at once: the traders who bought the break and now want out, and the traders who were waiting for it to fail. That is why a failed test often travels faster than the break did."

  - type: mc
    prompt: "Price breaks a level on the heaviest volume of the day and holds above it for five candles. What is that?"
    options:
      - {text: "A failed test, because price will always come back"}
      - {text: "Noise, because levels never break"}
      - {text: "A break that is holding — the level has changed hands", correct: true}
    explanation: "Heavy volume and closes that hold is the opposite of a failure — this level has genuinely gone."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Price traded one cent through the level"}
      - {text: "and is still there, so the test", wrong: true}
      - {text: "has already failed."}
    explanation: "While price is still beyond the level nothing has failed yet — the failure is the close back inside."

  - type: chart-decision
    scenario: "XYZ breaks the pre-market high at $17.40 on the biggest volume of the morning and the next two candles close above it. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[17.10, 17.18, 17.06, 17.16], [17.16, 17.24, 17.14, 17.22], [17.22, 17.30, 17.18, 17.28], [17.28, 17.38, 17.26, 17.36], [17.36, 17.48, 17.34, 17.46], [17.46, 17.54, 17.44, 17.52], [17.52, 17.62, 17.50, 17.60], [17.60, 17.68, 17.56, 17.66], [17.66, 17.72, 17.62, 17.70], [17.70, 17.76, 17.66, 17.72]]
      volume: [42000, 46000, 51000, 68000, 134000, 102000, 91000, 82000, 74000, 68000]
      levels:
        - {price: 17.40, label: "Pre-market high"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It kept going to $17.72 — $0.20 per share, +$300 long on 1,500 shares from $17.52."
    explanation: "Shorting a break because breaks sometimes fail is fighting the volume; this one had it."

  - type: tf
    statement: "A break on volume that holds for several closes is the same situation as a break that snaps back within a minute."
    answer: false
    explanation: "One has buying behind it and one does not — that is the whole difference between a break and a failed test."

  - type: match
    prompt: "Match each picture to what it is."
    pairs:
      - ["Two cents through, closed back inside", "Failed test"]
      - ["Through on record volume, three closes beyond", "A break that holds"]
      - ["Wick through, body back inside, average volume", "Not proven either way"]
      - ["Third touch of the level in ten minutes", "A level being worn thin"]
    explanation: "Where the candle closes and how many shares traded — that is the whole reading."

  - type: numeric-input
    prompt: "You short 1,500 shares at $18.06 with a stop at $18.24. What is at risk before costs?"
    answer: 270
    unit: "$"
    working: "($18.24 − $18.06) × 1,500 shares = $270"
    explanation: "The stop goes just beyond the failed break, because that is the price that would prove you wrong."

  - type: fill-tiles
    sentence: "A break that closes straight back inside the level is a ___ test."
    answer: "failed"
    explanation: "It went there, it could not stay, and everyone who joined it is now offside."

  - type: theory
    title: "The best evidence a level gives"
    body: "A level that holds tells you something. A level that breaks and cannot hold the break tells you more, and it usually tells you faster."
