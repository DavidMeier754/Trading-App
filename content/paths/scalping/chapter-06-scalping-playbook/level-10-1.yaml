id: "10-1"
title: "Final Exam"
chapter: 6
chapter_title: "Scalping Playbook"
path: scalping
category: final-exam
tags: [final-exam]
learning_goal: "Confirm mastery of the playbook card, the five setups, matching conditions to cards, R, costs and the discipline of passing."
purpose: "Twelve questions across everything the chapter built, and the last node on the scalping path."
terms_introduced: []
prerequisite: "9-2"
xp: 80
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "12 scored questions. Hearts apply. Pass mark 70 %."
screens:
  - type: intro
    text: "Final exam: the Scalping Playbook. Thirteen questions."
    counter: 13

  - type: mc
    prompt: "'Range day. Short the rejection candle at the top of the range. Stop two cents over the wick. Target VWAP. Out on a close through the level.' Which card is this?"
    options:
      - {text: "Failed-breakout fade"}
      - {text: "Mean reversion at a level", correct: true}
      - {text: "Momentum continuation"}
    explanation: "It leans against a level on a range day and aims back at the average price. The fade would need a break to have happened first."

  - type: numeric-mc
    prompt: "You risk $250 per trade. Three cards fired: the bounce made 2R, the fade lost 1R, the continuation made 1.5R. Where does the day stand, before costs?"
    options:
      - {text: "+$375"}
      - {text: "+$625", correct: true}
      - {text: "+$1,125"}
      - {text: "+$250"}
    working: "(2 − 1 + 1.5) = 2.5R; 2.5 × $250 = $625"
    explanation: "R makes a mixed day one sum, whatever share count each card used."

  - type: chart-decision
    scenario: "XYZ closed under the opening-range low at $19.60 on the lightest volume of the morning. This candle closes back above it at $19.64 on heavy volume. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[19.90, 19.96, 19.82, 19.84], [19.84, 19.88, 19.72, 19.74], [19.74, 19.78, 19.62, 19.64], [19.64, 19.68, 19.54, 19.56], [19.56, 19.66, 19.52, 19.64], [19.64, 19.76, 19.62, 19.74], [19.74, 19.86, 19.72, 19.84], [19.84, 19.94, 19.80, 19.90], [19.90, 19.98, 19.86, 19.94], [19.94, 20.02, 19.90, 19.98]]
      levels:
        - {price: 19.60, label: "Opening-range low"}
      volume: [82000, 70000, 58000, 46000, 106000, 94000, 86000, 78000, 72000, 66000]
      decision_index: 4
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $19.98. Out at $19.94: $0.30 per share, +$450 long on 1,500 shares from $19.64, against $0.14 of risk."
    explanation: "A break nobody bought, then a heavy close back inside. Everyone short from under the level has to cover."

  - type: tf
    statement: "A trade taken exactly by the card and stopped out still counts as a good decision."
    answer: true
    explanation: "The card decides whether a trade was good; one outcome does not. Losses inside the plan are what the plan costs."

  - type: match
    prompt: "Match each card to its trigger."
    pairs:
      - ["VWAP bounce", "The first candle closing back above the line"]
      - ["Opening-range scalp", "A candle closing beyond one side of the box on volume"]
      - ["Momentum continuation", "The first close back in the leg's direction after a quiet pause"]
      - ["Failed-breakout fade", "The candle closing back on the level's original side"]
    explanation: "Every trigger is a close. None of them is a touch, a wick or a feeling."

  - type: mc
    prompt: "Volume is half its normal level, VWAP is flat, and no level is within twenty cents of price. How many of your five cards are on the table?"
    options:
      - {text: "The two that suit a range day"}
      - {text: "All five, at a smaller share count"}
      - {text: "None", correct: true}
    explanation: "No movement and no level means no card. Sessions like this are where a playbook saves money rather than making it."

  - type: chart-decision
    scenario: "XYZ has climbed all morning and never traded back to VWAP. It wicks through the round number $27.00 to $27.14 and closes at $26.90. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.20, 26.40, 26.18, 26.38], [26.38, 26.58, 26.36, 26.56], [26.56, 26.78, 26.54, 26.76], [26.76, 26.98, 26.74, 26.96], [26.96, 27.14, 26.94, 27.00], [27.00, 27.06, 26.88, 26.90], [26.90, 27.10, 26.88, 27.08], [27.08, 27.28, 27.06, 27.26], [27.26, 27.44, 27.22, 27.40], [27.40, 27.58, 27.36, 27.54]]
      levels:
        - {price: 27.00, label: "Round number"}
      volume: [94000, 106000, 118000, 132000, 146000, 92000, 104000, 116000, 128000, 140000]
      decision_index: 5
    best: no-trade
    outcome: "It took the number on the next attempt and ran to $27.54 — $0.64 against a short, $640 on 1,000 shares."
    explanation: "A rejection candle inside a trend that has not seen VWAP all session is a breather, not a turn."

  - type: sort
    prompt: "Take it or pass?"
    buckets: ["Take it", "Pass"]
    items:
      - {text: "Close beyond the box on triple volume, first half hour", bucket: "Take it"}
      - {text: "Rejection at yesterday's high on climax volume, range day", bucket: "Take it"}
      - {text: "Re-entry candle on the session's smallest volume", bucket: "Pass"}
      - {text: "A measured move of $0.05 behind a $0.04 spread", bucket: "Pass"}
    explanation: "Shape, volume, conditions, cost. A card needs all four, not three."

  - type: numeric-input
    prompt: "You are long 1,500 shares at $18.80 and sell at $19.02. The spread costs $0.04 per share on the round trip and fees are $0.005 per share each way. What is left?"
    answer: 255
    tolerance: 0.5
    unit: "$"
    working: "$0.22 × 1,500 = $330; spread $0.04 × 1,500 = $60; fees $0.005 × 1,500 × 2 = $15; $330 − $75 = $255"
    explanation: "Twenty-two cents gross, seventeen net. Costs took nearly a quarter of the move."

  - type: chart-tap
    prompt: "Tap the candle that puts you in on the momentum continuation card."
    chart:
      kind: candles
      data: [[41.20, 41.36, 41.18, 41.34], [41.34, 41.52, 41.32, 41.50], [41.50, 41.68, 41.48, 41.66], [41.66, 41.68, 41.56, 41.58], [41.58, 41.62, 41.52, 41.54], [41.54, 41.68, 41.52, 41.66], [41.66, 41.82, 41.64, 41.80], [41.80, 41.94, 41.76, 41.90]]
      volume: [86000, 102000, 118000, 54000, 40000, 106000, 92000, 84000]
    target: 5
    explanation: "Three candles up, two small quiet ones back, then the first close in the leg's direction on volume."

  - type: fill-choice
    sentence: "The card that targets the high of day is the ___."
    options: ["VWAP bounce", "failed-breakout fade", "mean reversion at a level"]
    answer: "VWAP bounce"
    explanation: "It is a with-trend trade in a stock that has held the line all session, so the day's own high is the natural stop-off point."

  - type: mc
    prompt: "Over 200 trades each: card A wins 60 % of the time, average win 0.9R, average loss 1R. Card B wins 35 %, average win 2.4R, average loss 1R. Which card do you keep?"
    options:
      - {text: "B — (0.35 × 2.4) − (0.65 × 1) = +0.19R a trade, against A's +0.14R", correct: true}
      - {text: "A — it is right nearly twice as often as B"}
      - {text: "Both are the same, because both average losses are 1R"}
    explanation: "Expectancy, not win rate, decides which card earns its place in the playbook."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The break failed and closed back inside,"}
      - {text: "so you enter and put the stop at VWAP", wrong: true}
      - {text: "instead of beyond the failed extreme."}
    explanation: "Beyond the extreme is the price that would prove the break was real. VWAP is where this card takes profit, not where it gives up."

  - type: summary
    total: 13

  - type: badge
    name: "Scalping Playbook — Complete"
    unlocks: "Scalping path complete"
