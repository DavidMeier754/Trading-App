id: "9-1"
title: "Capstone — A Full Session"
chapter: 6
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [capstone, session, process, decisions]
learning_goal: "User runs a session in order: plan, day read, cards as they appear, and the risk left checked between trades."
purpose: "Setups are the easy half. Running them in sequence, with costs and a limit, is the job."
terms_introduced: []
prerequisite: "8-1"
xp: 30
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Aziz — How to Day Trade for a Living"]
notes: "First half of the capstone: the plan and the first three charts. 9-2 finishes the morning."
screens:
  - type: intro
    text: "One morning, one stock, five cards and $20,000."

  - type: story
    character: retail-trader
    text: "Thirty minutes before {{market.regular_open}} {{market.timezone}}. Yesterday's high and low are drawn, the pre-market high and low are drawn, the round numbers are marked."

  - type: theory
    title: "The plan fits on one line"
    body: "Risk $200 a trade — one per cent of the account. Daily loss limit 3R, so $600. Five cards, and no trade that is not one of them."

  - type: visual
    component: chart-candles
    data:
      data: [[30.22, 30.30, 30.18, 30.26], [30.26, 30.34, 30.22, 30.30], [30.30, 30.38, 30.26, 30.32], [30.32, 30.40, 30.28, 30.36], [30.36, 30.40, 30.32, 30.38]]
      levels:
        - {price: 30.40, label: "Opening-range high"}
        - {price: 30.10, label: "Opening-range low"}
      volume: [4400, 4000, 3600, 3300, 3100]
    caption: "The first five minutes are done. The box is $30.10 to $30.40, and volume is shrinking against the top edge."

  - type: chart-decision
    scenario: "The next candle closes at $30.50, above the box, on more than triple the volume of the candles that built it. You have 1,250 shares ready and $200 of risk for the trade."
    shares: 1250
    chart:
      kind: candles
      data: [[30.22, 30.30, 30.18, 30.26], [30.26, 30.34, 30.22, 30.30], [30.30, 30.38, 30.26, 30.32], [30.32, 30.40, 30.28, 30.36], [30.36, 30.40, 30.32, 30.38], [30.38, 30.52, 30.36, 30.50], [30.50, 30.62, 30.48, 30.60], [30.60, 30.70, 30.56, 30.66], [30.66, 30.74, 30.62, 30.70], [30.70, 30.78, 30.66, 30.74]]
      levels:
        - {price: 30.40, label: "Opening-range high"}
        - {price: 30.10, label: "Opening-range low"}
      volume: [4400, 4000, 3600, 3300, 3100, 10200, 8800, 8000, 7200, 6600]
      decision_index: 5
    best: long
    outcome: "It ran to $30.74. Out there: $0.24 per share, +$300 long on 1,250 shares from $30.50, with the stop at $30.34."
    explanation: "Card B, first trade of the day: coiling against the edge, then a close beyond it on the session's heaviest volume."

  - type: numeric-input
    prompt: "You bought 1,250 shares at $30.50 and sold at $30.74. The round trip costs $0.03 per share. What is the net?"
    answer: 262.5
    tolerance: 0.5
    unit: "$"
    working: "$0.24 × 1,250 = $300; costs $0.03 × 1,250 = $37.50; $300 − $37.50 = $262.50"
    explanation: "Three cents of a twenty-four-cent move. That ratio is the reason the card needs a target worth taking."

  - type: story
    character: retail-trader
    text: "An hour later. XYZ has stayed above VWAP the whole time and the 5-minute is still climbing. Now it eases back toward the line."

  - type: chart-decision
    scenario: "Price drifts into VWAP at $30.87 on shrinking volume, and this candle closes at $30.94 on the heaviest volume in ten minutes. High of day $31.22. You have 1,250 shares ready."
    shares: 1250
    chart:
      kind: candles
      data: [[31.10, 31.16, 31.02, 31.04], [31.04, 31.08, 30.96, 30.98], [30.98, 31.02, 30.90, 30.92], [30.92, 30.96, 30.86, 30.88], [30.88, 30.92, 30.80, 30.84], [30.84, 30.96, 30.82, 30.94], [30.94, 31.04, 30.92, 31.02], [31.02, 31.12, 31.00, 31.10], [31.10, 31.18, 31.06, 31.14], [31.14, 31.22, 31.10, 31.18]]
      vwap: [30.90, 30.89, 30.88, 30.88, 30.87, 30.87, 30.88, 30.89, 30.90, 30.91]
      volume: [6600, 5800, 5100, 4400, 3800, 9400, 8200, 7400, 6800, 6200]
      decision_index: 5
    best: long
    outcome: "It reached the high of day at $31.22. Out at $31.18: $0.24 per share, +$300 long on 1,250 shares from $30.94."
    explanation: "Card A on a trend day — the pullback into the line, bought back on volume, with the high of day as the target."

  - type: mc
    prompt: "Two winners in, the morning is up about $525 net. What does the playbook say about the next chart?"
    options:
      - {text: "Nothing — the next chart is judged on its own card, not on the morning so far", correct: true}
      - {text: "Size up, because the day is clearly working"}
      - {text: "Stop for the day and protect what is there"}
    explanation: "The chart does not know what you made this morning. Sizing up on a good run is how a good morning turns into a flat one."

  - type: chart-decision
    scenario: "Late morning. Volume has dried up, VWAP is flat, and price is sitting in a ten-cent band with no level nearby. You have 1,250 shares ready."
    shares: 1250
    chart:
      kind: candles
      data: [[31.14, 31.18, 31.10, 31.16], [31.16, 31.20, 31.11, 31.13], [31.13, 31.18, 31.09, 31.15], [31.15, 31.19, 31.10, 31.12], [31.12, 31.17, 31.08, 31.14], [31.14, 31.18, 31.09, 31.11], [31.11, 31.16, 31.08, 31.13], [31.13, 31.17, 31.09, 31.12], [31.12, 31.16, 31.08, 31.14], [31.14, 31.18, 31.10, 31.12]]
      vwap: [31.13, 31.13, 31.13, 31.13, 31.13, 31.13, 31.13, 31.13, 31.13, 31.13]
      volume: [4200, 3800, 3400, 3100, 2800, 2600, 2500, 2400, 2300, 2200]
      decision_index: 5
    best: no-trade
    outcome: "Another twenty minutes in the same band. Two round trips would have paid $75 in spread on 1,250 shares and returned nothing."
    explanation: "No card, no trade — and this is the stretch of the session where most of a good morning gets handed back."

  - type: tf
    statement: "Two winners in a row is a reason to widen the stop on the third trade."
    answer: false
    explanation: "The stop comes from the card and the chart, never from the balance. Profit is not extra risk for the next trade."

  - type: order
    prompt: "Put the morning in the order you actually ran it."
    items:
      - "Mark the levels and read the 5-minute before the open"
      - "Wait for the opening range to finish forming"
      - "Take the first chart that matches a card"
      - "Check the risk left before looking at the next one"
    explanation: "Plan, wait, trade, count. The counting step is the one beginners drop first."

  - type: theory
    title: "Half a morning gone"
    body: "Two cards taken, one chart passed, costs paid. The second half is where the day stops being easy."
