id: "7-2"
title: "Setup E — Failed-Breakout Fade"
chapter: 6
chapter_title: "Scalping Playbook"
path: scalping
category: repetition
tags: [failed-breakout, setup-e, practice, decisions]
learning_goal: "User fades only weak breaks that close back inside, and leaves alone breaks that were bought, weak re-entries and fades against the 5-minute trend."
purpose: "The difference between a failed break and a real one is volume and one candle close — and it is worth a lot of money either way."
terms_introduced: []
prerequisite: "7-1"
xp: 30
difficulty: 3
sources: ["Volman — Understanding Price Action", "Bellafiore — One Good Trade"]
notes: "Five decisions: two fades, one continuation, two passes. Interleaves the two-timeframe rule from Chapter 4."
screens:
  - type: intro
    text: "Five breaks. Only two of them broke."

  - type: story
    character: retail-trader
    text: "Levels marked, VWAP on the chart, 5-minute chart open beside the 1-minute. $20,000 in the account."

  - type: chart-decision
    scenario: "XYZ closed above the opening-range high at $34.20 on the lightest volume of the morning. This candle closes back inside at $34.16 on heavy volume. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[33.94, 34.06, 33.92, 34.04], [34.04, 34.16, 34.02, 34.14], [34.14, 34.28, 34.12, 34.26], [34.26, 34.30, 34.20, 34.24], [34.24, 34.28, 34.14, 34.16], [34.16, 34.20, 34.06, 34.08], [34.08, 34.12, 33.96, 33.98], [33.98, 34.02, 33.86, 33.88], [33.88, 33.92, 33.78, 33.80], [33.80, 33.84, 33.70, 33.74]]
      vwap: [33.90, 33.92, 33.94, 33.96, 33.98, 33.98, 33.98, 33.97, 33.96, 33.95]
      levels:
        - {price: 34.20, label: "Opening-range high"}
      volume: [7200, 6400, 5100, 4400, 9800, 8600, 7800, 7000, 6400, 5900]
      decision_index: 4
    best: short
    outcome: "It fell to VWAP at $33.98 and carried on to $33.74. Out at the line: $0.18 per share, +$270 short on 1,500 shares from $34.16."
    explanation: "The break traded fewer shares than the candles before it, and the return closed on heavy volume. That is the whole card."

  - type: slider
    prompt: "Take a guess: what share of intraday level breaks keep going instead of coming back?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 40
    tolerance: 15
    explanation: "Well under half on a typical chart — which is exactly why this card finds enough setups to be worth learning."

  - type: chart-decision
    scenario: "XYZ closed above the round number $62.00 on triple the volume of the candles before it, pulled back for one small candle that stayed above, and now closes at $62.16. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[61.70, 61.80, 61.68, 61.78], [61.78, 61.90, 61.76, 61.88], [61.88, 62.04, 61.86, 62.02], [62.02, 62.14, 62.00, 62.12], [62.12, 62.16, 62.04, 62.06], [62.06, 62.18, 62.02, 62.16], [62.16, 62.30, 62.14, 62.28], [62.28, 62.42, 62.26, 62.40], [62.40, 62.52, 62.36, 62.48], [62.48, 62.60, 62.44, 62.56]]
      levels:
        - {price: 62.00, label: "Round number"}
      volume: [6400, 7600, 12800, 11400, 8200, 9600, 9200, 8600, 7800, 7200]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $62.56 — $0.40 per share, +$600 long on 1,500 shares from $62.16."
    explanation: "This break was bought on triple volume and never gave the level back. The shape here is card C, and fading it would be taking the losing side."

  - type: numeric-mc
    prompt: "Back to the first trade: short 1,500 shares at $34.16, covered at $33.98. What did it make before costs?"
    options:
      - {text: "$270", correct: true}
      - {text: "$180"}
      - {text: "$240"}
      - {text: "$540"}
    working: "$34.16 − $33.98 = $0.18 per share; $0.18 × 1,500 shares = $270"
    explanation: "Eighteen cents. The share count is what makes it worth the screen time."

  - type: chart-decision
    scenario: "XYZ closed under the pre-market low at $47.00 on shrinking volume. This candle closes back above it at $47.06 on the heaviest volume in ten minutes. You have 2,000 shares ready."
    shares: 2000
    chart:
      kind: candles
      data: [[47.30, 47.36, 47.22, 47.24], [47.24, 47.28, 47.12, 47.14], [47.14, 47.18, 47.02, 47.04], [47.04, 47.08, 46.92, 46.94], [46.94, 47.08, 46.90, 47.06], [47.06, 47.18, 47.04, 47.16], [47.16, 47.28, 47.14, 47.26], [47.26, 47.36, 47.22, 47.32], [47.32, 47.42, 47.28, 47.38], [47.38, 47.46, 47.34, 47.42]]
      vwap: [47.34, 47.32, 47.30, 47.28, 47.26, 47.26, 47.27, 47.28, 47.30, 47.32]
      levels:
        - {price: 47.00, label: "Pre-market low"}
      volume: [7800, 6600, 5400, 4200, 10400, 9200, 8400, 7600, 7000, 6400]
      decision_index: 4
    best: long
    outcome: "It climbed through VWAP to $47.42. Out at $47.32: $0.26 per share, +$520 long on 2,000 shares from $47.06, against $0.18 of risk."
    explanation: "Quiet break, loud return. The sellers who pushed it under the level had to buy it back above it."

  - type: match
    prompt: "Match each break to what it actually is."
    pairs:
      - ["Break on the lightest volume of the hour, back inside next minute", "Card E — fade it"]
      - ["Break on triple volume that holds and pauses shallowly", "Card C — continuation"]
      - ["Re-entry candle on the smallest volume of the session", "Nobody bought it back — pass"]
      - ["Break the other way from a clear 5-minute trend", "Fighting the slower chart — pass"]
    explanation: "Two of these are trades on your cards. The other two are charts that look like trades."

  - type: chart-decision
    scenario: "XYZ closed under the round number $21.00, and this candle closes back above it at $21.02 — on the smallest volume of the session. You have 2,000 shares ready."
    shares: 2000
    chart:
      kind: candles
      data: [[21.30, 21.36, 21.24, 21.26], [21.26, 21.30, 21.16, 21.18], [21.18, 21.22, 21.06, 21.08], [21.08, 21.12, 20.94, 20.96], [20.96, 21.04, 20.94, 21.02], [21.02, 21.06, 20.92, 20.94], [20.94, 20.98, 20.84, 20.86], [20.86, 20.90, 20.76, 20.78], [20.78, 20.82, 20.68, 20.70], [20.70, 20.74, 20.62, 20.66]]
      levels:
        - {price: 21.00, label: "Round number"}
      volume: [6800, 6200, 5800, 5400, 3100, 5600, 6400, 7000, 7600, 8200]
      decision_index: 4
    best: no-trade
    outcome: "It closed back under the number the next minute and slid to $20.66 — $0.36 against a long, $720 on 2,000 shares."
    explanation: "The return has to be at least as convincing as the break was weak. On the session's smallest volume, nobody bought anything back."

  - type: tf
    statement: "The stop for a fade goes two cents beyond the failed break's extreme."
    answer: true
    explanation: "If price gets back there the break was real after all, and there is nothing left to fade."

  - type: chart-decision
    scenario: "The 5-minute chart has been in a clear uptrend all session. XYZ pushes above yesterday's high at $58.60 on heavy volume, then closes back under it at $58.56. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[58.20, 58.32, 58.18, 58.30], [58.30, 58.44, 58.28, 58.42], [58.42, 58.56, 58.40, 58.54], [58.54, 58.68, 58.52, 58.66], [58.66, 58.70, 58.54, 58.56], [58.56, 58.60, 58.48, 58.52], [58.52, 58.66, 58.50, 58.64], [58.64, 58.78, 58.62, 58.76], [58.76, 58.90, 58.72, 58.86], [58.86, 58.98, 58.82, 58.94]]
      levels:
        - {price: 58.60, label: "Yesterday's high"}
      volume: [8200, 9400, 10600, 11800, 9200, 6400, 8600, 9800, 10400, 11200]
      decision_index: 4
    best: no-trade
    reasonable: [short]
    outcome: "It paused for one candle, then made new highs to $58.94 — $0.38 against a short, $570 on 1,500 shares."
    explanation: "The break came on heavy volume inside a 5-minute uptrend. Fading that is fighting the slower chart, and the slower chart wins more often."

  - type: fill-tiles
    sentence: "Everyone still holding the failed break at a loss is a ___ trader."
    answer: "trapped"
    explanation: "Their exits are the move, which is why a failed break can travel further than the break would have."

  - type: theory
    title: "The playbook is complete"
    body: "Five cards. From here it stops being about learning setups and starts being about picking the right one for the day in front of you."
