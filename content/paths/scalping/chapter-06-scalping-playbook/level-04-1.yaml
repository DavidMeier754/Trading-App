id: "4-1"
title: "Setup C — Momentum Continuation"
chapter: 6
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [momentum, setup-c, playbook]
learning_goal: "User can identify a leg, judge whether the pullback is shallow enough, and place the entry, stop and measured-move target."
purpose: "Most of a fast move happens after the first push, and this is the card that gets you in without chasing."
terms_introduced: ["Momentum continuation", "Leg", "Measured move"]
prerequisite: "3-2"
xp: 20
difficulty: 2
sources: ["Volman — Understanding Price Action", "Bellafiore — The PlayBook"]
notes: "Third card. Introduces the leg and the measured move. 4-2 drills it."
screens:
  - type: intro
    text: "Card three: you missed the push. Good — that is when this one starts."

  - type: theory
    title: "A leg is one push"
    body: "Three or more 1-minute candles running the same way, bodies getting bigger, volume rising. That run is a leg. Chasing the third candle of it is how beginners buy the high."

  - type: theory
    title: "Then the market breathes"
    body: "After a leg comes a pause: one to three small candles drifting back, on shrinking volume. Falling volume means few shares are being sold into it — buyers have just stepped back for a minute."

  - type: visual
    component: chart-candles
    data:
      data: [[23.10, 23.24, 23.08, 23.22], [23.22, 23.38, 23.20, 23.36], [23.36, 23.50, 23.34, 23.48], [23.48, 23.50, 23.40, 23.42], [23.42, 23.46, 23.36, 23.38], [23.38, 23.52, 23.36, 23.50], [23.50, 23.64, 23.48, 23.62], [23.62, 23.74, 23.58, 23.70]]
      volume: [78000, 92000, 108000, 54000, 40000, 96000, 84000, 76000]
    caption: "Leg, two quiet candles, then the push starts again."

  - type: theory
    title: "The trigger"
    body: "The first candle that closes back in the direction of the leg puts you in. That is the momentum continuation: you buy the restart, not the run."

  - type: slider
    prompt: "A leg ran from $13.00 to $13.40. The pullback stopped at $13.28. How much of the leg did it give back?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 30
    tolerance: 10
    explanation: "$0.12 given back out of a $0.40 leg — under a third, which is exactly the shallow pause this card wants."

  - type: theory
    title: "Stop and target"
    body: "Stop two cents beyond the pullback's extreme. Target a measured move: the height of the leg, projected from your entry. A leg that ran $0.40 is asking for roughly $0.40 more."

  - type: numeric-input
    prompt: "The leg ran $0.40. You buy 2,000 shares at $13.32 and the measured move plays out in full. What is the profit before costs?"
    answer: 800
    unit: "$"
    working: "Target $13.32 + $0.40 = $13.72; $0.40 × 2,000 shares = $800"
    explanation: "The measured move is a projection, not a promise — but it is the number the card is written around."

  - type: mc
    prompt: "Which pullback is the one this card is waiting for?"
    options:
      - {text: "Two candles back, each smaller than the last, on falling volume", correct: true}
      - {text: "Five candles back to where the leg started, on rising volume"}
      - {text: "One large candle that swallows the whole leg in a minute"}
    explanation: "Shallow, short and quiet. The other two are the leg being unwound, not paused."

  - type: tf
    statement: "A pullback that gives back more than half the leg is still a good entry for this card."
    answer: false
    explanation: "Past half, the buyers who made the leg have already been overwhelmed — the pause has become a reversal."

  - type: chart-decision
    scenario: "XYZ ran from $12.96 to $13.42 in three candles above VWAP, then paused for two small candles on light volume. The next candle closes at $13.38 on heavy volume. You have 2,000 shares ready."
    shares: 2000
    chart:
      kind: candles
      data: [[12.98, 13.14, 12.96, 13.12], [13.12, 13.28, 13.10, 13.26], [13.26, 13.42, 13.24, 13.40], [13.40, 13.42, 13.30, 13.32], [13.32, 13.36, 13.26, 13.28], [13.28, 13.40, 13.26, 13.38], [13.38, 13.52, 13.36, 13.50], [13.50, 13.64, 13.48, 13.62], [13.62, 13.74, 13.58, 13.70], [13.70, 13.80, 13.66, 13.76]]
      vwap: [12.90, 12.94, 13.00, 13.06, 13.10, 13.14, 13.20, 13.26, 13.32, 13.38]
      volume: [82000, 94000, 106000, 52000, 39000, 98000, 86000, 78000, 70000, 64000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It pushed on to $13.76 — eight cents short of the $13.84 measured move. Out at $13.76: $0.38 per share, +$760 long on 2,000 shares from $13.38, with $0.14 of risk."
    explanation: "Every field on the card filled, and the move still stopped short of the projection. That is what 'projection, not promise' means."

  - type: match
    prompt: "Match each thing you see to what it is telling you."
    pairs:
      - ["Bodies growing through the leg", "The push is still being bought"]
      - ["Volume falling through the pullback", "Nobody is selling into it"]
      - ["Volume rising through the pullback", "The leg is being unwound"]
      - ["A close back in the leg's direction", "Your trigger"]
    explanation: "The candles give you the shape; the volume tells you whether to believe it."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The leg is running, so you buy"}
      - {text: "the third candle of the leg itself", wrong: true}
      - {text: "rather than waiting for the pause."}
    explanation: "Buying inside the leg puts your stop far away and your entry at the worst price of the minute. The card pays for the pause."

  - type: theory
    title: "Three cards, and a checkpoint"
    body: "You have a bounce, a break and a continuation. Ten questions next to see which ones actually stuck."
