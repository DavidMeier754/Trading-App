id: "5-1"
title: "Checkpoint"
chapter: 6
chapter_title: "Scalping Playbook"
path: scalping
category: test
tags: [checkpoint]
learning_goal: "Verify Levels 1–4: the five fields of a card, the VWAP bounce, the opening-range scalp, the momentum continuation, R and the measured move, and the cost check."
purpose: "Two more cards are coming. They only help if the first three are already automatic."
terms_introduced: []
prerequisite: "4-2"
xp: 40
difficulty: 2
sources: ["Bellafiore — The PlayBook", "Aziz — How to Day Trade for a Living"]
notes: "10 scored questions. Hearts apply. Pass mark 70 %."
screens:
  - type: intro
    text: "Checkpoint. Ten questions on the first three cards. Hearts are on."
    counter: 10

  - type: mc
    prompt: "A card reads: 'Above VWAP all session. Long on the reclaim candle. Stop two cents under its low. Out at the high of day.' Which field is still missing?"
    options:
      - {text: "Invalidation — what makes you drop the idea before the stop", correct: true}
      - {text: "Entry — the card never says what puts you in"}
      - {text: "Target — the card never says where you get out"}
    explanation: "Context, entry, stop and target are all there. Nothing tells you when the idea is simply no longer true."

  - type: numeric-mc
    prompt: "You are long 2,000 shares at $14.60 with the stop at $14.48. What is 1R for this position?"
    options:
      - {text: "$120"}
      - {text: "$240", correct: true}
      - {text: "$0.12"}
      - {text: "$480"}
    working: "$14.60 − $14.48 = $0.12 per share; $0.12 × 2,000 shares = $240"
    explanation: "R is the risk in money, so the share count is part of it."

  - type: chart-decision
    scenario: "XYZ has held above VWAP since the open. It eases into the line at $17.99 on shrinking volume and the next candle closes at $18.06 on the heaviest volume in ten minutes. You have 1,500 shares ready."
    shares: 1500
    chart:
      kind: candles
      data: [[18.30, 18.36, 18.22, 18.24], [18.24, 18.28, 18.12, 18.14], [18.14, 18.18, 18.04, 18.06], [18.06, 18.10, 17.98, 18.00], [18.00, 18.04, 17.92, 17.96], [17.96, 18.08, 17.94, 18.06], [18.06, 18.16, 18.04, 18.14], [18.14, 18.24, 18.10, 18.20], [18.20, 18.28, 18.16, 18.26], [18.26, 18.34, 18.22, 18.30]]
      vwap: [18.02, 18.01, 18.00, 18.00, 17.99, 17.99, 18.00, 18.01, 18.02, 18.03]
      volume: [74000, 66000, 58000, 49000, 42000, 98000, 86000, 78000, 70000, 64000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It climbed back to $18.30 — $0.24 per share, +$360 long on 1,500 shares from $18.06."
    explanation: "Quiet into the line, bought on the way out: card A with every field filled."

  - type: tf
    statement: "Widening a stop mid-trade makes every other number on the card meaningless."
    answer: true
    explanation: "The risk was the basis for the share count and the target; move it and none of them still hold."

  - type: match
    prompt: "Match each card to the chart it belongs on."
    pairs:
      - ["VWAP bounce", "Above the line all session, first pullback into it"]
      - ["Opening-range scalp", "First half hour, a close beyond one side of the box"]
      - ["Momentum continuation", "A leg, then a shallow pause on falling volume"]
      - ["No trade", "A ten-cent band, flat VWAP, no level nearby"]
    explanation: "Three cards and a large fourth category that most of the session belongs to."

  - type: mc
    prompt: "Price has chopped around the top of the opening range for ten minutes. What does the card need before you buy?"
    options:
      - {text: "A single trade printing above the box"}
      - {text: "A candle closing above the box on heavy volume", correct: true}
      - {text: "Three candles in a row making higher highs"}
    explanation: "The close is the trigger and the volume is the proof. Anything less is still chop."

  - type: chart-decision
    scenario: "XYZ ran from $13.08 to $13.58 in three candles, then pulled back to $13.16 on volume as heavy as the run itself. The next candle closes at $13.28. You have 2,000 shares ready."
    shares: 2000
    chart:
      kind: candles
      data: [[13.10, 13.26, 13.08, 13.24], [13.24, 13.42, 13.22, 13.40], [13.40, 13.58, 13.38, 13.56], [13.56, 13.58, 13.34, 13.36], [13.36, 13.40, 13.16, 13.18], [13.18, 13.30, 13.16, 13.28], [13.28, 13.32, 13.14, 13.16], [13.16, 13.20, 13.02, 13.04], [13.04, 13.08, 12.90, 12.92], [12.92, 12.96, 12.80, 12.84]]
      volume: [84000, 96000, 112000, 88000, 104000, 62000, 74000, 82000, 90000, 98000]
      decision_index: 5
    best: no-trade
    outcome: "It slid on to $12.84 — $0.44 against a long, $880 on 2,000 shares."
    explanation: "Eighty per cent of the leg given back on heavy volume. That is a reversal wearing a pullback's clothes."

  - type: order
    prompt: "Put these opening-range moments in the order they happen."
    items:
      - "The first five minutes close and the box is set"
      - "Price coils against the top of the box on shrinking volume"
      - "A candle closes above the box on heavy volume"
      - "The stop goes back inside the box"
    explanation: "The box has to exist, then be pressed, then be broken — and only then does the stop have a home."

  - type: numeric-input
    prompt: "You buy 2,000 shares at $14.40 and sell at $14.58. The round trip costs $0.03 per share in spread and $0.005 per share in fees each way. What is left?"
    answer: 280
    tolerance: 0.5
    unit: "$"
    working: "$0.18 × 2,000 = $360; spread $0.03 × 2,000 = $60; fees $0.005 × 2,000 × 2 = $20; $360 − $80 = $280"
    explanation: "Eighteen cents gross, fourteen net. Costs take about a fifth of a trade this size."

  - type: fill-choice
    sentence: "The target on the continuation card is the height of the ___ projected from your entry."
    options: ["leg", "pullback", "opening range"]
    answer: "leg"
    explanation: "The leg tells you how far this stock is travelling today; the pullback only tells you whether to get in."

  - type: summary
    total: 10
