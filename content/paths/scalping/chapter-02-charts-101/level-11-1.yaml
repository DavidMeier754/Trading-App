id: "11-1"
title: "Levels Practice"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: repetition
tags: [levels, decisions, practice]
learning_goal: "User applies levels, closes beyond them and volume together to choose long, short or no trade."
purpose: "Levels only pay when you can act on them in the minute they matter."
terms_introduced: []
prerequisite: "10-1"
xp: 20
difficulty: 3
sources: [consensus]
notes: "Practice on Levels 1–5. Four decisions, no new ideas."
screens:
  - type: intro
    text: "Four charts, four levels. Long, short or nothing — you decide."

  - type: story
    character: retail-trader
    text: "Before the session you marked yesterday's low, the pre-market high and the round numbers on both sides. Now the market is open and the first one is being tested."

  - type: chart-decision
    scenario: "XYZ has fallen four minutes straight into $12.00, a round number that stopped it earlier. The last candle dipped to $11.98, then closed at $12.08. You are sizing 2,000 shares."
    shares: 2000
    chart:
      kind: candles
      data: [[12.34, 12.38, 12.28, 12.30], [12.30, 12.33, 12.20, 12.22], [12.22, 12.26, 12.10, 12.12], [12.12, 12.16, 12.02, 12.05], [12.05, 12.09, 11.98, 12.02], [12.02, 12.10, 12.00, 12.08], [12.08, 12.18, 12.06, 12.16], [12.16, 12.24, 12.14, 12.22], [12.22, 12.28, 12.18, 12.26], [12.26, 12.32, 12.22, 12.28], [12.28, 12.34, 12.24, 12.30]]
      volume: [58000, 66000, 78000, 92000, 104000, 88000, 96000, 84000, 72000, 61000, 55000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "Price worked back to $12.30 — $0.22 a share above the decision, +$440 long on 2,000 shares."
    explanation: "The dip under $12.00 was bought back inside the same minute: that is the level doing its job."

  - type: match
    prompt: "Match each name to what the chart did."
    pairs:
      - ["Breakout", "Closed above the level on heavy volume"]
      - ["Bounce", "Long lower wick into support, closed back above"]
      - ["Pullback", "Dipped inside an uptrend and held above the last low"]
      - ["Range", "Stopped at the same ceiling and floor four times"]
    explanation: "Four shapes, four names — and each one asks for a different decision."

  - type: chart-decision
    scenario: "XYZ pushed a few cents above $34.00 and closed straight back under it. Since then every candle has closed lower, on rising volume. You are sizing 800 shares."
    shares: 800
    chart:
      kind: candles
      data: [[33.80, 33.92, 33.78, 33.90], [33.90, 34.04, 33.88, 34.02], [34.02, 34.08, 33.96, 33.98], [33.98, 34.02, 33.90, 33.92], [33.92, 33.96, 33.84, 33.86], [33.86, 33.90, 33.78, 33.80], [33.80, 33.83, 33.71, 33.73], [33.73, 33.76, 33.65, 33.66], [33.66, 33.71, 33.60, 33.63], [33.63, 33.66, 33.57, 33.60], [33.60, 33.65, 33.56, 33.59]]
      volume: [52000, 71000, 84000, 66000, 74000, 88000, 96000, 92000, 78000, 66000, 58000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell to $33.56 and finished the run at $33.59 — $0.21 a share, +$168 short on 800 shares."
    explanation: "A push above the level that could not close there leaves everyone who bought it offside, and they sell."

  - type: numeric-mc
    prompt: "You bought 2,000 shares at $12.08 when the level held and sold at $12.28. Result before costs?"
    options:
      - {text: "$400", correct: true}
      - {text: "$40"}
      - {text: "$4,000"}
      - {text: "$0.20"}
    working: "$0.20 a share × 2,000 shares = $400"
    explanation: "Twenty cents is small; 2,000 shares is what makes it worth the trade."

  - type: chart-decision
    scenario: "XYZ has been capped at $46.95, the pre-market high, twice this morning. The candle that just closed finished at $47.06 on more than double the volume of any candle before it. You are sizing 600 shares."
    shares: 600
    chart:
      kind: candles
      data: [[46.70, 46.78, 46.66, 46.76], [46.76, 46.84, 46.72, 46.82], [46.82, 46.90, 46.78, 46.86], [46.86, 46.92, 46.80, 46.84], [46.84, 46.94, 46.82, 46.92], [46.92, 47.08, 46.90, 47.06], [47.06, 47.18, 47.04, 47.16], [47.16, 47.24, 47.12, 47.22], [47.22, 47.30, 47.18, 47.28], [47.28, 47.34, 47.24, 47.30], [47.30, 47.36, 47.26, 47.32]]
      volume: [42000, 48000, 56000, 44000, 62000, 158000, 132000, 114000, 98000, 82000, 74000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $47.36 — $0.26 a share above the decision, +$156 long on 600 shares."
    explanation: "Closed beyond the cap, with the volume that says the sellers parked there are done."

  - type: sort
    prompt: "Trade it, or leave it?"
    buckets: ["Trade it", "Leave it"]
    items:
      - {text: "A close beyond a level you marked, on heavy volume", bucket: "Trade it"}
      - {text: "A wick through the level and a close back inside", bucket: "Leave it"}
      - {text: "Price halfway between two levels on the thinnest bars of the morning", bucket: "Leave it"}
      - {text: "A second refusal at the same resistance, with a lower close", bucket: "Trade it"}
    explanation: "Something has to have happened at a level. Otherwise you are paying to watch."

  - type: tf
    statement: "While price drifts between your levels, taking a small position to see what happens is a reasonable plan."
    answer: false
    explanation: "Nothing on the chart is asking a question yet, and a small position still pays full costs."

  - type: chart-decision
    scenario: "XYZ sits halfway between the levels you marked — support at $27.60, resistance at $28.40 — on the thinnest bars of the morning. You are sizing 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[27.98, 28.04, 27.94, 28.02], [28.02, 28.06, 27.96, 27.98], [27.98, 28.03, 27.93, 28.00], [28.00, 28.05, 27.95, 27.97], [27.97, 28.02, 27.92, 28.00], [28.00, 28.04, 27.95, 27.99], [27.99, 28.03, 27.93, 27.96], [27.96, 28.01, 27.92, 27.99], [27.99, 28.04, 27.94, 27.97], [27.97, 28.02, 27.93, 28.00], [28.00, 28.05, 27.95, 27.98]]
      volume: [22000, 19000, 17000, 15000, 14000, 12000, 13000, 11000, 12000, 10000, 11000]
      decision_index: 5
    best: no-trade
    outcome: "Price finished at $27.98, a cent below the decision — $10 down on 1,000 shares, before any cost."
    explanation: "No level, no volume, no push. The best scalp here is the one you skip."

  - type: fill-tiles
    sentence: "A candle that closes beyond a level instead of poking through it makes a ___."
    answer: "breakout"
    explanation: "Through and closed is a break; through and back is a wick."

  - type: mc
    prompt: "Price is running fast at a level you marked. Before you act you want:"
    options:
      - {text: "The candle at the level to close, so you can see whether it held", correct: true}
      - {text: "Price to touch the level exactly to the cent"}
      - {text: "A second stock to be doing the same thing at the same time"}
    explanation: "Levels are areas, not exact prices, and the close is the only part of a candle that settles anything."

  - type: checklist-reveal
    title: "What every decision here had"
    items:
      - "A level you marked before the open"
      - "A candle that closed, not a wick"
      - "Volume behind the close"
      - "A reason to say no when one of them was missing"

