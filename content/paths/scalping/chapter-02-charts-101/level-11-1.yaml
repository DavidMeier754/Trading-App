id: "11-1"
title: "Levels Practice"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: repetition
tags: [levels, decisions, sessions, practice]
learning_goal: "User takes four decisions at levels and tells a level that has answered from one that has not."
purpose: "Everything from Level 9 on only matters at the moment a level is reached, and that moment lasts one minute."
terms_introduced: []
reinforces: [1]
prerequisite: "10-3"
xp: 25
difficulty: 2
sources: [consensus]
notes: "First half of the practice level: four decisions with the reasoning still spelled out. 11-2 is the silent drill."
screens:
  - type: intro
    text: "Four levels, four minutes that have just closed. Say what happened, then take the side it gave you."

  - type: story
    text: "$20,000 in the account, one screen, and a line drawn on every chart before the first candle of the day."

  - type: compare
    prompt: "Both stocks pressed against $19.50. In which one did the level give way?"
    charts:
      - {kind: candles, data: [[19.10, 19.20, 19.06, 19.18], [19.18, 19.30, 19.16, 19.28], [19.28, 19.50, 19.26, 19.38], [19.38, 19.50, 19.34, 19.42], [19.42, 19.64, 19.40, 19.60], [19.60, 19.72, 19.56, 19.68], [19.68, 19.78, 19.64, 19.74], [19.74, 19.84, 19.70, 19.80]], label: "A"}
      - {kind: candles, data: [[19.10, 19.20, 19.06, 19.18], [19.18, 19.30, 19.16, 19.28], [19.28, 19.50, 19.26, 19.38], [19.38, 19.50, 19.34, 19.40], [19.40, 19.44, 19.28, 19.30], [19.30, 19.36, 19.22, 19.24], [19.24, 19.30, 19.14, 19.16], [19.16, 19.22, 19.08, 19.10]], label: "B"}
    answer: "A"
    explanation: "A finished four minutes running above $19.50. B reached it twice and spent the rest of the stretch making lower closes underneath it."

  - type: chart-decision
    scenario: "$14.00 has turned XYZ back twice without a close above it. The minute that just closed finished at $14.10 on 254,000 shares, more than any bar this morning."
    shares: 1400
    chart:
      kind: candles
      data: [[13.62, 13.70, 13.58, 13.68], [13.68, 13.78, 13.66, 13.76], [13.76, 13.90, 13.74, 13.86], [13.86, 14.00, 13.84, 13.94], [13.94, 14.00, 13.90, 13.96], [13.96, 14.12, 13.94, 14.10], [14.10, 14.24, 14.08, 14.20], [14.20, 14.26, 14.14, 14.16], [14.16, 14.34, 14.14, 14.30], [14.30, 14.36, 14.24, 14.28], [14.28, 14.44, 14.26, 14.40]]
      volume: [96000, 104000, 118000, 146000, 128000, 254000, 196000, 118000, 168000, 102000, 158000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 1,400 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $14.44 and finished at $14.40 — $0.30 a share above the decision, +$420 long on 1,400 shares."
    explanation: "Two refusals, then a close ten cents through on the day's heaviest bar. That is the level changing hands with the crowd behind it."

  - type: mc
    prompt: "A level made in {{market.premarket}} is being tested twenty minutes into the session. What has changed about it?"
    options:
      - {text: "many more people are trading it now", correct: true}
      - {text: "it counts for less because it is older"}
      - {text: "it counts for more because it was thin"}
    explanation: "A handful of traders set that price. The whole session is voting on it now, and this is the vote that moves real size."

  - type: chart-decision
    scenario: "Two runs into $26.50 in eight minutes. The minute that just closed reached it again and finished eighteen cents below, on the heaviest bar of the morning."
    shares: 750
    chart:
      kind: candles
      data: [[26.10, 26.20, 26.06, 26.18], [26.18, 26.30, 26.16, 26.28], [26.28, 26.50, 26.26, 26.36], [26.36, 26.42, 26.30, 26.32], [26.32, 26.44, 26.28, 26.42], [26.42, 26.50, 26.30, 26.32], [26.32, 26.36, 26.20, 26.22], [26.22, 26.28, 26.10, 26.12], [26.12, 26.18, 26.00, 26.04], [26.04, 26.10, 25.94, 25.98], [25.98, 26.04, 25.88, 25.92]]
      volume: [104000, 112000, 168000, 96000, 108000, 176000, 148000, 136000, 142000, 122000, 116000]
      decision_index: 5
    state: ["Size: 750 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It slid away to $25.88 and finished at $25.92 — $0.40 a share, +$300 short on 750 shares."
    explanation: "Two visits, no close above, and the third try spent the biggest bar of the day failing. The sellers at $26.50 are still there."

  - type: numeric-input
    prompt: "You were short 750 shares from $26.32 and covered at $26.04. What is the result before costs?"
    answer: 210
    tolerance: 0.01
    unit: "$"
    working: "$0.28 a share × 750 shares = $210"
    explanation: "Twenty-eight cents of the forty the move eventually gave, which is what taking the middle of a move looks like."

  - type: chart-decision
    scenario: "The level above is $11.80. XYZ has come within eight cents of it and spent five minutes there, on bars shrinking from 82,000 to 46,000."
    shares: 1700
    chart:
      kind: candles
      data: [[11.60, 11.66, 11.56, 11.64], [11.64, 11.70, 11.60, 11.68], [11.68, 11.74, 11.64, 11.72], [11.72, 11.76, 11.68, 11.70], [11.70, 11.75, 11.67, 11.73], [11.73, 11.76, 11.70, 11.72], [11.72, 11.77, 11.69, 11.74], [11.74, 11.78, 11.70, 11.72], [11.72, 11.76, 11.68, 11.70], [11.70, 11.75, 11.67, 11.73], [11.73, 11.78, 11.69, 11.74]]
      volume: [82000, 88000, 76000, 62000, 54000, 46000, 44000, 42000, 40000, 44000, 42000]
      decision_index: 5
    state: ["Size: 1,700 shares"]
    best: no-trade
    outcome: "Five minutes on price was $11.74, two cents above the decision and still short of the level — $34 on 1,700 shares before costs."
    explanation: "The level has not been asked a question yet, and the bars say nobody is in a hurry to ask one. There is no answer to trade."

  - type: match
    prompt: "Four things you might see at a level. What does each one buy you?"
    pairs:
      - ["A close twelve cents through, on the day's biggest bar", "Join the side that has just won"]
      - ["A wick through and a close back inside", "The level held, so the other side is the trade"]
      - ["A close through on the thinnest bar of the morning", "Nobody is behind it, so wait"]
      - ["Price five cents short of the level, bars shrinking", "Nothing has been asked yet"]
    explanation: "Two of these are trades, one is a warning and one is a waiting room. Telling them apart is the whole level."

  - type: chart-decision
    scenario: "Two holds at $20.50 on the way down. The minute that just closed opened on the level and finished at $20.66 on 188,000 shares, the heaviest since the fall began."
    shares: 950
    chart:
      kind: candles
      data: [[20.98, 21.02, 20.86, 20.88], [20.88, 20.92, 20.74, 20.76], [20.76, 20.80, 20.62, 20.66], [20.66, 20.70, 20.50, 20.56], [20.56, 20.62, 20.50, 20.52], [20.52, 20.66, 20.50, 20.66], [20.66, 20.80, 20.64, 20.78], [20.78, 20.84, 20.72, 20.74], [20.74, 20.92, 20.72, 20.88], [20.88, 20.94, 20.82, 20.86], [20.86, 21.04, 20.84, 21.00]]
      volume: [118000, 126000, 138000, 156000, 132000, 188000, 172000, 108000, 158000, 96000, 146000]
      decision_index: 5
    state: ["Size: 950 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It climbed to $21.04 and finished at $21.00 — $0.34 a share above the decision, +$323 long on 950 shares."
    explanation: "Twice defended, and the third minute at the level was the busiest of the fall and finished at its own high. The buyers turned up in size."

  - type: tf
    statement: "The second test of a level is always weaker than the first."
    answer: false
    explanation: "Sometimes it is. Sometimes the second visit brings the crowd that finally takes the level out. You judge the close and the bar, never the count."

  - type: fill-tiles
    sentence: "Before you can trade at a level, you have to be able to say what has already happened at that ___."
    answer: "price"
    explanation: "No history, no level. A line you drew because the chart looked empty there is worth nothing at all."

  - type: checklist-reveal
    title: "Four questions, in this order"
    items:
      - "Which price is the level, and what happened there before?"
      - "Has a minute finished on one side of it?"
      - "What did the bar under that close look like?"
      - "Can this stock take my size, in and out?"
