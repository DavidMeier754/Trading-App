id: "5-2"
title: "Support and Resistance"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [levels, breakout, decisions]
learning_goal: "User can tell a bounce from a breakout at a level and waits for a candle to close beyond it before treating the level as taken."
purpose: "Most bad scalps happen in the seconds between a wick through a level and the close that decides what it meant."
terms_introduced: ["Breakout", "Bounce"]
prerequisite: "5-1"
xp: 20
difficulty: 3
sources: [consensus]
notes: "The close-beyond rule is the core of this sub. Every decision here sits at a level."
screens:
  - type: intro
    text: "Price reaches your level. Now there are exactly two answers."

  - type: theory
    title: "Bounce or breakout"
    body: "At a level price either turns away — a bounce — or goes through and keeps going — a breakout. Both are tradable. Guessing which one, before the chart says, is not."

  - type: theory
    title: "Wait for the close"
    body: "A wick through a level proves nothing: price went there and was pushed straight back. A candle that closes beyond it means the people defending that price gave up."

  - type: visual
    component: chart-candles
    data:
      data: [[29.72, 29.80, 29.68, 29.78], [29.78, 29.88, 29.76, 29.86], [29.86, 30.02, 29.84, 29.94], [29.94, 29.98, 29.86, 29.90], [29.90, 29.99, 29.88, 29.97], [29.97, 30.12, 29.95, 30.10], [30.10, 30.22, 30.08, 30.20], [30.20, 30.28, 30.16, 30.26]]
      volume: [44000, 52000, 71000, 38000, 46000, 132000, 118000, 96000]
      levels:
        - {price: 30.00, label: "resistance"}
    caption: "The first try poked above $30.00 and closed back under. The second closed above it on triple the volume."

  - type: mc
    prompt: "A candle closes above resistance on the biggest volume bar of the morning. Next to the same close on the thinnest bar, this one is:"
    options:
      - {text: "More likely to keep going — real size had to trade to get through", correct: true}
      - {text: "The same: a close beyond the level is a close beyond the level"}
      - {text: "Less likely to keep going, because everyone who wanted in is now in"}
    explanation: "A level is a wall of orders; getting through it takes shares, and the volume bar is where you see them."

  - type: chart-tap
    prompt: "$41.00 held all morning. Tap the first candle that closed below it instead of just dipping under."
    chart:
      kind: candles
      data: [[41.30, 41.36, 41.24, 41.28], [41.28, 41.32, 41.14, 41.18], [41.18, 41.22, 40.98, 41.06], [41.06, 41.12, 41.02, 41.04], [41.04, 41.08, 40.90, 40.92], [40.92, 40.96, 40.80, 40.84], [40.84, 40.90, 40.76, 40.80], [40.80, 40.86, 40.72, 40.78]]
      levels:
        - {price: 41.00, label: "support"}
    target: 4
    explanation: "The earlier candle dipped to $40.98 and closed back above; this one finished at $40.92, and support was gone."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Price has just poked a cent above $30.00"}
      - {text: "on a wick,"}
      - {text: "so the breakout is confirmed.", wrong: true}
    explanation: "A wick is a price that was refused. Nothing is confirmed until a candle closes up there."

  - type: chart-decision
    scenario: "XYZ has been stopped at $23.60 twice this morning. The candle that just closed finished at $23.70, above the level, on the biggest volume bar of the day. You are sizing 1,200 shares."
    shares: 1200
    chart:
      kind: candles
      data: [[23.30, 23.38, 23.26, 23.36], [23.36, 23.44, 23.33, 23.42], [23.42, 23.58, 23.40, 23.50], [23.50, 23.56, 23.44, 23.48], [23.48, 23.60, 23.46, 23.58], [23.58, 23.72, 23.56, 23.70], [23.70, 23.82, 23.68, 23.80], [23.80, 23.90, 23.77, 23.88], [23.88, 23.96, 23.84, 23.92], [23.92, 23.98, 23.88, 23.94], [23.94, 24.00, 23.90, 23.96]]
      volume: [48000, 56000, 88000, 51000, 74000, 168000, 142000, 126000, 104000, 88000, 76000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $24.00 — $0.26 a share above the decision, +$312 long on 1,200 shares."
    explanation: "Closed beyond the level, with the volume to prove somebody had to buy through the sellers there."

  - type: sort
    prompt: "Bounce or breakout?"
    buckets: ["Bounce", "Breakout"]
    items:
      - {text: "Price stalls at the level and closes back under it with a long upper wick", bucket: "Bounce"}
      - {text: "A candle closes above the level on three times the recent volume", bucket: "Breakout"}
      - {text: "Three tries at the level, each closing lower than the last", bucket: "Bounce"}
      - {text: "The level gives way and the next candle holds above it", bucket: "Breakout"}
    explanation: "Closes beyond the level make breakouts; closes back inside make bounces."

  - type: chart-decision
    scenario: "XYZ has run into $17.20 twice. Both times it left a wick above and closed back under, and the candle that just closed is the lower of the two. You are sizing 1,500 shares."
    shares: 1500
    chart:
      kind: candles
      data: [[16.94, 17.02, 16.90, 17.00], [17.00, 17.20, 16.98, 17.06], [17.06, 17.10, 16.98, 17.02], [17.02, 17.12, 17.00, 17.10], [17.10, 17.21, 17.08, 17.12], [17.12, 17.19, 17.06, 17.08], [17.08, 17.10, 16.96, 16.98], [16.98, 17.02, 16.88, 16.90], [16.90, 16.94, 16.82, 16.86], [16.86, 16.90, 16.80, 16.84], [16.84, 16.88, 16.78, 16.82]]
      volume: [62000, 94000, 58000, 47000, 88000, 76000, 92000, 86000, 74000, 61000, 55000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It slid to $16.78 and closed the run at $16.82 — $0.26 a share, +$390 short on 1,500 shares."
    explanation: "Two refusals at the same price and a lower close: the sellers there are winning, and that is a bounce you can trade."

  - type: numeric-input
    prompt: "You went short 800 shares at $55.44 when the level held, and covered at $55.20. Result before costs?"
    answer: 192
    tolerance: 0.01
    unit: "$"
    working: "$0.24 a share × 800 shares = $192"
    explanation: "Shorts make the move in reverse: sold high, covered lower."

  - type: tf
    statement: "The two edges of a range are support and resistance."
    answer: true
    explanation: "A floor that keeps holding and a ceiling that keeps stopping the rise — that is what makes it a range."

  - type: fill-choice
    sentence: "Price reached the level, refused it and turned back the other way. That is a ___."
    options: ["bounce", "breakout", "pullback"]
    answer: "bounce"
    explanation: "A pullback happens inside a trend; a bounce happens at a level."

  - type: theory
    title: "Let the candle decide"
    body: "Touch is not a break. Wick is not a break. A close beyond the level is a break — and until then, the level is still in charge."
