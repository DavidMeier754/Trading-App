id: "7-1"
title: "Trend and Range"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [trend, structure, decisions]
learning_goal: "User can name an uptrend from its higher highs and higher lows, and reads the last dip as the thing that has to hold."
purpose: "Every scalp is taken with the shape of the last twenty minutes or against it, and the shape has a name."
terms_introduced: ["Uptrend", "Higher high", "Higher low"]
reinforces: [1]
prerequisite: "6-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "One direction only. The mirror image is 7-2, so nothing on this page uses the word for it."
screens:
  - type: intro
    text: "You can read one candle. Now read the shape a dozen of them make together."

  - type: story
    character: retail-trader
    text: "Eight minutes of XYZ on your screen. Three pushes up, two give-backs, and the second give-back stopped above the first."

  - type: theory
    title: "Price climbs in steps"
    body: "A rising market does not go straight up. It pushes, hands a little back, then pushes again. The pushes and the give-backs are the two halves you name."

  - type: theory
    title: "Uptrend"
    body: "Each push tops above the last one: a higher high. Each dip stops above the last one: a higher low. Both halves at once, and the shape is an uptrend."
    visual: chart-candles
    visual_data:
      data: [[16.20, 16.34, 16.16, 16.32], [16.32, 16.36, 16.22, 16.24], [16.24, 16.52, 16.22, 16.48], [16.48, 16.54, 16.38, 16.40], [16.40, 16.70, 16.38, 16.66], [16.66, 16.72, 16.54, 16.56], [16.56, 16.86, 16.54, 16.82], [16.82, 16.88, 16.70, 16.74]]
      volume: [86000, 52000, 104000, 48000, 126000, 56000, 142000, 60000]

  - type: chart-tap
    prompt: "Tap the first minute whose dip stopped above the dip before it."
    chart:
      kind: candles
      data: [[16.20, 16.34, 16.16, 16.32], [16.32, 16.36, 16.22, 16.24], [16.24, 16.52, 16.22, 16.48], [16.48, 16.54, 16.38, 16.40], [16.40, 16.70, 16.38, 16.66], [16.66, 16.72, 16.54, 16.56], [16.56, 16.86, 16.54, 16.82], [16.82, 16.88, 16.70, 16.74]]
      volume: [86000, 52000, 104000, 48000, 126000, 56000, 142000, 60000]
    target: 3
    explanation: "The first give-back bottomed at $16.22, the next one at $16.38. Sixteen cents higher, and the buyers are the ones setting the floor."

  - type: mc
    prompt: "Price makes a new high for the morning, then falls back under the low of the last dip. What is missing?"
    options:
      - {text: "nothing, a new high is enough"}
      - {text: "a heavier bar under the new high"}
      - {text: "the higher low", correct: true}
    explanation: "An uptrend needs both halves. A new high with the floor caving in underneath it is one half of a shape, not a shape."

  - type: tf
    statement: "Two higher highs still make an uptrend if the dips between them are getting deeper."
    answer: false
    explanation: "Deeper dips mean the sellers take more ground each time. Whatever the highs do, the floor is dropping."

  - type: chart-decision
    scenario: "Five minutes of stepping up. The last two dips stopped at $13.24 and then $13.38, and the minute that just closed is another shallow dip that held at $13.38."
    shares: 1400
    chart:
      kind: candles
      data: [[13.10, 13.22, 13.06, 13.20], [13.20, 13.24, 13.12, 13.14], [13.14, 13.36, 13.12, 13.32], [13.32, 13.38, 13.24, 13.26], [13.26, 13.50, 13.24, 13.46], [13.46, 13.52, 13.38, 13.42], [13.42, 13.66, 13.40, 13.62], [13.62, 13.70, 13.56, 13.60], [13.60, 13.84, 13.58, 13.80], [13.80, 13.88, 13.74, 13.78], [13.78, 13.94, 13.72, 13.90]]
      volume: [92000, 58000, 110000, 54000, 128000, 62000, 136000, 70000, 150000, 74000, 158000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 1,400 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It kept stepping up to $13.94 and finished at $13.90 — $0.48 a share above the decision, +$672 long on 1,400 shares."
    explanation: "Three highs in a row above the last, three dips in a row above the last, and the push bars are the heavy ones. You are joining the step, not calling the top."

  - type: hotspot
    component: quote-card
    prompt: "Before you join the steps you want to know whether a crowd is making them. Tap the number that tells you."
    data: {ticker: XYZ, name: Example Corp, price: 13.42, change: 0.62, change_pct: 4.8, volume: "4.6M", prev_close: 12.80}
    target: volume
    explanation: "The staircase looks the same at any size. Volume is still the liquidity clue, and it is what says whether you can get 1,400 shares back out."

  - type: fill-tiles
    sentence: "A dip that stops above the dip before it is a higher ___."
    answer: "low"
    explanation: "The floor moved up, which is the half of the shape most beginners never check."

  - type: sort
    prompt: "Uptrend, or not yet?"
    buckets: ["Uptrend", "Not yet"]
    items:
      - {text: "Each push tops higher and each dip stops higher", bucket: "Uptrend"}
      - {text: "A new high, then a dip straight through the last one", bucket: "Not yet"}
      - {text: "Highs and lows both climbing for twenty minutes", bucket: "Uptrend"}
      - {text: "One long green candle after a flat half hour", bucket: "Not yet"}
    explanation: "Two halves, both rising. One long candle is a minute, not a shape."

  - type: numeric-input
    prompt: "You joined the third step at $13.46 with 1,200 shares and sold into the next push at $13.74. What is the result before costs?"
    answer: 336
    tolerance: 0.01
    unit: "$"
    working: "$0.28 a share × 1,200 shares = $336"
    explanation: "Twenty-eight cents is one step of the staircase, and the share count is what turns it into a number worth having."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "An uptrend needs"}
      - {text: "each push to top the last one"}
      - {text: "and each dip to go deeper.", wrong: true}
    explanation: "The dips have to stop higher, not lower. Deeper dips are the first thing to go wrong in a climb."

  - type: visual
    component: chart-candles
    data:
      data: [[15.40, 15.56, 15.36, 15.52], [15.52, 15.58, 15.44, 15.46], [15.46, 15.74, 15.44, 15.70], [15.70, 15.76, 15.60, 15.64]]
      volume: [118000, 54000, 132000, 58000]
    caption: "Push, hand a little back, push again. Two rising halves, and the shape has a name."
