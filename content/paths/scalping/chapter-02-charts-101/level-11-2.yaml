id: "11-2"
title: "Levels Practice"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: repetition
tags: [levels, decisions, drill, practice]
learning_goal: "User decides at ten fresh levels with no reading in between, and passes on the ones that have not answered."
purpose: "Levels are recognised, not calculated, and recognition only comes from doing it many times."
terms_introduced: []
reinforces: [1]
prerequisite: "11-1"
xp: 25
difficulty: 3
sources: [consensus]
notes: "The chapter's second drill page. Ten charts, one calculation, no new ideas."
screens:
  - type: intro
    text: "Ten charts, one line drawn on each. No explanations this time — just the answer the minute gave you."

  - type: story
    character: retail-trader
    text: "Same $20,000, same single screen. Half of these are trades and half are somebody else's lesson."

  - type: swipe-deck
    prompt: "Your card is a long at the level. Take it, or pass?"
    cards:
      - chart: {kind: candles, data: [[14.70, 14.78, 14.66, 14.76], [14.76, 14.86, 14.74, 14.84], [14.84, 15.00, 14.82, 14.92], [14.92, 15.00, 14.88, 14.96], [14.96, 15.14, 14.94, 15.12], [15.12, 15.24, 15.10, 15.20], [15.20, 15.28, 15.14, 15.24], [15.24, 15.36, 15.22, 15.32]], volume: [96000, 104000, 118000, 124000, 262000, 198000, 142000, 166000]}
        answer: take
        note: "Twice refused at $15.00, then a close twelve cents through on twice any bar before it."
      - chart: {kind: candles, data: [[21.40, 21.44, 21.30, 21.32], [21.32, 21.36, 21.20, 21.22], [21.22, 21.26, 21.10, 21.14], [21.14, 21.18, 21.00, 21.06], [21.06, 21.10, 20.92, 21.08], [21.08, 21.20, 21.06, 21.18], [21.18, 21.26, 21.14, 21.22], [21.22, 21.34, 21.20, 21.30]], volume: [108000, 118000, 126000, 148000, 236000, 188000, 142000, 156000]}
        answer: take
        note: "Eight cents under $21.00 inside the minute, all of it bought back before the close, on the heaviest bar of the fall."
      - chart: {kind: candles, data: [[12.20, 12.28, 12.16, 12.26], [12.26, 12.34, 12.24, 12.32], [12.32, 12.44, 12.30, 12.40], [12.40, 12.50, 12.38, 12.46], [12.46, 12.56, 12.44, 12.54], [12.54, 12.56, 12.42, 12.44], [12.44, 12.48, 12.34, 12.36], [12.36, 12.42, 12.30, 12.32]], volume: [94000, 102000, 110000, 118000, 38000, 96000, 104000, 98000]}
        answer: pass
        note: "A close above $12.50 on the thinnest bar of the morning. Nobody was behind it, and the next minute took it back."
      - chart: {kind: candles, data: [[23.10, 23.16, 23.06, 23.14], [23.14, 23.20, 23.10, 23.18], [23.18, 23.24, 23.14, 23.22], [23.22, 23.26, 23.18, 23.20], [23.20, 23.25, 23.17, 23.23], [23.23, 23.26, 23.20, 23.22], [23.22, 23.27, 23.19, 23.24], [23.24, 23.28, 23.20, 23.22]], volume: [78000, 70000, 62000, 54000, 48000, 44000, 42000, 40000]}
        answer: pass
        note: "Six cents short of $23.30 with the bars halving. The level has not been asked anything."
      - chart: {kind: candles, data: [[17.90, 17.94, 17.80, 17.82], [17.82, 17.86, 17.70, 17.72], [17.72, 17.76, 17.60, 17.64], [17.64, 17.68, 17.50, 17.56], [17.56, 17.60, 17.50, 17.52], [17.52, 17.56, 17.38, 17.40], [17.40, 17.44, 17.30, 17.32], [17.32, 17.38, 17.24, 17.26]], volume: [112000, 124000, 132000, 146000, 138000, 244000, 196000, 172000]}
        answer: pass
        note: "$17.50 finally went, on the day's heaviest bar. That is a clean answer — for the other side."
      - chart: {kind: candles, data: [[19.40, 19.44, 19.28, 19.30], [19.30, 19.34, 19.18, 19.20], [19.20, 19.24, 19.00, 19.06], [19.06, 19.14, 19.04, 19.10], [19.10, 19.12, 19.00, 19.02], [19.02, 19.16, 19.00, 19.16], [19.16, 19.28, 19.14, 19.26], [19.26, 19.34, 19.22, 19.30]], volume: [104000, 112000, 138000, 96000, 126000, 182000, 164000, 138000]}
        answer: take
        note: "Third visit to $19.00, third refusal to close below it, and this one finished at its own high on the biggest bar."
    explanation: "Take when a close and a heavy bar agree at the level. Pass when the close is alone, when the level is untested, and when the answer belongs to the other side."

  - type: chart-decision
    scenario: "XYZ has been falling into $24.00, which held it twice. A minute has now finished at $23.88, on 238,000 shares — the heaviest bar of the morning."
    shares: 800
    chart:
      kind: candles
      data: [[24.50, 24.54, 24.40, 24.42], [24.42, 24.46, 24.30, 24.32], [24.32, 24.36, 24.18, 24.22], [24.22, 24.26, 24.00, 24.06], [24.06, 24.10, 24.00, 24.02], [24.02, 24.06, 23.86, 23.88], [23.88, 23.92, 23.74, 23.76], [23.76, 23.82, 23.66, 23.68], [23.68, 23.74, 23.56, 23.60], [23.60, 23.66, 23.52, 23.56], [23.56, 23.62, 23.42, 23.46]]
      volume: [112000, 124000, 132000, 148000, 136000, 238000, 192000, 168000, 154000, 132000, 124000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 800 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It carried down to $23.42 and finished at $23.46 — $0.42 a share, +$336 short on 800 shares."
    explanation: "Two defences and then a close twelve cents underneath on the day's biggest bar. The buyers who held $24.00 have stopped holding it."

  - type: chart-decision
    scenario: "Twice XYZ has fallen to $22.00 and stopped, and the minute that just closed opened on the level and finished at $22.16 on 196,000 shares."
    shares: 900
    chart:
      kind: candles
      data: [[22.44, 22.48, 22.34, 22.36], [22.36, 22.40, 22.24, 22.26], [22.26, 22.30, 22.12, 22.16], [22.16, 22.20, 22.00, 22.06], [22.06, 22.10, 22.00, 22.02], [22.02, 22.18, 22.00, 22.16], [22.16, 22.30, 22.14, 22.28], [22.28, 22.34, 22.22, 22.24], [22.24, 22.42, 22.22, 22.38], [22.38, 22.44, 22.32, 22.36], [22.36, 22.54, 22.34, 22.50]]
      volume: [116000, 128000, 136000, 152000, 138000, 196000, 174000, 106000, 162000, 98000, 148000]
      decision_index: 5
    state: ["Size: 900 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $22.54 and finished at $22.50 — $0.34 a share above the decision, +$306 long on 900 shares."
    explanation: "The whole dollar held twice and the third minute there finished sixteen cents above it on the heaviest bar of the fall."

  - type: numeric-input
    prompt: "You were long 900 shares from $22.16 and sold at $22.44. What is the result before costs?"
    answer: 252
    tolerance: 0.01
    unit: "$"
    working: "$0.28 a share × 900 shares = $252"
    explanation: "Twenty-eight cents out of the thirty-four the move gave, which is what leaving something on the table looks like."

  - type: chart-annotate
    prompt: "Drag the line to the price both pushes have finished under."
    chart:
      kind: candles
      data: [[13.42, 13.50, 13.38, 13.48], [13.48, 13.58, 13.46, 13.56], [13.56, 13.80, 13.54, 13.66], [13.66, 13.72, 13.60, 13.62], [13.62, 13.80, 13.58, 13.68], [13.68, 13.74, 13.62, 13.64], [13.64, 13.72, 13.60, 13.70], [13.70, 13.76, 13.66, 13.72]]
      volume: [94000, 102000, 148000, 88000, 136000, 84000, 78000, 74000]
    answer: 13.80
    tolerance: 0.04
    label: "Resistance"
    explanation: "$13.80 twice, and both minutes handed back more than ten cents of it before they closed."

  - type: chart-decision
    scenario: "The nearest level is yesterday's high at $16.90. XYZ has drifted up on bars near 58,000, and the minute that just closed is the longest body of the stretch, on 64,000."
    shares: 1200
    chart:
      kind: candles
      data: [[16.20, 16.26, 16.16, 16.24], [16.24, 16.30, 16.20, 16.28], [16.28, 16.34, 16.24, 16.30], [16.30, 16.36, 16.26, 16.34], [16.34, 16.40, 16.30, 16.38], [16.38, 16.52, 16.36, 16.50], [16.50, 16.54, 16.42, 16.44], [16.44, 16.50, 16.38, 16.40], [16.40, 16.46, 16.34, 16.42], [16.42, 16.48, 16.36, 16.38], [16.38, 16.44, 16.32, 16.36]]
      volume: [62000, 58000, 54000, 60000, 56000, 64000, 58000, 54000, 50000, 48000, 52000]
      decision_index: 5
    state: ["Size: 1,200 shares"]
    best: no-trade
    outcome: "Five minutes on price was $16.36 — fourteen cents under the decision, $168 down on 1,200 shares before a single cost."
    explanation: "Forty cents of empty chart to the only level that matters, and a body that no more people traded than the four before it. Nothing here is at anything."

  - type: sort
    prompt: "Has the level answered, or not yet?"
    buckets: ["It answered", "Nothing yet"]
    items:
      - {text: "A close fourteen cents through, on twice the recent bars", bucket: "It answered"}
      - {text: "A wick through and a close back inside, on the day's biggest bar", bucket: "It answered"}
      - {text: "Price six cents short of the level, bars halving", bucket: "Nothing yet"}
      - {text: "A close two cents through on the thinnest bar of the morning", bucket: "Nothing yet"}
    explanation: "An answer needs a close and a crowd. Two cents on no volume is a rumour, and six cents of empty air is not even a question."

  - type: checklist-reveal
    title: "What every take on this page had"
    items:
      - "A price with something already behind it"
      - "A minute that finished on one side of it"
      - "A bar heavy enough to mean a crowd was there"
      - "And every pass was missing one of the three"
