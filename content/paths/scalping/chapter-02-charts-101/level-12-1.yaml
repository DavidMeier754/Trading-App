id: "12-1"
title: "Checkpoint"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: test
tags: [checkpoint, trend, pullback, levels]
learning_goal: "User proves they can name a shape, read a give-back, mark a level and decide at one."
purpose: "The rest of the chapter assumes a chart is a shape with lines on it, not a wiggling price."
terms_introduced: []
reinforces: [1]
prerequisite: "11-2"
xp: 40
difficulty: 3
sources: [consensus]
notes: "Ten scored questions on Levels 7–11 with fresh numbers. Three of them reach back into Chapter 1."
screens:
  - type: intro
    text: "Ten questions on Levels 7 to 11. Nothing is timed, so read the chart before you answer."
    counter: 10

  - type: chart-tap
    prompt: "Tap the first minute whose dip broke through the dip before it."
    chart:
      kind: candles
      data: [[12.60, 12.74, 12.56, 12.72], [12.72, 12.76, 12.62, 12.64], [12.64, 12.88, 12.62, 12.84], [12.84, 12.90, 12.74, 12.76], [12.76, 13.00, 12.74, 12.96], [12.96, 13.02, 12.86, 12.88], [12.88, 12.92, 12.70, 12.72], [12.72, 12.78, 12.64, 12.68]]
      volume: [88000, 52000, 102000, 56000, 118000, 60000, 146000, 124000]
    target: 6
    explanation: "The dips ran $12.62, $12.74, $12.86 and then $12.70. That minute is where the floor stopped rising and the shape stopped being a climb."

  - type: mc
    prompt: "Eleven minutes of XYZ: highs at $18.42, $18.40 and $18.41, dips at $18.28, $18.29 and $18.27. What is on your screen?"
    options:
      - {text: "a range", correct: true}
      - {text: "a climb losing its floor"}
      - {text: "a give-back inside a climb"}
    explanation: "Neither half has moved a cent in either direction for eleven minutes. Fourteen cents is the whole prize, and the wobble is most of it."

  - type: numeric-input
    prompt: "You went short 1,000 shares at $17.42 and covered at $17.12. What is the result before costs?"
    answer: 300
    tolerance: 0.01
    unit: "$"
    working: "$0.30 a share × 1,000 shares = $300"
    explanation: "Sold high, bought back thirty cents lower, and the share count turns the thirty cents into the number that matters."

  - type: chart-decision
    scenario: "XYZ pushed from $15.16 to $15.52 on bars near 145,000. Three minutes came back on 64,000, 48,000 and 42,000, stopping at $15.30. The minute that just closed finished at $15.48 on 164,000."
    shares: 1200
    chart:
      kind: candles
      data: [[15.20, 15.34, 15.16, 15.32], [15.32, 15.48, 15.30, 15.46], [15.46, 15.52, 15.36, 15.38], [15.38, 15.42, 15.32, 15.34], [15.34, 15.38, 15.30, 15.32], [15.32, 15.50, 15.30, 15.48], [15.48, 15.62, 15.46, 15.58], [15.58, 15.64, 15.52, 15.54], [15.54, 15.72, 15.52, 15.68], [15.68, 15.74, 15.62, 15.66], [15.66, 15.82, 15.64, 15.78]]
      volume: [138000, 152000, 64000, 48000, 42000, 164000, 148000, 92000, 140000, 88000, 134000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 1,200 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $15.82 and finished at $15.78 — $0.30 a share above the decision, +$360 long on 1,200 shares."
    explanation: "The give-back thinned to a third of the push, held above the last dip, and one heavy minute took the whole of it back."

  - type: tf
    statement: "A level that has held three times is worth trading even in a stock printing 8,000 shares a minute."
    answer: false
    explanation: "The level may be perfect. Getting a scalper's size back out of an 8,000-share minute costs more than the level is likely to pay."

  - type: chart-annotate
    prompt: "Drag the line to the price this fall has stopped at twice."
    chart:
      kind: candles
      data: [[10.92, 10.96, 10.80, 10.82], [10.82, 10.86, 10.68, 10.72], [10.72, 10.76, 10.50, 10.56], [10.56, 10.66, 10.52, 10.62], [10.62, 10.66, 10.50, 10.54], [10.54, 10.66, 10.52, 10.66], [10.66, 10.74, 10.62, 10.70], [10.70, 10.78, 10.66, 10.74]]
      volume: [92000, 104000, 138000, 82000, 126000, 148000, 96000, 88000]
    answer: 10.50
    tolerance: 0.04
    label: "Support"
    explanation: "Two visits to $10.50, neither of them able to finish below it, and the minute after the second one closed at its own high."

  - type: sort
    prompt: "A give-back inside the climb, or the climb ending?"
    buckets: ["Still a pullback", "Climb ending"]
    items:
      - {text: "Three red minutes stopping four cents above the last dip", bucket: "Still a pullback"}
      - {text: "One red minute closing under the last two dips", bucket: "Climb ending"}
      - {text: "A dip on bars a third the size of the push", bucket: "Still a pullback"}
      - {text: "A dip on bars twice the size of the push", bucket: "Climb ending"}
    explanation: "Two tests: is the last floor still under price, and is the dip quieter than the push that made it."

  - type: chart-decision
    scenario: "XYZ was turned away at $19.80 eight minutes ago. The minute that just closed reached it again and finished at $19.54, on 186,000 shares — the heaviest of the morning."
    shares: 900
    chart:
      kind: candles
      data: [[19.30, 19.40, 19.26, 19.38], [19.38, 19.50, 19.36, 19.48], [19.48, 19.80, 19.46, 19.58], [19.58, 19.64, 19.52, 19.54], [19.54, 19.66, 19.50, 19.64], [19.64, 19.80, 19.52, 19.54], [19.54, 19.58, 19.42, 19.44], [19.44, 19.50, 19.34, 19.36], [19.36, 19.42, 19.26, 19.30], [19.30, 19.36, 19.22, 19.26], [19.26, 19.32, 19.14, 19.18]]
      volume: [96000, 108000, 172000, 88000, 102000, 186000, 154000, 138000, 132000, 116000, 124000]
      decision_index: 5
    state: ["Size: 900 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It rolled away to $19.14 and finished at $19.18 — $0.36 a share, +$324 short on 900 shares."
    explanation: "Second visit, second refusal, and the busiest minute of the day spent giving back twenty-six cents of it."

  - type: match
    prompt: "Four readings from Levels 7 to 11. What does each one describe?"
    pairs:
      - ["Higher low", "A dip that stopped above the dip before it"]
      - ["Pullback", "A give-back that has not broken the last dip"]
      - ["Breakout", "A minute that finished clearly through the level"]
      - ["Range", "Highs and lows that have both stopped moving"]
    explanation: "Four words that between them describe almost every chart you have decided from in this chapter."

  - type: numeric-mc
    prompt: "The pre-market high was $13.60. Well into the session XYZ closes a minute at $13.72 and you take 1,300 shares. Yesterday's high at $14.00 is the next level. What is that worth before costs?"
    options:
      - {text: "$28"}
      - {text: "$36.40"}
      - {text: "$3,640"}
      - {text: "$364", correct: true}
    working: "$14.00 − $13.72 = $0.28 a share × 1,300 shares = $364"
    explanation: "One level got you in and the next one tells you what the trade is worth, and both were on the chart before the session started."

  - type: summary
    total: 10
