id: "13-2"
title: "The Opening Minutes"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [open, gaps, decisions]
icon: bell
learning_goal: "User can read a gap up or down against yesterday's close and tell a gap that is being paid for from one that is being sold."
purpose: "A gap is the first thing on the chart every morning, and half the crowd misreads it as a discount."
terms_introduced: ["Gap"]
skills: ["Gap"]
reinforces: [1]
prerequisite: "13-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Yesterday's close comes off the quote card from Chapter 1; the opening range arrives in 13-3."
screens:
  - type: intro
    text: "Some mornings the chart starts somewhere else entirely."

  - type: theory
    title: "Gap"
    body: "A gap is a jump between yesterday's close and the first price of the new session. The market was shut while the news arrived, so no trades happened in between at all."

  - type: example
    body: "XYZ closed yesterday at $20.00 and the first trade this morning is at $20.90. Nobody bought at $20.40 on the way up, because there was no way up."

  - type: visual
    component: chart-candles
    data:
      data: [[20.90, 21.06, 20.84, 21.00], [21.00, 21.08, 20.92, 20.96], [20.96, 21.10, 20.94, 21.06], [21.06, 21.12, 20.98, 21.02], [21.02, 21.14, 21.00, 21.10], [21.10, 21.18, 21.04, 21.16]]
      volume: [412000, 286000, 232000, 208000, 196000, 224000]
      levels:
        - {price: 20.00, label: "yesterday's close"}
        - {price: 20.90, label: "opening price"}
    caption: "Ninety cents of empty chart between yesterday and today, and a session that starts above all of it."

  - type: numeric-mc
    prompt: "The quote card says XYZ closed at $20.00 yesterday and the session opened at $20.90. How big is that gap in percent?"
    options:
      - {text: "9.0 %"}
      - {text: "0.9 %"}
      - {text: "4.5 %", correct: true}
      - {text: "45 %"}
    working: "$0.90 ÷ $20.00 = 0.045 = 4.5 %"
    explanation: "The same arithmetic as the daily change on the quote card: the move divided by yesterday's close."

  - type: mc
    prompt: "So what has that ninety-cent jump actually told you?"
    options:
      - {text: "the stock is ninety cents too expensive and will come back to yesterday's close"}
      - {text: "news arrived overnight, and the open is the argument about it", correct: true}
      - {text: "yesterday's chart can be thrown away now"}
    explanation: "A gap is information, not a mistake. Yesterday's high, low and close are still prices the whole market can see."

  - type: theory
    title: "The opening price is the line"
    body: "The first price of the session is the one every trader shares. Above it, the buyers who paid for the gap are winning. Below it, they are the ones looking for a way out."

  - type: chart-decision
    scenario: "XYZ gapped up from $20.00 to $20.90. Six minutes in, every minute has finished above the opening price and each dip has stopped higher than the last."
    shares: 700
    chart:
      kind: candles
      data: [[20.90, 21.06, 20.84, 21.00], [21.00, 21.08, 20.92, 20.96], [20.96, 21.10, 20.94, 21.06], [21.06, 21.12, 20.98, 21.02], [21.02, 21.14, 21.00, 21.10], [21.10, 21.18, 21.04, 21.16], [21.16, 21.28, 21.14, 21.26], [21.26, 21.34, 21.22, 21.30], [21.30, 21.40, 21.26, 21.38], [21.38, 21.44, 21.32, 21.36], [21.36, 21.48, 21.34, 21.44]]
      volume: [412000, 286000, 232000, 208000, 196000, 224000, 246000, 218000, 232000, 196000, 214000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 700 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $21.48 and finished at $21.44 — $0.28 a share above the decision, +$196 long on 700 shares."
    explanation: "Six minutes of buyers defending the price they gapped to. Nothing is being handed back, so the gap is being paid for rather than sold into."

  - type: sort
    prompt: "Is the gap being kept, or given back?"
    buckets: ["Holding", "Fading"]
    items:
      - {text: "Every minute finishing above the opening price", bucket: "Holding"}
      - {text: "Each push after the open topping out lower than the last", bucket: "Fading"}
      - {text: "Dips that keep stopping above the first minute's low", bucket: "Holding"}
      - {text: "A slide back under the opening price on the heaviest bar since the bell", bucket: "Fading"}
    explanation: "One reference price and one question: which side of it is price choosing to live on."

  - type: tf
    statement: "A stock that has gapped down is cheap, because it costs less than it did yesterday."
    answer: false
    explanation: "Sellers accepted less than yesterday's close before the session even started. Lower and cheap are not the same word."

  - type: compare
    prompt: "Both stocks gapped up to $18.40. In which one are buyers still paying for the gap?"
    charts:
      - {kind: candles, data: [[18.40, 18.54, 18.34, 18.50], [18.50, 18.58, 18.44, 18.54], [18.54, 18.66, 18.48, 18.62], [18.62, 18.70, 18.56, 18.66], [18.66, 18.78, 18.62, 18.74], [18.74, 18.84, 18.70, 18.80], [18.80, 18.90, 18.76, 18.86], [18.86, 18.96, 18.82, 18.92]], label: "A"}
      - {kind: candles, data: [[18.40, 18.48, 18.20, 18.26], [18.26, 18.34, 18.16, 18.20], [18.20, 18.28, 18.10, 18.14], [18.14, 18.22, 18.04, 18.08], [18.08, 18.16, 17.98, 18.02], [18.02, 18.10, 17.94, 17.98], [17.98, 18.04, 17.88, 17.92], [17.92, 17.98, 17.82, 17.86]], label: "B"}
    answer: "A"
    explanation: "A has not closed a single minute under its opening price. B lost it on the first one and has made a lower high every minute since."

  - type: numeric-input
    prompt: "You bought the gap at $20.94 with 700 shares and it is now $20.72. Where do you stand before costs?"
    answer: -154
    tolerance: 0.01
    unit: "$"
    working: "($20.72 − $20.94) × 700 shares = −$154"
    explanation: "Twenty-two cents against you on 700 shares, and the arithmetic of a loss is the arithmetic of a win with the sign turned round."

  - type: chart-decision
    scenario: "The gap took XYZ from $13.80 to $14.60, and the very first minute lost the opening price. Every push since has topped out lower."
    shares: 1300
    chart:
      kind: candles
      data: [[14.60, 14.66, 14.42, 14.48], [14.48, 14.56, 14.38, 14.42], [14.42, 14.52, 14.34, 14.38], [14.38, 14.46, 14.28, 14.32], [14.32, 14.40, 14.24, 14.28], [14.28, 14.34, 14.16, 14.18], [14.18, 14.22, 14.04, 14.06], [14.06, 14.12, 13.94, 13.98], [13.98, 14.02, 13.86, 13.90], [13.90, 13.96, 13.80, 13.84], [13.84, 13.90, 13.76, 13.80]]
      volume: [438000, 322000, 286000, 264000, 248000, 302000, 288000, 264000, 236000, 218000, 206000]
      decision_index: 5
    state: ["Size: 1,300 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It gave the whole gap back to yesterday's close at $13.80 — $0.38 a share, +$494 short on 1,300 shares."
    explanation: "Everyone who bought the first minutes is offside, and their way out is the selling that carries the move."

  - type: fill-choice
    sentence: "Price that has spent the whole morning under the opening price says the gap is ___."
    options: ["fading", "holding", "widening"]
    answer: "fading"
    explanation: "The buyers who paid for the news have not been able to keep a single minute above the price they paid."

  - type: example
    body: "Two mornings, one shape. The gap tells you what arrived; the first minutes tell you who is willing to pay for it."
    visual: chart-candles
    visual_data:
      data: [[14.28, 14.34, 14.16, 14.18], [14.18, 14.22, 14.04, 14.06], [14.06, 14.12, 13.94, 13.98], [13.98, 14.02, 13.86, 13.90]]
      volume: [302000, 288000, 264000, 236000]
