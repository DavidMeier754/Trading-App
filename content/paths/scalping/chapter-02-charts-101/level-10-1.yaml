id: "10-1"
title: "Bounce or Break"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [levels, breakout, bounce, decisions]
icon: breakout
learning_goal: "User knows a level has exactly two answers and waits for the market to give one before choosing a side."
purpose: "Beginners lose money guessing which way a level will go; the whole job is reacting a minute later."
terms_introduced: ["Breakout", "Bounce"]
skills: ["Breakout", "Bounce"]
reinforces: []
prerequisite: "9-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Both answers get a decision here: one where the level goes, one where price is still standing on it."
screens:
  - type: intro
    text: "Price is at the level. There are two things that can happen, and neither of them needs your opinion."

  - type: theory
    title: "Two answers, no third"
    body: "Either the level holds and price turns away, or price goes through it and stays. You do not have to know which. You have to be quick once one of them has happened."

  - type: carousel
    cards:
      - {label: "Bounce", text: "Price reaches the level and turns away. The minute finishes back on the side it came from.", icon: level-bounce}
      - {label: "Breakout", text: "Price goes through and stays there. The minute finishes clearly on the other side, usually on a heavier bar.", icon: level-break}

  - type: compare
    prompt: "Both stocks pressed against $24.00. Which one went through it?"
    charts:
      - {kind: candles, data: [[23.70, 23.80, 23.66, 23.78], [23.78, 23.90, 23.76, 23.88], [23.88, 24.00, 23.86, 23.94], [23.94, 24.00, 23.90, 23.96], [23.96, 24.14, 23.94, 24.12], [24.12, 24.22, 24.08, 24.18], [24.18, 24.28, 24.14, 24.24], [24.24, 24.32, 24.18, 24.28]], label: "A"}
      - {kind: candles, data: [[23.70, 23.80, 23.66, 23.78], [23.78, 23.90, 23.76, 23.88], [23.88, 24.00, 23.86, 23.94], [23.94, 24.00, 23.90, 23.92], [23.92, 23.96, 23.80, 23.82], [23.82, 23.88, 23.74, 23.76], [23.76, 23.80, 23.66, 23.68], [23.68, 23.74, 23.60, 23.64]], label: "B"}
    answer: "A"
    explanation: "A finished four minutes in a row above $24.00 and never came back. B reached the same price twice and spent the rest of the stretch walking away from it."

  - type: chart-decision
    scenario: "Three minutes of pushing at $18.00 without a close above it. The minute that just closed finished at $18.12 on 268,000 shares, twice the biggest bar before it."
    shares: 1000
    chart:
      kind: candles
      data: [[17.72, 17.80, 17.68, 17.78], [17.78, 17.88, 17.76, 17.86], [17.86, 18.00, 17.84, 17.92], [17.92, 18.00, 17.88, 17.96], [17.96, 18.00, 17.92, 17.98], [17.98, 18.14, 17.96, 18.12], [18.12, 18.26, 18.10, 18.22], [18.22, 18.28, 18.16, 18.18], [18.18, 18.36, 18.16, 18.32], [18.32, 18.38, 18.26, 18.30], [18.30, 18.46, 18.28, 18.42]]
      volume: [96000, 108000, 142000, 128000, 136000, 268000, 210000, 128000, 176000, 104000, 168000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 1,000 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $18.46 and finished at $18.42 — $0.30 a share above the decision, +$300 long on 1,000 shares."
    explanation: "Three minutes of being refused, then one minute that finished twelve cents through on twice the volume. The market answered, and the answer was the second one."

  - type: chart-tap
    prompt: "Tap the first minute that finished above $18.00."
    chart:
      kind: candles
      data: [[17.72, 17.80, 17.68, 17.78], [17.78, 17.88, 17.76, 17.86], [17.86, 18.00, 17.84, 17.92], [17.92, 18.00, 17.88, 17.96], [17.96, 18.00, 17.92, 17.98], [17.98, 18.14, 17.96, 18.12], [18.12, 18.26, 18.10, 18.22], [18.22, 18.28, 18.16, 18.18]]
      volume: [96000, 108000, 142000, 128000, 136000, 268000, 210000, 128000]
    target: 5
    explanation: "Three minutes reached $18.00 and finished under it. Only the fourth one finished above, and that is the minute the level changed hands."

  - type: mc
    prompt: "Price has been pressing against a level for four minutes. What are you actually waiting for?"
    options:
      - {text: "a minute that closes on one side of it", correct: true}
      - {text: "the level to be redrawn a little higher"}
      - {text: "the volume bars underneath to shrink"}
    explanation: "The close is the only part of the minute everybody has to agree on. Until one arrives on one side, nothing has been decided."

  - type: tf
    statement: "Standing at a level without a position means you have already missed the move."
    answer: false
    explanation: "Both answers are tradeable and both take a minute to arrive. What costs money is picking one before the market has given it."

  - type: sort
    prompt: "Which answer has the market just given?"
    buckets: ["It held", "It went through"]
    items:
      - {text: "A red body finishing eight cents under the level on the heaviest bar of the morning", bucket: "It held"}
      - {text: "A green body finishing twelve cents above it on four times the recent bars", bucket: "It went through"}
      - {text: "Price reaches the level and the next minute closes back inside", bucket: "It held"}
      - {text: "Three minutes closing above it and none coming back", bucket: "It went through"}
    explanation: "Where the minute finished, and whether the ones after it agreed. Nothing else on the screen votes."

  - type: chart-decision
    scenario: "Price climbed into $21.00 and stopped, and the minute that just closed is a two-cent body underneath it on the thinnest bar of the last half hour."
    shares: 700
    chart:
      kind: candles
      data: [[20.60, 20.70, 20.56, 20.68], [20.68, 20.80, 20.66, 20.78], [20.78, 20.90, 20.76, 20.86], [20.86, 21.00, 20.84, 20.92], [20.92, 21.00, 20.88, 20.96], [20.96, 21.02, 20.94, 20.98], [20.98, 21.04, 20.92, 20.96], [20.96, 21.02, 20.90, 20.94], [20.94, 21.00, 20.88, 20.98], [20.98, 21.02, 20.92, 20.96], [20.96, 21.00, 20.90, 20.94]]
      volume: [92000, 104000, 112000, 128000, 96000, 88000, 84000, 80000, 76000, 72000, 70000]
      decision_index: 5
    state: ["Size: 700 shares"]
    best: no-trade
    outcome: "Six minutes later price was $20.94 — four cents under the decision, $28 down on 700 shares before a single cost."
    explanation: "Neither answer has arrived. Price is standing on the level on shrinking bars, which is the market saying 'not yet' in the only language it has."

  - type: fill-choice
    sentence: "A minute that finishes clearly through the level is a ___."
    options: ["breakout", "bounce", "pullback"]
    answer: "breakout"
    explanation: "Through and staying through. If it comes straight back the next minute, the level did its job after all."

  - type: numeric-input
    prompt: "You joined that minute through $18.00 at $18.12 with 1,000 shares and sold at $18.36. What is the result before costs?"
    answer: 240
    tolerance: 0.01
    unit: "$"
    working: "$0.24 a share × 1,000 shares = $240"
    explanation: "Twenty-four cents for reacting to a close rather than guessing at one, which is the whole difference between the two habits."

  - type: example
    body: "The level is a question the market asks out loud. A bounce and a breakout are both answers; standing there with an opinion is not."
