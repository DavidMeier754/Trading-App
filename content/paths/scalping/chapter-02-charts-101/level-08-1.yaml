id: "8-1"
title: "Momentum vs Exhaustion"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [momentum, exhaustion, volume, decisions]
learning_goal: "User can tell a move that is still feeding itself from one that has run out, and stops chasing late pushes."
purpose: "Both look strong on the chart; only one of them still has room, and telling them apart is most of a scalper's discipline."
terms_introduced: ["Momentum", "Exhaustion"]
prerequisite: "7-2"
xp: 20
difficulty: 3
sources: [consensus]
notes: "Builds directly on climax volume from 3-1 and the wick reading from 1-2."
screens:
  - type: intro
    text: "A move looks strongest twice: just as it starts, and just as it ends."

  - type: theory
    title: "Momentum"
    body: "Momentum is a move that keeps feeding itself: each body longer than the last, each volume bar taller, hardly any wick. More buyers keep arriving and they keep paying up."

  - type: theory
    title: "Exhaustion"
    body: "Exhaustion is the other end of the same move: the biggest volume bar of the run, a long wick, and a close far from the high. Everyone who wanted in has just got in."

  - type: visual
    component: chart-candles
    data:
      data: [[14.60, 14.70, 14.58, 14.68], [14.68, 14.84, 14.66, 14.82], [14.82, 15.02, 14.80, 15.00], [15.00, 15.24, 14.98, 15.22], [15.22, 15.58, 15.18, 15.28], [15.28, 15.34, 15.12, 15.16], [15.16, 15.22, 15.06, 15.10], [15.10, 15.18, 15.04, 15.14]]
      volume: [62000, 88000, 124000, 168000, 320000, 210000, 160000, 120000]
    caption: "Bodies growing on rising volume — then the biggest bar of all, and a close far below its high."

  - type: chart-tap
    prompt: "Tap the candle where this move ran out of buyers."
    chart:
      kind: candles
      data: [[61.20, 61.40, 61.16, 61.38], [61.38, 61.66, 61.36, 61.62], [61.62, 61.96, 61.58, 61.92], [61.92, 62.30, 61.88, 62.26], [62.26, 62.44, 62.20, 62.40], [62.40, 62.96, 62.34, 62.48], [62.48, 62.56, 62.24, 62.28], [62.28, 62.36, 62.10, 62.14], [62.14, 62.24, 62.06, 62.20]]
      volume: [40000, 62000, 88000, 120000, 140000, 310000, 190000, 160000, 110000]
    target: 5
    explanation: "The heaviest bar of the run, a spike to $62.96 and a close back at $62.48: maximum participation, no progress."

  - type: mc
    prompt: "XYZ has already made three pushes with a dip between each. A fourth starts. For a scalper this is:"
    options:
      - {text: "Late in the move, with less room left and a real chance of being the last buyer", correct: true}
      - {text: "The safest push of the day, because the trend has proved itself three times"}
      - {text: "Exactly the same trade as the first push"}
    explanation: "Every push uses up buyers who are already in; the later the leg, the fewer are left to pay you."

  - type: checklist-reveal
    title: "Signs a move is running out"
    items:
      - "The biggest volume bar since the move began"
      - "A long wick where the body used to be"
      - "A close far below the high of the candle"
      - "The next candle cannot make a new high"

  - type: chart-decision
    scenario: "XYZ is in the second push of the morning. Each body is longer than the one before, each volume bar taller, and there is barely a wick on top. You are sizing 1,500 shares."
    shares: 1500
    chart:
      kind: candles
      data: [[15.90, 15.98, 15.88, 15.96], [15.96, 16.06, 15.94, 16.04], [16.04, 16.18, 16.02, 16.16], [16.16, 16.24, 16.13, 16.22], [16.22, 16.36, 16.20, 16.34], [16.34, 16.44, 16.32, 16.42], [16.42, 16.56, 16.40, 16.54], [16.54, 16.64, 16.51, 16.62], [16.62, 16.70, 16.58, 16.66], [16.66, 16.72, 16.62, 16.68], [16.68, 16.74, 16.64, 16.70]]
      volume: [70000, 92000, 120000, 96000, 150000, 168000, 182000, 160000, 132000, 104000, 92000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $16.74 — $0.28 a share above the decision, +$420 long on 1,500 shares."
    explanation: "Growing bodies, growing volume, no upper wicks: the move is still recruiting buyers."

  - type: sort
    prompt: "Momentum or exhaustion?"
    buckets: ["Momentum", "Exhaustion"]
    items:
      - {text: "Bodies getting longer while the bars get taller", bucket: "Momentum"}
      - {text: "The tallest bar of the day with a long upper wick", bucket: "Exhaustion"}
      - {text: "Every candle closing near its high with barely a wick", bucket: "Momentum"}
      - {text: "A huge bar and a close in the bottom third of the candle", bucket: "Exhaustion"}
    explanation: "Same direction on the chart, opposite meanings — the difference is where the candle closes and how heavy the bar is."

  - type: tf
    statement: "Exhaustion means price has to turn around."
    answer: false
    explanation: "It means the fuel for that push is gone. Price often just stalls sideways while the crowd works out what to do."

  - type: chart-decision
    scenario: "XYZ has run for six minutes. The candle that just closed spiked to $54.86, closed back at $54.46 and traded twice the volume of any candle before it. You are sizing 500 shares."
    shares: 500
    chart:
      kind: candles
      data: [[53.20, 53.44, 53.16, 53.40], [53.40, 53.72, 53.38, 53.68], [53.68, 54.02, 53.64, 53.98], [53.98, 54.30, 53.94, 54.26], [54.26, 54.44, 54.20, 54.40], [54.40, 54.86, 54.34, 54.46], [54.46, 54.52, 54.20, 54.24], [54.24, 54.30, 54.02, 54.06], [54.06, 54.16, 53.96, 54.12], [54.12, 54.20, 54.00, 54.04], [54.04, 54.12, 53.92, 53.98]]
      volume: [80000, 110000, 150000, 190000, 220000, 420000, 300000, 260000, 200000, 170000, 150000]
      decision_index: 5
    best: no-trade
    reasonable: [short]
    outcome: "Price drifted back to $53.98. Buying there would have been $0.48 a share underwater — $240 on 500 shares."
    explanation: "Maximum volume and a close far off the high is the crowd finishing its buying, not starting it."

  - type: fill-choice
    sentence: "Longer bodies on taller volume bars, with no wick on top, is ___."
    options: ["momentum", "exhaustion", "a range"]
    answer: "momentum"
    explanation: "The move is still gathering people; nothing is being handed back yet."

  - type: numeric-mc
    prompt: "You chased the fourth push, got nervous and sold at your entry price. On 1,200 shares with a spread of $0.03, that trade cost you:"
    options:
      - {text: "$36", correct: true}
      - {text: "$3.60"}
      - {text: "$360"}
      - {text: "$0.03"}
    working: "$0.03 a share × 1,200 shares = $36"
    explanation: "A flat trade is never free — you always pay to get in and out."

  - type: theory
    title: "Join early or not at all"
    body: "Momentum pays the traders who are already in it. Once the biggest bar has printed and the wicks appear, the good trade was two minutes ago."
