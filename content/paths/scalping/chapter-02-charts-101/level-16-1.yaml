id: "16-1"
title: "The Scalper's Screen"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [routine, selection, liquidity]
learning_goal: "User can say what puts a stock on the screen in the first place: volume against its own normal day, movement worth the costs, and a price the account can hold."
purpose: "The best chart reading in the world cannot rescue a stock that should never have been on the screen."
terms_introduced: []
reinforces: [1]
prerequisite: "15-2"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Chapter 5 turns this into a scanning routine; here it is only the three questions asked before a chart is opened."
screens:
  - type: intro
    text: "Before the chart, the stock. Most beginners do these two the wrong way round."

  - type: theory
    title: "The screen comes second"
    body: "A chart is a picture of a stock somebody chose. Choosing badly is a mistake you cannot read your way out of later, because it is already priced into every candle."

  - type: carousel
    cards:
      - {label: "Enough volume", text: "Bars big enough that your whole position is a small slice of one minute, going in and coming back out.", icon: volume}
      - {label: "Enough movement", text: "Candles that cover more ground than being there costs. Ten-cent minutes, not two-cent ones.", icon: volatility}
      - {label: "A price you can hold", text: "The account has to be able to pay for the shares. $20,000 against a $25 stock is 800 shares, whatever the chart says.", icon: account}

  - type: mc
    prompt: "Two stocks at {{market.regular_open}}. One is on its usual volume with nothing new; the other is on four times normal after results. Which one gets the screen?"
    options:
      - {text: "the quiet one, because a normal day is easier to read"}
      - {text: "neither, the shape of the chart is what decides"}
      - {text: "the busy one, at four times its own normal", correct: true}
    explanation: "Volume measured against this stock's own ordinary day is the first filter of the morning. No crowd, no scalp, whatever the chart looks like."

  - type: numeric-input
    prompt: "Your account is $20,000 and the stock trades at $25. What is the largest position the account can pay for?"
    answer: 800
    tolerance: 0.01
    unit: "shares"
    working: "$20,000 ÷ $25 = 800 shares"
    explanation: "This ceiling has nothing to do with the chart, and it decides your size on every expensive stock you will ever look at."

  - type: tf
    statement: "A stock can be busy enough to trade and still be too expensive for your account to hold a scalper's size."
    answer: true
    explanation: "Two separate tests. The volume decides whether you can get out; the share price decides how much of it you could ever own."

  - type: chart-decision
    scenario: "XYZ is trading about four times its normal volume after results. It pushed, gave three minutes back on a third of the volume, and the minute that just closed finished at $16.44 on 286,000 shares. Your account is $20,000 and you are sizing 1,200 shares."
    shares: 1200
    chart:
      kind: candles
      data: [[16.10, 16.24, 16.06, 16.22], [16.22, 16.38, 16.20, 16.36], [16.36, 16.42, 16.26, 16.28], [16.28, 16.34, 16.22, 16.26], [16.26, 16.32, 16.24, 16.30], [16.30, 16.46, 16.28, 16.44], [16.44, 16.56, 16.40, 16.52], [16.52, 16.62, 16.48, 16.58], [16.58, 16.68, 16.54, 16.64], [16.64, 16.70, 16.58, 16.62], [16.62, 16.74, 16.60, 16.70]]
      volume: [268000, 302000, 118000, 96000, 88000, 286000, 264000, 232000, 208000, 176000, 194000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $16.74 and finished at $16.70 — $0.26 a share above the decision, +$312 long on 1,200 shares."
    explanation: "The right stock and then the right minute, in that order. The dip was quiet, it held above the last low, and one heavy minute took the whole of it back."

  - type: sort
    prompt: "Does this stock get on the screen this morning?"
    buckets: ["Gets the screen", "Left alone"]
    items:
      - {text: "Four times its own normal volume, on results", bucket: "Gets the screen"}
      - {text: "Ten-cent minutes on a quarter of a million shares", bucket: "Gets the screen"}
      - {text: "A $90 share price against a $20,000 account", bucket: "Left alone"}
      - {text: "Two-cent candles all morning", bucket: "Left alone"}
    explanation: "Two of these fail before the chart is even drawn, and no amount of good reading gets that back."

  - type: hotspot
    component: quote-card
    prompt: "Tap the number that says how much of this stock has changed hands today."
    data: {ticker: XYZ, name: Example Corp, price: 16.70, change: 1.24, change_pct: 8.0, volume: "4.8M", prev_close: 15.46}
    target: volume
    explanation: "4.8 million by the middle of the morning, against an ordinary whole day of about 1.2 million. That is what a stock in play looks like on a quote card."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "You choose the stock by what it is trading,"}
      - {text: "and the chart decides the rest,"}
      - {text: "so a clean chart is enough on its own.", wrong: true}
    explanation: "A clean chart on 9,000 shares a minute is a clean chart you cannot get out of. The order of the two checks is the point."

  - type: match
    prompt: "Four facts about a stock. What does each one decide?"
    pairs:
      - ["Trading four times its own normal", "Somebody has a reason to be in it today"]
      - ["Ten-cent candles all morning", "There is enough movement to pay for being there"]
      - ["Bars of 12,000 shares", "Your size would be most of a whole minute"]
      - ["$90 a share against a $20,000 account", "You could hold 222 shares, so the move would have to be huge"]
    explanation: "Volume, movement, size and price. Three of them are about the stock and one is about you."

  - type: example
    body: "Three questions before a chart is opened: is anyone there, does it move, and can the account hold it. Then, and only then, the candles."
    visual: chart-candles
    visual_data:
      data: [[16.30, 16.46, 16.28, 16.44], [16.44, 16.56, 16.40, 16.52], [16.52, 16.62, 16.48, 16.58], [16.58, 16.68, 16.54, 16.64]]
      volume: [286000, 264000, 232000, 208000]
