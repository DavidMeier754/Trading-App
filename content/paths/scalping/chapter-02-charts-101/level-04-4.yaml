id: "4-4"
title: "Volume Bars"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [volume, candles, decisions]
learning_goal: "User reads candle shape and volume as one reading and decides long, short or no trade from the pair."
purpose: "Neither row of the chart is worth much alone, and from here on every read in this app uses both at once."
terms_introduced: []
reinforces: [1]
prerequisite: "4-3"
xp: 20
difficulty: 3
sources: [consensus]
notes: "Three decisions where shape and volume have to agree. Closes Level 4 with a recap."
screens:
  - type: intro
    text: "Two rows on the screen, two questions. Which way, and did anybody mean it?"

  - type: story
    character: retail-trader
    text: "Both rows are switched on now. The candles you already read; the bars underneath are the half you have been missing."

  - type: theory
    title: "Read them together"
    body: "The candle answers who kept the ground. The bar answers how many people were involved. A trade needs both answers to point the same way."

  - type: chart-decision
    scenario: "Four minutes of selling, on the heaviest bars since the open. One small green candle paused it, on the thinnest bar of the move. The minute after that finished at its own low."
    shares: 700
    chart:
      kind: candles
      data: [[28.60, 28.66, 28.52, 28.56], [28.56, 28.60, 28.40, 28.44], [28.44, 28.48, 28.28, 28.32], [28.32, 28.36, 28.18, 28.22], [28.22, 28.30, 28.20, 28.28], [28.28, 28.32, 28.14, 28.16], [28.16, 28.20, 28.02, 28.04], [28.04, 28.08, 27.90, 27.94], [27.94, 27.98, 27.82, 27.86], [27.86, 27.90, 27.76, 27.80], [27.80, 27.86, 27.74, 27.82]]
      volume: [60000, 98000, 126000, 140000, 70000, 132000, 150000, 144000, 128000, 96000, 84000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 700 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It fell to $27.74 and finished the run at $27.82 — $0.34 a share, +$238 short on 700 shares."
    explanation: "The pause came on the thinnest bar of the move and the selling came back on a heavy one. Shape and weight agree."

  - type: numeric-input
    prompt: "Earlier you were long 1,300 shares of a different stock from $12.86 and sold at $13.04. What is the result before costs?"
    answer: 234
    tolerance: 0.01
    unit: "$"
    working: "$0.18 a share × 1,300 shares = $234"
    explanation: "Eighteen cents is a small move; the share count is the only reason it is worth anything."

  - type: chart-decision
    scenario: "Five minutes down on growing bars. The candle that just closed took back the whole of the previous minute, finished at $13.18, and traded 240,000 shares — the heaviest bar of the fall."
    shares: 1500
    chart:
      kind: candles
      data: [[13.44, 13.48, 13.34, 13.36], [13.36, 13.40, 13.24, 13.26], [13.26, 13.30, 13.14, 13.18], [13.18, 13.22, 13.06, 13.10], [13.10, 13.14, 12.98, 13.02], [13.02, 13.20, 12.96, 13.18], [13.18, 13.28, 13.14, 13.26], [13.26, 13.36, 13.22, 13.34], [13.34, 13.42, 13.30, 13.40], [13.40, 13.50, 13.36, 13.48], [13.48, 13.56, 13.44, 13.53]]
      volume: [80000, 92000, 104000, 118000, 126000, 240000, 180000, 150000, 124000, 102000, 88000]
      decision_index: 5
    state: ["Size: 1,500 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It worked back up to $13.56 and finished at $13.53 — $0.35 a share above the decision, +$525 long on 1,500 shares."
    explanation: "One minute undid five, and the heaviest bar of the fall printed while it happened. That is buyers arriving in size, not drift."

  - type: tf
    statement: "A huge volume bar under a candle with almost no body tells you which way the crowd went."
    answer: false
    explanation: "It tells you a crowd arrived. The candle finished where it started, so the crowd cancelled itself out."

  - type: chart-tap
    prompt: "Tap the minute where a long red body printed on the tallest bar of the stretch."
    chart:
      kind: candles
      data: [[16.80, 16.86, 16.74, 16.84], [16.84, 16.92, 16.80, 16.88], [16.88, 16.94, 16.76, 16.78], [16.78, 16.86, 16.74, 16.84], [16.84, 16.90, 16.66, 16.68], [16.68, 16.74, 16.60, 16.64], [16.64, 16.72, 16.58, 16.70], [16.70, 16.76, 16.64, 16.72]]
      volume: [48000, 52000, 86000, 60000, 164000, 120000, 88000, 66000]
    target: 4
    explanation: "A $0.16 red body on 164,000 shares: the sellers had the most people behind them in that one minute."

  - type: mc
    prompt: "Two stocks each rose $0.20 in ten minutes: one on 60,000 shares a minute, one on 6,000. For a scalper the difference is:"
    options:
      - {text: "none — the price move is what pays you"}
      - {text: "the busy one lets you in and out near the price you see", correct: true}
      - {text: "the quiet one is better, because fewer people are competing for the shares"}
    explanation: "On 6,000 shares a minute your own order becomes the move, and you pay for that on the way in and again on the way out."

  - type: sort
    prompt: "Do the two rows together give you a trade, or a wait?"
    buckets: ["There is a trade", "Wait"]
    items:
      - {text: "A long green body on the heaviest bar of a quiet morning", bucket: "There is a trade"}
      - {text: "A tiny body sitting on the heaviest bar of the day", bucket: "Wait"}
      - {text: "A long red body on rising bars after two refused pushes", bucket: "There is a trade"}
      - {text: "A green body on the thinnest bar since the session opened", bucket: "Wait"}
    explanation: "Shape without weight is drift; weight without shape is an argument nobody won."

  - type: chart-decision
    scenario: "330,000 shares in the minute that just closed, five times any bar before it. The candle on top of it reached $24.44, fell to $24.06 and finished within two cents of its open."
    shares: 800
    chart:
      kind: candles
      data: [[24.10, 24.18, 24.04, 24.16], [24.16, 24.24, 24.12, 24.20], [24.20, 24.28, 24.14, 24.18], [24.18, 24.26, 24.12, 24.22], [24.22, 24.30, 24.16, 24.24], [24.24, 24.44, 24.06, 24.22], [24.22, 24.30, 24.14, 24.18], [24.18, 24.28, 24.12, 24.24], [24.24, 24.32, 24.16, 24.20], [24.20, 24.28, 24.14, 24.25], [24.25, 24.32, 24.18, 24.21]]
      volume: [64000, 58000, 71000, 66000, 74000, 330000, 180000, 140000, 120000, 104000, 96000]
      decision_index: 5
    state: ["Size: 800 shares"]
    best: no-trade
    outcome: "Five minutes on, price was $24.21 — a cent below the decision, and $8 down on 800 shares before a single cost."
    explanation: "The biggest crowd of the morning turned up and finished exactly where it started. Nothing was settled, so there is nothing to join."

  - type: fill-choice
    sentence: "Candle for direction, bar for ___."
    options: ["weight", "timing", "price"]
    answer: "weight"
    explanation: "How many people had to trade for that minute to happen is the whole job of the lower row."

  - type: spot-mistake
    prompt: "One piece of this is false. Tap it."
    segments:
      - {text: "Volume was heavy"}
      - {text: "on the minute price fell hardest,"}
      - {text: "so the buyers must have been absent.", wrong: true}
    explanation: "Every share sold was bought by somebody. Heavy volume means both sides were there in size, and the candle is what says who won."

  - type: recap
    title: "Level 4 in three lines"
    points:
      - {text: "One volume bar per candle: how many shares changed hands that minute.", level: "4-1"}
      - {text: "Heavy and thin only mean something against this stock's own recent minutes.", level: "4-2"}
      - {text: "The biggest bar of a long run is usually the crowd leaving, not arriving.", level: "4-3"}
