id: "1-1"
title: "The Candle"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [candles, chart-reading]
icon: candle
learning_goal: "User can name the four prices a single candle records and read each of them off a 1-minute chart."
purpose: "Every chart from here to the end of the path is drawn out of these four numbers."
terms_introduced: ["Candle", "Open", "High", "Low", "Close"]
reinforces: []
prerequisite: null
xp: 20
difficulty: 1
sources: [consensus]
notes: "Four prices only. The names for the shape itself arrive in 1-2, so nothing here says body or wick."
screens:
  - type: intro
    text: "A line gives you one price a minute. A candle gives you four."

  - type: theory
    title: "One minute, one candle"
    body: "A candle covers one slice of time. For a scalper that slice is a minute, and the chart draws a fresh one every sixty seconds."
    visual: chart-candles
    visual_data:
      data: [[17.40, 17.48, 17.36, 17.45], [17.45, 17.52, 17.42, 17.50], [17.50, 17.55, 17.41, 17.44], [17.44, 17.51, 17.42, 17.49], [17.49, 17.58, 17.47, 17.56], [17.56, 17.61, 17.52, 17.59], [17.59, 17.64, 17.55, 17.57], [17.57, 17.66, 17.56, 17.65]]

  - type: theory
    title: "Where the minute started and stopped"
    body: "The open is the first price traded in that minute. The close is the last one. The thick block in the middle of the shape is drawn between those two."

  - type: theory
    title: "How far it got either way"
    body: "The high is the furthest price up inside the minute, the low the furthest down. The thin threads above and below the block reach out to them."

  - type: example
    body: "XYZ, one minute. The first trade goes off at $17.40, price runs to $17.58, dips to $17.36, and the last trade of the minute is $17.52."
    visual: chart-candles
    visual_data:
      data: [[17.40, 17.58, 17.36, 17.52]]

  - type: match
    prompt: "Four numbers come out of every minute. Which is which?"
    pairs:
      - ["Open", "The first price traded in that minute"]
      - ["Close", "The last price traded in that minute"]
      - ["High", "The furthest price up inside the minute"]
      - ["Low", "The furthest price down inside the minute"]
    explanation: "Two of them are the ends of the minute, two of them are the extremes reached inside it."

  - type: chart-tap
    prompt: "Tap the minute that ended lower than it started."
    chart:
      kind: candles
      data: [[11.02, 11.08, 11.01, 11.07], [11.07, 11.12, 11.05, 11.10], [11.10, 11.16, 11.09, 11.15], [11.15, 11.18, 11.06, 11.09], [11.09, 11.14, 11.08, 11.13], [11.13, 11.19, 11.12, 11.18], [11.18, 11.23, 11.16, 11.22], [11.22, 11.27, 11.20, 11.26]]
    target: 3
    explanation: "That minute opened at $11.15 and closed at $11.09, so it finished six cents under where it began."

  - type: numeric-mc
    prompt: "A minute of XYZ: open $21.12, high $21.44, low $21.06, close $21.38. How far did price travel from its low to its high?"
    options:
      - {text: "$0.26"}
      - {text: "$0.06"}
      - {text: "$0.32"}
      - {text: "$0.38", correct: true}
    working: "21.44 − 21.06 = 0.38"
    explanation: "Low to high is the whole span of the minute, not just the part between the open and the close."

  - type: tf
    statement: "Two candles can share the same open and the same close and still not look alike."
    answer: true
    explanation: "Their highs and lows can sit far apart, so the same start and finish can come out of two very different minutes."

  - type: fill-choice
    sentence: "Price ended the minute higher than it started, so the close sits above the ___."
    options: ["open", "high", "low"]
    answer: "open"
    explanation: "Green or red is decided by close against open; the high and the low take no part in it."

  - type: chart-tap
    prompt: "Tap the minute that reached the highest price of this stretch."
    chart:
      kind: candles
      data: [[24.20, 24.28, 24.16, 24.25], [24.25, 24.34, 24.22, 24.31], [24.31, 24.46, 24.29, 24.42], [24.42, 24.58, 24.40, 24.44], [24.44, 24.49, 24.35, 24.38], [24.38, 24.43, 24.30, 24.33], [24.33, 24.40, 24.28, 24.36], [24.36, 24.41, 24.31, 24.39], [24.39, 24.45, 24.36, 24.43]]
    target: 3
    explanation: "$24.58 is the top of a thin thread, not the top of a block — price got there and was back below before the minute ended."

  - type: numeric-input
    prompt: "A candle opens at $13.86, highs at $14.02, lows at $13.80 and closes at $13.94. How far below the high did the minute finish?"
    answer: 0.08
    tolerance: 0.001
    unit: "$"
    working: "14.02 − 13.94 = 0.08"
    explanation: "Eight cents were reached and then handed back before the minute was over."

  - type: sort
    prompt: "Is each of these describing the high, or the close?"
    buckets: ["The high", "The close"]
    items:
      - {text: "The last trade before the minute ran out", bucket: "The close"}
      - {text: "The most anyone paid inside that minute", bucket: "The high"}
      - {text: "The price the next candle starts from", bucket: "The close"}
      - {text: "The top of the thin thread above the block", bucket: "The high"}
    explanation: "The close ends the minute; the high only marks the furthest price up inside it."

  - type: visual
    component: chart-candles
    data:
      data: [[19.84, 20.06, 19.78, 20.00]]
    caption: "Open $19.84, high $20.06, low $19.78, close $20.00. Four numbers, one shape, sixty seconds."
