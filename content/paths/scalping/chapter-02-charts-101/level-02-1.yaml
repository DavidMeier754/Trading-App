id: "2-1"
title: "What a Candle Says"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [candles, chart-reading]
learning_goal: "User can read conviction, refusal and indecision from the way a candle's body and wicks are shared out."
purpose: "A scalper decides in seconds, and the shape of the last few candles is the fastest honest information on the screen."
terms_introduced: []
reinforces: []
prerequisite: "1-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Shape only, one candle at a time. Sequences are 2-2 and the decisions are 2-3."
screens:
  - type: intro
    text: "Same four prices, different shapes — and every shape is saying something."

  - type: theory
    title: "The body is the result"
    body: "The body shows how far price got between the open and the close. A long one means one side pushed and still held the ground when the minute ran out."

  - type: carousel
    cards:
      - {label: "Long body, short wicks", text: "One side ran the whole minute and gave almost nothing back. That is conviction."}
      - {label: "Long wick, small body", text: "Price went there and was pushed straight back. The market tried that price and refused it."}
      - {label: "Tiny body, wicks both ways", text: "Both sides pushed and neither kept anything. That is indecision."}

  - type: visual
    component: chart-candles
    data:
      data: [[16.02, 16.20, 16.01, 16.19], [16.19, 16.34, 16.17, 16.20], [16.20, 16.28, 16.12, 16.19]]
    caption: "Three minutes of one stock, in order: conviction, refusal, indecision."

  - type: chart-tap
    prompt: "Tap the minute where price ran up and handed the whole push back before it ended."
    chart:
      kind: candles
      data: [[26.10, 26.18, 26.06, 26.15], [26.15, 26.24, 26.12, 26.22], [26.22, 26.31, 26.20, 26.29], [26.29, 26.38, 26.26, 26.35], [26.35, 26.62, 26.33, 26.37], [26.37, 26.41, 26.28, 26.31], [26.31, 26.36, 26.24, 26.27], [26.27, 26.33, 26.22, 26.30], [26.30, 26.35, 26.25, 26.28]]
    target: 4
    explanation: "Price traded up to $26.62 and finished at $26.37. The long thread on top is the record of everything the sellers took back."

  - type: slider
    prompt: "A minute travelled from $20.00 to $20.40. Its body sits between $20.05 and $20.15. How much of that travel is body?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 25
    tolerance: 10
    explanation: "A $0.10 body inside a $0.40 move — three quarters of what price did that minute was given straight back."

  - type: theory
    title: "A wick is a refusal"
    body: "Every long wick is a price that could not be defended. One side reached out there and the other side took it away again, all inside sixty seconds."

  - type: mc
    prompt: "A candle with a tiny body and long wicks above and below shows:"
    options:
      - {text: "neither side keeping what it took", correct: true}
      - {text: "sellers firmly in control"}
      - {text: "a minute in which almost nothing traded"}
    explanation: "Both sides reached out and both were pushed back, so the minute finished about where it started."

  - type: tf
    statement: "A green candle tells you the price is higher than it was an hour ago."
    answer: false
    explanation: "Green only compares the close with the open of that one minute; the hour before it can look like anything."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "A long upper wick"}
      - {text: "shows a price that was reached"}
      - {text: "and then held to the close.", wrong: true}
    explanation: "It was reached and taken away again. If it had been held, the close would be up there and there would be no wick."

  - type: fill-choice
    sentence: "A long body with barely any thread at either end shows ___."
    options: ["conviction", "indecision", "refusal"]
    answer: "conviction"
    explanation: "One side took the ground and still had it when the minute ended."

  - type: match
    prompt: "Match each shape to what happened inside that minute."
    pairs:
      - ["Long green body, no upper wick", "Buyers paid up and kept every cent"]
      - ["Long upper wick, small body", "Price was reached above and taken away"]
      - ["Long lower wick, small body", "Price was reached below and bought back"]
      - ["Tiny body, wicks both ways", "Both sides pushed and both were pushed back"]
    explanation: "Where the body sits inside the whole candle is the entire read."

  - type: sort
    prompt: "Which side finished the minute ahead?"
    buckets: ["Buyers", "Sellers"]
    items:
      - {text: "Open $22.10, close $22.28, high $22.30, low $22.08", bucket: "Buyers"}
      - {text: "Open $22.28, high $22.46, low $22.24, close $22.26", bucket: "Sellers"}
      - {text: "Open $14.60, low $14.38, high $14.62, close $14.58", bucket: "Sellers"}
      - {text: "Open $14.58, low $14.40, high $14.74, close $14.72", bucket: "Buyers"}
    explanation: "Compare the close with the open and ignore everything else; the wicks say how hard it was, not who won."

  - type: example
    body: "The same stock, one minute apart. The first is a $0.22 body with two cents of thread on top. The second is a $0.04 body with $0.12 above it and $0.08 below."
    visual: chart-candles
    visual_data:
      data: [[13.40, 13.64, 13.38, 13.62], [13.62, 13.74, 13.50, 13.58]]
