id: "13-1"
title: "The Opening Minutes"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [open, sessions, volume]
learning_goal: "User can say why the first minutes of the session behave differently from every other part of the day, and why the first five of them are for watching."
purpose: "A scalper's whole morning happens in the half hour beginners lose their money in."
terms_introduced: []
reinforces: [1]
prerequisite: "12-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Session times come from market tokens; the gap and the opening range arrive in 13-2 and 13-3."
screens:
  - type: intro
    text: "The loudest half hour of the day, and the one that costs beginners the most."

  - type: theory
    title: "One half hour, hours of trading"
    body: "The session opens at {{market.regular_open}} {{market.timezone}}. Inside {{market.first_minutes}} more shares change hands than in any other stretch, the moves are bigger, and the spread is at its widest."

  - type: visual
    component: session-ribbon
    data:
      premarket: "{{market.premarket}}"
      regular: "{{market.regular}}"
      afterhours: "{{market.afterhours}}"
      timezone: "{{market.timezone}}"
    caption: "Everything in this chapter happens inside the regular session, and most of it near the front of it."

  - type: slider
    prompt: "Guess before you are told: how much of a whole day's volume goes through in the first half hour?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 20
    tolerance: 10
    explanation: "Around a fifth on an ordinary day. Half an hour of clock time carrying hours' worth of trading."

  - type: theory
    title: "Why it is different"
    body: "Everyone acts on the same overnight news at the same moment. Orders held back for hours arrive together, and the price they agree on takes a few minutes to find."

  - type: mc
    prompt: "XYZ traded 26,000 shares in the pre-market and 1,100,000 in the first ten minutes of the session. What does that change?"
    options:
      - {text: "the pre-market price was set by very few people", correct: true}
      - {text: "the pre-market price is the more reliable of the two"}
      - {text: "nothing, it is the same stock either way"}
    explanation: "Twenty-six thousand shares is a handful of traders. The session is where the crowd votes, and it can vote the other way in seconds."

  - type: chart-decision
    scenario: "The bell has just gone. XYZ opened at $16.20 and every minute since has overlapped the one before it, on the heaviest bars of the day. Your account is $20,000 and you are sizing 1,200 shares."
    shares: 1200
    chart:
      kind: candles
      data: [[16.20, 16.44, 16.06, 16.34], [16.34, 16.40, 16.12, 16.16], [16.16, 16.38, 16.10, 16.32], [16.32, 16.36, 16.08, 16.14], [16.14, 16.34, 16.10, 16.30], [16.30, 16.36, 16.12, 16.18], [16.18, 16.38, 16.14, 16.32], [16.32, 16.36, 16.10, 16.16], [16.16, 16.34, 16.12, 16.28], [16.28, 16.32, 16.10, 16.14], [16.14, 16.30, 16.12, 16.24]]
      volume: [468000, 386000, 342000, 318000, 296000, 274000, 262000, 248000, 236000, 224000, 218000]
      decision_index: 5
    best: no-trade
    outcome: "Five minutes on, price was $16.24 — six cents above the decision, $72 on 1,200 shares before a single cost."
    explanation: "Six minutes and nothing has been kept: every candle overlaps the one before it and the whole stretch is thirty-eight cents wide. Volume this big with no progress is two crowds paying each other."

  - type: tf
    statement: "The spread on the same stock is usually wider in the first minutes than it is an hour later."
    answer: true
    explanation: "Prices are moving too fast for anyone to quote them tightly. Chapter 3 puts a number on what that costs you."

  - type: numeric-input
    prompt: "XYZ traded 1,150,000 shares in the first half hour and 230,000 in the half hour before the close. The first is how many times the second?"
    answer: 5
    tolerance: 0.01
    working: "1,150,000 ÷ 230,000 = 5"
    explanation: "The same stock, the same length of time, five times the participation. That is why a scalper's day is front-loaded."

  - type: order
    prompt: "Put the front of a trading day in the order you see it."
    items:
      - "Pre-market trades set a high and a low on thin volume"
      - "The session opens and the heaviest bars of the day print"
      - "The first five minutes finish and their extremes stop moving"
      - "The pace thins out into the late morning"
    explanation: "Three of them happen before there is anything worth trading, which is exactly why the first five minutes are for watching."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "Volume is at its highest in the first minutes,"}
      - {text: "so the direction is at its clearest,", wrong: true}
      - {text: "and the spread is at its widest."}
    explanation: "Heavy volume means many people are trading, not that they agree. At the open they are still arguing."

  - type: chart-tap
    prompt: "Tap the minute that traded the most shares."
    chart:
      kind: candles
      data: [[14.60, 14.86, 14.52, 14.78], [14.78, 14.84, 14.62, 14.66], [14.66, 14.80, 14.60, 14.76], [14.76, 14.82, 14.64, 14.68], [14.68, 14.78, 14.62, 14.74], [14.74, 14.80, 14.66, 14.70], [14.70, 14.78, 14.66, 14.76], [14.76, 14.82, 14.70, 14.74]]
      volume: [452000, 316000, 284000, 262000, 238000, 214000, 206000, 198000]
    target: 0
    explanation: "The opening minute is almost always the biggest bar on the chart, and the bars shrink from there for the next half hour."

  - type: checklist-reveal
    title: "What the first five minutes are for"
    items:
      - "Watching which side keeps the price it takes"
      - "Letting the widest spread of the day settle"
      - "Waiting for the first prices that stop moving"
      - "Being ready, not being in"
