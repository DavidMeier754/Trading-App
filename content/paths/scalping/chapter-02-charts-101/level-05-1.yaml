id: "5-1"
title: "Candles and Volume Practice"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: repetition
tags: [volume, candles, liquidity, decisions]
learning_goal: "User runs the three-question read — which way, did anybody mean it, can this stock take my size — before deciding."
purpose: "A chart you like in a stock you cannot get out of is not a trade, and that is the question beginners skip."
terms_introduced: []
reinforces: [1]
prerequisite: "4-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Adds the Chapter 1 liquidity question to the two-row read. The pure drill is 5-2."
screens:
  - type: intro
    text: "Two rows on the chart answer two questions. The third one is about you, not about the chart."

  - type: theory
    title: "Three questions, in order"
    body: "Which way did the last minutes go? Did enough people trade for it to mean anything? And can this stock take the size you want, in and out?"

  - type: checklist-reveal
    title: "The read, every time"
    items:
      - "Body and wicks: who kept the ground"
      - "The bar underneath: how many had to trade for it"
      - "The recent bars: is this minute heavy for this stock"
      - "Your size against that minute: can you get back out"

  - type: compare
    prompt: "You want 1,500 shares in and out inside two minutes. Which of these mornings can take that?"
    charts:
      - {kind: candles, data: [[18.40, 18.48, 18.36, 18.46], [18.46, 18.56, 18.44, 18.54], [18.54, 18.60, 18.50, 18.52], [18.52, 18.64, 18.50, 18.62], [18.62, 18.72, 18.59, 18.70], [18.70, 18.78, 18.66, 18.74], [18.74, 18.84, 18.71, 18.82], [18.82, 18.90, 18.78, 18.86]], volume: [64000, 96000, 58000, 88000, 132000, 74000, 118000, 92000], label: "A"}
      - {kind: candles, data: [[18.40, 18.48, 18.36, 18.46], [18.46, 18.56, 18.44, 18.54], [18.54, 18.60, 18.50, 18.52], [18.52, 18.64, 18.50, 18.62], [18.62, 18.72, 18.59, 18.70], [18.70, 18.78, 18.66, 18.74], [18.74, 18.84, 18.71, 18.82], [18.82, 18.90, 18.78, 18.86]], volume: [7000, 9000, 6000, 8000, 11000, 5000, 9000, 7000], label: "B"}
    answer: "A"
    explanation: "The candles are identical. In B your 1,500 shares are more than a whole minute of trading, so you would be the move rather than joining it."

  - type: chart-decision
    scenario: "XYZ has drifted sideways on bars near 45,000 shares. The candle that just closed is the longest green body of the morning, on 168,000. Your account is $20,000 and you are sizing 900 shares."
    shares: 900
    chart:
      kind: candles
      data: [[21.90, 21.96, 21.86, 21.94], [21.94, 22.02, 21.92, 22.00], [22.00, 22.06, 21.96, 21.99], [21.99, 22.04, 21.95, 22.02], [22.02, 22.08, 22.00, 22.06], [22.06, 22.22, 22.04, 22.20], [22.20, 22.32, 22.17, 22.30], [22.30, 22.40, 22.26, 22.37], [22.37, 22.46, 22.33, 22.43], [22.43, 22.54, 22.39, 22.51], [22.51, 22.62, 22.47, 22.59]]
      volume: [46000, 52000, 40000, 44000, 58000, 168000, 152000, 134000, 118000, 100000, 86000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It kept going to $22.62 and finished at $22.59 — $0.39 a share above the decision, +$351 long on 900 shares."
    explanation: "Longest body of the morning on nearly four times the recent bars, in a stock busy enough to sell 900 shares back into."

  - type: numeric-mc
    prompt: "A stock is printing 6,000 shares a minute. Your 1,500-share order would be what share of that minute?"
    options:
      - {text: "4 %"}
      - {text: "2.5 %"}
      - {text: "25 %", correct: true}
      - {text: "40 %"}
    working: "1,500 ÷ 6,000 = 0.25 = 25 %"
    explanation: "A quarter of everything traded in that minute is you. Prices move to find the other side of an order that size."

  - type: tf
    statement: "Once the chart looks right, how many shares trade each minute stops mattering."
    answer: false
    explanation: "The shapes look the same at any size. Whether you can get your own order back out is a separate question, and it is the one that decides the trade."

  - type: chart-decision
    scenario: "XYZ has climbed twenty cents over six minutes. Every bar is shorter than the one before it, and the last one is 6,000 shares. Your account is $20,000 and you are sizing 700 shares."
    shares: 700
    chart:
      kind: candles
      data: [[25.90, 25.96, 25.86, 25.94], [25.94, 25.99, 25.90, 25.96], [25.96, 26.02, 25.93, 26.00], [26.00, 26.05, 25.97, 26.03], [26.03, 26.08, 26.00, 26.06], [26.06, 26.12, 26.03, 26.10], [26.10, 26.14, 26.04, 26.06], [26.06, 26.11, 26.02, 26.09], [26.09, 26.13, 26.05, 26.07], [26.07, 26.12, 26.03, 26.10], [26.10, 26.15, 26.06, 26.08]]
      volume: [16000, 13000, 11000, 9000, 8000, 6000, 7000, 6000, 8000, 5000, 6000]
      decision_index: 5
    best: no-trade
    outcome: "Five minutes on, price was $26.08 — two cents under the decision, and $14 down on 700 shares before a single cost."
    explanation: "The climb is real and nobody is behind it. Getting 700 shares back out of a 6,000-share minute costs more than the climb is worth."

  - type: match
    prompt: "Match each pairing on the chart to what you do with it."
    pairs:
      - ["Long body, heavy bar, busy stock", "Take it"]
      - ["Long body, thin bar", "Leave it — nobody is behind the move"]
      - ["Tiny body, heavy bar", "Leave it — a crowd arrived and settled nothing"]
      - ["Long body, heavy bar, 6,000-share minutes", "Leave it — you cannot get your size back out"]
    explanation: "Three of the four look tempting on the candles alone, which is exactly why the other two questions exist."

  - type: mc
    prompt: "You have found a chart you like in a stock trading 8,000 shares a minute. The next question is:"
    options:
      - {text: "whether that shape has worked in this stock before"}
      - {text: "how many shares you could get back out", correct: true}
      - {text: "whether to double the size, since the move will be bigger"}
    explanation: "Getting in is easy in any stock. The exit is what the 8,000 shares a minute is threatening."

  - type: order
    prompt: "Put a two-row read in the order it happens."
    items:
      - "Read the last candle's body and wicks"
      - "Check the bar under it against the recent minutes"
      - "Ask whether the stock can take your size"
      - "Decide long, short or nothing"
    explanation: "Direction, weight, size, decision. Skipping the third step is what turns a good read into a bad fill."

  - type: chart-tap
    prompt: "Tap the minute where a long body printed on the thinnest bar of the chart."
    chart:
      kind: candles
      data: [[19.20, 19.26, 19.16, 19.24], [19.24, 19.30, 19.21, 19.28], [19.28, 19.34, 19.25, 19.31], [19.31, 19.48, 19.29, 19.46], [19.46, 19.52, 19.42, 19.48], [19.48, 19.54, 19.44, 19.50], [19.50, 19.56, 19.46, 19.52], [19.52, 19.58, 19.48, 19.54]]
      volume: [64000, 58000, 52000, 9000, 46000, 44000, 40000, 38000]
    target: 3
    explanation: "A fifteen-cent body on 9,000 shares. Price went up because almost nobody was there to sell, and it comes back the same way."

  - type: fill-tiles
    sentence: "Before you trade a chart you like, check that the stock can take your ___."
    answer: "size"
    explanation: "The chart is the same for everybody; how many shares you need is yours alone."

  - type: visual
    component: chart-candles
    data:
      data: [[16.40, 16.52, 16.36, 16.50], [16.50, 16.58, 16.46, 16.48], [16.48, 16.64, 16.46, 16.62], [16.62, 16.70, 16.58, 16.66]]
      volume: [58000, 44000, 176000, 92000]
    caption: "Which way, who meant it, can I get out. Three questions, about four seconds, every single time."
