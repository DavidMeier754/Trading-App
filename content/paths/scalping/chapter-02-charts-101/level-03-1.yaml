id: "3-1"
title: "Timeframes"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [timeframes, chart-reading]
icon: zoom
learning_goal: "User can say what a timeframe is and name the job each of the scalper's two charts does."
purpose: "Scalpers live on the 1-minute chart, and the fastest way to lose on it is to ignore what the 5-minute is doing."
terms_introduced: ["Timeframe"]
reinforces: []
prerequisite: "2-3"
xp: 20
difficulty: 2
sources: [consensus]
notes: "The idea of a slice of time, and the two-chart pair. Building the bigger candle is 3-2."
screens:
  - type: intro
    text: "Same stock, same morning, two charts — and they are allowed to disagree."

  - type: theory
    title: "A candle is a slice of time"
    body: "The timeframe says how much time one candle covers. On a 1-minute chart every candle is a minute. On a 5-minute chart, one candle holds five of them."

  - type: visual
    component: chart-candles
    data:
      data: [[24.60, 24.72, 24.56, 24.70], [24.70, 24.78, 24.66, 24.68], [24.68, 24.74, 24.52, 24.58], [24.58, 24.66, 24.54, 24.64], [24.64, 24.82, 24.62, 24.80], [24.80, 24.88, 24.76, 24.86], [24.86, 24.94, 24.82, 24.90], [24.90, 24.98, 24.84, 24.88], [24.88, 24.96, 24.80, 24.82], [24.82, 24.90, 24.78, 24.88]]
    caption: "Ten minutes of XYZ on the 1-minute chart: ten candles, one for each."

  - type: example
    body: "The same ten minutes with the timeframe set to five: two candles instead of ten. Nothing about the stock changed, only how much time each shape is asked to hold."
    visual: chart-candles
    visual_data:
      data: [[24.60, 24.82, 24.52, 24.80], [24.80, 24.98, 24.76, 24.88]]

  - type: fill-tiles
    sentence: "How much time one candle covers is that chart's ___."
    answer: "timeframe"
    explanation: "The same stock can be drawn on any timeframe, and each one tells a slightly different story."

  - type: mc
    prompt: "You switch a chart from 1 minute to 5 minutes without changing anything else. The number of candles on the screen:"
    options:
      - {text: "falls to about a fifth", correct: true}
      - {text: "stays the same"}
      - {text: "rises to about five times as many"}
    explanation: "The same stretch of time is being packed into fewer, fatter shapes."

  - type: tf
    statement: "A move that takes five minutes shows up as five candles on the 5-minute chart."
    answer: false
    explanation: "Five minutes is one 5-minute candle. It is the 1-minute chart that draws five of them."

  - type: numeric-input
    prompt: "XYZ has been trading for 45 minutes since the session opened. How many finished candles are on its 5-minute chart?"
    answer: 9
    tolerance: 0.001
    working: "45 ÷ 5 = 9"
    explanation: "Nine on the 5-minute, forty-five on the 1-minute — the same morning, counted two ways."

  - type: match
    prompt: "Which chart is a scalper using for which job?"
    pairs:
      - ["1-minute", "Where the entry and the exit actually happen"]
      - ["5-minute", "Which way the bigger move is running"]
      - ["15-minute", "The shape of the whole morning at a glance"]
    explanation: "The slower charts set the context; the fastest one gives you the moment."

  - type: chart-tap
    prompt: "On this 5-minute chart, tap the five minutes that finished below where they started."
    chart:
      kind: candles
      data: [[13.40, 13.58, 13.36, 13.54], [13.54, 13.70, 13.50, 13.66], [13.66, 13.74, 13.44, 13.48], [13.48, 13.62, 13.46, 13.60], [13.60, 13.78, 13.56, 13.74], [13.74, 13.86, 13.70, 13.82], [13.82, 13.94, 13.78, 13.90], [13.90, 14.02, 13.86, 13.98]]
    target: 2
    explanation: "That candle opened at $13.66 and closed at $13.48 — five minutes the sellers finished in front of."

  - type: theory
    title: "Two charts, two jobs"
    body: "The 5-minute tells you which way the bigger move is running. The 1-minute tells you when to act. Scalpers decide with the first and enter with the second."

  - type: sort
    prompt: "Which chart answers each question?"
    buckets: ["Ask the 5-minute", "Ask the 1-minute"]
    items:
      - {text: "Which side has owned this morning so far", bucket: "Ask the 5-minute"}
      - {text: "Whether the minute just now finished at its high", bucket: "Ask the 1-minute"}
      - {text: "Where the bigger move has been turning", bucket: "Ask the 5-minute"}
      - {text: "Whether to press the button right now", bucket: "Ask the 1-minute"}
    explanation: "Direction from the slow chart, timing from the fast one — never the other way round."

  - type: order
    prompt: "Put a scalper's read in the order it happens."
    items:
      - "Check the 5-minute for the bigger move"
      - "Wait for a 1-minute candle that fits it"
      - "Take the trade on the 1-minute"
    explanation: "Context first, trigger second, action last. Reversing the first two is how you end up trading against the morning."

  - type: example
    body: "Six green minutes and four red ones can come out as two green 5-minute candles, or as one green and one red. Where the five-minute boundaries fall decides which shapes you end up looking at."
