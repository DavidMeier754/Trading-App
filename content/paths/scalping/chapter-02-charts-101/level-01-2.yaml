id: "1-2"
title: "The Candle"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [candles, chart-reading, decisions]
learning_goal: "User can read conviction, refusal and indecision from a candle's body-to-wick shape and use that read in a decision."
purpose: "A scalper decides in seconds; the shape of the last few candles is the fastest honest information on the screen."
terms_introduced: []
prerequisite: "1-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Shape only. Volume enters in Level 3, exhaustion as a named idea in Level 8."
screens:
  - type: intro
    text: "Same four prices, different shapes — and each shape says something."

  - type: theory
    title: "The body is the result"
    body: "The body shows how far price travelled between the open and the close. A long body means one side pushed and still held the ground when the minute ended."

  - type: carousel
    cards:
      - {label: "Long body, short wicks", text: "One side ran the whole minute and gave almost nothing back. Conviction."}
      - {label: "Long wick, small body", text: "Price went there and was pushed straight back. The market tried that price and refused it."}
      - {label: "Tiny body, wicks both ways", text: "Both sides pushed, neither kept anything. Indecision — and often the quietest place to trade."}

  - type: visual
    component: chart-candles
    data:
      data: [[16.02, 16.20, 16.01, 16.19], [16.19, 16.34, 16.17, 16.20], [16.20, 16.28, 16.12, 16.19]]
    caption: "Three minutes of the same stock: conviction, refusal, indecision."

  - type: slider
    prompt: "A candle travelled from $20.00 to $20.40. Its body sits between $20.05 and $20.15. How much of that travel is body?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 25
    tolerance: 10
    explanation: "A $0.10 body inside a $0.40 move — a quarter. Three quarters of what price did that minute was handed back."

  - type: theory
    title: "A wick is a refusal"
    body: "Every long wick is a price that could not be defended. Buyers reached up there and sellers took it away again, all inside one minute."

  - type: chart-tap
    prompt: "Tap the candle where price ran up and gave the whole push back before the close."
    chart:
      kind: candles
      data: [[46.10, 46.18, 46.06, 46.15], [46.15, 46.24, 46.12, 46.22], [46.22, 46.31, 46.20, 46.29], [46.29, 46.38, 46.26, 46.35], [46.35, 46.62, 46.33, 46.37], [46.37, 46.41, 46.28, 46.31], [46.31, 46.36, 46.24, 46.27], [46.27, 46.33, 46.22, 46.30], [46.30, 46.35, 46.25, 46.28]]
    target: 4
    explanation: "Price traded up to $46.62 and closed at $46.37 — the long wick is the record of everything sellers took back."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "A candle with a tiny body"}
      - {text: "and long wicks above and below"}
      - {text: "shows one side firmly in control.", wrong: true}
    explanation: "Both sides pushed and neither kept the ground — that is indecision, not control."

  - type: tf
    statement: "A green candle tells you the price is higher than it was an hour ago."
    answer: false
    explanation: "Green only compares the close with the open of that one candle; the hour before it can look like anything."

  - type: chart-decision
    scenario: "XYZ on the 1-minute: three bodies in a row, each longer than the last, each closing at the top with barely any wick. You are sizing 800 shares."
    shares: 800
    chart:
      kind: candles
      data: [[33.10, 33.16, 33.06, 33.12], [33.12, 33.18, 33.09, 33.15], [33.15, 33.26, 33.14, 33.24], [33.24, 33.38, 33.22, 33.36], [33.36, 33.52, 33.34, 33.50], [33.50, 33.58, 33.47, 33.56], [33.56, 33.70, 33.54, 33.68], [33.68, 33.79, 33.65, 33.76], [33.76, 33.84, 33.72, 33.81], [33.81, 33.86, 33.77, 33.83], [33.83, 33.88, 33.79, 33.85]]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It pushed on to $33.85 — $0.29 a share above the decision, +$232 long on 800 shares."
    explanation: "Growing bodies with almost no wick: buyers are paying up and nobody is taking it back."

  - type: mc
    prompt: "Three long green bodies in a row, each closing near its high. The most useful read is:"
    options:
      - {text: "A red candle is due after three green ones"}
      - {text: "The stock has become too expensive to buy"}
      - {text: "Buyers kept control minute after minute", correct: true}
    explanation: "Candles have no memory and no fair price — they only show who kept control."

  - type: chart-decision
    scenario: "XYZ ran up for six minutes. The last two candles both spiked higher and closed back near their open, leaving long wicks on top. You are sizing 1,500 shares."
    shares: 1500
    chart:
      kind: candles
      data: [[9.42, 9.50, 9.40, 9.48], [9.48, 9.60, 9.47, 9.58], [9.58, 9.72, 9.56, 9.70], [9.70, 9.86, 9.68, 9.84], [9.84, 9.98, 9.82, 9.86], [9.86, 9.97, 9.83, 9.85], [9.85, 9.88, 9.74, 9.76], [9.76, 9.79, 9.66, 9.68], [9.68, 9.72, 9.60, 9.63], [9.63, 9.67, 9.57, 9.59], [9.59, 9.62, 9.52, 9.55]]
      decision_index: 5
    best: no-trade
    reasonable: [short]
    outcome: "Price slid to $9.55. Buying there would have cost $0.30 a share — $450 on 1,500 shares. Standing aside cost nothing."
    explanation: "Two refusals in a row are a reason to stop buying; selling into a stock that is still rising needs more than shape, which is Level 8."

  - type: fill-choice
    sentence: "A candle with a tiny body and long wicks on both sides shows ___."
    options: ["indecision", "conviction", "heavy volume"]
    answer: "indecision"
    explanation: "Both sides tried, neither finished ahead."

  - type: theory
    title: "Shape first, story second"
    body: "Body says who won the minute. Wick says what they could not keep. You now read a candle faster than most people read a price."
