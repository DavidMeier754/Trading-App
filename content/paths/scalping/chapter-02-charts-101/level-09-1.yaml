id: "9-1"
title: "Support and Resistance"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [levels, support, resistance, structure]
learning_goal: "User can find the price that has turned the last pushes and name it support or resistance."
purpose: "A scalper trades to and from levels; without them a chart is just a wiggling line."
terms_introduced: ["Support", "Resistance"]
reinforces: [1]
prerequisite: "8-3"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Definition level. The 'what is sitting there' question is the Chapter 1 callback to supply and demand."
screens:
  - type: intro
    text: "Some prices stop the market twice in a morning. Those are the only prices worth drawing."

  - type: story
    character: retail-trader
    text: "XYZ has tried to get through $24.40 twice in ten minutes. Both times it got there and came straight back."

  - type: theory
    title: "A level is a memory"
    body: "Price stops where enough people decided to trade last time. They remember the number, so they act there again — and a price that turned the market twice is a level."

  - type: theory
    title: "Two names, one idea"
    body: "Below price it is support: buyers turned it up from there. Above price it is resistance: sellers turned it down from there. The same price is often both, at different times of day."
    visual: chart-candles
    visual_data:
      data: [[24.10, 24.24, 24.06, 24.22], [24.22, 24.40, 24.20, 24.30], [24.30, 24.36, 24.22, 24.26], [24.26, 24.40, 24.24, 24.32], [24.32, 24.38, 24.24, 24.28], [24.28, 24.34, 24.18, 24.20], [24.20, 24.28, 24.14, 24.24], [24.24, 24.32, 24.18, 24.22]]
      volume: [96000, 138000, 84000, 126000, 78000, 92000, 70000, 66000]
      levels: [24.40]

  - type: chart-annotate
    prompt: "Drag the line to the price that has stopped both pushes this morning."
    chart:
      kind: candles
      data: [[24.10, 24.24, 24.06, 24.22], [24.22, 24.40, 24.20, 24.30], [24.30, 24.36, 24.22, 24.26], [24.26, 24.40, 24.24, 24.32], [24.32, 24.38, 24.24, 24.28], [24.28, 24.34, 24.18, 24.20], [24.20, 24.28, 24.14, 24.24], [24.24, 24.32, 24.18, 24.22]]
      volume: [96000, 138000, 84000, 126000, 78000, 92000, 70000, 66000]
    answer: 24.40
    tolerance: 0.04
    label: "Resistance"
    explanation: "Twice to $24.40, twice back. Everything the stock does for the rest of the morning is measured against that price."

  - type: mc
    prompt: "Two pushes stalled at exactly $24.40. What is sitting there?"
    options:
      - {text: "a rule the exchange applies at that price"}
      - {text: "sellers willing to let go there", correct: true}
      - {text: "the market maker's fee for the day"}
    explanation: "Prices stop where supply meets demand. Enough people decided $24.40 was worth selling at, and they have not all been served yet."

  - type: chart-tap
    prompt: "Tap the second minute that reached the price the pushes keep stopping at."
    chart:
      kind: candles
      data: [[24.10, 24.24, 24.06, 24.22], [24.22, 24.40, 24.20, 24.30], [24.30, 24.36, 24.22, 24.26], [24.26, 24.40, 24.24, 24.32], [24.32, 24.38, 24.24, 24.28], [24.28, 24.34, 24.18, 24.20], [24.20, 24.28, 24.14, 24.24], [24.24, 24.32, 24.18, 24.22]]
      volume: [96000, 138000, 84000, 126000, 78000, 92000, 70000, 66000]
    target: 3
    explanation: "The second touch is what turns a price into a level. One touch is a high; two is a decision the market keeps making."

  - type: tf
    statement: "A level is one exact price, so $24.40 and $24.42 are two different levels."
    answer: false
    explanation: "Levels are areas a few cents wide. People remember the number, not the tick, so treat the last two cents as part of the same price."

  - type: chart-decision
    scenario: "XYZ was turned away at $19.60 ten minutes ago. It has come back up and the minute that just closed reached $19.60 again, finished fourteen cents below it, and printed the heaviest bar of the morning. Your account is $20,000 and you are sizing 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[19.20, 19.34, 19.16, 19.32], [19.32, 19.48, 19.30, 19.44], [19.44, 19.60, 19.42, 19.48], [19.48, 19.54, 19.38, 19.40], [19.40, 19.52, 19.36, 19.50], [19.50, 19.60, 19.44, 19.46], [19.46, 19.50, 19.34, 19.36], [19.36, 19.40, 19.24, 19.26], [19.26, 19.32, 19.16, 19.18], [19.18, 19.24, 19.10, 19.14], [19.14, 19.20, 19.04, 19.08]]
      volume: [104000, 118000, 146000, 88000, 96000, 152000, 128000, 134000, 122000, 110000, 102000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell away to $19.04 and finished at $19.08 — $0.38 a share, +$380 short on 1,000 shares."
    explanation: "The same price stopped it twice, and the second time the heaviest bar of the day was spent failing there. The sellers at $19.60 are still being served."

  - type: fill-choice
    sentence: "A price that has turned the market down twice is ___."
    options: ["resistance", "support", "a pullback"]
    answer: "resistance"
    explanation: "Sellers above, so price runs into them from below. The same price under the market would be doing the opposite job."

  - type: match
    prompt: "Three prices on your chart. What is each one worth to you?"
    pairs:
      - ["Support", "Buyers turned price up from here before"]
      - ["Resistance", "Sellers turned price down from here before"]
      - ["A price nothing has happened at", "A line on your screen and nothing more"]
    explanation: "A level is only worth drawing if the market has already reacted to it. Everything else is decoration."

  - type: numeric-input
    prompt: "You are long 900 shares from $19.24 and the price that turned the last two pushes is $19.60. If price stops exactly there, what is the trade worth before costs?"
    answer: 324
    tolerance: 0.01
    unit: "$"
    working: "$19.60 − $19.24 = $0.36 a share × 900 shares = $324"
    explanation: "The level is what tells you how much room the trade has, before you take it rather than after."

  - type: visual
    component: chart-candles
    data:
      data: [[26.10, 26.30, 26.06, 26.28], [26.28, 26.30, 26.14, 26.16], [26.16, 26.30, 26.12, 26.26], [26.26, 26.29, 26.10, 26.14]]
      volume: [124000, 88000, 116000, 92000]
      levels: [26.30]
    caption: "Three tries, one price, no progress. That is what a level looks like before anyone names it."
