id: "14-1"
title: "Momentum vs Exhaustion"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [momentum, volume, decisions]
learning_goal: "User can recognise a move that is still recruiting buyers — growing bodies, growing bars, almost no wick — and can say when that shape is not tradable anyway."
purpose: "Joining a move that is still feeding itself is the easiest money a scalper gets, and the shape is unmistakable once you have seen it."
terms_introduced: ["Momentum"]
reinforces: [1]
prerequisite: "13-4"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Builds on the volume bar from Level 4; the exhaustion end of the same move is 14-2."
screens:
  - type: intro
    text: "Some moves drag themselves along. Some pull a crowd behind them."

  - type: theory
    title: "Momentum"
    body: "Momentum is a move that keeps feeding itself: each body longer than the last, each volume bar taller than the last, and hardly any wick on top. New buyers keep arriving and keep paying up."

  - type: visual
    component: chart-candles
    data:
      data: [[17.10, 17.16, 17.06, 17.14], [17.14, 17.24, 17.12, 17.22], [17.22, 17.36, 17.20, 17.34], [17.34, 17.52, 17.32, 17.50], [17.50, 17.72, 17.48, 17.70], [17.70, 17.96, 17.68, 17.94]]
      volume: [86000, 124000, 168000, 214000, 268000, 326000]
    caption: "Four cents, eight, twelve, sixteen, twenty, twenty-four — and a taller bar under every one of them."

  - type: chart-tap
    prompt: "Tap the minute with the longest body."
    chart:
      kind: candles
      data: [[15.90, 15.96, 15.86, 15.94], [15.94, 16.04, 15.92, 16.02], [16.02, 16.18, 16.00, 16.16], [16.16, 16.40, 16.14, 16.38], [16.38, 16.48, 16.34, 16.44], [16.44, 16.52, 16.40, 16.48], [16.48, 16.56, 16.44, 16.52], [16.52, 16.58, 16.48, 16.54]]
      volume: [88000, 132000, 186000, 248000, 164000, 128000, 104000, 92000]
    target: 3
    explanation: "Twenty-two cents from open to close on the heaviest bar of the run. Everything after it is shorter and quieter."

  - type: mc
    prompt: "What has to keep happening for a push to carry on?"
    options:
      - {text: "the price keeps printing new highs on the minute"}
      - {text: "every candle in the run closes green"}
      - {text: "buyers keep arriving and paying up", correct: true}
    explanation: "Price only rises because somebody pays more than the last person did. When nobody new turns up, the shape stops meaning anything."

  - type: chart-decision
    scenario: "XYZ has run six minutes. The bodies have grown every minute, the bars underneath have grown with them, and no candle has closed more than two cents off its high. Your account is $20,000 and you are sizing 1,100 shares."
    shares: 1100
    chart:
      kind: candles
      data: [[17.10, 17.16, 17.06, 17.14], [17.14, 17.24, 17.12, 17.22], [17.22, 17.36, 17.20, 17.34], [17.34, 17.52, 17.32, 17.50], [17.50, 17.72, 17.48, 17.70], [17.70, 17.96, 17.68, 17.94], [17.94, 18.14, 17.90, 18.10], [18.10, 18.28, 18.06, 18.24], [18.24, 18.36, 18.18, 18.32], [18.32, 18.40, 18.26, 18.36], [18.36, 18.44, 18.30, 18.40]]
      volume: [86000, 124000, 168000, 214000, 268000, 326000, 298000, 262000, 208000, 164000, 142000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $18.44 and finished at $18.40 — $0.46 a share above the decision, +$506 long on 1,100 shares."
    explanation: "Six minutes, six longer bodies, six taller bars and no upper wicks. The move is still collecting people who have not bought yet."

  - type: tf
    statement: "A long green candle printed on a lighter bar than the ones before it is momentum."
    answer: false
    explanation: "The body says the price moved; the bar says how many people moved it. One long candle on thin volume is a few orders, not a crowd."

  - type: numeric-input
    prompt: "You are long 1,100 shares from $17.98 and the push carries to $18.24. What is the result before costs?"
    answer: 286
    tolerance: 0.01
    unit: "$"
    working: "$0.26 a share × 1,100 shares = $286"
    explanation: "Twenty-six cents of a forty-six cent move, which is what joining one late and leaving it early looks like."

  - type: compare
    prompt: "Both stocks are higher across the stretch. In which one are buyers still arriving?"
    charts:
      - {kind: candles, data: [[19.10, 19.16, 19.06, 19.14], [19.14, 19.26, 19.12, 19.24], [19.24, 19.42, 19.22, 19.40], [19.40, 19.62, 19.38, 19.60], [19.60, 19.86, 19.58, 19.84], [19.84, 20.12, 19.82, 20.10], [20.10, 20.34, 20.06, 20.30], [20.30, 20.52, 20.26, 20.48]], volume: [92000, 138000, 186000, 238000, 292000, 346000, 308000, 286000], label: "A"}
      - {kind: candles, data: [[19.10, 19.24, 19.06, 19.22], [19.22, 19.36, 19.20, 19.32], [19.32, 19.42, 19.30, 19.40], [19.40, 19.48, 19.38, 19.46], [19.46, 19.52, 19.44, 19.50], [19.50, 19.55, 19.48, 19.53], [19.53, 19.57, 19.51, 19.55], [19.55, 19.59, 19.53, 19.57]], volume: [284000, 236000, 192000, 154000, 124000, 98000, 86000, 72000], label: "B"}
    answer: "A"
    explanation: "A adds a longer body and a taller bar every minute. B has gone up too, on shorter bodies and quieter bars, which is the same few buyers running out of company."

  - type: sort
    prompt: "Momentum, or just a green candle?"
    buckets: ["Momentum", "Not momentum"]
    items:
      - {text: "Each body longer than the last on taller and taller bars", bucket: "Momentum"}
      - {text: "A green close on the lightest bar of the morning", bucket: "Not momentum"}
      - {text: "Five green minutes with the bars shrinking each time", bucket: "Not momentum"}
      - {text: "A run whose bars keep growing and whose candles barely wick", bucket: "Momentum"}
    explanation: "Green is a colour. Momentum is a colour plus a crowd that is still getting bigger."

  - type: theory
    title: "The shape is not enough"
    body: "The bars have to be big for this stock, and big enough for your size. A perfect run in something trading a few thousand shares a minute is a picture, not a trade."

  - type: chart-decision
    scenario: "Textbook run: growing bodies, growing bars, no wicks. The whole stock is trading about 14,000 shares a minute. Your account is $20,000 and you are sizing 1,400 shares."
    shares: 1400
    chart:
      kind: candles
      data: [[13.10, 13.16, 13.06, 13.14], [13.14, 13.26, 13.12, 13.24], [13.24, 13.40, 13.22, 13.38], [13.38, 13.58, 13.36, 13.56], [13.56, 13.78, 13.54, 13.76], [13.76, 14.02, 13.74, 14.00], [14.00, 14.06, 13.78, 13.82], [13.82, 13.90, 13.66, 13.70], [13.70, 13.78, 13.58, 13.62], [13.62, 13.70, 13.54, 13.66], [13.66, 13.72, 13.56, 13.60]]
      volume: [9000, 12000, 14000, 16000, 19000, 24000, 18000, 15000, 13000, 11000, 10000]
      decision_index: 5
    best: no-trade
    outcome: "It fell back to $13.56 and finished at $13.60 — buying that minute would be $0.40 a share offside, $560 down on 1,400 shares."
    explanation: "Your 1,400 shares are a tenth of an entire minute going in, and the same again coming out. The stock cannot pay for a shape this good."

  - type: fill-choice
    sentence: "Longer bodies on taller volume bars, with almost no wick on top, is ___."
    options: ["momentum", "a range", "a pullback"]
    answer: "momentum"
    explanation: "Nothing is being handed back yet, and every minute brings more people than the one before it."

  - type: example
    body: "A push you can join has two halves: a shape that is still growing, and a stock big enough to let you out of it."
    visual: chart-candles
    visual_data:
      data: [[17.34, 17.52, 17.32, 17.50], [17.50, 17.72, 17.48, 17.70], [17.70, 17.96, 17.68, 17.94], [17.94, 18.14, 17.90, 18.10]]
      volume: [214000, 268000, 326000, 298000]
