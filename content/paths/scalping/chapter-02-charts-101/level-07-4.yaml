id: "7-4"
title: "Trend and Range"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: new-theory
tags: [trend, structure, sessions, decisions, practice]
learning_goal: "User names the shape of a fresh chart in a few seconds and picks the side it allows."
purpose: "Naming the shape is the first thing a scalper does to a chart and the one thing that has to be automatic."
terms_introduced: []
reinforces: [1]
prerequisite: "7-3"
xp: 25
difficulty: 3
sources: [consensus]
notes: "Level 7's practice page. The pre-market question is the Chapter 1 callback: a shape made by nobody is not a shape."
screens:
  - type: intro
    text: "Eight charts, one question each: what shape is this, and does it allow you anything?"

  - type: story
    character: retail-trader
    text: "$20,000 in the account, no position, and a fresh stock on every screen. Most of them are somebody else's trade."

  - type: swipe-deck
    prompt: "Your card is a long with the steps. Take it, or pass?"
    cards:
      - chart: {kind: candles, data: [[19.20, 19.34, 19.16, 19.32], [19.32, 19.36, 19.22, 19.26], [19.26, 19.48, 19.24, 19.44], [19.44, 19.50, 19.36, 19.40], [19.40, 19.62, 19.38, 19.58], [19.58, 19.64, 19.50, 19.54], [19.54, 19.76, 19.52, 19.72], [19.72, 19.80, 19.66, 19.76]], volume: [88000, 50000, 104000, 54000, 120000, 58000, 134000, 64000]}
        answer: take
        note: "Three pushes, each one higher, and every dip stopping above the last."
      - chart: {kind: candles, data: [[15.44, 15.52, 15.40, 15.48], [15.48, 15.54, 15.42, 15.44], [15.44, 15.50, 15.38, 15.46], [15.46, 15.53, 15.41, 15.43], [15.43, 15.51, 15.39, 15.47], [15.47, 15.52, 15.40, 15.42], [15.42, 15.50, 15.38, 15.46], [15.46, 15.51, 15.41, 15.44]], volume: [44000, 38000, 42000, 36000, 40000, 34000, 38000, 32000]}
        answer: pass
        note: "Sixteen cents, crossed eight times. There is nothing here to be long of."
      - chart: {kind: candles, data: [[21.60, 21.66, 21.44, 21.48], [21.48, 21.56, 21.46, 21.52], [21.52, 21.54, 21.32, 21.36], [21.36, 21.46, 21.34, 21.42], [21.42, 21.44, 21.22, 21.26], [21.26, 21.36, 21.24, 21.32], [21.32, 21.34, 21.12, 21.16], [21.16, 21.24, 21.14, 21.20]], volume: [92000, 52000, 106000, 56000, 118000, 60000, 128000, 64000]}
        answer: pass
        note: "Every attempt up stalls lower. This is a clean shape — for the other side."
      - chart: {kind: candles, data: [[12.40, 12.52, 12.36, 12.50], [12.50, 12.54, 12.42, 12.44], [12.44, 12.66, 12.42, 12.62], [12.62, 12.68, 12.54, 12.56], [12.56, 12.78, 12.54, 12.74], [12.74, 12.80, 12.66, 12.68], [12.68, 12.70, 12.50, 12.52], [12.52, 12.58, 12.44, 12.48]], volume: [76000, 48000, 92000, 52000, 108000, 56000, 142000, 96000]}
        answer: pass
        note: "The last dip went straight through the two before it. The floor is gone, whatever the highs did."
      - chart: {kind: candles, data: [[23.10, 23.16, 23.06, 23.12], [23.12, 23.18, 23.08, 23.14], [23.14, 23.20, 23.10, 23.16], [23.16, 23.38, 23.14, 23.36], [23.36, 23.42, 23.28, 23.32], [23.32, 23.56, 23.30, 23.52], [23.52, 23.58, 23.44, 23.48], [23.48, 23.72, 23.46, 23.68]], volume: [44000, 40000, 46000, 168000, 72000, 186000, 80000, 196000]}
        answer: take
        note: "Flat, then three pushes on the heaviest bars of the morning, each dip holding higher."
    explanation: "Take when both halves are rising and the pushes carry the weight. Pass when either half has stopped, and pass when the shape belongs to the sellers."

  - type: chart-decision
    scenario: "Five minutes of falling. The attempts back up stopped at $28.38, then $28.24, and the one that just closed stopped at $28.08."
    shares: 700
    chart:
      kind: candles
      data: [[28.40, 28.48, 28.24, 28.28], [28.28, 28.38, 28.26, 28.34], [28.34, 28.36, 28.08, 28.12], [28.12, 28.24, 28.10, 28.20], [28.20, 28.22, 27.94, 27.98], [27.98, 28.08, 27.96, 28.04], [28.04, 28.06, 27.78, 27.82], [27.82, 27.92, 27.80, 27.88], [27.88, 27.90, 27.62, 27.66], [27.66, 27.74, 27.64, 27.70], [27.70, 27.72, 27.48, 27.52]]
      volume: [98000, 54000, 112000, 58000, 124000, 60000, 132000, 64000, 140000, 68000, 146000]
      decision_index: 5
    state: ["Account: $20,000", "Size: 700 shares"]
    best: short
    reasonable: [no-trade]
    outcome: "It kept stepping down to $27.48 and finished at $27.52 — $0.52 a share, +$364 short on 700 shares."
    explanation: "Three stalls, each lower than the last, and the red candles are carrying the heavy bars. The shape is telling you which side it allows."

  - type: mc
    prompt: "Before the session opens, XYZ has stepped up neatly on bars of 6,000 shares. What is the honest reading?"
    options:
      - {text: "the strongest trend of the day so far"}
      - {text: "a shape made by a handful of traders", correct: true}
      - {text: "proof the buyers will still be there at the open"}
    explanation: "Thin sessions make clean-looking shapes out of very few trades, and the crowd that arrives at the open has not voted yet."

  - type: numeric-input
    prompt: "You joined at $19.44 with 1,000 shares and sold into the third push at $19.76. What is the result before costs?"
    answer: 320
    tolerance: 0.01
    unit: "$"
    working: "$0.32 a share × 1,000 shares = $320"
    explanation: "Two steps of that staircase, and the share count turns them into something worth the screen time."

  - type: chart-decision
    scenario: "Three dips, each one stopping higher than the last: $10.42, $10.52 and now $10.64. The bars under the green candles are the heavy ones."
    shares: 1800
    chart:
      kind: candles
      data: [[10.40, 10.50, 10.36, 10.48], [10.48, 10.52, 10.42, 10.44], [10.44, 10.62, 10.42, 10.58], [10.58, 10.64, 10.52, 10.54], [10.54, 10.74, 10.52, 10.70], [10.70, 10.76, 10.64, 10.66], [10.66, 10.88, 10.64, 10.84], [10.84, 10.90, 10.78, 10.80], [10.80, 11.02, 10.78, 10.98], [10.98, 11.04, 10.92, 10.94], [10.94, 11.12, 10.92, 11.08]]
      volume: [96000, 58000, 112000, 54000, 126000, 62000, 138000, 66000, 152000, 70000, 160000]
      decision_index: 5
    state: ["Size: 1,800 shares"]
    best: long
    reasonable: [no-trade]
    outcome: "It carried to $11.12 and finished at $11.08 — $0.42 a share above the decision, +$756 long on 1,800 shares."
    explanation: "Both halves rising for five minutes and the weight sitting under the pushes. The dip you are buying is the third one that has held higher."

  - type: sort
    prompt: "Three highs and three dips from four different mornings. Name each shape."
    buckets: ["Uptrend", "Downtrend", "Range"]
    items:
      - {text: "Highs $14.60, $14.72, $14.86 · dips $14.44, $14.56, $14.68", bucket: "Uptrend"}
      - {text: "Highs $26.40, $26.28, $26.16 · dips $26.20, $26.08, $25.96", bucket: "Downtrend"}
      - {text: "Highs $12.34, $12.36, $12.35 · dips $12.20, $12.19, $12.21", bucket: "Range"}
      - {text: "Highs $21.10, $21.24, $21.38 · dips $21.02, $21.14, $21.26", bucket: "Uptrend"}
    explanation: "Read the two rows of numbers, not the picture. Both rising, both falling, or neither."

  - type: order
    prompt: "Put the shape read in the order you actually do it."
    items:
      - "Find the last two pushes and compare them"
      - "Find the last two give-backs and compare them"
      - "Name the shape out loud"
      - "Take the side the shape allows, or none"
    explanation: "Naming it first is what stops you from finding the trade you already wanted."

  - type: chart-decision
    scenario: "The same fifteen cents, eleven minutes, bars near 40,000 shares. The candle that just closed finished in the middle of the band."
    shares: 1000
    chart:
      kind: candles
      data: [[18.26, 18.33, 18.20, 18.30], [18.30, 18.33, 18.22, 18.24], [18.24, 18.32, 18.19, 18.28], [18.28, 18.33, 18.21, 18.23], [18.23, 18.32, 18.18, 18.29], [18.29, 18.33, 18.20, 18.22], [18.22, 18.32, 18.19, 18.27], [18.27, 18.33, 18.21, 18.24], [18.24, 18.32, 18.18, 18.28], [18.28, 18.33, 18.20, 18.23], [18.23, 18.32, 18.19, 18.26]]
      volume: [46000, 38000, 44000, 36000, 42000, 40000, 44000, 38000, 42000, 36000, 40000]
      decision_index: 5
    state: ["Size: 1,000 shares"]
    best: no-trade
    outcome: "Five minutes later the stretch was still the stretch: $18.26, four cents above the decision and $40 on 1,000 shares before a single cost."
    explanation: "Neither half has moved in eleven minutes. Whichever side you pick, you are paying to find out, and the answer is usually a wobble."

  - type: recap
    title: "Level 7 in three lines"
    points:
      - {text: "Both halves rising is an uptrend: the last dip is what has to hold.", level: "7-1"}
      - {text: "Both halves falling is a downtrend, and the green candles are the tell.", level: "7-2"}
      - {text: "Neither half moving is a range, and it costs more than it pays.", level: "7-3"}
