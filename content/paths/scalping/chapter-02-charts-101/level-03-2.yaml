id: "3-2"
title: "Volume Bars"
chapter: 2
chapter_title: "Charts 101"
path: scalping
category: repetition
tags: [volume, candles, decisions]
learning_goal: "User reads candle shape and volume together and decides long, short or no trade from the pair."
purpose: "Neither signal is worth much alone; every read from here on uses both at once."
terms_introduced: []
prerequisite: "3-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Mixed practice on Levels 1–3. No new ideas."
screens:
  - type: intro
    text: "Three charts, two questions each: which way, and did anybody mean it?"

  - type: story
    character: retail-trader
    text: "Two stocks on your screen. Both are up about $0.20 on the morning. Only one of them has anybody actually trading it."

  - type: chart-decision
    scenario: "XYZ steps up candle after candle with almost no wick, and each volume bar is taller than the last. You are sizing 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[23.10, 23.16, 23.06, 23.14], [23.14, 23.20, 23.11, 23.18], [23.18, 23.30, 23.16, 23.28], [23.28, 23.36, 23.25, 23.34], [23.34, 23.44, 23.32, 23.42], [23.42, 23.50, 23.39, 23.48], [23.48, 23.60, 23.46, 23.58], [23.58, 23.68, 23.55, 23.66], [23.66, 23.74, 23.63, 23.72], [23.72, 23.78, 23.68, 23.75], [23.75, 23.80, 23.71, 23.76]]
      volume: [38000, 42000, 88000, 104000, 126000, 134000, 148000, 130000, 112000, 90000, 76000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached $23.76 — $0.28 a share above the decision, +$280 long on 1,000 shares."
    explanation: "Shape and volume agree: buyers keep taking price and more of them arrive each minute."

  - type: chart-tap
    prompt: "Tap the candle where the most shares changed hands."
    chart:
      kind: candles
      data: [[15.40, 15.48, 15.36, 15.46], [15.46, 15.52, 15.43, 15.50], [15.50, 15.56, 15.44, 15.47], [15.47, 15.60, 15.45, 15.58], [15.58, 15.72, 15.56, 15.70], [15.70, 15.76, 15.64, 15.66], [15.66, 15.71, 15.60, 15.63], [15.63, 15.68, 15.59, 15.66]]
      volume: [34000, 41000, 38000, 76000, 152000, 88000, 62000, 45000]
    target: 4
    explanation: "152,000 shares in that minute — the tallest bar, under the longest body."

  - type: chart-decision
    scenario: "XYZ has small bodies with wicks both ways for five minutes and the bars underneath keep shrinking. You are sizing 800 shares."
    shares: 800
    chart:
      kind: candles
      data: [[37.20, 37.26, 37.16, 37.22], [37.22, 37.27, 37.18, 37.20], [37.20, 37.25, 37.15, 37.23], [37.23, 37.28, 37.19, 37.21], [37.21, 37.26, 37.17, 37.24], [37.24, 37.29, 37.20, 37.22], [37.22, 37.27, 37.18, 37.25], [37.25, 37.29, 37.21, 37.23], [37.23, 37.28, 37.19, 37.21], [37.21, 37.26, 37.17, 37.24], [37.24, 37.28, 37.20, 37.22]]
      volume: [12000, 9000, 8000, 7000, 6000, 5000, 6000, 5000, 7000, 4000, 5000]
      decision_index: 5
    best: no-trade
    outcome: "Five minutes later price was $37.22 — exactly where you looked. Long or short, 800 shares would have paid costs for nothing."
    explanation: "Indecision on shrinking volume is the clearest 'not yet' a chart can give you."

  - type: numeric-input
    prompt: "You went long 1,200 shares at $9.86 and closed at $9.98. Result before costs?"
    answer: 144
    tolerance: 0.01
    unit: "$"
    working: "$0.12 a share × 1,200 shares = $144"
    explanation: "Twelve cents on 1,200 shares — small moves get their size from the share count."

  - type: match
    prompt: "Match what you see to what it means."
    pairs:
      - ["Long green body, tallest bar of the morning", "Buyers paid up, and plenty of them"]
      - ["Long upper wick on a huge bar", "A price the market refused, with a crowd watching"]
      - ["Small bodies, shrinking bars", "Nobody is interested right now"]
      - ["Long red body on rising bars", "Sellers in control and finding takers"]
    explanation: "Body and wick give the direction; the bar gives the weight behind it."

  - type: chart-decision
    scenario: "XYZ has sold off for four minutes on the heaviest bars since the open. One small green candle pauses it, then sellers take it again. You are sizing 600 shares."
    shares: 600
    chart:
      kind: candles
      data: [[44.60, 44.66, 44.52, 44.56], [44.56, 44.60, 44.40, 44.44], [44.44, 44.48, 44.28, 44.32], [44.32, 44.36, 44.18, 44.22], [44.22, 44.30, 44.20, 44.28], [44.28, 44.32, 44.16, 44.18], [44.18, 44.22, 44.04, 44.06], [44.06, 44.10, 43.92, 43.96], [43.96, 44.00, 43.84, 43.88], [43.88, 43.94, 43.80, 43.90], [43.90, 43.96, 43.84, 43.92]]
      volume: [60000, 98000, 126000, 140000, 70000, 132000, 150000, 144000, 128000, 96000, 84000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It fell to $43.92 — $0.26 a share, +$156 short on 600 shares."
    explanation: "The pause came on the thinnest bar of the move; the selling came back on the heaviest."

  - type: tf
    statement: "A thin volume bar under a green candle means buyers are waiting and will show up soon."
    answer: false
    explanation: "It means almost nobody traded that minute. Nothing in a bar says what the next one does."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "A huge volume bar"}
      - {text: "in the middle of a quiet stretch"}
      - {text: "proves the next candle will be green.", wrong: true}
    explanation: "Volume shows how much interest arrived, never in which direction it will push."

  - type: mc
    prompt: "Two stocks each rose $0.20 in ten minutes: one on 40,000 shares a minute, one on 4,000. For a scalper the difference is:"
    options:
      - {text: "The busy one is far easier to get into and out of", correct: true}
      - {text: "None — the price move is what pays you"}
      - {text: "The quiet one is cheaper, because fewer people want it"}
    explanation: "You can only trade where somebody else is trading; on 4,000 shares a minute your own order becomes the move."

  - type: theory
    title: "Two signals, one glance"
    body: "Candle for direction, bar for weight. Next you give the chart a shape: trend or sideways."
