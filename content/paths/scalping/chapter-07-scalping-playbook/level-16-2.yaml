id: "16-2"
title: "When Nothing Fits"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [discipline, near-miss, expectancy]
learning_goal: "User refuses the chart that is one feature short of a card, and can show in R what happens to a card that gets widened to include those charts."
purpose: "Playbooks are rarely abandoned. They are widened, one reasonable exception at a time, until there is nothing left to follow."
terms_introduced: []
reinforces: [6]
prerequisite: "16-1"
xp: 25
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Tharp — Trade Your Way to Financial Freedom"]
notes: "Near misses and card drift. Account named at $21,000; both decisions sized under it. The expectancy arithmetic is the Chapter 6 callback."
screens:
  - type: intro
    text: "Nobody deletes a playbook. They widen it until it stops saying no."

  - type: theory
    title: "One feature short"
    body: "The dangerous chart is not the one that looks wrong. It is the one that has four of the five things the card asks for, and the missing one is usually the volume."

  - type: swipe-deck
    prompt: "A card, or one feature short of one?"
    cards:
      - chart:
          kind: candles
          data: [[15.44, 15.56, 15.42, 15.54], [15.54, 15.60, 15.50, 15.56], [15.56, 15.60, 15.50, 15.52], [15.52, 15.58, 15.48, 15.54], [15.54, 15.60, 15.52, 15.56], [15.56, 15.72, 15.54, 15.70], [15.70, 15.82, 15.68, 15.80], [15.80, 15.90, 15.76, 15.86]]
          levels: [{price: 15.60, label: "Opening-range high"}]
          volume: [142000, 98000, 78000, 66000, 58000, 196000, 168000, 148000]
        answer: take
        note: "Four minutes coiling under the box on falling volume, then a close above it on the heaviest bar since the bell. Card B."
      - chart:
          kind: candles
          data: [[18.22, 18.34, 18.20, 18.32], [18.32, 18.38, 18.28, 18.34], [18.34, 18.38, 18.26, 18.30], [18.30, 18.36, 18.26, 18.34], [18.34, 18.38, 18.30, 18.36], [18.36, 18.44, 18.34, 18.42], [18.42, 18.44, 18.32, 18.34], [18.34, 18.38, 18.24, 18.28]]
          levels: [{price: 18.38, label: "Opening-range high"}]
          volume: [124000, 96000, 74000, 62000, 54000, 46000, 88000, 96000]
        answer: pass
