id: "19-1"
title: "Final Exam"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: final-exam
tags: [final-exam]
learning_goal: "Confirm mastery of the playbook card, the eight setups, matching conditions to cards, selection, R and costs, and the discipline of passing."
purpose: "Fourteen questions across everything the chapter built, before the chapter that puts it into a session."
terms_introduced: []
reinforces: [4, 5, 6]
prerequisite: "18-2"
xp: 80
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "14 scored questions across the eight cards, day type, selection, R and costs. Five of them reach back into Chapters 4, 5 and 6. Hearts apply. Pass mark 70 %. Account named at $25,000; all three decisions sized under it."
screens:
  - type: intro
    text: "Final exam: eight cards, one $25,000 account, fourteen questions."
    counter: 14

  - type: mc
    prompt: "A card reads: 'Opened above yesterday's close and never traded back through the first print. In on the first close back up after a quiet pullback. Stop under the pullback low.' Which card is it?"
    options:
      - {text: "Momentum continuation on a trend day"}
      - {text: "Gap-and-go continuation", correct: true}
      - {text: "Opening-range scalp"}
    explanation: "The first print of the session is the level it leans on, and that is the only card written around the opening price rather than around a candle or a box."

  - type: numeric-mc
    prompt: "You risk $220 a trade. Today: card F made 1.5R, card D lost 1R, card H made 2R, card G lost 1R. Before costs, where does the day stand?"
    options:
      - {text: "+$110"}
      - {text: "+$770"}
      - {text: "+$330", correct: true}
      - {text: "+$550"}
    working: "1.5 − 1 + 2 − 1 = 1.5R; 1.5 × $220 = $330"
    explanation: "Four cards at four different share counts, and R makes the whole morning one number."

  - type: chart-decision
    scenario: "SRN's first five minutes built a box from $16.80 to $17.10. Price coiled under the top of it on falling volume, and this minute closes at $17.20 on more than triple that. You have 1,200 shares ready."
    shares: 1200
    chart:
      kind: candles
      data: [[16.96, 17.04, 16.90, 17.00], [17.00, 17.10, 16.94, 16.98], [16.98, 17.06, 16.92, 17.04], [17.04, 17.08, 16.98, 17.02], [17.02, 17.08, 16.98, 17.06], [17.06, 17.22, 17.04, 17.20], [17.20, 17.34, 17.18, 17.32], [17.32, 17.44, 17.28, 17.40], [17.40, 17.50, 17.36, 17.46], [17.46, 17.56, 17.42, 17.52]]
      levels:
        - {price: 17.10, label: "Opening-range high"}
        - {price: 16.80, label: "Opening-range low"}
      volume: [186000, 142000, 98000, 76000, 62000, 214000, 182000, 164000, 148000, 132000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $17.52 and you took it there — $0.32 per share, +$384 long on 1,200 shares from $17.20."
    explanation: "Card B: four minutes of coiling against the line on shrinking volume, then a close beyond it on the heaviest bar of the session. Stop $17.04, back inside the box."

  - type: tf
    statement: "A candle that trades through the opening-range high and closes back inside still triggers the opening-range card."
    answer: false
    explanation: "The trigger is a close beyond the box. Through and back is the chart saying the opposite of what the card waits for."

  - type: match
    prompt: "Four cards, four first lines. Match them."
    pairs:
      - ["VWAP bounce", "The first close back above the line after a quiet drift into it"]
      - ["Momentum continuation", "The first close back in the leg's direction after a shallow pause"]
      - ["Mean reversion at a level", "A rejection close at a marked price after a run with no rest in it"]
      - ["Range rotation", "A close back inside an edge the session has already refused twice"]
    explanation: "Four closes. Two of them go with the move and two lean against something the day has already shown you."

  - type: scanner-pick
    prompt: "One name has to carry the morning. Which row can the sheet be used on at all?"
    data:
      rows:
        - {ticker: FLV, price: 22.80, change_pct: 7.1, rvol: 5.6, float: "42M", spread: 0.03, catalyst: "Upgrade"}
        - {ticker: BZT, price: 12.60, change_pct: 26.4, rvol: 11.2, float: "3M", spread: 0.18, catalyst: "Offering"}
        - {ticker: WLN, price: 58.40, change_pct: 0.9, rvol: 1.0, float: "310M", spread: 0.11, catalyst: "—"}
        - {ticker: OKM, price: 19.20, change_pct: -0.4, rvol: 0.5, float: "88M", spread: 0.04, catalyst: "—"}
    target: FLV
    explanation: "BZT moves most and its float and spread make the stop unaffordable. WLN and OKM have nobody new in them. FLV has a reason, five times its own normal volume and a three-cent spread."

  - type: chart-decision
    scenario: "HMT has climbed since the open and has not traded back to its average price. It wicks through $24.00 to $24.02 and closes at $23.76 on the heaviest bar of the morning. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[22.90, 23.06, 22.88, 23.04], [23.04, 23.22, 23.02, 23.20], [23.20, 23.38, 23.18, 23.36], [23.36, 23.54, 23.34, 23.52], [23.52, 23.72, 23.50, 23.70], [23.70, 24.02, 23.68, 23.76], [23.76, 23.94, 23.72, 23.90], [23.90, 24.08, 23.86, 24.04], [24.04, 24.24, 24.00, 24.20], [24.20, 24.38, 24.16, 24.34]]
      levels:
        - {price: 24.00, label: "Round number"}
      vwap: [22.94, 23.00, 23.08, 23.16, 23.24, 23.32, 23.38, 23.44, 23.52, 23.60]
      volume: [98000, 116000, 134000, 158000, 186000, 224000, 148000, 166000, 182000, 196000]
      decision_index: 5
    best: no-trade
    outcome: "It took the number on the second attempt and ran to $24.34 — $0.58 against a short, $580 on 1,000 shares."
    explanation: "A rejection candle is card D's trigger and this session is not card D's day. A run that has not seen its average price all morning takes the marked price on the next try."

  - type: numeric-input
    prompt: "Your account is $25,000 and you risk $200 a trade. The card's stop sits 8 cents away and the stock is $25.00. How many shares?"
    answer: 1000
    unit: "shares"
    working: "$200 ÷ $0.08 = 2,500 shares the stop allows; $25,000 ÷ $25.00 = 1,000 the account can pay for; the smaller number wins"
    explanation: "A tight stop can ask for more stock than the account owns. Two ceilings, and the lower one is the size."

  - type: chart-tap
    prompt: "Tap the candle whose low the stop goes two cents under on this continuation."
    chart:
      kind: candles
      data: [[26.20, 26.38, 26.18, 26.36], [26.36, 26.56, 26.34, 26.54], [26.54, 26.72, 26.52, 26.70], [26.70, 26.72, 26.58, 26.60], [26.60, 26.64, 26.50, 26.54], [26.54, 26.68, 26.54, 26.66], [26.66, 26.84, 26.64, 26.82], [26.82, 26.98, 26.78, 26.94]]
      volume: [92000, 128000, 154000, 58000, 44000, 148000, 132000, 118000]
    target: 4
    explanation: "The lowest candle of the pause is what the idea rests on. Two cents under $26.50 is the price that says the leg is finished."

  - type: fill-choice
    sentence: "A card that fires on a day type it was not written for is a reason to ___."
    options: ["pass", "halve the size", "widen the stop"]
    answer: "pass"
    explanation: "The day decides which cards get dealt. Neither a smaller share count nor more room turns the wrong session into the right one."

  - type: mc
    prompt: "Over 180 trades each: card X wins 55 % with an average win of 0.8R and an average loss of 1R. Card Y wins 30 % with an average win of 3R and the same average loss. Which stays on the sheet?"
    options:
      - {text: "X, because it wins 55 % of the time"}
      - {text: "Both — the samples are the same size, so both are proven"}
      - {text: "Neither, because average losses of 1R make them equivalent"}
      - {text: "Y, at +0.20R a trade against X's −0.01R", correct: true}
    explanation: "Expectancy decides, not the win rate. X wins more often and gives it all back, one small win at a time."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The day has crossed the same two prices since the bell,"}
      - {text: "so you buy the break of the ceiling", wrong: true}
      - {text: "instead of selling the close back inside it."}
    explanation: "On a session that has refused both edges, the break is the thing the range keeps rejecting. The card is written on the close that comes back."

  - type: chart-decision
    scenario: "TRC has crossed between $20.96 and $21.40 all morning. This minute pokes to $21.46 and closes back inside at $21.32. You have 900 shares ready."
    shares: 900
    chart:
      kind: candles
      data: [[21.02, 21.16, 21.00, 21.14], [21.14, 21.28, 21.12, 21.26], [21.26, 21.38, 21.24, 21.36], [21.36, 21.40, 21.28, 21.30], [21.30, 21.42, 21.28, 21.38], [21.38, 21.46, 21.30, 21.32], [21.32, 21.36, 21.20, 21.22], [21.22, 21.26, 21.10, 21.12], [21.12, 21.16, 21.00, 21.02], [21.02, 21.08, 20.96, 21.00]]
      levels:
        - {price: 21.40, label: "Range ceiling"}
        - {price: 20.96, label: "Range floor"}
      volume: [96000, 108000, 124000, 102000, 116000, 148000, 132000, 118000, 106000, 94000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It crossed to the floor and you covered at $21.02 — $0.30 per share, +$270 short on 900 shares from $21.32."
    explanation: "Card G at an edge the day has already refused three times. Stop $21.48 over the poke: sixteen cents risked for a trip across a forty-four-cent band."

  - type: tf
    statement: "The same card can be a full-size trade on one session and a half-size trade on the next, with nothing on the chart having changed."
    answer: true
    explanation: "Size follows the morning you have had and the direction the card leans, not only the candle in front of you."

  - type: summary
    total: 14

  - type: badge
    name: "Scalping Playbook — Complete"
    unlocks: "Chapter 8"
