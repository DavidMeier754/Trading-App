id: "6-1"
title: "Setup D — Mean Reversion at a Level"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [mean-reversion, levels, setup-d, playbook]
learning_goal: "User can spot a stretched run into a marked level, take the rejection candle against it with a smaller share count, and target VWAP."
purpose: "Price spends the session leaving VWAP and coming back to it; this is the card for the coming back."
terms_introduced: ["Mean reversion"]
skills: ["Mean reversion"]
reinforces: [2, 4, 6]
prerequisite: "5-1"
xp: 20
difficulty: 3
sources: ["Volman — Understanding Price Action", "Nison — Japanese Candlestick Charting Techniques"]
notes: "Fourth card, and the first counter-trend one. Smaller size is part of the card. 6-2 drills it."
screens:
  - type: intro
    text: "Card four is the awkward one: you trade against the move."

  - type: story
    text: "XYZ has run six straight green candles and is now thirty cents above VWAP, right at yesterday's high."

  - type: theory
    title: "Price stretches, then snaps back"
    body: "A fast run leaves VWAP behind. The further price gets from the line, the fewer buyers are still willing to pay up — and at some point the run runs out of them."

  - type: theory
    title: "Mean reversion"
    body: "Trading a stretched move back toward its average price is mean reversion. On the 1-minute chart the average you aim at is VWAP."

  - type: visual
    component: chart-candles
    data:
      data: [[19.10, 19.24, 19.08, 19.22], [19.22, 19.38, 19.20, 19.36], [19.36, 19.54, 19.34, 19.52], [19.52, 19.70, 19.50, 19.68], [19.68, 19.86, 19.66, 19.70], [19.70, 19.74, 19.54, 19.56], [19.56, 19.60, 19.42, 19.44], [19.44, 19.48, 19.32, 19.36]]
      vwap: [19.20, 19.22, 19.26, 19.30, 19.34, 19.36, 19.38, 19.39]
      levels:
        - {price: 19.80, label: "Yesterday's high"}
    caption: "Four candles up into the level, one long wick, and the whole run comes back."

  - type: theory
    title: "The trigger"
    body: "You wait for a rejection candle at the level: a long wick through it and a close back on your side. Without that close you are guessing where a running move stops."

  - type: chart-tap
    prompt: "The round number $88.00 is your level. Tap the rejection candle."
    chart:
      kind: candles
      data: [[87.20, 87.34, 87.18, 87.32], [87.32, 87.48, 87.30, 87.46], [87.46, 87.64, 87.44, 87.62], [87.62, 87.84, 87.60, 87.82], [87.82, 88.06, 87.80, 87.86], [87.86, 87.92, 87.70, 87.72], [87.72, 87.78, 87.56, 87.58], [87.58, 87.64, 87.44, 87.46]]
      levels:
        - {price: 88.00, label: "Round number"}
      volume: [64000, 76000, 92000, 114000, 148000, 96000, 84000, 76000]
    target: 4
    explanation: "It traded to $88.06, six cents through the number, and closed at $87.86 — everyone who bought above the level was wrong within a minute."

  - type: tf
    statement: "A rejection candle on its own, with no marked level anywhere near it, is enough for this card."
    answer: false
    explanation: "Without a level there is nothing for the run to fail against, and the wick is just one nervous minute."

  - type: theory
    title: "Stop, target, size"
    body: "Stop two cents beyond the wick. Target VWAP. And take a smaller share count than the other cards: you are trading against a move that is still moving."

  - type: numeric-input
    prompt: "You short 1,000 shares at $27.38, stop $27.58, target VWAP at $27.10. What is that target as an R-multiple?"
    answer: 1.4
    tolerance: 0.05
    working: "Risk $27.58 − $27.38 = $0.20; reward $27.38 − $27.10 = $0.28; $0.28 ÷ $0.20 = 1.4"
    explanation: "A 1.4R target — normal for this card, because the stop has to be tight to be worth taking at all."

  - type: mc
    prompt: "Why does this card use a smaller share count than the other three?"
    options:
      - {text: "Counter-trend trades always have wider spreads"}
      - {text: "It trades against a move that is still running", correct: true}
      - {text: "The target is always closer than on the other cards"}
    explanation: "Catching a turn is the hardest thing in the playbook. A smaller size is how the card survives being wrong."

  - type: checklist-reveal
    title: "The mean reversion card"
    items:
      - "Context: a fast one-way run into a level you marked, well away from VWAP"
      - "Confirmation: the heaviest volume of the whole run, arriving at the level"
      - "Entry: the rejection candle that closes back on your side of the level"
      - "Stop: two cents beyond that candle's extreme"
      - "Target: VWAP — invalidation is any candle that closes through the level"

  - type: chart-decision
    scenario: "XYZ has run five candles into yesterday's high at $27.50 on climax volume, thirty cents above VWAP. The next candle wicks to $27.56 and closes at $27.38. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.90, 27.04, 26.88, 27.02], [27.02, 27.16, 27.00, 27.14], [27.14, 27.30, 27.12, 27.28], [27.28, 27.44, 27.26, 27.42], [27.42, 27.50, 27.40, 27.48], [27.48, 27.56, 27.36, 27.38], [27.38, 27.42, 27.24, 27.26], [27.26, 27.30, 27.12, 27.14], [27.14, 27.18, 27.04, 27.06], [27.06, 27.10, 26.96, 27.00]]
      vwap: [27.02, 27.03, 27.05, 27.07, 27.09, 27.10, 27.11, 27.12, 27.12, 27.13]
      levels:
        - {price: 27.50, label: "Yesterday's high"}
      volume: [62000, 74000, 88000, 106000, 126000, 142000, 98000, 86000, 78000, 70000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It came back to VWAP at $27.10 — $0.28 per share, +$280 short on 1,000 shares from $27.38."
    explanation: "Climax volume into a level you marked, a wick through it and a close back under: the run bought its last buyer."

  - type: fill-tiles
    sentence: "Trading a stretched move back toward its average price is mean ___."
    answer: "reversion"
    explanation: "Reversion to the mean — and on a 1-minute chart the mean you aim at is VWAP."

  - type: theory
    title: "Handle with care"
    body: "This card is the one that punishes stubbornness fastest. One candle closing through the level and you are out, no matter how good the idea looked."
