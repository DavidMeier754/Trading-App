id: "17-3"
title: "Capstone — A Full Session"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: repetition
tags: [capstone, session, journal, limits]
learning_goal: "User closes a session properly: a re-entry taken for the right reason, the trade cap honoured on a winning day, the numbers written down, and the morning graded on process."
purpose: "How a session ends decides what the next one starts from, and it is the half nobody practises."
terms_introduced: []
skills: []
reinforces: [3, 5, 6]
prerequisite: "17-2"
xp: 30
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Steenbarger — The Daily Trading Coach"]
notes: "Final third of the capstone: trades 5 and 6, the cap, the journal and tomorrow's shortlist. Same $20,000 account and $200 unit as 17-1 and 17-2; running total +4R before this sub."
screens:
  - type: intro
    text: "Two trades left on the cap, and the part of the morning nobody practises."

  - type: story
    text: "The news spread is back to two cents and the $20,000 account is up 3R. Trade 5 was card A, long from $15.22 with the stop at $15.06, and it filled the stop by a penny."

  - type: chart-decision
    scenario: "That $15.06 low has held for four minutes since it stopped you, and this minute closes at $15.20 on the heaviest volume since the stop. You have 1,250 shares ready and $200 of risk."
    shares: 1250
    state: ["Day: +3R", "Limit: 3R", "Trades: 5 of 6"]
    chart:
      kind: candles
      data: [[15.22, 15.26, 15.10, 15.12], [15.12, 15.16, 15.04, 15.06], [15.06, 15.12, 15.04, 15.10], [15.10, 15.14, 15.06, 15.08], [15.08, 15.14, 15.06, 15.12], [15.12, 15.22, 15.10, 15.20], [15.20, 15.30, 15.18, 15.28], [15.28, 15.38, 15.26, 15.36], [15.36, 15.46, 15.34, 15.44], [15.44, 15.50, 15.40, 15.46]]
      levels:
        - {price: 15.06, label: "The low that stopped you"}
      volume: [142000, 168000, 96000, 78000, 84000, 196000, 172000, 158000, 146000, 132000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached the target at $15.44 — $0.24 per share, +$300 long on 1,250 shares from $15.20."
    explanation: "Card H: the level that stopped you survived four more minutes and a fresh close paid for it. Same size as the first attempt, stop $15.04 under the low."

  - type: order-build
    prompt: "The stop goes in with the fill, not a minute later. Build it for the 1,250 shares you are now long from $15.20."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [600, 1250, 2000]
      price: [15.04, 15.20, 15.44]
    answer: {side: sell, type: stop, qty: 1250, price: 15.04}
    explanation: "A sell stop for the whole position, two cents under the low the card is built on. A limit there would sit and wait while price traded through it."

  - type: journal-row
    prompt: "Write the row for the trade you just closed."
    trade: {setup: "Re-entry", entry: 15.20, stop: 15.04, exit: 15.44, shares: 1250}
    slots: [r_risked, r_made, grade]
    chips:
      r_risked: ["$150", "$200", "$300"]
      r_made: ["+1R", "+1.5R", "+2R"]
      grade: ["A", "B", "C"]
    answer: {r_risked: "$200", r_made: "+1.5R", grade: "A"}
    explanation: "Sixteen cents on 1,250 shares is $200 of risk and twenty-four cents made is one and a half times it. The grade is for how it was taken, and this one was taken to the letter."

  - type: numeric-input
    prompt: "Six round trips on 1,250 shares at $0.03 per share, against a gross of +4.5R with a $200 unit. What did the session actually clear?"
    answer: 675
    unit: "$"
    working: "4.5R × $200 = $900 gross; $0.03 × 1,250 × 6 = $225 of costs; $900 − $225 = $675"
    explanation: "A quarter of the gross went on getting in and out six times. That ratio is the argument for six trades rather than sixteen."

  - type: mc
    prompt: "Trade 6 went straight back into the name that had stopped you out four minutes earlier. What keeps it off the revenge list?"
    options:
      - {text: "The level held and a fresh close paid for it", correct: true}
      - {text: "It was smaller than the first attempt, which caps the damage"}
      - {text: "It worked, which the first attempt did not"}
    explanation: "A re-entry needs the thing the card is built on to still be there. Size that shrinks or grows after a stop is the tell that the last trade is picking this one."

  - type: chart-decision
    scenario: "Twenty minutes later XYZ runs into yesterday's high at $15.70, wicks through, and this minute closes at $15.54 on the heaviest bar of the push. You have 600 shares ready — half size for this card."
    shares: 600
    state: ["Day: +4.5R", "Limit: 3R", "Trades: 6 of 6"]
    chart:
      kind: candles
      data: [[15.46, 15.56, 15.44, 15.54], [15.54, 15.62, 15.52, 15.60], [15.60, 15.70, 15.58, 15.68], [15.68, 15.78, 15.66, 15.70], [15.70, 15.74, 15.60, 15.62], [15.62, 15.66, 15.52, 15.54], [15.54, 15.58, 15.44, 15.46], [15.46, 15.50, 15.36, 15.38], [15.38, 15.42, 15.28, 15.32], [15.32, 15.38, 15.26, 15.30]]
      levels:
        - {price: 15.70, label: "Yesterday's high"}
      volume: [92000, 108000, 126000, 158000, 142000, 124000, 112000, 104000, 96000, 88000]
      decision_index: 5
    best: no-trade
    outcome: "It slid to $15.28 — $0.26 per share, $156 on 600 shares, on a session the cap had already closed."
    explanation: "Card D, read correctly, on a morning that has run out of trades. The cap is the limit that gets tested on the good days, and this is what testing it looks like."

  - type: tf
    statement: "Being flat before the bell is a rule for the day you are up as much as for the day you are down."
    answer: true
    explanation: "A scalp carried past the close is an overnight position, and there is no card on the sheet written for one."

  - type: scanner-pick
    prompt: "Flat and finished, you run the scanner once more for tomorrow's shortlist. Which row earns a place?"
    data:
      rows:
        - {ticker: XYZ, price: 15.30, change_pct: 8.4, rvol: 6.0, float: "31M", spread: 0.02, catalyst: "Earnings"}
        - {ticker: NDL, price: 42.60, change_pct: 1.1, rvol: 1.2, float: "260M", spread: 0.07, catalyst: "—"}
        - {ticker: QOR, price: 10.40, change_pct: 18.6, rvol: 8.4, float: "4M", spread: 0.16, catalyst: "Offering"}
        - {ticker: HVM, price: 21.40, change_pct: -0.3, rvol: 0.6, float: "150M", spread: 0.05, catalyst: "—"}
    target: XYZ
    explanation: "The name you traded all morning still has the reason, the crowd and the spread. QOR has a four-million float behind a sixteen-cent spread, and the other two have nobody in them."

  - type: visual
    component: stats-card
    data:
      rows:
        - {label: "Cards taken", value: "6 of 6"}
        - {label: "Charts passed", value: "4"}
        - {label: "Session result", value: "+4.5R"}
        - {label: "Net after costs", value: "$675"}
        - {label: "Execution grades", value: "5 A, 1 B"}
    caption: "The morning in five rows. Only one of them is money, and it is not the row that says whether the session was run well."

  - type: fill-choice
    sentence: "The loss limit stops a bad day. The trade cap has to stop a ___ one."
    options: ["good", "quiet", "long"]
    answer: "good"
    explanation: "Nobody argues with a limit while they are losing. The cap gets its real test on the morning where every card seems to be working."

  - type: recap
    title: "Level 17 in three lines"
    points:
      - {text: "The plan is one line, and it is written before the first chart.", level: "17-1"}
      - {text: "A card can fire correctly and still lose — that is what the stop is for.", level: "17-2"}
      - {text: "The cap closes a winning session as firmly as the loss limit closes a losing one.", level: "17-3"}
