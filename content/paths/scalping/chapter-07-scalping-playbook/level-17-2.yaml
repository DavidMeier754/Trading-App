id: "17-2"
title: "Capstone — A Full Session"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: repetition
tags: [capstone, session, costs, decisions]
learning_goal: "User finishes a session with a losing trade taken correctly, a card passed because the day is wrong for it, and a chart passed on cost alone, and judges the session against the card's expectancy rather than the day's dollars."
purpose: "The second half of a session is where the playbook is either a rulebook or a suggestion."
terms_introduced: []
skills: []
reinforces: [3, 6]
prerequisite: "17-1"
xp: 30
difficulty: 3
sources: ["Bellafiore — The PlayBook", "Elder — Trading for a Living"]
notes: "Second third of the capstone: four charts, one of them a correct trade that loses. 17-3 closes the session."
screens:
  - type: intro
    text: "Same stock, same account, four more charts."

  - type: story
    text: "The high of day is $13.22. Price pushes through it on quiet volume, and one minute later it is back underneath."

  - type: chart-decision
    scenario: "The break of $13.22 traded fewer shares than the candles before it. This candle closes back under at $13.16 on heavier volume. You have 1,250 shares ready and $200 of risk."
    shares: 1250
    chart:
      kind: candles
      data: [[13.10, 13.16, 13.06, 13.14], [13.14, 13.20, 13.10, 13.18], [13.18, 13.28, 13.16, 13.26], [13.26, 13.30, 13.20, 13.22], [13.22, 13.26, 13.14, 13.16], [13.16, 13.34, 13.14, 13.32], [13.32, 13.44, 13.30, 13.42], [13.42, 13.52, 13.38, 13.48], [13.48, 13.56, 13.44, 13.52], [13.52, 13.60, 13.48, 13.56]]
      levels:
        - {price: 13.22, label: "High of day"}
      volume: [62000, 58000, 54000, 49000, 76000, 98000, 92000, 86000, 80000, 74000]
      decision_index: 4
    state: ["Day: +3R", "Trade 3 of 6"]
    best: short
    reasonable: [no-trade]
    outcome: "It took the level back and ran to $13.56. The stop filled at $13.32 — $0.16 per share, −$200 on 1,250 shares. Exactly 1R."
    explanation: "The card fired correctly and the trade still lost. That is what the stop is for, and why it was decided before the entry."

  - type: numeric-input
    prompt: "The morning is +$300 and +$300 gross from the two winners and −$200 from the stop-out, with $0.03 per share of costs on each of the three 1,250-share round trips. What is the net?"
    answer: 287.5
    tolerance: 0.5
    unit: "$"
    working: "$300 + $300 − $200 = $400; costs $0.03 × 1,250 × 3 = $112.50; $400 − $112.50 = $287.50"
    explanation: "Three round trips on 1,250 shares cost $112.50 — nearly a fifth of the $600 the two winners made."

  - type: spot-mistake
    prompt: "Read it through, then tap the part that is wrong."
    segments:
      - {text: "The fade stopped out for 1R, so you take the same trade again"}
      - {text: "with double the share count", wrong: true}
      - {text: "to get the loss back."}
    explanation: "Doubling after a loss lets the loss pick the size. The reset routine says the opposite: same setups, same stops, smaller shares."

  - type: chart-decision
    scenario: "XYZ pushes into a fresh leg above VWAP, pauses for two small candles on the lightest volume of the hour, then closes at $13.96. You have 1,250 shares ready."
    shares: 1250
    chart:
      kind: candles
      data: [[13.56, 13.70, 13.54, 13.68], [13.68, 13.84, 13.66, 13.82], [13.82, 13.98, 13.80, 13.96], [13.96, 13.98, 13.86, 13.88], [13.88, 13.92, 13.82, 13.86], [13.86, 13.98, 13.84, 13.96], [13.96, 14.10, 13.94, 14.08], [14.08, 14.22, 14.06, 14.20], [14.20, 14.30, 14.16, 14.26], [14.26, 14.36, 14.22, 14.32]]
      vwap: [13.40, 13.46, 13.54, 13.60, 13.64, 13.68, 13.74, 13.82, 13.88, 13.94]
      volume: [88000, 102000, 116000, 56000, 42000, 108000, 94000, 86000, 78000, 72000]
      decision_index: 5
    state: ["Day: +2R", "Trade 4 of 6"]
    best: long
    reasonable: [no-trade]
    outcome: "It carried on past $14.28. Out there: $0.32 per share, +$400 long on 1,250 shares from $13.96, with the stop at $13.80 — a 2R win."
    explanation: "Card C straight after a loss, taken at the size on the card. The previous trade had nothing to do with this one."

  - type: mc
    prompt: "The next chart offers a textbook rejection candle at a round number — on a day that has trended up since the open. What does the playbook say?"
    options:
      - {text: "Take it small — the morning can absorb a loss"}
      - {text: "Pass — the card is right and the day is wrong for it", correct: true}
      - {text: "Take it full size, since the setup is textbook"}
    explanation: "Conditions come before cards. Mean reversion belongs to range days, not to a chart that has not seen VWAP since the open."

  - type: chart-decision
    scenario: "That rejection: price wicks through $15.00 and closes back under at $14.80 on a day that has climbed all morning. You have 1,250 shares ready."
    shares: 1250
    chart:
      kind: candles
      data: [[14.32, 14.46, 14.30, 14.44], [14.44, 14.58, 14.42, 14.56], [14.56, 14.72, 14.54, 14.70], [14.70, 14.86, 14.68, 14.84], [14.84, 15.04, 14.82, 14.88], [14.88, 14.94, 14.78, 14.80], [14.80, 14.96, 14.78, 14.94], [14.94, 15.10, 14.92, 15.08], [15.08, 15.22, 15.06, 15.20], [15.20, 15.34, 15.18, 15.30]]
      levels:
        - {price: 15.00, label: "Round number"}
      volume: [92000, 104000, 118000, 132000, 146000, 86000, 98000, 112000, 124000, 136000]
      decision_index: 5
    state: ["Day: +4R", "Trades: 4 of 6"]
    best: no-trade
    outcome: "It paused for one candle, then made new highs to $15.30 — $0.50 against a short, $625 on 1,250 shares."
    explanation: "The rejection was a breather in a trend, not a turn. On this kind of day the round number gets taken on the second try."

  - type: slider
    prompt: "News hits, the spread jumps to $0.11 and your target on this card is $0.20. How much of the target does the round-trip spread take?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 55
    tolerance: 10
    explanation: "$0.11 of $0.20 — more than half the move gone before slippage or fees, at any share count."

  - type: chart-decision
    scenario: "On that news the spread is $0.11, five times its normal size. The chart still shows a clean VWAP reclaim at $15.08. You have 1,250 shares ready."
    shares: 1250
    chart:
      kind: candles
      data: [[15.30, 15.44, 15.26, 15.28], [15.28, 15.34, 15.14, 15.16], [15.16, 15.22, 15.02, 15.04], [15.04, 15.10, 14.94, 14.96], [14.96, 15.04, 14.90, 14.94], [14.94, 15.10, 14.92, 15.08], [15.08, 15.14, 14.88, 14.90], [14.90, 15.16, 14.86, 15.12], [15.12, 15.20, 14.90, 14.94], [14.94, 15.10, 14.88, 15.06]]
      vwap: [15.06, 15.04, 15.02, 15.01, 15.00, 15.00, 15.00, 15.01, 15.02, 15.02]
      volume: [98000, 112000, 136000, 154000, 142000, 168000, 182000, 174000, 166000, 158000]
      decision_index: 5
    state: ["Day: +4R", "Trades: 4 of 6"]
    best: no-trade
    outcome: "It whipsawed twenty cents each way for ten minutes. Two round trips at an eleven-cent spread would have cost $275 on 1,250 shares before a single cent of movement."
    explanation: "The shape was there and the price of admission was not payable. A spread five times its normal size is news you have not read yet."

  - type: numeric-input
    prompt: "Across 200 trades this card has averaged +0.4R. At $200 of risk and four trades a day, what is an average day worth?"
    answer: 320
    tolerance: 0.5
    unit: "$"
    working: "0.4R × $200 = $80 a trade; $80 × 4 = $320"
    explanation: "Expectancy per trade times the number of trades — that is the number a session is judged against, not today's total."

  - type: mc
    prompt: "Today finished at +4R and the expectancy above says an average day is worth 1.6R. What does that tell you?"
    options:
      - {text: "Today sits inside a normal spread of days", correct: true}
      - {text: "The card is working better than expected, so the size can go up"}
      - {text: "The expectancy is out of date and should be recalculated from today"}
    explanation: "A single session sits far inside the range a positive expectancy produces. The average only means anything over hundreds of trades."

  - type: theory
    title: "Four trades in"
    body: "Four trades, one loss, two charts passed, and the loss limit never came close. Two trades left on the cap, and the stretch of the morning that decides the session."

  - type: fill-choice
    sentence: "When the spread widens to several times its normal size, the honest answer is usually ___."
    options: ["no trade", "a smaller size", "a wider stop"]
    answer: "no trade"
    explanation: "Smaller size and wider stops both leave you paying the same spread on every share you do trade."

  - type: theory
    title: "The last stretch"
    body: "Two trades left on the cap, the spread back where it started, and a session to write down while the charts are still in front of you."
