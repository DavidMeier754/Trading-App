id: "6-2"
title: "Setup D — Mean Reversion at a Level"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: repetition
tags: [mean-reversion, levels, setup-d, practice, decisions]
icon: mean-reversion
learning_goal: "User fades stretched runs only at marked levels with climax volume and a rejection close, and passes when the level, the rejection or the room to VWAP is missing."
purpose: "Counter-trend trades punish loose rules faster than any other card, so the rules get drilled hardest here."
terms_introduced: []
skills: []
reinforces: [2, 3, 4, 6]
prerequisite: "6-1"
xp: 30
difficulty: 3
sources: ["Volman — Understanding Price Action", "Nison — Japanese Candlestick Charting Techniques"]
notes: "Five decisions: two takes, three passes — one for no level, one for a broken level, one on cost."
screens:
  - type: intro
    text: "Five stretched charts. Two of them are your card."

  - type: story
    text: "Levels marked before the open, VWAP on the chart, $30,000 in the account. Size down for these."

  - type: chart-decision
    scenario: "XYZ has run five candles into the pre-market high at $26.80 on the heaviest volume of the move, thirty-six cents above VWAP. The next candle wicks to $26.88 and closes at $26.68. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.20, 26.34, 26.18, 26.32], [26.32, 26.48, 26.30, 26.46], [26.46, 26.62, 26.44, 26.60], [26.60, 26.74, 26.58, 26.72], [26.72, 26.80, 26.70, 26.78], [26.78, 26.88, 26.66, 26.68], [26.68, 26.72, 26.54, 26.56], [26.56, 26.60, 26.42, 26.44], [26.44, 26.48, 26.32, 26.34], [26.34, 26.38, 26.28, 26.32]]
      vwap: [26.22, 26.24, 26.26, 26.28, 26.30, 26.32, 26.33, 26.34, 26.35, 26.36]
      levels:
        - {price: 26.80, label: "Pre-market high"}
      volume: [72000, 84000, 98000, 116000, 138000, 152000, 104000, 92000, 82000, 74000]
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It came back to VWAP at $26.34 — $0.34 per share, +$340 short on 1,000 shares from $26.68."
    explanation: "Marked level, climax volume, a wick through and a close back under. All four boxes on the card."

  - type: hotspot
    component: quote-panel
    prompt: "You are short and want to cover at VWAP right now. Tap the price your buy fills at."
    data: {bid: 45.32, ask: 45.35, last: 45.33}
    target: ask
    explanation: "A buyer in a hurry pays the ask. Three cents on 1,000 shares is $30 of the $340."

  - type: chart-decision
    scenario: "XYZ has run five candles and is twenty cents above VWAP. No level is marked anywhere near the price. The next candle wicks up and closes back down at $27.12. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.60, 26.72, 26.58, 26.70], [26.70, 26.84, 26.68, 26.82], [26.82, 26.96, 26.80, 26.94], [26.94, 27.08, 26.92, 27.06], [27.06, 27.18, 27.04, 27.16], [27.16, 27.26, 27.10, 27.12], [27.12, 27.28, 27.10, 27.26], [27.26, 27.42, 27.24, 27.40], [27.40, 27.54, 27.38, 27.52], [27.52, 27.66, 27.50, 27.64]]
      vwap: [26.70, 26.74, 26.80, 26.86, 26.92, 26.96, 27.00, 27.06, 27.12, 27.18]
      volume: [68000, 74000, 82000, 88000, 94000, 86000, 98000, 106000, 112000, 118000]
      decision_index: 5
    best: no-trade
    outcome: "One quiet minute, then it carried on to $27.64 — $0.52 against a short, $520 on 1,000 shares."
    explanation: "A wick with nothing behind it. There was no level for the run to fail against, so nothing failed."

  - type: numeric-mc
    prompt: "Back to the first trade: short at $26.68, stop $26.90, covered at VWAP $26.34. What did it make as an R-multiple?"
    options:
      - {text: "About 0.6R"}
      - {text: "About 2.2R"}
      - {text: "About 1.5R", correct: true}
      - {text: "About 3.4R"}
    working: "Risk $26.90 − $26.68 = $0.22; reward $26.68 − $26.34 = $0.34; $0.34 ÷ $0.22 ≈ 1.5"
    explanation: "The R-multiple turns every trade into the same unit, whatever the stock costs or how many shares you held."

  - type: chart-decision
    scenario: "XYZ rejected the round number $27.00 once, then the next candle closed at $27.04, through it. Now a third candle closes at $27.16 on growing volume. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.60, 26.74, 26.58, 26.72], [26.72, 26.86, 26.70, 26.84], [26.84, 26.98, 26.82, 26.96], [26.96, 27.06, 26.90, 26.94], [26.94, 27.08, 26.92, 27.04], [27.04, 27.18, 27.02, 27.16], [27.16, 27.30, 27.14, 27.28], [27.28, 27.42, 27.26, 27.40], [27.40, 27.52, 27.36, 27.48], [27.48, 27.60, 27.44, 27.56]]
      vwap: [26.66, 26.70, 26.76, 26.80, 26.84, 26.90, 26.96, 27.02, 27.08, 27.14]
      volume: [76000, 84000, 92000, 106000, 124000, 138000, 126000, 114000, 106000, 98000]
      decision_index: 5
    best: no-trade
    outcome: "It ran to $27.56 — $0.40 against a short from $27.16, $400 on 1,000 shares."
    explanation: "The first rejection failed and a candle closed through the number. The level is now a floor, and your card has already told you to leave."

  - type: fill-choice
    sentence: "The invalidation on this card is a candle that ___ through the level."
    options: ["closes", "wicks", "opens"]
    answer: "closes"
    explanation: "Wicks through levels all day long. A close through is the market agreeing on the new price."

  - type: chart-decision
    scenario: "XYZ has fallen five candles into yesterday's low at $23.80, forty cents below VWAP, on the biggest volume of the move. The next candle wicks to $23.74 and closes at $23.96. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[24.40, 24.44, 24.28, 24.30], [24.30, 24.34, 24.16, 24.18], [24.18, 24.22, 24.02, 24.04], [24.04, 24.08, 23.90, 23.92], [23.92, 23.96, 23.82, 23.84], [23.84, 23.98, 23.74, 23.96], [23.96, 24.10, 23.94, 24.08], [24.08, 24.20, 24.06, 24.18], [24.18, 24.30, 24.14, 24.26], [24.26, 24.36, 24.22, 24.32]]
      vwap: [24.34, 24.32, 24.30, 24.28, 24.26, 24.24, 24.24, 24.25, 24.26, 24.27]
      volume: [74000, 86000, 102000, 124000, 146000, 162000, 114000, 102000, 94000, 86000]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It ran back to VWAP at $24.24 — $0.28 per share, +$280 long on 1,000 shares from $23.96."
    explanation: "The card works from below too: a level, climax volume, a wick under it and a close back above."

  - type: tf
    statement: "The heaviest volume of the whole run arriving right at the level is a warning for the run, not a sign of strength."
    answer: true
    explanation: "That is the last of the buyers being used up, and it is the reason this card exists at all."

  - type: chart-decision
    scenario: "XYZ rejects the pre-market high at $27.50 with a clean wick and a close at $27.38. But VWAP is only twelve cents away at $27.26, and the quote shows a nine-cent spread. You have 1,000 shares ready."
    shares: 1000
    chart:
      kind: candles
      data: [[26.90, 27.06, 26.88, 27.04], [27.04, 27.20, 27.02, 27.18], [27.18, 27.34, 27.16, 27.32], [27.32, 27.46, 27.30, 27.44], [27.44, 27.50, 27.40, 27.48], [27.48, 27.58, 27.36, 27.38], [27.38, 27.42, 27.28, 27.30], [27.30, 27.36, 27.24, 27.32], [27.32, 27.38, 27.26, 27.28], [27.28, 27.34, 27.22, 27.26]]
      vwap: [27.14, 27.16, 27.19, 27.22, 27.24, 27.26, 27.26, 27.26, 27.26, 27.26]
      levels:
        - {price: 27.50, label: "Pre-market high"}
      volume: [64000, 76000, 92000, 110000, 132000, 144000, 96000, 82000, 74000, 68000]
      decision_index: 5
    best: no-trade
    outcome: "It drifted to VWAP at $27.26 — $0.12 per share, $120 on 1,000 shares, against $90 of spread on the round trip."
    explanation: "The read was right and there was nothing left in it. A twelve-cent target behind a nine-cent spread is not a trade at any size."

  - type: mc
    prompt: "Which of these is card D?"
    options:
      - {text: "Six candles up into yesterday's high on shrinking volume, still climbing with no wick"}
      - {text: "A wick and a close back down in the middle of the day's range on the heaviest bar of the move"}
      - {text: "Six candles up into yesterday's high on climax volume, then a wick through and a close back under", correct: true}
    explanation: "Level, climax volume, rejection close. Take any one away and it is a different chart."

  - type: theory
    title: "The hardest card"
    body: "Four down. The last one is the other side of a failure you already know: the breakout that does not hold."
