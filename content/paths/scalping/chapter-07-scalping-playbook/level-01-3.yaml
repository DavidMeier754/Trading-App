id: "1-3"
title: "What a Playbook Is"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [playbook, plan, journal]
learning_goal: "User turns a vague setup description into a card whose five fields are instructions, sizes it from the stop, and writes the first card of their own playbook."
purpose: "A card is only worth having if two people could read it and take the same trade in the same minute."
terms_introduced: []
reinforces: [6]
prerequisite: "1-2"
xp: 25
difficulty: 2
sources: ["Bellafiore — The PlayBook", "Elder — Trading for a Living"]
notes: "Ends on the plan-card that becomes the user's plan-sheet. The journal-row and the sizing question are Chapter 6 in playbook clothes."
screens:
  - type: intro
    text: "Time to write one. The first card in a playbook that belongs to you."

  - type: theory
    title: "Descriptions and instructions"
    body: "A description tells you what to look for. An instruction tells you what to do. 'Buy strength at support' is the first. 'Buy the first close back above the level' is the second."

  - type: walkthrough
    component: plan-sheet
    data:
      fields:
        - {key: name, label: "Card name", value: "Level bounce"}
        - {key: context, label: "Context", value: "5-minute climbing, a marked level just under price, first test of it today"}
        - {key: entry, label: "Entry", value: "The first minute that closes back up off the level"}
        - {key: stop, label: "Stop", value: "Two cents under that minute's low"}
        - {key: target, label: "Target", value: "The high the last push made"}
        - {key: invalidation, label: "Invalidation", value: "Volume rising while price sits on the level"}
    steps:
      - {spotlight: context, text: "Context is a filter, not a hope. If it is not true, nothing below it applies."}
      - {spotlight: entry, text: "One event, named. Two traders reading this line enter on the same minute."}
      - {spotlight: invalidation, text: "The field most playbooks skip, and the one that keeps losses under a full R."}

  - type: mc
    prompt: "Which entry line could two traders read and act on in the same minute?"
    options:
      - {text: "Buy when the buyers have clearly taken over again"}
      - {text: "Buy the first close back above the level", correct: true}
      - {text: "Buy strength at support"}
    explanation: "One names an event that either happened or did not. The other two name a feeling about the chart."

  - type: chart-decision
    scenario: "The card above is open beside you. XYZ has climbed all morning and is testing $21.30 for the first time today. This minute turns up off it and closes at $21.46 on the heaviest bar since the test began. You have 1,000 shares ready and a $30,000 account."
    shares: 1000
    chart:
      kind: candles
      data: [[21.52, 21.58, 21.44, 21.48], [21.48, 21.52, 21.40, 21.42], [21.42, 21.46, 21.36, 21.38], [21.38, 21.42, 21.32, 21.34], [21.34, 21.40, 21.30, 21.36], [21.36, 21.48, 21.34, 21.46], [21.46, 21.56, 21.44, 21.54], [21.54, 21.62, 21.50, 21.60], [21.60, 21.70, 21.56, 21.66], [21.66, 21.78, 21.62, 21.74]]
      volume: [62000, 54000, 48000, 43000, 39000, 96000, 84000, 76000, 70000, 64000]
      levels:
        - {price: 21.30, label: "First test today"}
        - {price: 21.74, label: "High of the last push"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached the target on the last bar: $0.28 per share, +$280 long on 1,000 shares from $21.46."
    explanation: "Context, entry, stop and target were all written before the minute opened, so nothing had to be decided while it was open."

  - type: numeric-mc
    prompt: "Your risk budget is $140 a trade and that card's stop sits $0.14 under the entry. What share count does the budget allow?"
    options:
      - {text: "2,000 shares"}
      - {text: "1,400 shares"}
      - {text: "1,000 shares", correct: true}
      - {text: "700 shares"}
    working: "$140 ÷ $0.14 per share = 1,000 shares"
    explanation: "Divide the budget by the stop distance. The card fixes the stop, so the card fixes the size."

  - type: order-build
    prompt: "The minute closed at $21.46 and the ask is $21.47. Build the entry the card asks for, capped three cents over the ask."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [500, 1000, 1500]
      price: [21.44, 21.47, 21.50]
    answer: {side: buy, type: limit, qty: 1000, price: 21.50}
    explanation: "A marketable limit takes the offer now, and the cap decides how far the fill is allowed to run away from you."

  - type: journal-row
    prompt: "The trade is finished. Fill its row."
    trade: {setup: "Level bounce", entry: 21.46, stop: 21.32, exit: 21.74, shares: 1000}
    slots: [r_risked, r_made, grade]
    chips:
      r_risked: ["$120", "$140", "$280"]
      r_made: ["+1R", "+2R", "+3R"]
      grade: ["A", "B", "C"]
    answer: {r_risked: "$140", r_made: "+2R", grade: "A"}
    explanation: "Fourteen cents risked on 1,000 shares, twenty-eight made — two units, and an A because the trade was the card and nothing else."

  - type: tf
    statement: "A trade that followed the card exactly and still lost money grades an A."
    answer: true
    explanation: "The grade is for the execution. What one trade pays is mostly the market's business."

  - type: match
    prompt: "Match each half-written card line to the fix it needs."
    pairs:
      - ["Entry: buy strength", "Name the minute that puts you in"]
      - ["Stop: a sensible distance", "Name a price on the chart"]
      - ["Target: let it run", "Name where you take the money"]
      - ["Invalidation: if it looks weak", "Name a condition you can see"]
    explanation: "Each fix moves one decision out of the live market and into the quiet hour before it."

  - type: fill-tiles
    sentence: "A card line two traders would act on in the same minute is an ___."
    answer: "instruction"
    explanation: "Descriptions are for reading about trading; instructions are for doing it."

  - type: plan-card
    title: "Your first card"
    intro: "Write the setup you already half-recognise. You will rewrite it as the chapter goes on."
    fields:
      - {key: card_name, label: "Card name", kind: text}
      - {key: card_context, label: "Context — what the chart must look like", kind: text}
      - {key: card_entry, label: "Entry — the exact event", kind: text}
      - {key: card_stop, label: "Stop — the price", kind: text}
      - {key: card_target, label: "Target — where you take it", kind: text}
      - {key: card_invalidation, label: "Invalidation — the condition", kind: text}
    note: "This sheet stays in your plan and fills up with every card in this chapter."
