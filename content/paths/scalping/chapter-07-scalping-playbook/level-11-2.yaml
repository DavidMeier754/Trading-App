id: "11-2"
title: "Setup G — Range Rotation"
chapter: 7
chapter_title: "Scalping Playbook"
path: scalping
category: new-theory
tags: [range, day-type, costs, setup-g]
icon: range-rotation
learning_goal: "User refuses this card on a session that keeps stepping, reads an edge that is about to break from the volume and the lows pressing it, and checks the band is wide enough to pay for a round trip."
purpose: "Fading the edge of a trend day is the single most expensive habit a range trader picks up, and it looks exactly like the card until the close."
terms_introduced: []
skills: ["When not to rotate"]
reinforces: [5]
prerequisite: "11-1"
xp: 25
difficulty: 3
sources: ["Raschke & Connors — Street Smarts", "Carter — Mastering the Trade"]
notes: "The veto and the cost floor. Account named at $24,000 and both decisions sized under it."
screens:
  - type: intro
    text: "The card is easy. Knowing which days it is allowed on is the lesson."

  - type: theory
    title: "The day gives permission"
    body: "This is the only card in the book whose first condition is not on the 1-minute chart. The slower chart has to be crossing rather than stepping, or the edge you fade is the one that goes."

  - type: compare
    prompt: "Two sessions on the 5-minute chart. On which one may card G be taken?"
    charts:
      - kind: candles
        data: [[18.20, 18.48, 18.16, 18.42], [18.42, 18.52, 18.24, 18.28], [18.28, 18.36, 18.10, 18.14], [18.14, 18.22, 18.08, 18.20], [18.20, 18.50, 18.16, 18.38], [18.38, 18.52, 18.30, 18.34], [18.34, 18.40, 18.12, 18.16], [18.16, 18.30, 18.10, 18.24]]
        label: "A"
      - kind: candles
        data: [[21.10, 21.34, 21.06, 21.30], [21.30, 21.52, 21.26, 21.48], [21.48, 21.56, 21.38, 21.44], [21.44, 21.72, 21.40, 21.68], [21.68, 21.86, 21.62, 21.82], [21.82, 21.90, 21.74, 21.80], [21.80, 22.04, 21.76, 22.00], [22.00, 22.20, 21.94, 22.16]]
        label: "B"
    answer: "A"
    explanation: "A has been to the same ceiling twice and the same floor twice. B stops every give-back higher than the last one, and an edge on that chart is a pause on the way up."

  - type: chart-decision
    scenario: "TKR has made a new high of day every twenty minutes since the bell. On the 1-minute it is pressing the top of the last half hour at $19.46 for the third time in ten minutes. This minute closes at $19.44. You have 1,100 shares ready and a $24,000 account."
    shares: 1100
    chart:
      kind: candles
      data: [[19.28, 19.38, 19.26, 19.36], [19.36, 19.46, 19.32, 19.42], [19.42, 19.44, 19.34, 19.38], [19.38, 19.46, 19.36, 19.44], [19.44, 19.46, 19.38, 19.40], [19.40, 19.48, 19.38, 19.44], [19.44, 19.62, 19.42, 19.60], [19.60, 19.76, 19.56, 19.72], [19.72, 19.88, 19.68, 19.84], [19.84, 19.96, 19.80, 19.92]]
      volume: [86000, 124000, 78000, 96000, 84000, 168000, 212000, 196000, 178000, 164000]
      levels:
        - {price: 19.46, label: "Top of the last half hour"}
      decision_index: 5
    best: no-trade
    reasonable: [long]
    outcome: "It closed above the band on the next minute and ran to $19.92. A 1,100-share short from $19.44 was $528 down."
    explanation: "Three attempts from three higher lows on a session making new highs. Waiting for the close beyond the band is card C; fading it is nothing at all."

  - type: theory
    title: "The edge about to break"
    body: "Two things give it away before the close does: each push into the edge starts from a higher low than the last, and the volume arriving at the edge builds instead of fading."

  - type: sort
    prompt: "Rotation, or a breakout building?"
    buckets: ["Rotation", "Breakout building"]
    items:
      - {text: "The edge has refused twice and each push into it is smaller", bucket: "Rotation"}
      - {text: "Each push into the edge starts from a higher low than the last", bucket: "Breakout building"}
      - {text: "Volume into the edge is the lightest of the hour", bucket: "Rotation"}
      - {text: "Volume into the edge builds on every attempt", bucket: "Breakout building"}
    explanation: "Price at the edge tells you nothing on its own. What price had to do to get there tells you most of it."

  - type: chart-decision
    scenario: "BRC has crossed the same two prices four times this session: $16.84 at the floor, $17.18 at the ceiling, VWAP flat between them. This minute wicks to $16.82 and closes back inside at $16.92. You have 1,300 shares ready."
    shares: 1300
    chart:
      kind: candles
      data: [[17.10, 17.16, 17.02, 17.06], [17.06, 17.10, 16.96, 16.98], [16.98, 17.02, 16.88, 16.90], [16.90, 16.94, 16.84, 16.88], [16.88, 16.92, 16.84, 16.86], [16.86, 16.94, 16.82, 16.92], [16.92, 17.00, 16.90, 16.98], [16.98, 17.06, 16.94, 17.04], [17.04, 17.12, 17.00, 17.10], [17.10, 17.18, 17.06, 17.13], [17.13, 17.16, 17.04, 17.08]]
      vwap: [17.02, 17.02, 17.01, 17.01, 17.00, 17.00, 17.00, 17.00, 17.01, 17.01, 17.01]
      volume: [78000, 68000, 62000, 54000, 46000, 112000, 96000, 88000, 82000, 104000, 74000]
      levels:
        - {price: 16.84, label: "Range floor"}
        - {price: 17.18, label: "Range ceiling"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It rotated back to the ceiling and you let it go at $17.13 — $0.21 per share, +$273 long on 1,300 shares from $16.92."
    explanation: "The push under the floor arrived on the lightest volume of the hour and closed back inside on the heaviest. Stop $16.80, two cents under the wick."

  - type: numeric-input
    prompt: "That trade took 21 cents out of a 34-cent band, on 1,300 shares. Spread and fees take $0.03 per share on the round trip. What is left?"
    answer: 234
    tolerance: 0.5
    unit: "$"
    working: "$0.21 × 1,300 = $273; $0.03 × 1,300 = $39; $273 − $39 = $234"
    explanation: "Thirty-nine dollars of a two-hundred-and-seventy-three-dollar move. A narrow band pays the same costs as a wide one."

  - type: fill-choice
    sentence: "This card is on the table only while the slower chart is ___ rather than stepping."
    options: ["crossing", "gapping", "climbing"]
    answer: "crossing"
    explanation: "Crossing means the same two prices keep arriving. Stepping means every give-back finishes above the one before it, and that is a different book."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The session has crossed the same two prices three times,"}
      - {text: "so you short the ceiling on the first close back inside"}
      - {text: "and hold it for a new low of day.", wrong: true}
    explanation: "The target is the middle, and the far edge at most. A session that keeps coming back to its floor has not made a new low since that floor was set."

  - type: checklist-reveal
    title: "Before a rotation"
    items:
      - "Has this session crossed the same two prices more than twice?"
      - "Has this edge already refused price at least once today?"
      - "Is the volume arriving at the edge fading rather than building?"
      - "Is the middle far enough away to pay for the round trip?"
