id: "2-2"
title: "Hotkeys and Muscle Memory"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: new-theory
tags: [hotkeys, sequence, execution]
learning_goal: "User runs one fixed key sequence — size, entry, stop — and knows what each of the other two keys is for."
purpose: "Five keys pressed in the same order every time is the difference between muscle memory and a decision made at the worst moment."
terms_introduced: []
skills: ["One key sequence"]
reinforces: [3]
prerequisite: "2-1"
xp: 25
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Bellafiore — The PlayBook"]
notes: "Chapter 3's account ceiling re-tested as a sticky size key. Account named at $20,000; the worked position is 1,400 shares at $13.16 = $18,424. The $34,720 order on screen 9 is deliberately an order that should never be sendable."
screens:
  - type: intro
    text: "Five keys. Not fifteen, and not one of them chosen on the morning."

  - type: theory
    title: "Why the set stays small"
    body: "Every extra key is another thing to get wrong at the worst moment. Five cover entry, exit, size, emergency and cleanup, and nothing else is worth the risk of a wrong press."

  - type: walkthrough
    component: hotkey-pad
    data:
      keys:
        - {label: "Size", action: "Set the share count"}
        - {label: "Buy", action: "Buy at the ask"}
        - {label: "Stop", action: "Send the protective stop"}
        - {label: "Flatten", action: "Close everything"}
      sequence: ["Size", "Buy", "Stop"]
    steps:
      - {spotlight: "Size", text: "Pressed first, every time. The number came off the page you wrote before the bell."}
      - {spotlight: "Buy", text: "Sends your size at the ask. Nothing about the trade is decided here; it was decided on the chart."}
      - {spotlight: "Stop", text: "Sends the protective order at the price you already chose. This is the press people skip."}
      - {spotlight: "Flatten", text: "Not part of the sequence. It is for the mornings where the sequence has already gone wrong."}

  - type: match
    prompt: "Five keys, five jobs. Match them."
    pairs:
      - ["Size", "Sets the share count for the next order"]
      - ["Buy", "Sends your size at the ask"]
      - ["Stop", "Puts the protective order into the market"]
      - ["Flatten", "Closes every open position at once"]
      - ["Cancel", "Removes working orders and leaves the shares"]
    explanation: "Two of them touch shares, two touch orders, and one decides how big all four of the others are."

  - type: theory
    title: "One sequence, always the same"
    body: "Size, entry, stop. In that order it is three presses. In any other order there is a window where you are holding stock with nothing underneath it."

  - type: branch
    scenario: "You are long 1,400 shares of XYZ from $13.16 with $20,000 in the account. Size and Buy are done. The stop is not in yet."
    shares: 1400
    chart:
      kind: candles
      data: [[13.10, 13.18, 13.06, 13.16], [13.16, 13.22, 13.12, 13.18], [13.18, 13.24, 13.14, 13.20], [13.20, 13.26, 13.16, 13.22], [13.22, 13.24, 13.12, 13.14], [13.14, 13.18, 13.02, 13.06], [13.06, 13.14, 13.02, 13.12], [13.12, 13.20, 13.08, 13.18], [13.18, 13.26, 13.14, 13.24], [13.24, 13.30, 13.20, 13.26]]
      volume: [86000, 74000, 68000, 62000, 96000, 142000, 88000, 76000, 70000, 64000]
      decision_index: 5
    steps:
      - prompt: "Price ticks down two cents while your hand is still on the keyboard. What now?"
        options:
          - {text: "Send the stop, then look at the chart", correct: true, next: 1}
          - {text: "Watch one more candle before committing to a stop", next: 1}
        explanation: "The stop is not a reaction to the next candle. It was chosen before the entry, and it goes in regardless of what the next candle does."
      - prompt: "The stop is in at $13.02. Price slides to $13.06 and your hand drifts to Flatten. What now?"
        options:
          - {text: "Leave it — the stop is the plan and it is already working", correct: true}
          - {text: "Flatten now and save the last four cents"}
        explanation: "Flatten is for emergencies, not for nerves. A stop you keep stepping in front of is a stop you never really had."

  - type: mc
    prompt: "Why does the size key come first in the sequence?"
    options:
      - {text: "The platform rejects an entry with no size set"}
      - {text: "Otherwise the entry uses the size left over", correct: true}
      - {text: "The size key also clears any working orders"}
    explanation: "The size key is sticky. Whatever it was last set to is what the next entry sends, and on a bad morning that is a number from a different name."

  - type: hotspot
    component: hotkey-pad
    prompt: "You are flat, and a limit entry from ten minutes ago is still working thirty cents away. Tap the key."
    data:
      keys:
        - {label: "Size", action: "Set the share count"}
        - {label: "Buy", action: "Buy at the ask"}
        - {label: "Stop", action: "Send the protective stop"}
        - {label: "Flatten", action: "Close everything"}
        - {label: "Cancel", action: "Cancel every working order"}
    target: "Cancel"
    explanation: "Cancel. Flatten would do nothing here — there are no shares — and the stale order is the one that fills while you are looking elsewhere."

  - type: numeric-input
    prompt: "The size key is still set to 1,400 from the last name. You press Buy on a $24.80 stock with $20,000 in the account. What is that order worth?"
    answer: 34720
    tolerance: 1
    unit: "$"
    working: "1,400 × $24.80 = $34,720"
    explanation: "Chapter 3's account ceiling arriving as a keystroke: $34,720 of stock on a $20,000 account is an order that should never have been sendable."

  - type: tf
    statement: "A key sequence is only worth building if it is the same every single time."
    answer: true
    explanation: "Muscle memory is repetition of one pattern. Two patterns is not memory at all; it is a choice, made at the moment you have least time for one."

  - type: fill-tiles
    sentence: "Cancel removes working orders; flatten removes the ___."
    answer: "position"
    explanation: "One acts on what you asked for, the other on what you own."

  - type: checklist-reveal
    title: "Before the bell, every morning"
    items:
      - "Size key set to today's share count"
      - "Buy and sell keys tested on the simulator"
      - "Stop key sending to the right side of the entry"
      - "Flatten and cancel where your hand already goes"

  - type: story
    text: "Size, Buy, Stop, and only then you look up at the chart. For a fortnight it feels slow. After that you stop noticing that you did it."
