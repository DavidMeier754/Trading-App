id: "7-2"
title: "Mid-Session"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: new-theory
tags: [midday, sizing, costs, discipline]
learning_goal: "User answers the lull with one of three decisions — raise the bar, cut the size, or close the screen — and prices the smaller move before taking it."
purpose: "Drifting through the dead stretch is not one of the answers, and it is the one most traders pick."
terms_introduced: []
skills: ["Three answers to the lull"]
reinforces: [4, 6]
prerequisite: "7-1"
xp: 25
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Steenbarger — The Daily Trading Coach"]
notes: "Chapter 6's cut-size-keep-setups rule and its reject-a-trade-whose-target-is-under-its-stop rule re-tested in the lull; Chapter 4's confluence read supplies the bar to clear. Account named at $16,000; the worked position is 800 shares at $17.24 = $13,792."
screens:
  - type: intro
    text: "Three honest answers to a dead stretch, and one habit that is none of them."

  - type: theory
    title: "Raise the bar, cut the size, or stop"
    body: "Take only the setup that has everything. Trade the smaller move at a smaller size. Or close the screen. All three are decisions; sitting there clicking is not one."

  - type: carousel
    cards:
      - {label: "Raise the bar", text: "Only a setup with every reason present gets a ticket. Two of three is a pass through the middle of the session.", icon: chart-empty}
      - {label: "Cut the size", text: "The same setups and the same stops on fewer shares, so a thinner move still fits the risk you planned.", icon: retail-trader}
      - {label: "Close the screen", text: "Nothing on your page is live and nothing on the board is yours. The stretch is finished before it starts.", icon: cost-spread}

  - type: numeric-input
    prompt: "A lull setup offers an eight-cent stop and a twelve-cent target. The quote is six cents. What is left of the target after the round trip?"
    answer: 0.06
    tolerance: 0.001
    unit: "$"
    working: "$0.12 − $0.06 = $0.06 a share left"
    explanation: "Six cents of reward against eight cents of risk. Chapter 6 threw that trade out before you ever reached the middle of the session."

  - type: mc
    prompt: "What does raising the bar actually change about the setups you take?"
    options:
      - {text: "How many reasons must line up before you send", correct: true}
      - {text: "The stop distance you allow on each of them"}
      - {text: "Which of your playbook cards are permitted at all in the stretch"}
    explanation: "Chapter 4's four-part read does not change; the pass mark does. Two out of four is a trade at the open and a pass in the dead stretch."

  - type: chart-decision
    scenario: "The middle of the session, and BRIM has not been quiet. It has held under its own average price all stretch, the quote is two cents, and the minute that just closed finished at $17.24 through the $17.30 low it set an hour ago, on the heaviest bar since the open. Your account is $16,000 and you have cut your size to 800 shares."
    shares: 800
    chart:
      kind: candles
      data: [[17.44, 17.48, 17.30, 17.32], [17.32, 17.42, 17.30, 17.40], [17.40, 17.44, 17.34, 17.36], [17.36, 17.40, 17.32, 17.34], [17.34, 17.38, 17.32, 17.34], [17.34, 17.36, 17.22, 17.24], [17.24, 17.26, 17.14, 17.16], [17.16, 17.20, 17.08, 17.10], [17.10, 17.12, 17.02, 17.04], [17.04, 17.08, 16.96, 16.98]]
      volume: [64000, 58000, 72000, 61000, 66000, 184000, 152000, 128000, 106000, 94000]
      vwap: [17.52, 17.50, 17.47, 17.45, 17.43, 17.41, 17.38, 17.35, 17.32, 17.29]
      levels:
        - {price: 17.30, label: "Low of the morning"}
      decision_index: 5
    state: ["Day: +1R", "Trades: 2 of 6"]
    best: short
    reasonable: [no-trade]
    outcome: "Four minutes on it was $16.98 — $0.26 a share below the decision, +$208 short on 800 shares."
    explanation: "A thin stretch is a reason to demand more, not a reason to refuse everything. Under the line all stretch, and the one heavy minute of it took the level; the size is the part that got smaller."

  - type: tf
    statement: "Cutting your size through the middle of the session leaves the setups and the stops exactly where they were."
    answer: true
    explanation: "Size is the one control you can change without changing the method. The moment the cards or the stops move too, you are not cutting risk — you are lowering the bar."

  - type: branch
    scenario: "You are short 800 BRIM from $17.24 with the stop at $17.34, on the size you cut for the stretch."
    shares: 800
    chart:
      kind: candles
      data: [[17.30, 17.32, 17.22, 17.24], [17.24, 17.26, 17.16, 17.18], [17.18, 17.24, 17.16, 17.22], [17.22, 17.26, 17.20, 17.22], [17.22, 17.24, 17.16, 17.18], [17.18, 17.20, 17.08, 17.10], [17.10, 17.14, 17.06, 17.08], [17.08, 17.10, 17.00, 17.02]]
      decision_index: 3
    steps:
      - prompt: "Two minutes later it is back two cents under your entry and the bars have gone small again. What now?"
        options:
          - {text: "Leave the stop where it is and let the trade have its room", correct: true, next: 1}
          - {text: "Pull the stop down over the last minute to protect the entry", next: 1}
        explanation: "A stop tightened into small bars is a stop that gets hit by the noise the lull is made of. Nothing about the idea has changed."
      - prompt: "It presses lower and your ten-cent target is reached. What does the smaller size change about the exit?"
        options:
          - {text: "Nothing — the exit is a price, and $80 is what 800 shares of it is worth", correct: true}
          - {text: "Hold for more, because the smaller size makes the risk of holding smaller"}
        explanation: "Ten cents on 800 shares is $80 instead of the $110 the same ten cents pays on 1,100. That is the trade you chose when you cut the size, and it is not renegotiated at the target."

  - type: order-build
    prompt: "A second lull setup on BRIM an hour later: short 800 shares, nothing worse than three cents under the bid of $17.02."
    ticker: BRIM
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [400, 800, 1600]
      price: [16.99, 17.02, 17.05]
    answer: {side: sell, type: limit, qty: 800, price: 16.99}
    explanation: "A sell limit three cents under the bid crosses the quote and still refuses anything below $16.99. Thin books are exactly where that floor earns its keep."

  - type: spot-mistake
    prompt: "One piece of this is false. Tap it."
    segments:
      - {text: "You cut the size in half for the thin stretch"}
      - {text: "and drop the target to the eight cents the chart is offering,", wrong: true}
      - {text: "but you leave the stop exactly where the chart puts it."}
    explanation: "Half the size on the same setup is risk control. An eight-cent target against a ten-cent stop is a trade Chapter 6 rejects at any size."

  - type: checklist-reveal
    title: "Before a ticket in the dead stretch"
    items:
      - "Every reason the card asks for is at this one price"
      - "The move on offer is worth more than twice the quote"
      - "The stop is where the chart puts it, not where the size wants it"
      - "The trade still fits under the day's caps"

  - type: example
    body: "Two trades before the first hour was out, one in the whole stretch after it, and nothing at all on three of the four names. That is a normal middle of a session, not a wasted one."
