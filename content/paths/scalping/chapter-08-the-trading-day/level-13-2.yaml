id: "13-2"
title: "Chapters 6 & 7 Callback"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: repetition
tags: [sizing, playbook, risk, selection]
learning_goal: "User takes the right card at the size the account and the stop allow, and can say which of the two ceilings cut it."
purpose: "Most of the damage a good setup does is done by the share count somebody carried over from another name."
terms_introduced: []
reinforces: [6, 7]
prerequisite: "13-1"
xp: 30
difficulty: 3
sources: ["Tharp — Trade Your Way to Financial Freedom", "Bellafiore — One Good Trade"]
notes: "Closes Level 13 with a recap. Chapter 6's two ceilings and Chapter 7's cards re-tested against each other. Account named at $20,000, default page size 1,200 shares, risk budget $200. The worked positions are 800 shares at $24.50 = $19,600 and 800 at $24.55 = $19,640."
screens:
  - type: intro
    text: "The card is the one you have drilled forty times. The share size on the page belongs to a different stock."

  - type: story
    character: retail-trader
    text: "A $20,000 account, 1,200 shares written on the page this morning, and a budget of $200 a trade. Two names are live and only one of them is cheap."

  - type: scanner-pick
    prompt: "Tap the row where your page's 1,200 shares still fit a $20,000 account."
    data:
      rows:
        - {ticker: ORWELL, price: 24.50, change_pct: 6.8, rvol: 5.4, float: "44M", spread: 0.03, catalyst: "Earnings"}
        - {ticker: BRAE, price: 15.20, change_pct: 5.2, rvol: 4.9, float: "60M", spread: 0.02, catalyst: "Contract"}
        - {ticker: QUARN, price: 28.60, change_pct: 7.4, rvol: 6.2, float: "38M", spread: 0.04, catalyst: "Guidance"}
        - {ticker: TILLY, price: 22.40, change_pct: 4.6, rvol: 4.1, float: "90M", spread: 0.03, catalyst: "Upgrade"}
    target: BRAE
    explanation: "1,200 of BRAE is $18,240. The same 1,200 shares of ORWELL is $29,400, of TILLY $26,880 and of QUARN $34,320, and the account can pay for none of them."

  - type: numeric-input
    prompt: "The card fires on ORWELL at $24.50 instead. How many shares can a $20,000 account pay for?"
    answer: 816
    tolerance: 5
    unit: "shares"
    working: "$20,000 ÷ $24.50 = 816 shares"
    explanation: "Eight hundred and change, against the 1,200 on the page. The card said nothing about share counts; the account did."

  - type: chart-decision
    scenario: "ORWELL has held above its own average price all morning, given back fourteen cents over three lighter minutes, and the minute that just closed finished at $24.50 back above the line. The stop belongs under the pullback at $24.36. You have rounded the size down to 800 shares."
    shares: 800
    chart:
      kind: candles
      data: [[24.62, 24.68, 24.50, 24.54], [24.54, 24.58, 24.42, 24.46], [24.46, 24.52, 24.38, 24.42], [24.42, 24.48, 24.36, 24.40], [24.40, 24.46, 24.36, 24.42], [24.42, 24.54, 24.40, 24.50], [24.50, 24.66, 24.48, 24.62], [24.62, 24.76, 24.58, 24.72], [24.72, 24.86, 24.68, 24.82], [24.82, 24.90, 24.78, 24.85]]
      volume: [96000, 88000, 74000, 68000, 72000, 186000, 158000, 134000, 116000, 104000]
      vwap: [24.56, 24.54, 24.51, 24.49, 24.47, 24.46, 24.47, 24.49, 24.52, 24.55]
      decision_index: 5
    state: ["Size: 800, capped by the account", "Day: 0R"]
    best: long
    reasonable: [no-trade]
    outcome: "It worked to $24.85 — $0.35 a share above the decision, +$280 on 800 shares against $112 of risk."
    explanation: "Every condition on the card is present and the only thing that changed is the number in the quantity box. A smaller position is still the trade."

  - type: numeric-input
    prompt: "800 shares with the stop fourteen cents under the entry. What is 1R on this one?"
    answer: 112
    tolerance: 0.5
    unit: "$"
    working: "$0.14 × 800 = $112"
    explanation: "Under the $200 the budget allowed, because the account ran out first. Risking less than the budget costs you nothing at all."

  - type: order-build
    prompt: "ORWELL is offered at $24.52 and you will pay at most three cents through it. Build the entry for the size the account allows."
    ticker: ORWELL
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [800, 1200, 1600]
      price: [24.49, 24.52, 24.55]
    answer: {side: buy, type: limit, qty: 800, price: 24.55}
    explanation: "800 × $24.55 is $19,640 of a $20,000 account. The same ticket at 1,200 asks for $29,460 that is not there."

  - type: tf
    statement: "A card you can only take at two-thirds of your usual size is a card to pass."
    answer: false
    explanation: "Two-thirds of the size is two-thirds of the result and two-thirds of the risk. It is a smaller version of the same trade, not a worse one."

  - type: journal-row
    prompt: "That trade closed at $24.78. Fill its row, at the size you actually took."
    trade: {setup: "VWAP bounce", entry: 24.50, stop: 24.36, exit: 24.78, shares: 800}
    slots: [r_risked, r_made, grade]
    chips:
      r_risked: ["$112", "$168", "$200"]
      r_made: ["+1R", "+2R", "+3R"]
      grade: ["A", "B", "C"]
    answer: {r_risked: "$112", r_made: "+2R", grade: "A"}
    explanation: "Fourteen cents risked and twenty-eight made, on the size the account allowed. The row records what was taken, never what a fuller position would have made."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "The card is complete on a $24.50 name,"}
      - {text: "so the page's 1,200 shares go into the ticket,", wrong: true}
      - {text: "and the stop goes fourteen cents under the entry."}
    explanation: "The share count on the page was written for names around $16. Carried over unchanged, it is an order for $29,400 of stock."

  - type: mc
    prompt: "Both ceilings were recomputed and the account turned out to be the smaller one. What does that change about the card?"
    options:
      - {text: "Nothing on the card, only the number behind it", correct: true}
      - {text: "The stop, which comes in so the unit stays where it was"}
      - {text: "The target, which widens to pay for the smaller size"}
    explanation: "Context, entry, stop, target and invalidation are all still whatever the card says. Size is the one field that was never on it."

  - type: sort
    prompt: "Right card, wrong number. Which of these cuts the size, and which cancels the trade?"
    buckets: ["Cut the size", "Cancel the trade"]
    items:
      - {text: "The account cannot pay for the page's share count", bucket: "Cut the size"}
      - {text: "The stop the chart asks for is twice your usual one", bucket: "Cut the size"}
      - {text: "The name is printing 9,000 shares a minute", bucket: "Cancel the trade"}
      - {text: "The quote is eleven cents against a fifteen-cent move", bucket: "Cancel the trade"}
    explanation: "The first two are arithmetic and have an answer. The other two say the trade cannot be got into or out of at a price worth having."

  - type: fill-choice
    sentence: "Your size is the smaller of the risk budget and what the ___ can pay for."
    options: ["account", "card", "stop"]
    answer: "account"
    explanation: "Two sums, and the lower answer wins every time. The card decides whether there is a trade; these two decide how much of it there is."

  - type: recap
    title: "Level 13 in two lines"
    points:
      - {text: "A card that fires without room left is a row for the review.", level: "13-1"}
      - {text: "A card that fires on a name your size does not fit is a smaller position, not a pass.", level: "13-2"}
