id: "3-2"
title: "Execution Drills"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: repetition
tags: [drills, orders, ladder, practice]
learning_goal: "User works a short from ticket to fill, reads the average a two-row fill produces, and sends only on the close the plan named."
purpose: "The second half of execution is knowing when not to press, and the candle decides that, not you."
terms_introduced: []
reinforces: [3, 4]
prerequisite: "3-1"
xp: 30
difficulty: 3
sources: ["Volman — Understanding Price Action", "Bellafiore — The PlayBook"]
notes: "Closes Level 3 with a recap. Chapter 4's range read re-tested as an execution problem. Account named at $18,000; the worked position is 700 shares at $21.48 = $15,036."
screens:
  - type: intro
    text: "Eight more rounds, the short side, and one deck where the answer is to do nothing."

  - type: theory
    title: "The chart sets the pace"
    body: "Nothing here is timed. What decides when the order goes is the candle closing, and your only job is that the order is already built when it does."

  - type: depth-ladder
    prompt: "You market-buy 700 shares of XYZ. Where does the last share fill?"
    data:
      bids: [[21.41, 500], [21.40, 700], [21.39, 1600]]
      asks: [[21.44, 350], [21.45, 800], [21.46, 1400]]
    target: ask-2
    explanation: "$21.45. The top row covered 350 of your 700, and the price you were reading was only ever the first half of the order."

  - type: numeric-mc
    prompt: "What did those 700 shares average out at?"
    options:
      - {text: "$21.44"}
      - {text: "$21.4475"}
      - {text: "$21.445", correct: true}
      - {text: "$21.46"}
    working: "(350 × 21.44 + 350 × 21.45) ÷ 700 = 21.445"
    explanation: "Half a cent above the top row, which is $4 on this order. Small, and it is the same $4 on every trade you take."

  - type: order-build
    prompt: "Long 700 from $21.45, and the chart invalidates the idea below $21.24. Build the protective order. Your account is $18,000."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [400, 700, 1000]
      price: [21.24, 21.45, 21.66]
    answer: {side: sell, type: stop, qty: 700, price: 21.24}
    explanation: "Twenty-one cents on 700 shares is $147 at risk, and that number was known before the entry was sent."

  - type: chart-decision
    scenario: "A different morning. XYZ has rotated between $21.20 and $21.60 for forty minutes. This minute poked $21.66 and closed back inside the band on the heaviest volume of the rotation. Your $18,000 account allows 700 shares here."
    shares: 700
    chart:
      kind: candles
      data: [[21.24, 21.34, 21.20, 21.32], [21.32, 21.44, 21.28, 21.40], [21.40, 21.52, 21.36, 21.48], [21.48, 21.58, 21.44, 21.54], [21.54, 21.60, 21.50, 21.58], [21.58, 21.66, 21.46, 21.48], [21.48, 21.52, 21.36, 21.38], [21.38, 21.42, 21.26, 21.28], [21.28, 21.32, 21.18, 21.20], [21.20, 21.24, 21.12, 21.16]]
      vwap: [21.38, 21.39, 21.40, 21.41, 21.42, 21.43, 21.43, 21.42, 21.41, 21.40]
      volume: [64000, 72000, 86000, 98000, 112000, 146000, 104000, 92000, 84000, 76000]
      levels:
        - {price: 21.60, label: "Top of the morning range"}
        - {price: 21.20, label: "Bottom of the morning range"}
      decision_index: 5
    best: short
    reasonable: [no-trade]
    outcome: "It rotated back across to $21.16 — $0.32 a share below the decision, +$224 short on 700 shares."
    explanation: "A poke through the band and a close back under it. The read is Chapter 4's; this level's part was having the sell ticket built before the candle finished."

  - type: order-build
    prompt: "Build that short: 700 shares, nothing worse than three cents under the bid of $21.47."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [400, 700, 1000]
      price: [21.44, 21.47, 21.50]
    answer: {side: sell, type: limit, qty: 700, price: 21.44}
    explanation: "A sell limit three cents under the bid crosses the quote like a market order and still refuses anything below $21.44."

  - type: depth-ladder
    prompt: "That 700-share sell goes in. Where does the last share fill?"
    data:
      bids: [[21.47, 300], [21.46, 200], [21.45, 1500]]
      asks: [[21.50, 600], [21.51, 800], [21.52, 1100]]
    target: bid-3
    explanation: "$21.45, still inside the floor you built. Two thin rows at the top of the book are exactly why the limit had a floor under it."

  - type: swipe-deck
    prompt: "The ticket is built and the line is marked. Does this candle send it?"
    cards:
      - chart:
          kind: candles
          data: [[21.36, 21.44, 21.32, 21.42], [21.42, 21.48, 21.38, 21.44], [21.44, 21.52, 21.40, 21.48], [21.48, 21.58, 21.44, 21.54], [21.54, 21.60, 21.50, 21.56], [21.56, 21.62, 21.52, 21.58], [21.58, 21.74, 21.56, 21.72], [21.72, 21.80, 21.68, 21.76]]
          levels: [{price: 21.60}]
        answer: take
        note: "Twelve cents through the line on the biggest body of the run. This is the candle the ticket was built for."
      - chart:
          kind: candles
          data: [[21.38, 21.44, 21.34, 21.42], [21.42, 21.46, 21.38, 21.40], [21.40, 21.48, 21.36, 21.44], [21.44, 21.50, 21.40, 21.46], [21.46, 21.52, 21.42, 21.48], [21.48, 21.54, 21.44, 21.50], [21.50, 21.54, 21.46, 21.52], [21.52, 21.56, 21.48, 21.54]]
          levels: [{price: 21.60}]
        answer: pass
        note: "Six cents under the line for eight straight minutes. The order is ready and nothing has triggered it."
      - chart:
          kind: candles
          data: [[21.44, 21.52, 21.40, 21.50], [21.50, 21.58, 21.46, 21.54], [21.54, 21.62, 21.50, 21.56], [21.56, 21.66, 21.52, 21.58], [21.58, 21.68, 21.54, 21.56], [21.56, 21.60, 21.48, 21.50], [21.50, 21.54, 21.42, 21.44], [21.44, 21.48, 21.36, 21.40]]
          levels: [{price: 21.60}]
        answer: pass
        note: "Three wicks through and three closes back under. A poke is not a close, and the order waits on a close."
      - chart:
          kind: candles
          data: [[21.52, 21.56, 21.44, 21.46], [21.46, 21.50, 21.38, 21.40], [21.40, 21.44, 21.32, 21.34], [21.34, 21.38, 21.28, 21.30], [21.30, 21.34, 21.26, 21.28], [21.28, 21.30, 21.14, 21.16], [21.16, 21.20, 21.04, 21.08], [21.08, 21.12, 20.96, 21.00]]
          levels: [{price: 21.28}]
        answer: take
        note: "Straight through the marked price on the widest body of the morning, and the ready ticket was the sell."
    explanation: "Two sends and two waits. A built ticket is not a reason to use it."

  - type: compare
    prompt: "Two mornings, same size, same market order. On which one does it cost you most?"
    charts:
      - kind: candles
        label: "A"
        data: [[21.00, 21.24, 20.98, 21.22], [21.22, 21.46, 21.18, 21.42], [21.42, 21.70, 21.38, 21.66], [21.66, 21.92, 21.60, 21.88], [21.88, 22.14, 21.84, 22.10], [22.10, 22.36, 22.04, 22.30], [22.30, 22.58, 22.26, 22.52], [22.52, 22.78, 22.46, 22.72]]
      - kind: candles
        label: "B"
        data: [[21.30, 21.34, 21.26, 21.32], [21.32, 21.36, 21.28, 21.30], [21.30, 21.34, 21.27, 21.33], [21.33, 21.36, 21.29, 21.31], [21.31, 21.35, 21.28, 21.34], [21.34, 21.38, 21.31, 21.36], [21.36, 21.39, 21.32, 21.37], [21.37, 21.40, 21.33, 21.38]]
    answer: "A"
    explanation: "Twenty-four-cent candles mean the book is being cleared as fast as it refills. A market order there is the one that walks three rows."

  - type: fill-choice
    sentence: "A stop names the price that ___ the order, not the price you get."
    options: ["triggers", "fills", "cancels"]
    answer: "triggers"
    explanation: "Past the trigger it is a market order, and a market order takes whatever the book is offering."

  - type: slider
    prompt: "Your target is twenty cents and the round trip costs three. What share of the target is gone before price moves at all?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 15
    tolerance: 10
    explanation: "Three cents out of twenty. Same arithmetic as Chapter 3, and it decides whether a twenty-cent target is worth a ticket at all."

  - type: recap
    title: "Level 3 in three lines"
    points:
      - {text: "The ticket is built before the candle closes, not after it.", level: "3-1"}
      - {text: "A stop names a trigger; the book names the fill.", level: "3-1"}
      - {text: "A ready order is not a reason to send one.", level: "3-2"}
