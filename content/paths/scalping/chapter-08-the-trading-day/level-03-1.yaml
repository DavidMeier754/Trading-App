id: "3-1"
title: "Execution Drills"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: repetition
tags: [drills, orders, execution, practice]
learning_goal: "User builds entry, stop and exit tickets for one position from start to finish, and predicts where each order actually fills."
purpose: "A ticket you have built a hundred times is one you can build while the candle is still closing."
terms_introduced: []
reinforces: [3, 4]
prerequisite: "2-3"
xp: 30
difficulty: 3
sources: ["Aziz — How to Day Trade for a Living", "Volman — Understanding Price Action"]
notes: "Drill sub: one position followed through ten rounds. Nothing here is timed. Account named at $20,000; the worked position is 1,100 shares at $16.66 = $18,326."
screens:
  - type: intro
    text: "Ten rounds on one position. No new ideas — just the orders."

  - type: story
    character: retail-trader
    text: "The chart sets the pace here. There is no clock on this screen and there never will be one."

  - type: order-build
    prompt: "XYZ, ask $16.42. Your page says 1,100 shares and nothing worse than four cents through it. Your account is $20,000."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [600, 1100, 1600]
      price: [16.38, 16.42, 16.46]
    answer: {side: buy, type: limit, qty: 1100, price: 16.46}
    explanation: "Four cents through the ask is $16.46, and 1,100 × $16.46 is $18,106 — inside the account, with the ceiling checked before the ticket."

  - type: depth-ladder
    prompt: "Round two. The same 1,100 shares go in as a plain market buy instead. Where does the last share fill?"
    data:
      bids: [[16.39, 700], [16.38, 900], [16.37, 1800]]
      asks: [[16.42, 400], [16.43, 500], [16.44, 1500]]
    target: ask-3
    explanation: "$16.44. Four hundred and five hundred at the top two rows leave 200 shares for the third, and the limit you built would still have covered it."

  - type: order-build
    prompt: "Round three. Filled at $16.44, and the chart says the trade is wrong below $16.30. Build the protective order."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [600, 1100, 1600]
      price: [16.30, 16.44, 16.58]
    answer: {side: sell, type: stop, qty: 1100, price: 16.30}
    explanation: "A sell stop at the price the chart named, for the whole position. A stop covering half the shares is a position with no stop."

  - type: numeric-input
    prompt: "Round four. Entry $16.44, stop $16.30, 1,100 shares. What is 1R in dollars?"
    answer: 154
    tolerance: 0.5
    unit: "$"
    working: "$16.44 − $16.30 = $0.14 a share; $0.14 × 1,100 = $154"
    explanation: "Chapter 6's unit arrived at with Chapter 3's arithmetic: the distance times the size, known before anything moves."

  - type: depth-ladder
    prompt: "Round five. The stop triggers and becomes a market sell for 1,100 shares. Where does the last share fill?"
    data:
      bids: [[16.30, 300], [16.29, 400], [16.28, 2200]]
      asks: [[16.33, 600], [16.34, 800], [16.35, 1400]]
    target: bid-3
    explanation: "$16.28, two cents below where the stop triggered. A stop names the trigger; the book names the fill."

  - type: chart-decision
    scenario: "Round six, a fresh name. XYZ has held $16.60 twice and the minute that just closed finished above it on the heaviest volume since the bell. Your $20,000 account allows 1,100 shares here."
    shares: 1100
    chart:
      kind: candles
      data: [[16.40, 16.48, 16.36, 16.44], [16.44, 16.56, 16.40, 16.50], [16.50, 16.60, 16.46, 16.52], [16.52, 16.60, 16.44, 16.48], [16.48, 16.58, 16.44, 16.56], [16.56, 16.70, 16.54, 16.66], [16.66, 16.78, 16.62, 16.74], [16.74, 16.86, 16.70, 16.82], [16.82, 16.92, 16.78, 16.88], [16.88, 16.98, 16.84, 16.94]]
      volume: [78000, 86000, 74000, 68000, 62000, 172000, 148000, 126000, 110000, 96000]
      levels:
        - {price: 16.60, label: "Held twice"}
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It worked up to $16.94 — $0.28 a share above the decision, +$308 long on 1,100 shares."
    explanation: "Chapter 4 did the reading two candles ago. What this level drills is having the ticket already built when the close prints."

  - type: order-build
    prompt: "Round seven. You are long 1,100 from $16.66 and your page puts the target at $16.94. Build the exit."
    ticker: XYZ
    slots: [side, type, qty, price]
    chips:
      side: [buy, sell]
      type: [market, limit, stop]
      qty: [600, 1100, 1600]
      price: [16.66, 16.80, 16.94]
    answer: {side: sell, type: limit, qty: 1100, price: 16.94}
    explanation: "A limit at the target is the exit that does not need you watching when price gets there."

  - type: mc
    prompt: "Round eight. Your stop and your target are both working on 1,100 shares, and the target fills. What is the next press?"
    options:
      - {text: "Cancel, so the stop is not left working", correct: true}
      - {text: "Flatten, to be certain the position is closed"}
      - {text: "Nothing — the platform pairs the two orders"}
    explanation: "A stop left working after the shares are gone becomes a fresh short the moment it triggers."

  - type: spot-mistake
    prompt: "Round nine. Tap the mistake."
    segments:
      - {text: "The stop triggered at $16.30,"}
      - {text: "so the fill came back at $16.30,", wrong: true}
      - {text: "and the loss came out a little above the $154 you planned."}
    explanation: "The trigger is a price you chose; the fill is whatever the book has. That gap is the slippage Chapter 3 measured."

  - type: tf
    statement: "A market order sent into a thin book can fill across three price levels."
    answer: true
    explanation: "It takes each row in turn until it is done, and the last share pays the worst of the three."

  - type: example
    body: "One position, start to finish: built, protected, stopped out, read again, re-entered, targeted and cleaned up. Not one of those rounds was a decision about the market."
