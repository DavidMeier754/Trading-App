id: "4-4"
title: "The Pre-Market Hour"
chapter: 8
chapter_title: "The Trading Day"
path: scalping
category: new-theory
tags: [pre-market, plan, capstone, process]
learning_goal: "User runs the whole hour on an unseen morning, keeps their own page, and executes it rather than rewriting it at the open."
purpose: "The hour is only worth anything if the open cannot talk you out of it."
terms_introduced: []
reinforces: [5, 6]
prerequisite: "4-3"
xp: 30
difficulty: 3
sources: ["Bellafiore — One Good Trade", "Aziz — How to Day Trade for a Living"]
notes: "Closes Level 4 with the chapter's first plan-card and a recap. Account named at $16,000; the worked position is 900 shares at $16.88 = $15,192."
screens:
  - type: intro
    text: "One hour, start to finish, on a morning you have not seen before."

  - type: story
    character: retail-trader
    text: "An hour before the bell. $16,000 in the account, an empty page, and four conditions saved in the scanner."

  - type: scanner-pick
    prompt: "Steps one and two. Your stop is usually twelve cents and your account is $16,000. Which two rows survive?"
    data:
      rows:
        - {ticker: MERIT, price: 16.60, change_pct: 9.1, rvol: 8.2, float: "44M", spread: 0.02, catalyst: "Earnings"}
        - {ticker: DALV, price: 88.40, change_pct: 6.8, rvol: 5.1, float: "320M", spread: 0.06, catalyst: "Guidance"}
        - {ticker: HOLT, price: 12.90, change_pct: 5.4, rvol: 4.6, float: "70M", spread: 0.02, catalyst: "Contract"}
        - {ticker: PYRA, price: 15.30, change_pct: 1.2, rvol: 0.8, float: "110M", spread: 0.04, catalyst: "None"}
    targets: [MERIT, HOLT]
    explanation: "MERIT is 900 shares on $16,000 and HOLT is 1,200, both two cents wide and both on heavy volume. DALV is 180 shares, and PYRA is on less than its own normal day."

  - type: chart-annotate
    prompt: "Step three on MERIT. Drag the line to the price the pre-market has failed at twice."
    chart:
      kind: candles
      data: [[16.50, 16.62, 16.46, 16.58], [16.58, 16.78, 16.54, 16.70], [16.70, 16.74, 16.60, 16.64], [16.64, 16.72, 16.60, 16.68], [16.68, 16.78, 16.64, 16.72], [16.72, 16.76, 16.66, 16.70], [16.70, 16.74, 16.64, 16.68], [16.68, 16.76, 16.66, 16.74], [16.74, 16.76, 16.68, 16.72]]
      volume: [16000, 21000, 13000, 11000, 18000, 12000, 9000, 14000, 15000]
    answer: 16.78
    tolerance: 0.04
    label: "Pre-market high"
    explanation: "$16.78, touched twice and sold both times. It is the first of three lines on this name and it took about forty seconds."

  - type: plan-card
    title: "Your pre-market page"
    intro: "The four numbers your hour ends on. You can change them later."
    fields:
      - {key: share_size, label: "Today's share size", kind: number, suggest: 900}
      - {key: r_dollars, label: "1R in dollars for that size", kind: number, suggest: 108}
      - {key: daily_loss_limit, label: "Daily loss limit (in R)", kind: number, suggest: 3}
      - {key: trade_cap, label: "Maximum trades today", kind: number, suggest: 6}
    note: "Chapter 6 chose the limit. This page is where it becomes a number you can see before the bell, and it comes back when your simulator plan is built."

  - type: swipe-deck
    prompt: "The bell has gone. Does each chart do what your page said it had to?"
    cards:
      - chart:
          kind: candles
          data: [[16.60, 16.66, 16.56, 16.64], [16.64, 16.70, 16.60, 16.66], [16.66, 16.74, 16.62, 16.70], [16.70, 16.76, 16.66, 16.72], [16.72, 16.78, 16.68, 16.74], [16.74, 16.80, 16.70, 16.76], [16.76, 16.90, 16.74, 16.88], [16.88, 16.96, 16.84, 16.92]]
          levels: [16.78]
        answer: take
        note: "Ten cents through the price your page names, on the biggest body since the bell. This is the sentence you wrote an hour ago."
      - chart:
          kind: candles
          data: [[19.40, 19.80, 19.36, 19.76], [19.76, 20.20, 19.72, 20.16], [20.16, 20.60, 20.10, 20.54], [20.54, 21.00, 20.48, 20.94], [20.94, 21.40, 20.88, 21.34], [21.34, 21.80, 21.28, 21.74], [21.74, 22.20, 21.68, 22.14], [22.14, 22.60, 22.08, 22.54]]
        answer: pass
        note: "The best chart on the screen, on triple volume, and it never went near your routine. Wanting it is not the same as having prepared it."
      - chart:
          kind: candles
          data: [[16.58, 16.64, 16.54, 16.62], [16.62, 16.66, 16.58, 16.60], [16.60, 16.68, 16.56, 16.64], [16.64, 16.70, 16.60, 16.66], [16.66, 16.72, 16.62, 16.68], [16.68, 16.72, 16.64, 16.70], [16.70, 16.74, 16.66, 16.72], [16.72, 16.74, 16.68, 16.70]]
          levels: [16.78]
        answer: pass
        note: "Eight minutes sitting six cents under the trigger. The line has not been touched, so nothing has happened yet."
      - chart:
          kind: candles
          data: [[12.96, 13.00, 12.88, 12.90], [12.90, 12.94, 12.82, 12.84], [12.84, 12.88, 12.78, 12.80], [12.80, 12.84, 12.76, 12.78], [12.78, 12.82, 12.74, 12.76], [12.76, 12.78, 12.64, 12.66], [12.66, 12.70, 12.56, 12.58], [12.58, 12.62, 12.48, 12.52]]
          levels: [12.74]
        answer: take
        note: "HOLT through the line your page marked underneath it, on full bodies. Nothing in the page said the trade had to be a long."
    explanation: "Two sends and two passes, and what separated them was decided before the open rather than during it."

  - type: chart-decision
    scenario: "MERIT pressed $16.78 twice before the bell and closed above neither. This minute did, on nearly three times the volume of anything before it. Your page says 900 shares and your account is $16,000."
    shares: 900
    chart:
      kind: candles
      data: [[16.66, 16.72, 16.62, 16.70], [16.70, 16.76, 16.66, 16.72], [16.72, 16.78, 16.68, 16.74], [16.74, 16.78, 16.70, 16.76], [16.76, 16.80, 16.72, 16.78], [16.78, 16.90, 16.76, 16.88], [16.88, 16.98, 16.84, 16.94], [16.94, 17.06, 16.90, 17.02], [17.02, 17.14, 16.98, 17.10], [17.10, 17.28, 17.06, 17.25]]
      volume: [72000, 66000, 74000, 68000, 62000, 186000, 158000, 134000, 118000, 104000]
      levels:
        - {price: 16.78, label: "Pre-market high"}
      decision_index: 5
    state: ["Day: 0R", "Trade 1 of 6"]
    best: long
    reasonable: [no-trade]
    outcome: "It ran to $17.25 — $0.37 a share above the decision, +$333 long on 900 shares."
    explanation: "Every part of this decision was on the page an hour earlier, except the minute it happened in."

  - type: numeric-input
    prompt: "Filled at $16.88 with the stop at $16.76, on 900 shares. What is at risk?"
    answer: 108
    tolerance: 0.5
    unit: "$"
    working: "$16.88 − $16.76 = $0.12 a share; $0.12 × 900 = $108"
    explanation: "Exactly the 1R the page wrote an hour before the bell. That agreement is the whole point of the hour."

  - type: mc
    prompt: "The trade works and by mid-morning you are up 2.5R. What does the page say about the trade cap?"
    options:
      - {text: "It loosens a little once the day is green"}
      - {text: "It counts trades, so it is unchanged", correct: true}
      - {text: "It only starts counting after the first loss"}
    explanation: "A cap on decisions does not care what the decisions earned. Chapter 6 wrote it for the morning that goes well and tempts you into a seventh trade."

  - type: tf
    statement: "If the hour produces no names, the sensible move is to trade the best-looking chart at the open anyway."
    answer: false
    explanation: "An empty page is a result. The chart that looks best at the open is the one you have prepared for least."

  - type: recap
    title: "Level 4 in four lines"
    points:
      - {text: "The hour ends on a page, not on a prediction.", level: "4-1"}
      - {text: "Three lines a name, and one sentence about the room.", level: "4-2"}
      - {text: "Size, 1R, the caps, then one if-then line per name.", level: "4-3"}
      - {text: "At the open you execute the page; you do not rewrite it.", level: "4-4"}
