id: "1-2"
title: "The Stop Is Not Optional"
chapter: 5
chapter_title: "Risk & Psychology for Scalpers"
path: scalping
category: new-theory
tags: [risk, r-multiple, sizing]
learning_goal: "User expresses risk and result as R and rejects trades whose target is smaller than their stop."
purpose: "R is the unit every rule in this chapter is written in — it makes a $40 trade and a $400 trade comparable."
terms_introduced: ["R", "R-multiple"]
prerequisite: "1-1"
xp: 20
difficulty: 2
sources: ["Tharp — Trade Your Way to Financial Freedom", "Elder — Trading for a Living"]
screens:
  - type: intro
    text: "Two traders, two sizes, same skill. One number compares them."

  - type: theory
    title: "R is one unit of risk"
    body: "R is what you lose if the stop hits: entry minus stop, times shares. Every trade you take is a bet of exactly 1R, whatever the share count."

  - type: example
    body: "Long 1,000 shares at $18.40, stop $18.28. 1R = $0.12 × 1,000 shares = $120. Sell at $18.64 and you made $0.24 × 1,000 = $240 — a 2R win."

  - type: theory
    title: "Why R beats dollars"
    body: "A $60 win on $30 of risk is a better trade than a $100 win on $200 of risk. In dollars the second looks bigger. As an R-multiple it is +2R against +0.5R."

  - type: numeric-input
    prompt: "You buy 500 shares at $41.20 with a stop at $41.12. What is 1R in dollars?"
    answer: 40
    tolerance: 0.01
    unit: "$"
    working: "$0.08 per share × 500 shares = $40"
    explanation: "Eight cents of stop distance on 500 shares is the whole risk of that trade."

  - type: numeric-mc
    prompt: "That trade exits at $41.32. What is the result as an R-multiple?"
    options:
      - {text: "+1.5R", correct: true}
      - {text: "+1.2R"}
      - {text: "+3R"}
      - {text: "+0.5R"}
    working: "Gain $0.12 ÷ risk $0.08 = 1.5"
    explanation: "Divide what you made by what you risked; the share count cancels out."

  - type: theory
    title: "Targets in R"
    body: "Scalpers usually work between 1R and 2R: small moves, taken often. A 1R target only pays if you are right more often than wrong — which is what the next level measures."

  - type: match
    prompt: "Match each result to what it means."
    pairs:
      - ["1R", "What you lose if the stop hits"]
      - ["+2R", "A win of twice what you risked"]
      - ["−1R", "The full planned loss"]
      - ["+0.5R", "Half your risk taken as profit"]
    explanation: "Every result is measured against the risk that trade took."

  - type: chart-decision
    scenario: "XYZ drifts in a 1-minute range. You would enter long at $47.60, but the only place for a stop is under $47.35 — 25 cents. The range top at $47.72 is your only target. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[47.50, 47.60, 47.44, 47.56], [47.56, 47.64, 47.50, 47.52], [47.52, 47.58, 47.40, 47.44], [47.44, 47.56, 47.38, 47.54], [47.54, 47.66, 47.50, 47.58], [47.58, 47.64, 47.54, 47.60], [47.60, 47.70, 47.56, 47.66], [47.66, 47.70, 47.54, 47.56], [47.56, 47.60, 47.44, 47.46], [47.46, 47.50, 47.38, 47.42]]
      decision_index: 5
    best: no-trade
    outcome: "It stalled two cents under the target and slid back to $47.42 — 18 cents against you, $180 down on 1,000 shares, with 7 cents still to go before the stop."
    explanation: "Twelve cents of reward against 25 cents of risk is half an R for a full R — the math says no before the chart does."

  - type: visual
    component: bar-chart
    data:
      bars: [{label: "T1", value: 1}, {label: "T2", value: -1}, {label: "T3", value: 2}, {label: "T4", value: -1}, {label: "T5", value: 0.5}]
      unit: "R"
    caption: "Five scalps in one morning: +1.5R in total, whatever the share size was."

  - type: numeric-mc
    prompt: "A different morning: +2R, −1R, −1R, +1.5R, −1R. What is the net?"
    options:
      - {text: "−0.5R", correct: true}
      - {text: "+0.5R"}
      - {text: "−1.5R"}
      - {text: "+2.5R"}
    working: "2 − 1 − 1 + 1.5 − 1 = −0.5"
    explanation: "Three losers and two winners, and the morning is only half an R down — that is what the unit is for."

  - type: tf
    statement: "Risking $40 on one trade and $400 on the next means both full losses are −1R."
    answer: true
    explanation: "R is measured against each trade's own risk, which is why keeping 1R roughly constant is what makes the number honest."

  - type: fill-tiles
    sentence: "Measuring results in R makes trades of different sizes ___."
    answer: "comparable"
    explanation: "Dollars change with your account; R doesn't."

  - type: theory
    title: "From here on, results are in R"
    body: "Limits, targets, sizing, the Friday review — all of it is written in R. Next: what a whole series of R adds up to."
