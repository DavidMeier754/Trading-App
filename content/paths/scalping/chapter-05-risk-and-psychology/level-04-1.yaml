id: "4-1"
title: "Checkpoint"
chapter: 5
chapter_title: "Risk & Psychology for Scalpers"
path: scalping
category: test
tags: [checkpoint]
learning_goal: "Verify Levels 1–3: the stop placed before the entry, hard versus mental stops, never widening, R, expectancy after costs, and the session limits."
purpose: "The second half of the chapter is about your own head — it assumes the arithmetic is already automatic."
terms_introduced: []
prerequisite: "3-1"
xp: 40
difficulty: 2
sources: ["Elder — Trading for a Living", "Tharp — Trade Your Way to Financial Freedom"]
notes: "10 scored questions. Hearts apply. Pass mark 70 %."
screens:
  - type: intro
    text: "Checkpoint. Ten questions on stops, R and limits. Hearts are on."
    counter: 10

  - type: mc
    prompt: "Your platform freezes for thirty seconds while you are long 1,000 shares. Which stop still works?"
    options:
      - {text: "The stop order resting at the broker", correct: true}
      - {text: "The mental stop you set at $18.28"}
      - {text: "Neither — a frozen platform cancels resting orders"}
    explanation: "A resting order lives at the broker, not on your screen."

  - type: numeric-input
    prompt: "You buy 1,200 shares at $9.85 with a stop at $9.76. What is 1R?"
    answer: 108
    tolerance: 0.01
    unit: "$"
    working: "$0.09 per share × 1,200 shares = $108"
    explanation: "Stop distance times shares, every time."

  - type: numeric-mc
    prompt: "That trade exits at $9.94. What is the result as an R-multiple?"
    options:
      - {text: "+2R"}
      - {text: "+1R", correct: true}
      - {text: "+0.5R"}
      - {text: "+1.5R"}
    working: "Gain $0.09 ÷ risk $0.09 = 1"
    explanation: "Nine cents made against nine cents risked is exactly one unit."

  - type: tf
    statement: "Expectancy can be positive with a win rate below 50 %."
    answer: true
    explanation: "Big enough winners against small losers outweigh being wrong more often."

  - type: chart-decision
    scenario: "You are two full stops down and your limit is 3R. XYZ sets up short at a level that capped it twice: entry $16.20, stop $16.32, next support $15.90. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[16.50, 16.54, 16.40, 16.42], [16.42, 16.46, 16.30, 16.32], [16.32, 16.36, 16.20, 16.24], [16.24, 16.30, 16.16, 16.26], [16.26, 16.34, 16.22, 16.30], [16.30, 16.32, 16.18, 16.20], [16.20, 16.22, 16.08, 16.10], [16.10, 16.14, 16.00, 16.02], [16.02, 16.06, 15.88, 15.92], [15.92, 15.98, 15.86, 15.94]]
      decision_index: 5
    state: ["Day: −2R", "Limit: 3R"]
    best: short
    reasonable: [no-trade]
    outcome: "It rolled over to $15.86. Covered at $15.90: $0.30 per share, +$300 on 1,000 shares — 2.5R."
    explanation: "Two stops down is not the limit. Twelve cents of risk for thirty of reward is the trade the rules leave room for."

  - type: sort
    prompt: "Which rule does each one break?"
    buckets: ["Breaks the stop rule", "Breaks a session limit", "Breaks nothing"]
    items:
      - {text: "Moving the stop 15 cents lower as price approaches it", bucket: "Breaks the stop rule"}
      - {text: "Taking a ninth trade after the third full stop of the day", bucket: "Breaks a session limit"}
      - {text: "Skipping a clean setup because you are done for the day", bucket: "Breaks nothing"}
      - {text: "Entering with the stop already resting at the broker", bucket: "Breaks nothing"}
    explanation: "Two rules, and the two things that look like caution but are just the plan working."

  - type: numeric-mc
    prompt: "Out of 100 trades, 40 win an average of $180 and 60 lose an average of $100. What is the expectancy per trade?"
    options:
      - {text: "−$12"}
      - {text: "+$72"}
      - {text: "+$12", correct: true}
      - {text: "−$28"}
    working: "(0.4 × $180) − (0.6 × $100) = $72 − $60 = $12"
    explanation: "Wrong six times in ten and still positive, because the winners are nearly twice the losers."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "A daily loss limit"}
      - {text: "should be recalculated during the day", wrong: true}
      - {text: "so a good setup is never missed."}
    explanation: "A limit that moves with the morning is not a limit. It is written before the open and left alone."

  - type: numeric-input
    prompt: "Your daily loss limit is 3R and 1R is $180. You are down $420. How many more dollars of loss end the session?"
    answer: 120
    tolerance: 0.01
    unit: "$"
    working: "3 × $180 = $540; $540 − $420 = $120"
    explanation: "Less than one full stop left, which is worth knowing before you size the next trade."

  - type: match
    prompt: "Four words that describe a method, not a trade."
    pairs:
      - ["Win rate", "The share of trades that end in profit"]
      - ["Average loss", "Everything lost, divided by the number of losers"]
      - ["Expectancy", "What one average trade is worth after costs"]
      - ["1R", "The dollars between your entry and your stop"]
    explanation: "Four words that describe one method, not one trade."

  - type: summary
    total: 10
