id: "5-1"
title: "Overtrading and Tilt"
chapter: 5
chapter_title: "Risk & Psychology for Scalpers"
path: scalping
category: new-theory
tags: [psychology, tilt, overtrading]
learning_goal: "User names revenge trading, FOMO and chasing, and recognizes tilt in their own behavior before the next trade."
purpose: "The most expensive trades of a scalper's month are usually the ones taken right after a loss."
terms_introduced: ["Overtrading", "Revenge trade", "FOMO", "Chasing", "Tilt"]
prerequisite: "4-1"
xp: 20
difficulty: 2
sources: ["Douglas — Trading in the Zone", "Elder — Trading for a Living"]
screens:
  - type: intro
    text: "The trade right after the loss is the most expensive one you will take."

  - type: theory
    title: "Overtrading"
    body: "Taking more trades than the plan calls for. Each extra one pays the spread and carries risk with no edge behind it — and they cluster after losses, never before."

  - type: carousel
    cards:
      - {label: "Revenge trade", text: "Straight back into the stock that just took your money. The size is bigger and the setup is thinner.", icon: retail-trader}
      - {label: "FOMO", text: "A stock runs without you, so you jump in late — usually near the point where the move is ending.", icon: bull}
      - {label: "Chasing", text: "Paying whatever the ask is because price is moving away from you. Your entry gets worse and your stop gets further.", icon: market-maker}

  - type: theory
    title: "Tilt"
    body: "The state where your next trade is about the last one instead of about the chart. The signs: bigger size, no written stop, a stock you don't normally trade, a heartbeat you can feel."

  - type: story
    character: retail-trader
    text: "Twenty minutes in, down 2R. XYZ is running and you are not in it. Your hand is already on the buy key."

  - type: mc
    prompt: "Which of these is the clearest sign of tilt?"
    options:
      - {text: "You have taken two losses in a row"}
      - {text: "You have doubled your size on a setup you would normally skip", correct: true}
      - {text: "You have traded three different stocks this morning"}
    explanation: "Losses and variety are normal. Size that was never in the plan is the state, not the market."

  - type: sort
    prompt: "On tilt, or following the plan?"
    buckets: ["On tilt", "Following the plan"]
    items:
      - {text: "Re-entering the stock that just stopped you out, at double size", bucket: "On tilt"}
      - {text: "Buying 40 cents into a move because it is leaving without you", bucket: "On tilt"}
      - {text: "Taking the same setup again at the same size and stop", bucket: "Following the plan"}
      - {text: "Sitting out because the spread widened past what your target can pay", bucket: "Following the plan"}
    explanation: "It is not the number of trades. It is whether the plan or the last result chose them."

  - type: tf
    statement: "Taking the same setup a second time after it stopped you out is automatically a revenge trade."
    answer: false
    explanation: "Same size, same stop, still your setup — that is the plan. Revenge shows up as extra size and hurry."

  - type: chart-decision
    scenario: "XYZ has gone up 60 cents in six minutes without a pullback and sits 35 cents above the last level. You have watched the whole move. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[22.10, 22.22, 22.06, 22.20], [22.20, 22.36, 22.18, 22.34], [22.34, 22.50, 22.32, 22.48], [22.48, 22.62, 22.46, 22.60], [22.60, 22.70, 22.56, 22.66], [22.66, 22.74, 22.62, 22.70], [22.70, 22.72, 22.54, 22.56], [22.56, 22.60, 22.42, 22.44], [22.44, 22.52, 22.40, 22.50], [22.50, 22.54, 22.38, 22.42]]
      decision_index: 5
    best: no-trade
    outcome: "It reversed and was trading at $22.42 four minutes later. A 1,000-share long at $22.70 was $280 down."
    explanation: "Wanting in is not a setup. The move you missed is not the one you have to catch."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "I lost 1R on that stock,"}
      - {text: "so I will take the next entry at double size", wrong: true}
      - {text: "on the same setup as before."}
    explanation: "Doubling size after a loss doubles the risk at exactly the moment your judgment is worst."

  - type: hotspot
    component: quote-panel
    prompt: "The stock is running and the spread has widened. Tap the price you would pay to get in right now."
    data: {bid: 22.62, ask: 22.70, last: 22.66}
    target: ask
    explanation: "Chasing means paying the ask wherever it happens to be — eight cents of spread here, before the trade even starts."

  - type: fill-choice
    sentence: "Jumping into a move that is already extended because you cannot stand missing it is ___."
    options: ["FOMO", "overtrading", "a hard stop"]
    answer: "FOMO"
    explanation: "Overtrading is the count of trades; FOMO is the feeling that produces this particular one."

  - type: theory
    title: "Naming it is half of it"
    body: "You cannot stop a state you have not noticed. The next lesson is what you do in the minute after you notice it."
