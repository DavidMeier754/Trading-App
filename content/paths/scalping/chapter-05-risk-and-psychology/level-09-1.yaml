id: "9-1"
title: "Chapter Review"
chapter: 5
chapter_title: "Risk & Psychology for Scalpers"
path: scalping
category: repetition
tags: [review, decisions, discipline]
learning_goal: "User walks one losing morning end to end and applies the stop, the limits, the reset and the smaller size in sequence."
purpose: "The chapter is one routine, not seven ideas — this is what it looks like on a bad day."
terms_introduced: []
prerequisite: "8-1"
xp: 30
difficulty: 3
sources: ["Bellafiore — One Good Trade", "Douglas — Trading in the Zone"]
screens:
  - type: intro
    text: "One losing morning, handled well — from the first stop to the reset."

  - type: story
    character: retail-trader
    text: "Before the open: 1R is $120 on 1,000 shares. Daily loss limit 3R. Maximum eight trades. All of it written down."

  - type: chart-decision
    scenario: "First setup: XYZ holds the pre-market high at $41.20 and turns up from it. Entry $41.26, stop $41.14. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[41.10, 41.22, 41.06, 41.18], [41.18, 41.26, 41.14, 41.22], [41.22, 41.28, 41.16, 41.20], [41.20, 41.24, 41.14, 41.18], [41.18, 41.28, 41.16, 41.24], [41.24, 41.32, 41.20, 41.26], [41.26, 41.30, 41.16, 41.18], [41.18, 41.22, 41.10, 41.12], [41.12, 41.16, 41.04, 41.06], [41.06, 41.10, 41.00, 41.04]]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It rolled over and hit the stop: −$120 on 1,000 shares, a clean −1R."
    explanation: "Right decision, losing result. The row gets a grade A and the morning moves on."

  - type: chart-tap
    prompt: "Your stop was under $41.14. Tap the first candle whose low breaks it."
    chart:
      kind: candles
      data: [[41.10, 41.22, 41.06, 41.18], [41.18, 41.26, 41.14, 41.22], [41.22, 41.28, 41.16, 41.20], [41.20, 41.24, 41.14, 41.18], [41.18, 41.28, 41.16, 41.24], [41.24, 41.32, 41.20, 41.26], [41.26, 41.30, 41.16, 41.18], [41.18, 41.22, 41.10, 41.12], [41.12, 41.16, 41.04, 41.06], [41.06, 41.10, 41.00, 41.04]]
    target: 7
    explanation: "The resting order did the work at the price you chose while you were calm."

  - type: story
    character: retail-trader
    text: "Half an hour in: two more stops, both from the plan. Down 2R with a 3R limit."

  - type: mc
    prompt: "Down 2R with a 3R limit. What is allowed?"
    options:
      - {text: "One more trade from the plan, at plan size", correct: true}
      - {text: "One more trade at double size, to get back to flat"}
      - {text: "Nothing — 2R is close enough to the limit"}
    explanation: "The limit is a line, not a mood. Until it is reached, the plan runs at its normal size."

  - type: chart-decision
    scenario: "The stock that just stopped you out is running again, 25 cents above your last entry, with no level underneath to hide a stop. Your hand is quick. 1,000 shares."
    shares: 1000
    chart:
      kind: candles
      data: [[41.04, 41.16, 41.00, 41.14], [41.14, 41.30, 41.12, 41.28], [41.28, 41.42, 41.26, 41.40], [41.40, 41.50, 41.36, 41.48], [41.48, 41.56, 41.44, 41.52], [41.52, 41.58, 41.48, 41.54], [41.54, 41.56, 41.42, 41.44], [41.44, 41.48, 41.34, 41.36], [41.36, 41.40, 41.30, 41.34], [41.34, 41.38, 41.28, 41.32]]
      decision_index: 5
    best: no-trade
    outcome: "It gave back 22 cents. A long at $41.54 was $220 down on 1,000 shares."
    explanation: "Same stock, no level, more hurry: that is the last result choosing the trade, not the chart."

  - type: numeric-input
    prompt: "Down 2R at $120 per R. After the reset you take one +2R trade at half size. Where is the morning in dollars?"
    answer: -120
    tolerance: 0.01
    unit: "$"
    working: "−2 × $120 = −$240; at half size 1R is $60, so +2R = +$120; −$240 + $120 = −$120"
    explanation: "Half size halves the win too — and it also halved what the next mistake could have cost."

  - type: story
    character: retail-trader
    text: "Ten minutes away from the screen, the rows written up, back at 500 shares."

  - type: chart-decision
    scenario: "Back at 500 shares. XYZ reclaims VWAP and holds above it for two candles. Entry $41.30, stop $41.18."
    shares: 500
    chart:
      kind: candles
      data: [[41.20, 41.26, 41.12, 41.16], [41.16, 41.22, 41.10, 41.20], [41.20, 41.28, 41.18, 41.26], [41.26, 41.32, 41.22, 41.30], [41.30, 41.34, 41.26, 41.28], [41.28, 41.36, 41.26, 41.32], [41.32, 41.44, 41.30, 41.42], [41.42, 41.50, 41.38, 41.48], [41.48, 41.62, 41.44, 41.56], [41.56, 41.60, 41.48, 41.54]]
      vwap: [41.24, 41.24, 41.24, 41.25, 41.26, 41.26, 41.27, 41.29, 41.31, 41.33]
      decision_index: 5
    best: long
    reasonable: [no-trade]
    outcome: "It reached $41.62. Sold at $41.54: $0.24 per share, +$120 on 500 shares — 2R at the smaller size."
    explanation: "Full plan, half size. The morning finishes at −1R instead of −5R."

  - type: tf
    statement: "Ending that morning down 1R counts as a bad session."
    answer: false
    explanation: "Four decisions followed the plan and one bad state was caught early. That is the session doing its job."

  - type: match
    prompt: "Match each term to what happened this morning."
    pairs:
      - ["Execution grade", "An A for a losing trade taken as written"]
      - ["Reset routine", "Ten minutes away, then half size"]
      - ["Daily loss limit", "The line that would have ended the session"]
      - ["Chasing", "Paying up for a move with no level underneath"]
    explanation: "Every one of them was decided before the open and only applied during it."

  - type: fill-choice
    sentence: "The morning counts as a success because the ___ were followed, not because of the result."
    options: ["rules", "charts", "targets"]
    answer: "rules"
    explanation: "On any single morning the result is mostly noise; the rules are the part you own."

  - type: theory
    title: "This is the skill"
    body: "Not avoiding losses — sizing them, stopping them and coming back smaller. The exam is next."
