id: "7-2"
title: "Volume and Liquidity"
chapter: 1
chapter_title: "Market Basics"
path: all
category: new-theory
tags: [liquidity, volume, quote]
learning_goal: "User uses volume on an ordinary day as the clue to liquidity, and can say where that clue misleads."
purpose: "Nobody publishes a liquidity number, so volume is the reading you actually get — as long as you read the ordinary day and not today's crowd."
terms_introduced: []
reinforces: []
prerequisite: "7-1"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Introduces the shape clue (a thin stock's line is a staircase) which the 7-4 drill then tests. Account named at $6,000; the worked position is 300 × $19.40 = $5,820."
screens:
  - type: intro
    text: "Liquidity is printed nowhere. Volume is printed everywhere, and it is the clue you get."

  - type: theory
    title: "Volume stands in for liquidity"
    body: "There is no liquidity number on any card. What you get is volume, and a stock that trades millions of shares on an ordinary day almost always has people waiting on both sides of it."

  - type: visual
    component: bar-chart
    data: {bars: [{label: "TIDE", value: 4200000}, {label: "PINE", value: 640000}, {label: "RUSK", value: 9000}], unit: "shares a day"}
    caption: "Three stocks, three very different answers to the question can I get out."

  - type: hotspot
    component: quote-card
    prompt: "Tap the number you would check first to judge how easily this stock trades."
    data: {ticker: TIDE, name: Tidewater Foods, price: 22.40, change: 0.36, change_pct: 1.6, volume: "4.2M"}
    target: volume
    explanation: "4.2 M shares means a crowd on both sides. Price and change say nothing at all about the way out."

  - type: numeric-mc
    prompt: "PINE trades 640,000 shares on a normal day. You want 3,200 shares. What percentage of a normal day is that?"
    options:
      - {text: "0.5 %", correct: true}
      - {text: "5 %"}
      - {text: "0.05 %"}
      - {text: "2 %"}
    working: "3,200 ÷ 640,000 = 0.005 = 0.5 %"
    explanation: "Half of one per cent. PINE will not notice you arriving or leaving."

  - type: mc
    prompt: "Volume is a clue to liquidity rather than a guarantee of it. Which case shows the difference?"
    options:
      - {text: "A stock that has traded 30 M shares every single day for the last three years"}
      - {text: "A stock that normally does 40,000 and did 9 M today", correct: true}
      - {text: "A stock that does 2 M shares even on a quiet day"}
    explanation: "Today's crowd came for one headline. Tomorrow it is back to 40,000, and so is your way out."

  - type: tf
    statement: "A price that moves in jumps with flat gaps between them is a sign of very few trades."
    answer: true
    explanation: "Each jump is one trade reaching the next price. A busy stock fills in the space between."

  - type: example
    body: "A liquid stock's line looks like a walk: many small steps, one after another. A thin one looks like a staircase with long landings. Nothing, nothing, then 30 cents at once."

  - type: mc
    prompt: "TIDE does 4.2 M shares a day. You hold 1,000 shares and want out quickly. What should you expect?"
    options:
      - {text: "To move the price by a percent or two"}
      - {text: "To sell close to the price you can see", correct: true}
      - {text: "To wait while enough buyers collect"}
    explanation: "A thousand shares out of four million is nothing at all to that stock."

  - type: sort
    prompt: "Which of these says something about your way out, and which does not?"
    buckets: ["Says something", "Says nothing"]
    items:
      - {text: "Shares traded on an ordinary day", bucket: "Says something"}
      - {text: "How small the steps in the price are", bucket: "Says something"}
      - {text: "Today's percentage change", bucket: "Says nothing"}
      - {text: "What the company is called", bucket: "Says nothing"}
    explanation: "Activity and the shape of the move. Not direction, and certainly not the name."

  - type: chart-decision
    scenario: "PINE trades 640,000 shares on a normal day and has climbed for six minutes to $19.40. You have a $6,000 account and are looking at 300 shares. Buy, or wait?"
    shares: 300
    chart: {kind: line, data: [18.98, 19.04, 19.00, 19.14, 19.28, 19.40, 19.50, 19.58, 19.64, 19.68], decision_index: 5}
    buttons: [buy, wait]
    best: buy
    reasonable: [wait]
    outcome: "It carried on to $19.68: 28 cents a share, which on 300 shares is +$84."
    explanation: "The direction is on the chart and 300 shares is nothing to a stock that trades 640,000 of them a day."

  - type: fill-choice
    sentence: "The quickest clue to how easily a stock trades is its ___."
    options: ["volume", "price", "name"]
    answer: "volume"
    explanation: "It is the only number on the card that counts participation."

  - type: story
    text: "Two stocks, both around $20, both up 2 %. One does 5 M shares on a normal day and the other 12,000. They are not the same stock at all."

  - type: theory
    title: "Check it before anything else"
    body: "Look at the ordinary day's volume before you look at the chart. It is the difference between a plan you can leave and a plan you cannot."
