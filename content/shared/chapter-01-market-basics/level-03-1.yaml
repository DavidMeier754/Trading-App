id: "3-1"
title: "Who's On the Other Side"
chapter: 1
chapter_title: "Market Basics"
path: all
category: new-theory
tags: [participants, market-maker]
learning_goal: "User can name retail traders, institutions and market makers, and knows the market maker earns the gap between its two prices."
purpose: "Big, sudden moves usually come from big players — knowing who is out there explains why prices sometimes jump for no visible reason."
terms_introduced: ["Retail trader", "Institution", "Market maker", "Spread"]
prerequisite: "2-2"
xp: 20
difficulty: 1
sources: [consensus]
screens:
  - type: intro
    text: "Every time you buy, someone sells. Who?"

  - type: carousel
    cards:
      - {label: "Retail trader", text: "Individuals like you, trading their own money from a phone or laptop.", icon: retail-trader}
      - {label: "Institution", text: "Funds, banks, pension plans — trading millions at a time. When they move, prices move.", icon: institution}
      - {label: "Market maker", text: "A firm that always offers to buy and to sell. It quotes two prices and keeps the small gap between them.", icon: market-maker}

  - type: theory
    title: "The market maker's gap"
    body: "A market maker might buy from you at $10.00 and sell to you at $10.02. That gap is the spread — how it gets paid for always being there. You'll meet the spread on every quote from Chapter 3."

  - type: mc
    prompt: "Why does a market maker quote two prices instead of one?"
    options:
      - {text: "It buys at the lower and sells at the higher — the gap is its income", correct: true}
      - {text: "One price is for retail traders, the other for institutions"}
      - {text: "Rules require two prices so trades can be reversed"}
    explanation: "Buy low, sell slightly higher, thousands of times a day."

  - type: story
    character: institution
    text: "A pension fund decides to buy 2 million shares of XYZ this afternoon."

  - type: mc
    prompt: "What does the fund's buying most likely do to XYZ's price during the afternoon?"
    options:
      - {text: "Push it up — that much demand needs more sellers, who want higher prices", correct: true}
      - {text: "Nothing — one buyer can't move a price"}
      - {text: "Push it down — big buyers negotiate discounts"}
    explanation: "Size matters. Large demand moves price by the same rule as Level 1."

  - type: tf
    statement: "Retail traders make up most of the trading volume in big stocks."
    answer: false
    explanation: "Institutions and market makers account for most of it. Retail is a small slice — remember that when a stock suddenly moves on huge volume."

  - type: sort
    prompt: "Who is it?"
    buckets: ["Retail trader", "Institution", "Market maker"]
    items:
      - {text: "Trades their own savings from an app", bucket: "Retail trader"}
      - {text: "Buys 2 million shares for a fund", bucket: "Institution"}
      - {text: "Always quotes a buy and a sell price", bucket: "Market maker"}
      - {text: "Earns the gap between two prices", bucket: "Market maker"}
    explanation: "Three kinds of players, three kinds of footprints."

  - type: match
    prompt: "Match each word to its meaning."
    pairs:
      - ["Retail trader", "Individual trading their own money"]
      - ["Institution", "Fund or bank trading very large size"]
      - ["Market maker", "Always ready to buy and to sell"]
      - ["Spread", "Gap between the market maker's two prices"]
    explanation: "Who's there, and what the gap is called."

  - type: mc
    prompt: "XYZ suddenly trades 20 times its normal volume, with the price jumping in big steps. Most likely?"
    options:
      - {text: "Institutions are active — large blocks are moving the price", correct: true}
      - {text: "Many retail traders happened to click at the same second"}
      - {text: "The market maker widened its two prices"}
    explanation: "Huge volume and big steps are the footprint of size."

  - type: fill-tiles
    sentence: "The gap between a market maker's buy price and sell price is the ___."
    answer: "spread"
    explanation: "Spread — you'll pay it on every trade."

  - type: theory
    title: "Footprints"
    body: "You'll rarely know who is on the other side. But you can read their footprints: volume and price moves. That's what the next levels are about."
