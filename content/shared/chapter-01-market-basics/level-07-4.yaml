id: "7-4"
title: "Volume and Liquidity"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [drill, liquidity, decisions]
learning_goal: "User judges tradability and position size from a chart and a volume figure without being walked through it."
purpose: "Recognition is built by repetition, not by one more explanation."
terms_introduced: []
reinforces: []
prerequisite: "7-3"
xp: 25
difficulty: 2
sources: [consensus]
notes: "Drill sub for this block: nine decisions and no teaching. Account named at $6,000; the largest position worked here is 250 × $21.60 = $5,400."
screens:
  - type: intro
    text: "No teaching in this one. Decide first, read afterwards."

  - type: swipe-deck
    prompt: "Every one of these is climbing. You want 500 shares and a quick way out again. Take it, or pass?"
    cards:
      - chart: {kind: line, data: [14.02, 14.06, 14.09, 14.14, 14.18, 14.23, 14.27, 14.32]}
        answer: take
        note: "Small steps all the way up. Somebody is trading this every minute."
      - chart: {kind: line, data: [9.80, 9.80, 9.80, 10.15, 10.15, 10.15, 10.50, 10.50]}
        answer: pass
        note: "Three trades in the whole stretch, 35 cents apart. You would be leaving through those same gaps."
      - chart: {kind: line, data: [21.40, 21.46, 21.44, 21.52, 21.58, 21.63, 21.69, 21.76]}
        answer: take
        note: "A busy, even climb, with company on both sides of it."
      - chart: {kind: line, data: [7.20, 7.20, 7.55, 7.55, 7.54, 7.90, 7.90, 7.92]}
        answer: pass
        note: "Flat landings and sudden jumps: the staircase of a stock almost nobody trades."
      - chart: {kind: line, data: [16.10, 16.14, 16.12, 16.18, 16.24, 16.28, 16.33, 16.39]}
        answer: take
        note: "Cent by cent, minute by minute. That is what a crowd looks like."
    explanation: "Three takes and two passes, and the deciding thing every time was whether the line filled in the space between prices."

  - type: chart-decision
    scenario: "TIDE trades 4.2 M shares on a normal day and has stepped higher for six minutes to $21.60. You have a $6,000 account and are looking at 250 shares. Buy, or wait?"
    shares: 250
    chart: {kind: line, data: [21.10, 21.16, 21.14, 21.30, 21.46, 21.60, 21.72, 21.82, 21.90, 21.96], decision_index: 5}
    buttons: [buy, wait]
    best: buy
    reasonable: [wait]
    outcome: "It finished the stretch at $21.96, 36 cents higher. On 250 shares that is +$90."
    explanation: "A direction on the chart, a stock you can leave whenever you like, and a position the account covers."

  - type: numeric-mc
    prompt: "RUSK trades 9,000 shares on a normal day. Which position would be a fifth of that?"
    options:
      - {text: "180 shares"}
      - {text: "900 shares"}
      - {text: "1,800 shares", correct: true}
      - {text: "4,500 shares"}
    working: "9,000 ÷ 5 = 1,800"
    explanation: "A fifth of everything the stock normally does in a day, sitting in one position."

  - type: chart-decision
    scenario: "RUSK trades 9,000 shares on a normal day. It has climbed for six minutes to $11.80 and you are looking at 450 shares, a twentieth of a normal day. Buy, or wait?"
    shares: 450
    chart: {kind: line, data: [11.30, 11.36, 11.34, 11.50, 11.66, 11.80, 11.88, 11.84, 11.90, 11.86], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    reasonable: [buy]
    outcome: "It edged up to $11.86: six cents, or +$27 on 450 shares, and the last of those 450 would have needed three prices to sell."
    explanation: "The chart was fine. The stock was not, and a small gain does not begin to pay for what leaving 450 shares of RUSK would cost."

  - type: spot-mistake
    prompt: "Read it through, then tap the part that is wrong."
    segments:
      - {text: "RUSK trades 9,000 shares on a normal day"}
      - {text: "and you want 450 of them,"}
      - {text: "which is small enough to go unnoticed.", wrong: true}
    explanation: "450 is a twentieth of everything RUSK does in a day. That is a size the stock notices."

  - type: sort
    prompt: "Bigger problem, or smaller problem?"
    buckets: ["Bigger problem", "Smaller problem"]
    items:
      - {text: "1,000 shares in a stock that trades 12,000 a day", bucket: "Bigger problem"}
      - {text: "1,000 shares in a stock that trades 5 M a day", bucket: "Smaller problem"}
      - {text: "Needing out within a minute in a thin stock", bucket: "Bigger problem"}
      - {text: "100 shares of a stock that trades 900,000 a day", bucket: "Smaller problem"}
    explanation: "It is always your size against that stock's ordinary day."

  - type: chart-decision
    scenario: "VANE has fallen from $17.90 to $16.40 in seven minutes and the last step was the largest of them. It trades 3 M shares a day. You are looking at 300 shares. Buy, or wait?"
    shares: 300
    chart: {kind: line, data: [17.90, 17.72, 17.48, 17.16, 16.82, 16.40, 16.22, 16.10, 16.02, 15.98], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    outcome: "It carried on to $15.98 — 42 cents a share lower, which would have cost −$126 on 300 shares."
    explanation: "Easy to leave is not the same as worth entering, and a stock falling hardest at the right-hand edge is neither."

  - type: compare
    prompt: "You need to be out of 600 shares within a minute. Which of these two could you do that in?"
    charts:
      - {kind: line, data: [25.00, 25.00, 25.00, 25.40, 25.40, 25.38, 25.80, 25.80], label: "A"}
      - {kind: line, data: [25.00, 25.04, 25.02, 25.09, 25.13, 25.11, 25.17, 25.22], label: "B"}
    answer: "B"
    explanation: "B trades every minute, so there is somebody to sell to. A goes minutes at a time without a single trade, which is exactly when you would be looking for six hundred buyers."

  - type: slider
    prompt: "A stock trades 20,000 shares on a normal day and you are holding 2,000. What percentage of a normal day is your position?"
    min: 0
    max: 25
    step: 1
    unit: "%"
    answer: 10
    tolerance: 1
    explanation: "2,000 ÷ 20,000 = 10 %. A tenth of the day's trading, held by one person."

  - type: recap
    title: "Level 7 in four lines"
    points:
      - {text: "Liquidity is how easily you can leave, not how far the price moves.", level: "7-1"}
      - {text: "Volume on an ordinary day is the clue you can actually see.", level: "7-2"}
      - {text: "Selling in size in a thin stock walks the price away from you.", level: "7-3"}
      - {text: "Your size against that stock's ordinary day is the whole question.", level: "7-4"}
