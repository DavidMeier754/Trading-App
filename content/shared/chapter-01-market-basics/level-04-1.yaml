id: "4-1"
title: "The Quote Card"
chapter: 1
chapter_title: "Market Basics"
path: all
category: new-theory
tags: [quote, volume]
icon: ticket
learning_goal: "User can read a quote card: price, change versus previous close in dollars and percent, and volume."
purpose: "Every stock you'll ever look at starts as this card — reading it instantly is the first real skill."
terms_introduced: ["Quote", "Previous close", "Daily change", "Volume"]
prerequisite: "3-3"
xp: 20
difficulty: 1
sources: [consensus]
screens:
  - type: intro
    text: "Two seconds. That's how long reading a quote should take."

  - type: walkthrough
    component: quote-card
    data: {ticker: XYZ, name: Example Corp, price: 142.50, change: 2.10, change_pct: 1.5, volume: "3.2M", prev_close: 140.40}
    steps:
      - {spotlight: price, text: "The current price — what XYZ trades at right now."}
      - {spotlight: change, text: "The change: how far the price is from yesterday's closing price, in dollars and percent. Green with a plus means up."}
      - {spotlight: prev_close, text: "Yesterday's last price is the previous close — the reference point for today's change."}
      - {spotlight: volume, text: "Volume: how many shares changed hands today. More volume, more activity."}

  - type: example
    body: "Red and minus: −$1.80 (−1.3 %) means the stock is $1.80 below yesterday's close. One red day says nothing about the company — only about today's buyers and sellers."
    visual: quote-card
    visual_data: {ticker: XYZ, name: Example Corp, price: 138.60, change: -1.80, change_pct: -1.3}

  - type: hotspot
    component: quote-card
    prompt: "Tap the number that shows how far the price is from yesterday's close."
    data: {ticker: BRIX, name: Brix Materials, price: 88.20, change: -0.95, change_pct: -1.1, volume: "540K"}
    target: change
    explanation: "−$0.95 (−1.1 %) is the change from the previous close."

  - type: mc
    prompt: "XYZ shows +$3.40 (+2.1 %). What do you know?"
    options:
      - {text: "It's $3.40 above yesterday's close", correct: true}
      - {text: "It rose $3.40 in the last hour"}
      - {text: "It will likely rise another 2 % tomorrow"}
    explanation: "The change is measured from the previous close — nothing about the last hour or tomorrow."

  - type: numeric-input
    prompt: "Previous close $50.00. Price now $51.50. What is the change in percent?"
    answer: 3
    tolerance: 0.01
    unit: "%"
    working: "1.50 ÷ 50.00 = 0.03 = 3 %"
    explanation: "Dollar change divided by the previous close."

  - type: tf
    statement: "A stock showing +$0.00 (0.0 %) may have swung up and down all day."
    answer: true
    explanation: "The change compares now with yesterday's close; everything in between is invisible on that one number."

  - type: theory
    title: "Volume: how busy is it?"
    body: "3.2 M means 3.2 million shares traded today. A stock with 5,000 shares traded is quiet, and each trade matters more there. Levels 7 and 8 are built on it."

  - type: mc
    prompt: "Two stocks are both up 2 %. Stock A traded 4 million shares today, Stock B 6,000. Which move was backed by more people?"
    options:
      - {text: "Stock B — fewer trades means each one was more deliberate"}
      - {text: "Stock A — far more shares changed hands behind that move", correct: true}
      - {text: "Equal — the percentage is what counts"}
    explanation: "Volume shows how much activity stands behind a move."

  - type: hotspot
    component: quote-card
    prompt: "Tap the volume."
    data: {ticker: TRN, name: Trion Logistics, price: 12.05, change: 0.15, change_pct: 1.3, volume: "1.1M"}
    target: volume
    explanation: "1.1 M shares traded today."

  - type: match
    prompt: "Four fields on a quote card. What does each one tell you?"
    pairs:
      - ["Quote", "The price card of a stock"]
      - ["Previous close", "Yesterday's last price"]
      - ["Daily change", "Distance from the previous close"]
      - ["Volume", "Shares traded today"]
    explanation: "Four things on every quote card."

  - type: mc
    prompt: "Half an hour after the open. XYZ: $19.60, −$0.40 (−2.0 %), volume 8 M — it usually has 2 M by now. Best reading?"
    options:
      - {text: "Down 2 % on a normal, quiet morning"}
      - {text: "Down 2 % on unusually heavy activity — something is going on", correct: true}
      - {text: "Volume is high because the price fell; nothing more to it"}
    explanation: "Four times the usual volume means many participants are reacting."

  - type: fill-choice
    sentence: "Today's change is measured from the ___."
    options: ["previous close", "opening price", "highest price"]
    answer: "previous close"
    explanation: "Yesterday's last price is the reference."

  - type: theory
    title: "Done in two seconds"
    body: "Price, change, volume — you can now read what every app shows. Next comes the difference between a big move in dollars and a big move for this particular stock."
