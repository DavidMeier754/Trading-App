id: "9-2"
title: "Two Dials Practice"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [drill, liquidity, volatility, decisions]
learning_goal: "User reaches a buy-or-wait answer where the chart alone is not enough and the stock behind it decides."
purpose: "Two charts can look identical and be completely different trades. This is the drill that makes that instinct."
terms_introduced: []
reinforces: []
prerequisite: "9-1"
xp: 25
difficulty: 3
sources: [consensus]
notes: "Drill sub: three decisions, a managed exit and a deck, with no teaching screens. Account named at $6,000; the largest position worked here is 250 × $22.20 = $5,550."
screens:
  - type: intro
    text: "The same charts you have been reading. This time the stock behind them decides the answer."

  - type: chart-decision
    scenario: "TIDE trades 4.2 M shares on a normal day. It has stepped higher for six minutes to $22.20. You have a $6,000 account and are looking at 250 shares. Buy, or wait?"
    shares: 250
    chart: {kind: line, data: [21.70, 21.76, 21.74, 21.90, 22.06, 22.20, 22.32, 22.44, 22.52, 22.58], decision_index: 5}
    buttons: [buy, wait]
    best: buy
    reasonable: [wait]
    outcome: "It reached $22.58 — 38 cents a share, +$95 on 250 shares."
    explanation: "A direction on the chart, and a stock in which 250 shares is nothing at all."

  - type: chart-decision
    scenario: "The same shape on RUSK, which trades 9,000 shares on a normal day. It has climbed for six minutes to $12.90 and you are looking at the same 250 shares. Buy, or wait?"
    shares: 250
    chart: {kind: line, data: [12.62, 12.66, 12.64, 12.74, 12.84, 12.90, 12.96, 13.02, 13.06, 13.08], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    reasonable: [buy]
    outcome: "It drifted up to $13.08: 18 cents, +$45 on 250 shares, and those 250 would have taken three prices to sell."
    explanation: "The chart said the same thing both times. 250 shares is a thirty-sixth of everything RUSK does in a day, and that is what makes it a different trade."

  - type: branch
    scenario: "You are holding 400 shares of RUSK, bought at $12.90. It trades about 9,000 shares on a normal day."
    shares: 400
    chart:
      kind: line
      data: [12.90, 12.96, 13.02, 12.94, 12.80, 12.66, 12.58, 12.62, 12.55, 12.50]
      decision_index: 4
    steps:
      - prompt: "The price has turned and is back below your entry, at $12.80. You would like out. What is the first thing to check?"
        options:
          - {text: "How many shares are wanted near this price", correct: true, next: 1}
          - {text: "What the company announced this morning", next: 1}
        explanation: "In a stock this thin the question is never what the price is. It is how much of it there is at that price."
      - prompt: "There are 120 shares wanted at $12.80 and the next buyers sit at $12.68. What does selling all 400 now look like?"
        options:
          - {text: "120 at $12.80 and 280 of them lower down", correct: true}
          - {text: "All 400 at $12.80"}
        explanation: "You take what is there and then walk down to the next buyers, and 280 shares is far past 120."
      - prompt: "What would have prevented most of that?"
        options:
          - {text: "A position RUSK could take back in one go", correct: true}
          - {text: "Buying at a slightly better price"}
        explanation: "Two cents on the entry would not have mattered. 400 shares in a stock that trades 9,000 a day is what did."

  - type: numeric-mc
    prompt: "You sell those 400 shares and the average comes out 14 cents below the price you were looking at. What did that cost?"
    options:
      - {text: "$5.60"}
      - {text: "$14"}
      - {text: "$56", correct: true}
      - {text: "$560"}
    working: "$0.14 × 400 shares = $56"
    explanation: "Paid for size, not for being wrong about the direction."

  - type: chart-decision
    scenario: "VANE trades 3 M shares a day and moves about 8 % on an ordinary one. It has stepped higher for six minutes to $18.40 and you are looking at 300 shares. Buy, or wait?"
    shares: 300
    chart: {kind: line, data: [17.80, 17.88, 17.84, 18.02, 18.22, 18.40, 18.56, 18.72, 18.84, 18.92], decision_index: 5}
    buttons: [buy, wait]
    best: buy
    reasonable: [wait]
    outcome: "It ran to $18.92 — 52 cents a share, +$156 on 300 shares."
    explanation: "Volatile and liquid is the workable combination: the move is worth having and the way out stays open."

  - type: swipe-deck
    prompt: "You want a stock with enough movement for a decision to have a result. Take it, or pass?"
    cards:
      - chart: {kind: line, data: [31.00, 31.02, 31.01, 31.03, 31.02, 31.04, 31.03, 31.05]}
        answer: pass
        note: "Five cents across the whole stretch. There is nothing here to be paid for."
      - chart: {kind: line, data: [17.60, 17.74, 17.68, 17.90, 18.04, 18.16, 18.30, 18.44]}
        answer: take
        note: "Eighty-four cents of ground, in steps you could act on."
      - chart: {kind: line, data: [12.00, 12.00, 12.00, 12.42, 12.42, 12.40, 12.84, 12.84]}
        answer: pass
        note: "It moves, but in three jumps with nothing in between. That is a stock almost nobody trades."
      - chart: {kind: line, data: [45.20, 45.44, 45.36, 45.66, 45.88, 45.76, 46.04, 46.24]}
        answer: take
        note: "Steady movement and a step every minute. Both dials where you want them."
    explanation: "Two passes: one with no movement at all, and one where the movement arrives in jumps because nobody is trading it."

  - type: tf
    statement: "Two stocks with identical charts can be completely different trades."
    answer: true
    explanation: "The chart is half of it. How many shares trade behind it decides whether you can act on what the chart says."

  - type: recap
    title: "Levels 8 and 9 in three lines"
    points:
      - {text: "Volatility is distance and speed, in either direction.", level: "8-1"}
      - {text: "Liquidity and volatility are separate dials, and thin plus wild is the hard one.", level: "8-2"}
      - {text: "The same chart is a different trade depending on the stock behind it.", level: "9-2"}
