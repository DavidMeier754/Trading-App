id: "15-3"
title: "The Big Picture"
chapter: 1
chapter_title: "Market Basics"
path: all
category: new-theory
tags: [trend, context, decisions]
learning_goal: "User takes the decision the stock in front of them offers, in either direction, while treating the broad trend as context."
purpose: "A trend that is used as a signal turns into a reason to take bad longs and to refuse good shorts."
terms_introduced: []
reinforces: []
prerequisite: "15-2"
xp: 25
difficulty: 3
sources: [consensus]
notes: "Account named at $5,000; the largest position worked here is 300 × $16.10 = $4,830 in LUMA. Deviation: reinforces is empty because the validator only accepts chapters lower than this file's own, and Chapter 1 has none."
screens:
  - type: intro
    text: "Three decisions, all of them inside the same rising market."

  - type: story
    character: bull
    text: "The bull has had three good months. It has no opinion whatsoever about the next six minutes in your stock."

  - type: theory
    title: "Context tilts the odds; it does not answer the question"
    body: "In a rising market more stocks rise than fall on an average day. The one in front of you is still settled by the buyers and sellers in it, today. You have $5,000 in the account for all three of these."

  - type: chart-decision
    scenario: "The broad market has risen for three months. LUMA, which trades about 1.6 M shares a day, has stepped higher for six minutes on volume well above its usual. It is at $16.10 and you are looking at 300 shares."
    shares: 300
    chart: {kind: line, data: [15.70, 15.76, 15.74, 15.88, 16.00, 16.10, 16.18, 16.28, 16.34, 16.42], decision_index: 5}
    best: long
    reasonable: [no-trade]
    outcome: "It carried on to $16.42 — 32 cents a share, +$96 on 300 shares."
    explanation: "The weather and the stock point the same way, and the position is one the account can pay for."

  - type: chart-decision
    scenario: "The same rising market, the same morning. PINE has made a lower high every two minutes and the last step down was the largest of them. It is at $18.95 and you are looking at 250 shares."
    shares: 250
    chart: {kind: line, data: [19.60, 19.48, 19.52, 19.30, 19.12, 18.95, 18.88, 18.72, 18.64, 18.58], decision_index: 5}
    best: short
    reasonable: [no-trade]
    outcome: "It finished at $18.58 — 37 cents of ground, $92.50 on a 250-share short."
    explanation: "Three good months for the market did not put a single buyer under this stock this morning. The trade is what is in front of you."

  - type: mc
    prompt: "The market has risen for three months and the stock in front of you has sellers all over it. What does the trend tell you to do?"
    options:
      - {text: "Nothing: it is the weather, not the decision", correct: true}
      - {text: "Take longs only, whatever this stock is doing"}
      - {text: "Wait for the market to fall before shorting anything"}
    explanation: "The trend changes how often each kind of setup appears. It does not overrule the one you are looking at."

  - type: tf
    statement: "In a falling market, a stock can rise all day."
    answer: true
    explanation: "The market average is made of stocks going both ways; on any given day plenty of them go the other way."

  - type: chart-decision
    scenario: "MOON opened at $6.88 on an announcement and is 25 % higher at $8.60, where it has spent the last stretch going sideways just under its high. You are looking at 400 shares."
    shares: 400
    chart: {kind: line, data: [7.60, 8.10, 8.44, 8.60, 8.58, 8.60, 8.56, 8.62, 8.54, 8.50], decision_index: 5}
    best: no-trade
    outcome: "It drifted to $8.50. A 400-share long would have been $40 down and a short $40 up, and neither was readable from where the chart paused."
    explanation: "The move has already happened and the stock has stopped agreeing with itself. Sideways after a 25 % run is not a direction."

  - type: numeric-input
    prompt: "That PINE short: 250 shares sold at $18.95 and covered at $18.58. What was the result?"
    answer: 92.5
    tolerance: 0.01
    unit: "$"
    working: "$18.95 − $18.58 = $0.37; $0.37 × 250 = $92.50"
    explanation: "Thirty-seven cents in your favour, and the share count does the rest."

  - type: compare
    prompt: "Each of these is six months of the same broad market. Which stretch would be called a bear market?"
    charts:
      - {kind: line, data: [128, 126, 122, 124, 119, 115, 117, 111, 108, 104], label: "A"}
      - {kind: line, data: [104, 108, 106, 112, 110, 116, 119, 117, 123, 127], label: "B"}
    answer: "A"
    explanation: "A is broadly lower month after month, bounces included. B is the same market climbing, and both have plenty of days going the other way."

  - type: order
    prompt: "Put these four in order, from the slowest-moving context to the fastest."
    items: ["A bear market", "A three-week trend in this stock", "This morning's direction", "The last minute of trading"]
    explanation: "Years, weeks, hours, seconds. The slow end is the weather you trade in; the fast end is the decision."

  - type: mc
    prompt: "Where do most of a stock's biggest single days come from?"
    options:
      - {text: "Days with no reason behind them at all"}
      - {text: "Dates that were already on the calendar", correct: true}
      - {text: "The first minute of every session"}
    explanation: "Results and scheduled decisions are known in advance; only the number in them is a surprise."

  - type: fill-tiles
    sentence: "The direction of a market across months is its ___."
    answer: "trend"
    explanation: "Months of direction, not this morning's."

  - type: recap
    title: "Level 15 in three lines"
    points:
      - {text: "A trend is context: it tilts the odds and settles nothing on its own.", level: "15-1"}
      - {text: "Prices answer the gap between the news and what was expected.", level: "15-2"}
      - {text: "Take the decision the stock offers, in either direction, whatever the weather is doing.", level: "15-3"}
