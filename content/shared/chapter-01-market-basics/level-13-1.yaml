id: "13-1"
title: "Long and Short"
chapter: 1
chapter_title: "Market Basics"
path: all
category: new-theory
tags: [long-short]
icon: updown
learning_goal: "User can explain long and short positions, compute the result of each, and knows why a short's loss has no ceiling."
purpose: "Half of every chart is a falling price — without 'short' you can only ever use the other half."
terms_introduced: ["Long", "Short", "Borrow", "Cover"]
prerequisite: "12-3"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "So far you've only bet on 'up'. There's a 'down' button too."

  - type: theory
    title: "Long"
    body: "Buy first, sell later, profit if the price rises. That's going long — everything you've done so far."
    visual: chart-line
    visual_data: {data: [20.0, 20.2, 20.1, 20.4, 20.6, 20.9, 21.0], markers: [{index: 0, label: "Buy"}, {index: 6, label: "Sell"}]}

  - type: theory
    title: "Short"
    body: "Sell first, buy back later, profit if the price falls. That's going short. How can you sell what you don't own? You borrow the shares."

  - type: example
    body: "You borrow 100 shares of XYZ from your broker and sell them at $50. The price falls to $45. You buy 100 back at $45 and return them. Profit: $5 × 100 = $500. Buying back to return the shares is called covering."
    visual: chart-line
    visual_data: {data: [50.0, 49.5, 48.8, 47.9, 47.0, 46.0, 45.0], markers: [{index: 0, label: "Sell short"}, {index: 6, label: "Cover"}]}

  - type: numeric-mc
    prompt: "You short 100 shares at $30 and cover at $28. Result?"
    options:
      - {text: "−$200"}
      - {text: "+$200", correct: true}
      - {text: "+$2"}
      - {text: "+$2,800"}
    working: "(30 − 28) × 100 = +$200"
    explanation: "Sold high, bought back lower."

  - type: numeric-input
    prompt: "You short 50 shares at $20 and the price rises to $23. Result if you cover now?"
    answer: -150
    unit: "$"
    working: "(20 − 23) × 50 = −$150"
    explanation: "Short and the price rises: you must buy back higher. A loss."

  - type: theory
    title: "The asymmetry"
    body: "Long: the most you can lose is what you paid — the price can only fall to zero. Short: a price can rise without limit, so a short loss has no ceiling. Shorts need discipline, and a stop — Chapter 3."

  - type: tf
    statement: "When you're short, a rising price is bad for you."
    answer: true
    explanation: "You have to buy back higher than you sold."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "You borrow shares and sell them,"}
      - {text: "then buy them back later."}
      - {text: "A rising price is what you want.", wrong: true}
    explanation: "Short and rising is a loss — you have to buy back higher than you sold."

  - type: sort
    prompt: "Long or short?"
    buckets: ["Long", "Short"]
    items:
      - {text: "Buy first, sell later", bucket: "Long"}
      - {text: "Sell borrowed shares first", bucket: "Short"}
      - {text: "Profits when the price falls", bucket: "Short"}
      - {text: "Maximum loss is what you paid", bucket: "Long"}
    explanation: "Direction and risk shape."

  - type: mc
    prompt: "You're short XYZ from $40. Which is the worst news?"
    options:
      - {text: "XYZ drifts down to $38"}
      - {text: "XYZ jumps to $60 on a takeover", correct: true}
      - {text: "XYZ closes flat at $40"}
    explanation: "A $20 jump against a short is a $20-per-share loss."

  - type: mc
    prompt: "Why can a short lose more than a long on the same stock?"
    options:
      - {text: "Brokers charge shorts a higher fee"}
      - {text: "Short trades can't be closed until the end of the day"}
      - {text: "A price can rise without limit but can only fall to zero", correct: true}
    explanation: "Unlimited upside for the stock is unlimited downside for the short."

  - type: fill-choice
    sentence: "Buying back borrowed shares to close a short is called ___."
    options: ["covering", "hedging", "settling"]
    answer: "covering"
    explanation: "Cover the short, return the shares."

  - type: match
    prompt: "Two directions and two verbs. Which is which?"
    pairs:
      - ["Long", "Buy first, profit if the price rises"]
      - ["Short", "Sell borrowed shares first, profit if the price falls"]
      - ["Borrow", "Get shares from your broker to sell"]
      - ["Cover", "Buy back to close a short"]
    explanation: "Two directions, two verbs."

  - type: theory
    title: "Three buttons"
    body: "Every scenario from now on has three answers: long, short, or no trade. Let's practice."
