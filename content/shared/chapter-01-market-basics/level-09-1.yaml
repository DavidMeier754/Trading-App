id: "9-1"
title: "Two Dials Practice"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [liquidity, volatility, volume]
learning_goal: "User classifies real-looking quotes on both dials and uses them in a buy/wait decision."
purpose: "Reading the two dials on a quote card has to become automatic before charts arrive."
terms_introduced: []
prerequisite: "8-1"
xp: 20
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "Four stocks, two dials. Let's read them."

  - type: story
    character: mascot
    text: "Meet four stocks. Judge each one on liquidity and volatility."

  - type: mc
    prompt: "APEX: 30 M shares a day, moves about 0.8 % a day."
    options:
      - {text: "Liquid, volatile"}
      - {text: "Illiquid, calm"}
      - {text: "Liquid, calm", correct: true}
    explanation: "Huge volume, small moves."

  - type: mc
    prompt: "MOON: 12 M shares a day, moved 35 % today on a drug approval."
    options:
      - {text: "Liquid, volatile", correct: true}
      - {text: "Illiquid, volatile"}
      - {text: "Liquid, calm"}
    explanation: "Plenty of volume, enormous move."

  - type: tf
    statement: "DUST: 1,500 shares a day, price flat for weeks. It's calm, so it's safe to trade a large position."
    answer: false
    explanation: "Calm, yes — but illiquid. A large position can't get out without moving the price."

  - type: slider
    prompt: "DUST trades 1,500 shares a day. You want to buy 300. What share of daily volume is that?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 20
    tolerance: 5
    explanation: "300 ÷ 1,500 = 20 % — you'd be a big part of the day."

  - type: hotspot
    component: quote-card
    prompt: "Tap the number that tells you FLUX is volatile today."
    data: {ticker: FLUX, name: Flux Systems, price: 7.42, change: 1.10, change_pct: 17.4, volume: "48M"}
    target: change
    explanation: "+17.4 % in a day is a big swing. The volume says it's liquid too."

  - type: mc
    prompt: "Same FLUX quote: 48 M shares, +17.4 %. Two dials?"
    options:
      - {text: "Illiquid and volatile"}
      - {text: "Liquid and volatile", correct: true}
      - {text: "Liquid and calm"}
    explanation: "Big volume, big move."

  - type: spot-mistake
    prompt: "Tap the mistake."
    segments:
      - {text: "DUST trades 1,500 shares a day"}
      - {text: "and its price barely moves,"}
      - {text: "so a large position is easy to get out of.", wrong: true}
    explanation: "Calm is not the same as liquid. At 1,500 shares a day, getting out means walking the price down."

  - type: match
    prompt: "Three measurements and one player — match them up."
    pairs:
      - ["Liquidity", "Ease of trading without moving the price"]
      - ["Volatility", "Size and speed of moves"]
      - ["Volume", "Shares traded"]
      - ["Market maker", "Quotes two prices, keeps the spread"]
    explanation: "Three dials and one player."

  - type: mc
    prompt: "A friend says: 'This stock is up 12 % today on huge volume, so it's easy to trade and it'll be up again tomorrow.' Which part is wrong?"
    options:
      - {text: "'Easy to trade' — high volume doesn't mean liquid"}
      - {text: "'Up again tomorrow' — nothing here says anything about tomorrow", correct: true}
      - {text: "Nothing — both parts follow from the numbers"}
    explanation: "Volume backs the move today; it predicts nothing."

  - type: chart-decision
    scenario: "XYZ is liquid and usually calm. Today it dropped 9 % in ten minutes on a rumor and is still falling fast. Buy 100 shares, or wait?"
    shares: 100
    chart: {kind: line, data: [30.00, 29.60, 29.10, 28.40, 27.80, 27.30, 27.00, 26.80, 26.60, 26.50, 26.45], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    outcome: "It fell another 3 % before stabilizing. Waiting avoided −$85 on 100 shares."
    explanation: "Sudden volatility on a rumor is a moment to watch, not to jump in."

  - type: fill-tiles
    sentence: "A stock with few buyers and sellers ready is ___."
    answer: "illiquid"
    explanation: "Your own trade moves it."

  - type: sort
    prompt: "Does it raise the risk of a bad exit?"
    buckets: ["Raises the risk", "Doesn't"]
    items:
      - {text: "Low daily volume", bucket: "Raises the risk"}
      - {text: "High volatility during news", bucket: "Raises the risk"}
      - {text: "High daily volume", bucket: "Doesn't"}
      - {text: "A calm, liquid stock", bucket: "Doesn't"}
    explanation: "Thin or wild makes exits expensive."

  - type: story
    character: mascot
    text: "Sleepy or wild, crowded or empty — you can now read both dials off a quote card. Next: when the market is actually open."

