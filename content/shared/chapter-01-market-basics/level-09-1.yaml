id: "9-1"
title: "Two Dials Practice"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [liquidity, volatility, quote, drill]
icon: gauge
learning_goal: "User places a stock on both dials from a quote card or a pair of numbers, quickly and without prompting."
purpose: "Reading the two dials has to be automatic before charts and orders start competing for the same attention."
terms_introduced: []
reinforces: []
prerequisite: "8-3"
xp: 20
difficulty: 2
sources: [consensus]
notes: "Pure classification practice. The decisions that turn on the dials are 9-2's job."
screens:
  - type: intro
    text: "Six stocks, two dials each, and no explanations until you have answered."

  - type: story
    text: "Nothing new in this level. Read the numbers, place the stock on both dials, and go."

  - type: hotspot
    component: quote-card
    prompt: "Tap the number that places MOON on the movement dial."
    data: {ticker: MOON, name: Moon Bio, price: 8.60, change: 2.05, change_pct: 31.3, volume: "26M"}
    target: change
    explanation: "+$2.05 is +31.3 % on the day, which is the movement dial. The 26 M underneath it answers the other one."

  - type: mc
    prompt: "APEX trades 30 M shares a day and has not moved more than 1 % on any day this month. You want a stock where a decision has a result. What is APEX's problem?"
    options:
      - {text: "You could not get out of it quickly"}
      - {text: "There is not enough movement to work with", correct: true}
      - {text: "It is too expensive to buy"}
    explanation: "APEX is as easy to leave as a stock gets. There is simply nothing to leave with."

  - type: mc
    prompt: "MOON did 26 M shares today, five times its usual, on one announcement. Where does that leave the way out tomorrow?"
    options:
      - {text: "Proven, since it has shown it can trade 26 M"}
      - {text: "Impossible to guess from anything at all"}
      - {text: "Back near its ordinary day once the crowd leaves", correct: true}
    explanation: "Today's crowd came for the announcement. Your exit has to live in the ordinary day."

  - type: tf
    statement: "DUST trades 1,500 shares a day and its price has been flat for weeks, so a large position in it is safe to hold."
    answer: false
    explanation: "Calm is not the same as easy to leave. At 1,500 shares a day, a large position gets out by walking the price down."

  - type: sort
    prompt: "Which dial is each of these a reading of?"
    buckets: ["Liquidity", "Volatility"]
    items:
      - {text: "48 M shares changed hands", bucket: "Liquidity"}
      - {text: "Ranged 14 % between the high and the low", bucket: "Volatility"}
      - {text: "A 300-share trade moved it 2 %", bucket: "Liquidity"}
      - {text: "Went nowhere at all last week", bucket: "Volatility"}
    explanation: "Counts and impact on the one side, distance travelled on the other."

  - type: slider
    prompt: "DUST trades 1,500 shares on a normal day. You hold 450 of them. What share of a normal day is your position?"
    min: 0
    max: 100
    step: 5
    unit: "%"
    answer: 30
    tolerance: 5
    explanation: "450 ÷ 1,500 is nearly a third of the day's trading, sitting in one position."

  - type: spot-mistake
    prompt: "Tap the part a trader would have to unlearn."
    segments:
      - {text: "MOON is up 31 % today"}
      - {text: "on 26 M shares,"}
      - {text: "so it is a calm stock to practise on.", wrong: true}
    explanation: "31 % in a day is the opposite of calm. The volume is fine; the movement is extreme."

  - type: match
    prompt: "Four stocks from this level, four one-line verdicts."
    pairs:
      - ["APEX", "Easy to leave, nothing to trade"]
      - ["MOON", "Huge move, crowd here for a day"]
      - ["DUST", "Calm, and very hard to leave"]
      - ["TIDE", "Busy, steady, workable"]
    explanation: "The two dials, said out loud, four times over."

  - type: numeric-mc
    prompt: "TIDE trades between $22.00 and $22.66 on an ordinary day. What is that range as a percentage of the low?"
    options:
      - {text: "0.66 %"}
      - {text: "6.6 %"}
      - {text: "3 %", correct: true}
      - {text: "0.3 %"}
    working: "$22.66 − $22.00 = $0.66; $0.66 ÷ $22.00 = 0.03 = 3 %"
    explanation: "Three per cent of movement in a stock that trades millions of shares. Workable."

  - type: fill-choice
    sentence: "The dial that asks how easily you can leave a position is ___."
    options: ["liquidity", "volatility", "volume"]
    answer: "liquidity"
    explanation: "Ease of getting out, not size of movement."

  - type: compare
    prompt: "Both of these trade 5 M shares a day. Which one gives you more to work with?"
    charts:
      - {kind: line, data: [33.00, 33.02, 33.01, 33.04, 33.03, 33.06, 33.05, 33.08], label: "A"}
      - {kind: line, data: [33.00, 33.24, 33.16, 33.48, 33.36, 33.70, 33.58, 33.90], label: "B"}
    answer: "B"
    explanation: "A covered eight cents across the whole stretch. B covered ninety, in steps large enough to act on."

  - type: story
    text: "Both dials, off a card, in a couple of seconds. Now the same two dials with decisions attached to them."
