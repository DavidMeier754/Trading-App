id: "16-1"
title: "Chapter Review"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [review]
learning_goal: "User applies every Chapter 1 concept across one narrated trading day."
purpose: "Seeing all the pieces in one real-looking day is the best preparation for the final exam — and for Chapter 2."
terms_introduced: []
prerequisite: "15-3"
xp: 30
difficulty: 2
sources: [consensus]
screens:
  - type: intro
    text: "One trading day, start to finish. Everything you've learned."

  - type: story
    text: "Before the open. Coffee. News: XYZ lands a huge contract, and {{market.premarket}} {{market.timezone}} trading shows +7 % on 30,000 shares."

  - type: mc
    prompt: "Why not trust the +7 % fully yet?"
    options:
      - {text: "Contracts don't move stock prices"}
      - {text: "Pre-market is thin — 30,000 shares is a handful of traders", correct: true}
      - {text: "Percent changes only count in the regular session"}
    explanation: "Thin session, few participants, jumpy price."

  - type: story
    text: "{{market.regular_open}}. The session opens. XYZ trades 4 million shares in the first ten minutes and holds +6 %."

  - type: mc
    prompt: "What does that volume tell you?"
    options:
      - {text: "Institutions are selling into it"}
      - {text: "Many participants agree — the move has broad support", correct: true}
      - {text: "Volume this high means the stock is illiquid"}
    explanation: "Heavy volume behind a move means the crowd is voting with it."

  - type: chart-decision
    scenario: "XYZ +6 % on 4 million shares, pulling back slightly; buyers step in on every dip. 100 shares."
    shares: 100
    chart: {kind: line, data: [52.40, 52.10, 52.30, 52.00, 52.20, 52.00, 52.30, 52.45, 52.60, 52.70, 52.80], decision_index: 5}
    best: long
    reasonable: [no-trade]
    outcome: "+$0.80 over the next twenty minutes — +$80 on 100 shares."
    explanation: "Volume-backed strength with buyers defending dips: a long with the pressure."

  - type: numeric-input
    prompt: "You bought 100 shares at $52.00 and sold at $52.80. Your broker charges $1 per order. Net profit?"
    answer: 78
    unit: "$"
    working: "$0.80 × 100 = $80, minus 2 orders × $1 = $78"
    explanation: "Fees come off every round, win or lose."

  - type: story
    text: "Meanwhile the market maker keeps quoting XYZ all day: buy at $52.78, sell at $52.80."

  - type: tf
    statement: "The market maker profits from the gap between its two prices, not from XYZ going up."
    answer: true
    explanation: "Two cents, thousands of times — that's the spread."

  - type: story
    text: "Late morning. A rumor: the contract may be smaller than reported. XYZ drops 3 % in two minutes on heavy selling."

  - type: chart-decision
    scenario: "XYZ falling fast on heavy volume after the rumor; every bounce gets sold. 100 shares."
    shares: 100
    chart: {kind: line, data: [53.20, 52.60, 52.00, 52.20, 51.70, 51.50, 51.30, 51.40, 51.00, 50.70, 50.50], decision_index: 5}
    best: short
    reasonable: [no-trade]
    outcome: "It fell another 2 % before the company clarified — +$100 on a 100-share short."
    explanation: "Sellers in control, bounces failing: short with the pressure, or stand aside."

  - type: mc
    prompt: "You're a day trader and it's three minutes to the close. XYZ is +4 % on the day. You:"
    options:
      - {text: "Go long for the overnight gap"}
      - {text: "Go short because day traders will all sell now"}
      - {text: "Make sure you're flat before the bell", correct: true}
    explanation: "A day trader's rule is to be out before the close."

  - type: sort
    prompt: "Which concept?"
    buckets: ["Liquidity", "Volatility", "Style"]
    items:
      - {text: "4 million shares in ten minutes", bucket: "Liquidity"}
      - {text: "−3 % in two minutes", bucket: "Volatility"}
      - {text: "Closed before the bell", bucket: "Style"}
      - {text: "Thin pre-market", bucket: "Liquidity"}
    explanation: "Ease, movement, holding period."

  - type: match
    prompt: "Four ideas you used during today's session."
    pairs:
      - ["Long", "Profit if the price rises"]
      - ["Short", "Profit if the price falls"]
      - ["Previous close", "Reference for today's change"]
      - ["Holding period", "Defines your style"]
    explanation: "Four ideas you used today."

  - type: theory
    title: "A whole day"
    body: "You just read a trading day from coffee to close. Final exam next — then you choose your path."
