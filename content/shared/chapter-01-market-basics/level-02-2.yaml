id: "2-2"
title: "Why Prices Move"
chapter: 1
chapter_title: "Market Basics"
path: all
category: repetition
tags: [price, supply-demand, profit-loss]
icon: scale
learning_goal: "User combines buy/wait decisions, profit math and the buyers-versus-sellers rule in one simulated morning."
purpose: "Doing it a second time with your own explanations is what makes the first two lessons stick."
terms_introduced: []
skills: []
prerequisite: "2-1"
xp: 20
difficulty: 1
sources: [consensus]
screens:
  - type: intro
    text: "Let's trade again — this time you explain the moves."

  - type: story
    text: "Monday, mid-morning. XYZ trades at $22.00. You have $2,500 and want 100 shares."

  - type: chart-decision
    scenario: "XYZ has drifted sideways around $22.00 for ten minutes. Buyers and sellers look balanced. Buy, or wait?"
    shares: 100
    chart: {kind: line, data: [22.02, 21.98, 22.01, 22.00, 21.99, 22.00, 22.01, 22.00, 22.02, 22.01, 22.02], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    reasonable: [buy]
    outcome: "It stayed flat at $22.02. Buying wouldn't have lost, but there was no move to catch."
    explanation: "Balanced buyers and sellers means no pressure and no move. Waiting costs nothing."

  - type: mc
    prompt: "Now a rush of buyers appears and XYZ jumps to $22.40 in one minute. What does the jump tell you?"
    options:
      - {text: "The company just released more shares"}
      - {text: "Demand outran supply — buyers had to pay more", correct: true}
      - {text: "The market paused and reset the price"}
    explanation: "A fast rise means eager buyers competing for too few sellers."

  - type: numeric-input
    prompt: "You buy 100 shares at $22.40 and later sell at $22.90. Total profit?"
    answer: 50
    unit: "$"
    working: "$0.50 × 100 = $50"
    explanation: "Half a dollar per share on 100 shares."

  - type: tf
    statement: "If you had bought only 10 shares, your profit per share would be smaller."
    answer: false
    explanation: "Per share it's the same $0.50. The total is smaller: $5."

  - type: theory
    title: "Two numbers on every trade"
    body: "How far the price moved, and how many shares you held. Total result = move × shares."

  - type: numeric-mc
    prompt: "A stock moves $0.20 in your favor. You hold 250 shares. Total?"
    options:
      - {text: "$50", correct: true}
      - {text: "$5"}
      - {text: "$500"}
      - {text: "$20"}
    working: "$0.20 × 250 = $50"
    explanation: "Move times shares."

  - type: chart-decision
    scenario: "XYZ at $23.00 after a fast spike. Sellers are now flooding in and the price is dropping quickly. Buy, or wait?"
    shares: 100
    chart: {kind: line, data: [22.60, 22.80, 23.00, 23.10, 23.05, 23.00, 22.90, 22.80, 22.70, 22.55, 22.50], decision_index: 5}
    buttons: [buy, wait]
    best: wait
    outcome: "It fell to $22.50. Waiting avoided −$50 on 100 shares."
    explanation: "Sellers in charge, price falling: not the moment to buy."

  - type: match
    prompt: "Two words about the market, two about your trade."
    pairs:
      - ["Demand", "How much people want to buy"]
      - ["Supply", "How much is for sale"]
      - ["Position", "Shares you currently hold"]
      - ["Loss", "Sold lower than you bought"]
    explanation: "Demand and supply set the price; position and loss describe your trade."

  - type: fill-choice
    sentence: "A profit is only real once you ___ the position."
    options: ["close", "open", "watch"]
    answer: "close"
    explanation: "Open positions have paper gains; closing makes them real."

  - type: mc
    prompt: "You hold 100 shares bought at $22.40. The price is now $22.10. Which is true?"
    options:
      - {text: "$30 has already been taken from your account"}
      - {text: "Nothing counts until the price is back above $22.40"}
      - {text: "You have a $30 loss on paper — it becomes real only if you sell", correct: true}
    explanation: "Paper losses are real risk, but they're only booked when you close."

  - type: sort
    prompt: "What's the pressure?"
    buckets: ["Price likely up", "Price likely down", "No clear pressure"]
    items:
      - {text: "Many buyers, few sellers", bucket: "Price likely up"}
      - {text: "Many sellers, few buyers", bucket: "Price likely down"}
      - {text: "Buyers and sellers balanced", bucket: "No clear pressure"}
      - {text: "Buyers paying more than the last price", bucket: "Price likely up"}
    explanation: "Imbalance moves price; balance doesn't."

  - type: theory
    title: "One rule, twice over"
    body: "You have now read the same engine from both sides: what moves a price, and what that move does to a position. Next comes the thing that tips it fastest — news."
