<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the notch and the home bar and
         keeps its content inside the safe area itself (docs/ui/15-theming-and-accessibility.md §10). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Nutrade</title>
    <!-- The browser bar in the ground's colour, light or dark; the app keeps it
         in step with its own theme once it runs (src/App.tsx). -->
    <meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- A plain stand-in until stage BRAND draws the icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #eef1f5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0e1116;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
