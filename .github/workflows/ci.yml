name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Validate content (0 errors)
        run: python3 tools/validate_content.py
      - name: Validator self-test
        run: python3 tools/test_validate.py
      - name: Position sizing (0 breaches)
        run: python3 tools/check_sizing.py --summary
      - name: Drill batch is up to date
        run: python3 tools/build_drill_batch.py --check

  app:
    name: App (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Content index is up to date
        run: npm run gen:content -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Contrast and sizes (UI check)
        run: npm run check:ui
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_TEST_TOOLS: '1'

  # Contact sheets and the measured UI check (npm run sheets, docs/UI.md §10):
  # the test bench and the home screens in the three looks, light and dark, at
  # 390, 375 and 320 pt. A text below 13 px or 4.5 : 1, or a button smaller
  # than 48 x 48, fails the job. The sheets are the "contact-sheets" artifact.
  sheets:
    name: Look (contact sheets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
      - name: Shoot and measure every screen
        run: npm run sheets -- --looks neo,neoMono,classicContrast --strict
      - name: Summary
        if: always()
        run: cat sheets/ui-check.md >> "$GITHUB_STEP_SUMMARY" || echo "The UI check wrote no report." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheets
          path: |
            sheets/*.jpg
            sheets/ui-check.md
            sheets/ui-check.json
          if-no-files-found: warn

  # The render test (npm run smoke): every screen of every lesson, by deep link.
  # Blocking since stage STABLE-DATA: one crash, NaN, console error or blank
  # screen fails the job. The numbers land in the job summary, in a comment on
  # the PR and in the "render-report" artifact (with contact sheets).
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What to render
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push to main renders everything. A PR renders everything when the
          # app changed, only the touched chapters when only content changed,
          # and nothing when none of src/, content/ or demo/ changed.
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "only=" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          if echo "$changed" | grep -qE '^(src/|demo/|metro/|tools/smoke\.mjs|package(-lock)?\.json|app\.json|babel\.config\.js|metro\.config\.js|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "only=" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^content/'; then
            only=$(echo "$changed" | grep -oE 'chapter-[0-9]{2}-[a-z0-9-]+' | sort -u | paste -sd, -)
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "only=$only" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in src/, content/ or demo/ changed: no render test." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - if: steps.scope.outputs.run == 'true'
        run: |
          pip install -r tools/requirements.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
      - name: Render every screen
        id: smoke
        if: steps.scope.outputs.run == 'true'
        env:
          ONLY: ${{ steps.scope.outputs.only }}
        run: npm run smoke -- ${ONLY:+--only "$ONLY"}
      - name: Summary
        if: steps.scope.outputs.run == 'true' && always()
        run: cat smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "The render test wrote no report." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true' && always()
        with:
          name: render-report
          path: |
            smoke/smoke-report.json
            smoke/summary.md
            smoke/contact-*.jpg
          if-no-files-found: warn
      - name: Report on the PR
        if: steps.scope.outputs.run == 'true' && always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- render-report -->';
            const summary = fs.existsSync('smoke/summary.md')
              ? fs.readFileSync('smoke/summary.md', 'utf8')
              : 'The render test wrote no report.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n\nContact sheets and the JSON report: the **render-report** artifact of [this run](${run}).`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
